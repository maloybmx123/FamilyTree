          n.kids.push(ancNode(p.id, gen + 1, depth - 1));
        });
      }
      return n;
    }

    var parents = S.parentsOf(focus.id);
    var father = parents.filter(function (p) { return p.sex !== 'F'; })[0] || parents[0] || null;
    var mother = parents.filter(function (p) { return p !== father; })[0] || null;

    /* ---- супруги фокуса справа ---- */
    var mates = S.spousesOf(focus.id).filter(function (x) { return !used[x.id]; });
    mates.forEach(function (m) { used[m.id] = 1; });
    var mateRight = CW / 2;                       // правый край занятого фокусом и супругами
    if (mates.length) mateRight = CW / 2 + 14 + (mates.length - 1) * MATE + CW;
    // правое крыло отодвигаем, чтобы не наехать на супругов
    var shiftR = Math.max(0, mateRight + 28 - (COL - CW / 2));

    function wing(rootPerson, side) {
      if (!rootPerson) return null;
      var tree = ancNode(rootPerson.id, 1, self_up - 1);
      tidy(tree, VGAP);
      var list = [];
      placeTree(tree, 0, list);
      list.forEach(function (n) {
        var p = S.person(n.id);
        if (!p) return;
        var x = side * n.gen * COL - CW / 2 + (side > 0 ? shiftR : 0);
        put(p, x, n.x - CH / 2);
      });
      // связи: родитель → ребёнок, и связка между двумя родителями
      (function links2(n) {
        if (n.kids.length === 2) links.push({ kind: 'couple', a: n.kids[0].id, b: n.kids[1].id });
        n.kids.forEach(function (k) {
          links.push({ kind: 'wing', from: k.id, to: n.id });
          links2(k);
        });
      })(tree);
      return tree;
    }
    var self_up = this.up;
    var wl = wing(father, -1), wr = wing(mother, 1);

    /* ---- фокус и супруги ---- */
    put(focus, -CW / 2, -CH / 2, 'focus');
    mates.forEach(function (m, i) {
      put(m, CW / 2 + 14 + i * MATE, -CH / 2, 'spouse');
      links.push({ kind: 'couple', a: i === 0 ? focus.id : mates[i - 1].id, b: m.id });
    });
    // от фокуса к его родителям
    if (father) links.push({ kind: 'wing', from: father.id, to: focus.id });
    if (mother) links.push({ kind: 'wing', from: mother.id, to: focus.id });

    /* ---- потомки вниз, тем же алгоритмом ---- */
    function unitOf(pid) {
      var u = [pid];
      S.spousesOf(pid).forEach(function (sp) {
        if (u.indexOf(sp.id) < 0 && !used[sp.id]) u.push(sp.id);
      });
      return u;
    }
    function kidNode(ids, gen, depth) {
      ids.forEach(function (id) { used[id] = 1; });
      var n = { ids: ids, gen: gen, bloodId: ids[0], w: (ids.length - 1) * MATE + CW, kids: [] };
      if (depth > 0) {
        var seen = {};
        ids.forEach(function (pid) {
          S.childrenOf(pid).forEach(function (ch) {
            if (seen[ch.id] || used[ch.id]) return;
            seen[ch.id] = 1;
            n.kids.push(kidNode(unitOf(ch.id), gen + 1, depth - 1));
          });
        });
      }
      return n;
    }
    var rootIds = [focus.id].concat(mates.map(function (m) { return m.id; }));
    var kidsRoot = { ids: rootIds, gen: 0, w: (rootIds.length - 1) * MATE + CW, kids: [] };
    var seenK = {}, this_down = this.down;
    rootIds.forEach(function (pid) {
      S.childrenOf(pid).forEach(function (ch) {
        if (seenK[ch.id] || used[ch.id]) return;
        seenK[ch.id] = 1;
        kidsRoot.kids.push(kidNode(unitOf(ch.id), 1, this_down - 1));
      });
    });

    if (kidsRoot.kids.length) {
      tidy(kidsRoot, KGAP);
      var klist = [];
      placeTree(kidsRoot, (mates.length ? (mateRight - CW / 2) / 2 : 0), klist);

      /* Потомки опускаются ниже всего, что висит над ними в тех же столбцах:
         иначе длинное крыло предков спускается прямо на детей. */
      var top = CH / 2 + 46;
      klist.forEach(function (n) {
        if (n === kidsRoot) return;
        var l = n.x - n.w / 2, r = n.x + n.w / 2;
        cards.forEach(function (c) {
          if (c.x + c.w <= l || c.x >= r) return;         // столбцы не пересекаются
          top = Math.max(top, c.y + c.h + 40);
        });
      });
      klist.forEach(function (n) {
        if (n === kidsRoot) return;
        var left = n.x - n.w / 2;
        n.ids.forEach(function (pid, i) {
          var p = S.person(pid);
          if (p && !placed[pid]) put(p, left + i * MATE, top + (n.gen - 1) * LEVEL);
        });
        for (var i2 = 1; i2 < n.ids.length; i2++) {
          links.push({ kind: 'couple', a: n.ids[i2 - 1], b: n.ids[i2] });
        }
      });
      (function kidLinks(n) {
        n.kids.forEach(function (k) {
          var par = n.ids.filter(function (pid) {
            return S.childrenOf(pid).some(function (c) { return c.id === k.bloodId; });
          });
          links.push({ kind: 'parent', from: par.length ? par : n.ids, to: k.bloodId });
          kidLinks(k);
        });
      })(kidsRoot);
    }

    /* ---- в пиксели ---- */
    var PAD = 60;
    var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    cards.forEach(function (c) {
      minX = Math.min(minX, c.x); maxX = Math.max(maxX, c.x + c.w);
      minY = Math.min(minY, c.y); maxY = Math.max(maxY, c.y + c.h);
    });
    cards.forEach(function (c) {
      c.x = Math.round(c.x - minX + PAD);
      c.y = Math.round(c.y - minY + PAD);
    });
    return {
      cards: cards, links: links, map: placed,
      w: (maxX - minX) + PAD * 2, h: (maxY - minY) + PAD * 2,
      butterfly: true
    };
  };

  /* ---------------- укладка по контурам ----------------
     Приём Райнгольда–Тилфорда в варианте Уокера, тот же, что под деревьями
     в MyHeritage и Gramps. Соседние ветки разводятся не по приблизительной
     ширине, а по фактическому контуру поддерева на каждом уровне, поэтому
     наложение невозможно по построению, а не потому что зазор угадан.
     node: { w, kids: [] } → после укладки у каждого узла есть rel —
     смещение его центра относительно центра родителя. */
  function tidy(node, gap) {
    var kids = node.kids || [];
    kids.forEach(function (k) { tidy(k, gap); });
    if (!kids.length) {
      node.cl = [-node.w / 2];
      node.cr = [node.w / 2];
      return;
    }
    var cl = null, cr = null;          // контуры уже уложенных соседей
    kids.forEach(function (k, i) {
      if (i === 0) k.off = 0;
      else {
        var need = 0, L = Math.min(cr.length, k.cl.length);
        for (var d = 0; d < L; d++) need = Math.max(need, cr[d] - k.cl[d] + gap);
        k.off = need;
      }
      var a = k.cl.map(function (v) { return v + k.off; });
      var b = k.cr.map(function (v) { return v + k.off; });
      if (!cl) { cl = a; cr = b; }
      else {
        for (var d2 = 0; d2 < a.length; d2++) {
          if (d2 < cl.length) { cl[d2] = Math.min(cl[d2], a[d2]); cr[d2] = Math.max(cr[d2], b[d2]); }
          else { cl.push(a[d2]); cr.push(b[d2]); }
        }
      }
    });
    var mid = (kids[0].off + kids[kids.length - 1].off) / 2;
    kids.forEach(function (k) { k.rel = k.off - mid; });
    node.cl = [-node.w / 2];
    node.cr = [node.w / 2];
    for (var d3 = 0; d3 < cl.length; d3++) {
      node.cl.push(cl[d3] - mid);
      node.cr.push(cr[d3] - mid);
    }
  }
  function placeTree(node, x, out) {
    node.x = x;
    out.push(node);
    (node.kids || []).forEach(function (k) { placeTree(k, x + k.rel, out); });
  }

  Tree.prototype.compute = function () {
    if (this.mode === 'butterfly') return this.computeButterfly();
    var self = this, prefs = S.prefs;
    var CW = prefs.card.w, CH = prefs.card.h;
    var mode = this.mode;

    // шаг вдоль оси «братья-сёстры» и шаг между поколениями
    var SLOT, LEVEL;
    if (mode === 'horizontal') { SLOT = CH + 22; LEVEL = CW + 110; }
    else { SLOT = CW + 26; LEVEL = CH + 78; }
    var MATE = (mode === 'horizontal') ? CH + 10 : CW + 12;  // шаг внутри пары супругов
    // Протяжённость самой карточки вдоль оси «братья-сёстры». SLOT шире неё
    // на зазор; если ставить карточки по SLOT, центр пары уезжает от центра
    // детей на половину зазора — и линия вниз получается с изломом.
    var CARD = (mode === 'horizontal') ? CH : CW;

    var GAP = SLOT - CARD;              // просвет между соседними эскизами

    var cards = [], links = [];
    var focus = S.person(this.focusId);
    if (!focus) return { cards: [], links: [], w: 0, h: 0, map: {} };

    var placed = {};           // personId -> card
    var used = {};             // кто уже попал в какой-нибудь узел

    /* Узел укладки — «юнит»: пара супругов или одиночка, то есть люди,
       которые всегда стоят рядом и двигаются вместе. */
    function makeUnit(ids, gen) {
      ids.forEach(function (id) { used[id] = 1; });
      // при втором и третьем браке в юните больше двух человек —
      // ширина обязана расти с каждым, иначе соседи наезжают
      return { ids: ids, gen: gen, w: (ids.length - 1) * MATE + CARD, kids: [] };
    }
    function unitOf(pid) {
      var u = [pid];
      S.spousesOf(pid).forEach(function (sp) {
        if (u.indexOf(sp.id) < 0 && !used[sp.id]) u.push(sp.id);
      });
      return u;
    }

    /* вниз: дети юнита становятся его ветками */
    function buildDown(node, depth) {
      if (depth <= 0) return node;
      var seen = {}, kids = [];
      node.ids.forEach(function (pid) {
        S.childrenOf(pid).forEach(function (ch) {
          if (!seen[ch.id] && !used[ch.id]) { seen[ch.id] = 1; kids.push(ch.id); }
        });
      });
      kids.forEach(function (kid) {
        if (used[kid]) return;
        var kn = makeUnit(unitOf(kid), node.gen + 1);
        kn.bloodId = kid;
        node.kids.push(kn);
        buildDown(kn, depth - 1);
      });
      return node;
    }

    /* вверх: родительская пара каждого члена юнита становится веткой */
    function buildUp(node, depth) {
      if (depth <= 0) return node;
      node.ids.forEach(function (pid) {
        var par = S.parentsOf(pid).filter(function (p) { return !used[p.id]; });
        if (!par.length) return;
        var pn = makeUnit(par.map(function (p) { return p.id; }), node.gen - 1);
        pn.childOf = pid;
        node.kids.push(pn);
        buildUp(pn, depth - 1);
      });
      return node;
    }

    /* опора — родительская пара фокуса: тогда рядом видны братья и сёстры */
    var pivotFam = S.childFamily(focus.id);
    var onParents = !!(pivotFam && (pivotFam.husb || pivotFam.wife));
    var rootIds = onParents
      ? [pivotFam.husb, pivotFam.wife].filter(Boolean)
      : unitOf(focus.id);
    var root = makeUnit(rootIds, onParents ? -1 : 0);
    root.bloodId = rootIds[0];
    buildDown(root, this.down + (onParents ? 1 : 0));

    /* Предки висят на том же корне. Два дерева с общим корнем укладываются
       порознь, но корень у обоих в нуле — поэтому они стыкуются без зазора
       и без наложения: уровни у них разные. */
    var upRoot = { ids: root.ids, gen: root.gen, w: root.w, kids: [] };
    buildUp(upRoot, this.up);

    tidy(root, GAP);
    tidy(upRoot, GAP);
    var downNodes = [], upNodes = [];
    placeTree(root, 0, downNodes);
    placeTree(upRoot, 0, upNodes);

    function emit(nodes, skip) {
      nodes.forEach(function (n) {
        if (n === skip) return;
        var left = n.x - n.w / 2;
        n.ids.forEach(function (pid, i) {
          if (placed[pid]) return;
          var p = S.person(pid);
          if (!p) return;
          var c = { id: pid, person: p, gen: n.gen, pos: left + i * MATE,
            role: i === 0 ? 'blood' : 'spouse' };
          cards.push(c); placed[pid] = c;
        });
      });
    }
    emit(downNodes, null);
    emit(upNodes, upRoot);

    // связка рисуется между каждыми соседями в юните: при втором браке
    // супруги стоят цепочкой, и одной линии на всех не хватает
    function coupleLinks(n) {
      for (var i = 1; i < n.ids.length; i++) {
        links.push({ kind: 'couple', a: n.ids[i - 1], b: n.ids[i] });
      }
    }
    downNodes.forEach(function (n) {
      coupleLinks(n);
      n.kids.forEach(function (k) {
        // линия к ребёнку идёт от той пары, в которой он родился
        var par = n.ids.filter(function (pid) {
          return S.childrenOf(pid).some(function (c) { return c.id === k.bloodId; });
        });
        links.push({ kind: 'parent', from: par.length ? par : n.ids, to: k.bloodId });
      });
    });
    upNodes.forEach(function (n) {
      if (n === upRoot) return;
      coupleLinks(n);
      links.push({ kind: 'parent', from: n.ids, to: n.childOf });
    });

    /* перевод в пиксели */
    var minPos = Infinity, maxPos = -Infinity, minGen = Infinity, maxGen = -Infinity;
    cards.forEach(function (c) {
      minPos = Math.min(minPos, c.pos); maxPos = Math.max(maxPos, c.pos);
      minGen = Math.min(minGen, c.gen); maxGen = Math.max(maxGen, c.gen);
    });
    var PAD = 60;
    cards.forEach(function (c) {
      var p = Math.round(c.pos - minPos), g = c.gen - minGen;
      if (mode === 'horizontal') { c.x = PAD + g * LEVEL; c.y = PAD + p; }
      else { c.x = PAD + p; c.y = PAD + g * LEVEL; }
      c.w = CW; c.h = CH;
    });

    var w = PAD * 2 + (mode === 'horizontal' ? (maxGen - minGen) * LEVEL + CW : (maxPos - minPos) + CW);
    var h = PAD * 2 + (mode === 'horizontal' ? (maxPos - minPos) + CH : (maxGen - minGen) * LEVEL + CH);

    return { cards: cards, links: links, w: w, h: h, map: placed };
  };

  /* ---------------- отрисовка ---------------- */
  Tree.prototype.render = function (recenter) {
    var self = this;
    this.host.classList.toggle('grid', !!(S.prefs && S.prefs.treeGrid));
    if (!S.persons().length) {
      this.canvas.innerHTML = '';
      this.svg.innerHTML = '';
      this.cards = []; this.links = [];
      this.onRender(this);
      return;
    }
    if (!this.focusId || !S.person(this.focusId)) {
      this.focusId = S.tree.meta.rootId && S.person(S.tree.meta.rootId)
        ? S.tree.meta.rootId : Object.keys(S.tree.persons)[0];
    }
    var res = this.compute();
    this.cards = res.cards; this.links = res.links;
    var prefs = S.prefs;

    this.canvas.style.width = res.w + 'px';
    this.canvas.style.height = res.h + 'px';
    this.svg.setAttribute('width', res.w);
    this.svg.setAttribute('height', res.h);
    this.svg.setAttribute('viewBox', '0 0 ' + res.w + ' ' + res.h);

    /* Линии. Главное правило: каждый конец упирается в край эскиза, а не
       повисает в воздухе. Линия от пары детей выходит из середины связки
       супругов — то есть с отрезка, который уже нарисован между ними. */
    var paths = [], map = res.map;
    var horiz = this.mode === 'horizontal';   // «бабочка» ведёт потомков вниз, как вертикальная
    var OVER = 1;                      // заход под рамку, чтобы не было волоска зазора
    // Координаты округляем до целого: на дробных линия размазывается между
    // двумя столбцами точек и на глаз выглядит кривой.
    function q(v) { return Math.round(v); }

    /* Ломаная со скруглёнными поворотами. Углы срезаются дугой, радиус
       уменьшается сам, если колено короткое, — иначе дуга съела бы весь отрезок. */
    var BEND = 10;
    function poly(pts) {
      var p = pts.map(function (o) { return { x: q(o.x), y: q(o.y) }; });
      if (p.length < 2) return '';
      var d = 'M' + p[0].x + ',' + p[0].y;
      for (var i = 1; i < p.length - 1; i++) {
        var a = p[i - 1], c = p[i], b = p[i + 1];
        var la = Math.abs(c.x - a.x) + Math.abs(c.y - a.y);
        var lb = Math.abs(b.x - c.x) + Math.abs(b.y - c.y);
        var r = Math.min(BEND, la / 2, lb / 2);
        if (r < 1) { d += ' L' + c.x + ',' + c.y; continue; }
        var ax = c.x + (a.x - c.x) / la * r, ay = c.y + (a.y - c.y) / la * r;
        var bx = c.x + (b.x - c.x) / lb * r, by = c.y + (b.y - c.y) / lb * r;
        d += ' L' + Math.round(ax) + ',' + Math.round(ay) +
             ' Q' + c.x + ',' + c.y + ' ' + Math.round(bx) + ',' + Math.round(by);
      }
      var z = p[p.length - 1];
      return d + ' L' + z.x + ',' + z.y;
    }

    function coupleLine(a, b) {
      return horiz
        ? { x1: a.x + a.w / 2, y1: a.y + a.h, x2: b.x + b.w / 2, y2: b.y }
        : { x1: a.x + a.w, y1: a.y + a.h / 2, x2: b.x, y2: b.y + b.h / 2 };
    }

    res.links.forEach(function (L) {
      if (L.kind === 'couple') {
        var a = map[L.a], b = map[L.b];
        if (!a || !b || typeof a !== 'object' || typeof b !== 'object') return;
        var ln = coupleLine(a, b);
        paths.push({
          d: 'M' + q(ln.x1 - OVER * (horiz ? 0 : 1)) + ',' + q(ln.y1 - OVER * (horiz ? 1 : 0)) +
            ' L' + q(ln.x2 + OVER * (horiz ? 0 : 1)) + ',' + q(ln.y2 + OVER * (horiz ? 1 : 0)),
          cls: 'lnk-couple'
        });
        return;
      }
      if (L.kind === 'wing') {
        // крыло «бабочки»: родитель сбоку, ребёнок ближе к середине
        var par = map[L.from], ch = map[L.to];
        if (!par || !ch || typeof par !== 'object' || typeof ch !== 'object') return;
        var toLeft = par.x < ch.x;
        var sx = toLeft ? par.x + par.w - OVER : par.x + OVER;
        var ex = toLeft ? ch.x + OVER : ch.x + ch.w - OVER;
        var mx2 = (sx + ex) / 2;
        var py = par.y + par.h / 2, cy = ch.y + ch.h / 2;
        paths.push({
          d: poly([{ x: sx, y: py }, { x: mx2, y: py }, { x: mx2, y: cy }, { x: ex, y: cy }]),
          cls: 'lnk-parent'
        });
        return;
      }
      if (L.kind !== 'parent') return;

      var kid = map[L.to];
      if (!kid || typeof kid !== 'object') return;
      var ps = L.from.map(function (id) { return map[id]; })
        .filter(function (c) { return c && typeof c === 'object'; });
      if (!ps.length) return;

      // точка выхода: середина связки супругов либо край одиночного эскиза
      var ox, oy;
      if (ps.length === 2) {
        var ln2 = coupleLine(ps[0], ps[1]);
        ox = (ln2.x1 + ln2.x2) / 2;
        oy = (ln2.y1 + ln2.y2) / 2;
      } else if (horiz) {
        ox = ps[0].x + ps[0].w - OVER; oy = ps[0].y + ps[0].h / 2;
      } else {
        ox = ps[0].x + ps[0].w / 2; oy = ps[0].y + ps[0].h - OVER;
      }

      if (horiz) {
        var tx = kid.x + OVER, ty = kid.y + kid.h / 2;
        var mx = Math.max(ox + 12, (ox + tx) / 2);
        paths.push({
          d: poly([{ x: ox, y: oy }, { x: mx, y: oy }, { x: mx, y: ty }, { x: tx, y: ty }]),
          cls: 'lnk-parent'
        });
      } else {
        var tx2 = kid.x + kid.w / 2, ty2 = kid.y + OVER;
        var my = Math.max(oy + 12, (oy + ty2) / 2);
        paths.push({
          d: poly([{ x: ox, y: oy }, { x: ox, y: my }, { x: tx2, y: my }, { x: tx2, y: ty2 }]),
          cls: 'lnk-parent'
        });
      }
    });
    this.svg.innerHTML = paths.map(function (p) {
      return '<path d="' + p.d + '" class="' + p.cls + '"/>';
    }).join('');

    // карточки
    var frag = document.createDocumentFragment();
    res.cards.forEach(function (c) { frag.appendChild(self.cardEl(c)); });
    this.canvas.innerHTML = '';
    this.canvas.appendChild(frag);

    this.applyTransform();
    if (recenter) this.centerOn(this.focusId);
    this.onRender(this);
  };

  /** человека нет в живых: есть дата смерти или снята отметка «жив» */
  function isGone(p) {
    return !!(p && ((p.death && p.death.date) || p.living === false));
  }

  Tree.prototype.cardEl = function (c) {
    var self = this, p = c.person, prefs = S.prefs;
    var el = document.createElement('div');
    var radius = prefs.card.shape === 'circle' ? Math.round(c.h / 2) : prefs.card.radius;
    el.className = 'node sex-' + (p.sex || 'U').toLowerCase() +
      (p.id === this.openId ? ' is-open' : '') +
      (isGone(p) ? ' is-gone' : '');
    el.style.left = c.x + 'px';
    el.style.top = c.y + 'px';
    el.style.width = c.w + 'px';
    el.style.height = c.h + 'px';
    el.style.borderRadius = radius + 'px';
    el.dataset.id = p.id;

    var gone = isGone(p);
    var hasPhoto = prefs.showPhotos && prefs.card.photo > 0;
    var html = '';
    if (hasPhoto) {
      var silhouette = p.sex === 'M' ? 'personM' : p.sex === 'F' ? 'personF' : 'person';
      html += '<div class="node-ph" style="width:' + prefs.card.photo + 'px;height:' + prefs.card.photo +
        'px;border-radius:' + (prefs.card.shape === 'circle' ? '50%' : Math.max(2, prefs.card.radius - 4) + 'px') +
        '">' + global.Icon(silhouette) +
        (gone ? '<span class="mourn-corner" aria-hidden="true"></span>' : '') + '</div>';
    }
    html += '<div class="node-txt"><div class="node-name" style="font-size:' + prefs.card.nameSize + 'px">' +
      esc(S.shortName(p)) + '</div>';
    if (prefs.showDates) {
      html += '<div class="node-years" style="font-size:' + prefs.card.dateSize +
        'px;font-weight:' + (prefs.card.dateWeight || 400) + '">' + esc(S.years(p)) + '</div>';
    }
    html += '</div>';
    // без фотокарточки лента ложится на угол самого эскиза
    if (gone && !hasPhoto) html += '<span class="node-mourn" aria-hidden="true"></span>';
    if (p.acl && (p.acl.locked || p.acl.level !== 'public')) {
      html += '<span class="node-lock" title="Ограниченный доступ">' + global.Icon('lock') + '</span>';
    }
    el.innerHTML = html;

    // кнопка «добавить родственника»
    var plus = document.createElement('button');
    plus.className = 'node-plus';
    plus.type = 'button';
    plus.innerHTML = global.Icon('plus');
    plus.title = 'Добавить родственника к ' + S.callName(p);
    plus.setAttribute('aria-label', plus.title);
    plus.addEventListener('click', function (e) { e.stopPropagation(); self.onAdd(p.id, plus); });
    el.appendChild(plus);

    el.addEventListener('click', function () { self.onSelect(p.id); });
    el.addEventListener('dblclick', function () { self.setFocus(p.id); });

    if (prefs.showPhotos && p.photo) {
      S.mediaURL(p.photo).then(function (url) {
        var ph = el.querySelector('.node-ph');
        if (url && ph) {
          ph.style.backgroundImage = 'url(' + url + ')';
          ph.classList.add('has-img');
          ph.innerHTML = gone ? '<span class="mourn-corner"></span>' : '';
        }
      });
    }
    return el;
  };

  /* ---------------- масштаб и перетаскивание ---------------- */
  Tree.prototype.applyTransform = function () {
    var t = 'translate(' + this.tx + 'px,' + this.ty + 'px) scale(' + this.scale + ')';
    this.canvas.style.transform = t;
    this.svg.style.transform = t;
  };
  Tree.prototype.zoom = function (factor, cx, cy) {
    var rect = this.host.getBoundingClientRect();
    cx = cx == null ? rect.width / 2 : cx;
    cy = cy == null ? rect.height / 2 : cy;
    var ns = Math.min(2.5, Math.max(0.2, this.scale * factor));
    var k = ns / this.scale;
    this.tx = cx - k * (cx - this.tx);
    this.ty = cy - k * (cy - this.ty);
    this.scale = ns;
    this.applyTransform();
  };
  /* keepReadable: если всё дерево пришлось бы ужать до нечитаемого размера,
     показываем ближний круг выбранного человека — родителей, супругов, детей */
  Tree.prototype.fit = function (keepReadable) {
    var rect = this.host.getBoundingClientRect();
    var w = parseFloat(this.canvas.style.width) || 1, h = parseFloat(this.canvas.style.height) || 1;
    var s = Math.min(rect.width / w, rect.height / h, 1) * 0.96;
    if (keepReadable && s < 0.45) { this.fitCircle(); return; }
    this.scale = Math.max(0.2, s);
    this.tx = (rect.width - w * this.scale) / 2;
    this.ty = (rect.height - h * this.scale) / 2;
    this.applyTransform();
  };

  /** вписать ближний круг выбранного человека */
  Tree.prototype.fitCircle = function () {
    var S2 = global.Store, id = this.focusId;
    var want = {};
    want[id] = 1;
    [S2.parentsOf(id), S2.spousesOf(id), S2.childrenOf(id), S2.siblingsOf(id)].forEach(function (arr) {
      arr.forEach(function (p) { want[p.id] = 1; });
    });
    var box = null;
    this.cards.forEach(function (c) {
      if (!want[c.id]) return;
      if (!box) box = { x1: c.x, y1: c.y, x2: c.x + c.w, y2: c.y + c.h };
      else {
        box.x1 = Math.min(box.x1, c.x); box.y1 = Math.min(box.y1, c.y);
        box.x2 = Math.max(box.x2, c.x + c.w); box.y2 = Math.max(box.y2, c.y + c.h);
      }
    });
    if (!box) { this.centerOn(id); return; }
    var rect = this.host.getBoundingClientRect();
    var bw = (box.x2 - box.x1) + 48, bh = (box.y2 - box.y1) + 48;
    this.scale = Math.max(0.42, Math.min(1, Math.min(rect.width / bw, rect.height / bh)));
    this.tx = rect.width / 2 - ((box.x1 + box.x2) / 2) * this.scale;
    this.ty = rect.height / 2 - ((box.y1 + box.y2) / 2) * this.scale;
    this.applyTransform();
  };

  Tree.prototype.centerOn = function (id) {
    var c = this.cards.filter(function (x) { return x.id === id; })[0] || this.cards[0];
    if (!c) return;
    var rect = this.host.getBoundingClientRect();
    this.tx = rect.width / 2 - (c.x + c.w / 2) * this.scale;
    this.ty = rect.height / 2 - (c.y + c.h / 2) * this.scale;
    this.applyTransform();
  };
  Tree.prototype._bindPanZoom = function () {
    var self = this, drag = null, pinch = null;
    this.host.addEventListener('pointerdown', function (e) {
      if (e.target.closest('.node')) return;
      drag = { x: e.clientX, y: e.clientY, tx: self.tx, ty: self.ty, id: e.pointerId };
      self.host.setPointerCapture(e.pointerId);
      self.host.classList.add('grabbing');
    });
    this.host.addEventListener('pointermove', function (e) {
      if (pinch) { drag = null; return; }          // идёт щипок — не тащим
      if (!drag || drag.id !== e.pointerId) return;
      self.tx = drag.tx + (e.clientX - drag.x);
      self.ty = drag.ty + (e.clientY - drag.y);
      self.applyTransform();
    });
    function end() { drag = null; self.host.classList.remove('grabbing'); }
    this.host.addEventListener('pointerup', end);
    this.host.addEventListener('pointercancel', end);
    this.host.addEventListener('wheel', function (e) {
      e.preventDefault();
      var r = self.host.getBoundingClientRect();
      self.zoom(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });

    /* Щипок на сенсорном экране.
       Здесь была причина, по которой дерево на телефоне уезжало вбок:
       первый палец уже запустил перетаскивание, и пока второй масштабировал,
       pointermove продолжал тащить холст — два движения складывались.
       Поэтому при появлении второго пальца перетаскивание отменяется,
       а после щипка не возобновляется, пока палец не поднимут. */
    this.host.addEventListener('touchstart', function (e) {
      if (e.touches.length === 2) {
        drag = null;
        self.host.classList.remove('grabbing');
        var r0 = self.host.getBoundingClientRect();
        pinch = {
          d: dist(e.touches), s: self.scale,
          cx: (e.touches[0].clientX + e.touches[1].clientX) / 2 - r0.left,
          cy: (e.touches[0].clientY + e.touches[1].clientY) / 2 - r0.top,
          tx: self.tx, ty: self.ty
        };
      }
    }, { passive: true });
    this.host.addEventListener('touchmove', function (e) {
      if (pinch && e.touches.length === 2) {
        e.preventDefault();
        drag = null;
        var d = dist(e.touches);
        // считаем от состояния на начало щипка, а не от предыдущего кадра:
        // так не копится ошибка округления и картинка не ползёт
        var ns = Math.min(2.5, Math.max(0.2, pinch.s * (d / pinch.d)));
        var k = ns / pinch.s;
        self.scale = ns;
        self.tx = pinch.cx - k * (pinch.cx - pinch.tx);
        self.ty = pinch.cy - k * (pinch.cy - pinch.ty);
        self.applyTransform();
      }
    }, { passive: false });
    this.host.addEventListener('touchend', function (e) {
      if (e.touches.length < 2) { pinch = null; drag = null; }
    });
    function dist(t) {
      var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
      return Math.sqrt(dx * dx + dy * dy) || 1;
    }
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  Tree.esc = esc;
  global.TreeView = Tree;
})(window);
</script>
<script>/* Семейное Древо — импорт, экспорт и резервные копии.
   GEDCOM 5.5.1 (UTF-8), простой текст, SVG, PDF (через печать), ZIP с фотографиями. */
(function (global) {
  'use strict';
  var S = global.Store;
  var U = S.util;

  var MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

  /* ---------------- GEDCOM: выгрузка ---------------- */
  function gedDate(s) {
    var d = U.parseDate(s);
    if (!d) return s || '';
    if (!d.m || !d.d) return String(d.y);
    return d.d + ' ' + MON[d.m - 1] + ' ' + d.y;
  }
  function exportGEDCOM() {
    var t = S.tree, L = [];
    L.push('0 HEAD');
    L.push('1 SOUR SEMDREVO');
    L.push('2 NAME Семейное Древо');
    L.push('2 VERS 1.0');
    L.push('1 DATE ' + gedDate(new Date().toISOString().slice(0, 10)));
    L.push('1 CHAR UTF-8');
    L.push('1 GEDC');
    L.push('2 VERS 5.5.1');
    L.push('2 FORM LINEAGE-LINKED');
    L.push('1 FILE ' + (t.meta.name || 'tree') + '.ged');

    var pid = {}, fid = {}, n = 1;
    S.persons().forEach(function (p) { pid[p.id] = '@I' + (n++) + '@'; });
    n = 1;
    S.families().forEach(function (f) { fid[f.id] = '@F' + (n++) + '@'; });

    S.persons().forEach(function (p) {
      L.push('0 ' + pid[p.id] + ' INDI');
      var given = [p.given, p.patronymic].filter(Boolean).join(' ');
      L.push('1 NAME ' + given + ' /' + (p.surname || '') + '/');
      if (given) L.push('2 GIVN ' + given);
      if (p.surname) L.push('2 SURN ' + p.surname);
      if (p.maiden) { L.push('1 NAME /' + p.maiden + '/'); L.push('2 TYPE maiden'); }
      L.push('1 SEX ' + (p.sex === 'M' || p.sex === 'F' ? p.sex : 'U'));
      if (p.birth && (p.birth.date || p.birth.place)) {
        L.push('1 BIRT');
        if (p.birth.date) L.push('2 DATE ' + gedDate(p.birth.date));
        if (p.birth.place) L.push('2 PLAC ' + p.birth.place);
        if (p.birth.lat != null && p.birth.lng != null) {
          L.push('2 MAP'); L.push('3 LATI ' + mapCoord(p.birth.lat, 'N', 'S')); L.push('3 LONG ' + mapCoord(p.birth.lng, 'E', 'W'));
        }
      }
      if (p.death && (p.death.date || p.death.place)) {
        L.push('1 DEAT');
        if (p.death.date) L.push('2 DATE ' + gedDate(p.death.date));
        if (p.death.place) L.push('2 PLAC ' + p.death.place);
      }
      (p.events || []).forEach(function (e) {
        if (!S.canSee(e.acl)) return;
        L.push('1 EVEN' + (e.note ? ' ' + oneLine(e.note) : ''));
        L.push('2 TYPE ' + (e.type || 'событие'));
        if (e.date) L.push('2 DATE ' + gedDate(e.date));
        if (e.place) L.push('2 PLAC ' + e.place);
      });
      (p.fields || []).forEach(function (f) {
        if (!S.canSee(f.acl)) return;
        if (f.type === 'phone') L.push('1 PHON ' + oneLine(f.value));
        else if (f.type === 'email') L.push('1 EMAIL ' + oneLine(f.value));
        else if (f.type === 'addr') L.push('1 ADDR ' + oneLine(f.value));
        else { L.push('1 FACT ' + oneLine(f.value)); L.push('2 TYPE ' + oneLine(f.label || 'сведения')); }
      });
      if (p.note) pushNote(L, 1, p.note);
      var cf = S.childFamily(p.id);
      if (cf) L.push('1 FAMC ' + fid[cf.id]);
      S.spouseFamilies(p.id).forEach(function (f) { L.push('1 FAMS ' + fid[f.id]); });
      (p.media || []).forEach(function (mid) {
        var m = S.tree.media[mid];
        if (!m || !S.canSee(m.acl)) return;
        L.push('1 OBJE');
        L.push('2 FILE media/' + mid + '_' + safeName(m.name));
        L.push('2 FORM ' + (m.mime || '').split('/').pop());
        if (m.caption) L.push('2 TITL ' + oneLine(m.caption));
      });
      L.push('1 CHAN');
      L.push('2 DATE ' + gedDate((p.updated || '').slice(0, 10)));
    });

    S.families().forEach(function (f) {
      L.push('0 ' + fid[f.id] + ' FAM');
      if (f.husb && pid[f.husb]) L.push('1 HUSB ' + pid[f.husb]);
      if (f.wife && pid[f.wife]) L.push('1 WIFE ' + pid[f.wife]);
      f.children.forEach(function (c) { if (pid[c]) L.push('1 CHIL ' + pid[c]); });
      if (f.marriage && (f.marriage.date || f.marriage.place)) {
        L.push('1 MARR');
        if (f.marriage.date) L.push('2 DATE ' + gedDate(f.marriage.date));
        if (f.marriage.place) L.push('2 PLAC ' + f.marriage.place);
      }
      if (f.divorced) L.push('1 DIV Y');
    });

    L.push('0 TRLR');
    return L.join('\r\n') + '\r\n';
  }
  function mapCoord(v, pos, neg) { return (v >= 0 ? pos : neg) + Math.abs(v).toFixed(6); }
  function oneLine(s) { return String(s || '').replace(/\s*\n\s*/g, ' ').trim(); }
  function safeName(s) { return String(s || 'file').replace(/[^\wа-яА-ЯёЁ.\-]+/g, '_'); }
  function pushNote(L, lvl, text) {
    var lines = String(text).split(/\r?\n/);
    L.push(lvl + ' NOTE ' + lines[0]);
    for (var i = 1; i < lines.length; i++) L.push((lvl + 1) + ' CONT ' + lines[i]);
  }

  /* ---------------- GEDCOM: загрузка ---------------- */
  function parseGedDate(s) {
    if (!s) return '';
    s = s.replace(/^(ABT|EST|CAL|BEF|AFT|FROM|TO)\s+/i, '').trim();
    var m = s.match(/^(\d{1,2})\s+([A-Z]{3})\s+(\d{4})$/i);
    if (m) {
      var mi = MON.indexOf(m[2].toUpperCase());
      if (mi >= 0) return m[3] + '-' + pad(mi + 1) + '-' + pad(+m[1]);
    }
    m = s.match(/^([A-Z]{3})\s+(\d{4})$/i);
    if (m) { var k = MON.indexOf(m[1].toUpperCase()); if (k >= 0) return m[2] + '-' + pad(k + 1); }
    m = s.match(/(\d{4})/);
    return m ? m[1] : s;
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function importGEDCOM(text) {
    var lines = String(text).replace(/﻿/g, '').split(/\r?\n/);
    var recs = [], cur = null, stack = [];
    lines.forEach(function (raw) {
      var m = raw.match(/^\s*(\d+)\s+(@[^@]+@\s+)?(\w+)\s?(.*)$/);
      if (!m) return;
      var lvl = +m[1], xref = (m[2] || '').trim(), tag = m[3], val = m[4] || '';
      var node = { lvl: lvl, xref: xref, tag: tag, val: val, kids: [] };
      if (lvl === 0) { cur = node; recs.push(node); stack = [node]; return; }
      if (!stack.length) return;
      stack.length = Math.min(stack.length, lvl);
      var parent = stack[lvl - 1];
      if (!parent) return;
      if (tag === 'CONT') { parent.val += '\n' + val; return; }
      if (tag === 'CONC') { parent.val += val; return; }
      parent.kids.push(node);
      stack[lvl] = node;
    });

    var tree = U.emptyTree();
    tree.meta.name = 'Импортированное дерево';
    var byXref = {}, famXref = {};
    function kid(node, tag) { return node.kids.filter(function (k) { return k.tag === tag; })[0]; }
    function kids(node, tag) { return node.kids.filter(function (k) { return k.tag === tag; }); }

    recs.forEach(function (r) {
      if (r.tag === 'INDI') {
        var p = U.newPerson();
        var nameNode = kid(r, 'NAME');
        if (nameNode) {
          var nm = nameNode.val || '';
          var sur = (nm.match(/\/([^\/]*)\//) || [])[1] || '';
          var giv = nm.replace(/\/[^\/]*\//, '').trim();
          var gn = kid(nameNode, 'GIVN'), sn = kid(nameNode, 'SURN');
          p.surname = (sn && sn.val) || sur;
          var parts = ((gn && gn.val) || giv).split(/\s+/).filter(Boolean);
          p.given = parts[0] || '';
          p.patronymic = parts.slice(1).join(' ');
        }
        var sx = kid(r, 'SEX');
        p.sex = sx && /^[MF]/.test(sx.val) ? sx.val[0] : 'U';
        var b = kid(r, 'BIRT');
        if (b) {
          p.birth.date = parseGedDate((kid(b, 'DATE') || {}).val);
          p.birth.place = ((kid(b, 'PLAC') || {}).val || '').trim();
        }
        var d = kid(r, 'DEAT');
        if (d) {
          p.death.date = parseGedDate((kid(d, 'DATE') || {}).val);
          p.death.place = ((kid(d, 'PLAC') || {}).val || '').trim();
          p.living = false;
        }
        var note = kid(r, 'NOTE');
        if (note) p.note = note.val;
        kids(r, 'PHON').forEach(function (x) {
          p.fields.push({ id: U.uid('f'), label: 'Телефон', value: x.val, type: 'phone', acl: { level: 'group', locked: false } });
        });
        kids(r, 'EMAIL').forEach(function (x) {
          p.fields.push({ id: U.uid('f'), label: 'Почта', value: x.val, type: 'email', acl: { level: 'group', locked: false } });
        });
        kids(r, 'EVEN').forEach(function (x) {
          p.events.push({
            id: U.uid('e'), type: ((kid(x, 'TYPE') || {}).val) || 'Событие',
            date: parseGedDate((kid(x, 'DATE') || {}).val), place: ((kid(x, 'PLAC') || {}).val || ''),
            note: x.val || '', lat: null, lng: null, acl: { level: 'public', locked: false }
          });
        });
        tree.persons[p.id] = p;
        byXref[r.xref] = p.id;
      }
    });
    recs.forEach(function (r) {
      if (r.tag === 'FAM') {
        var f = U.newFamily();
        var h = kid(r, 'HUSB'), w = kid(r, 'WIFE');
        if (h) f.husb = byXref[(h.val || '').trim()] || null;
        if (w) f.wife = byXref[(w.val || '').trim()] || null;
        kids(r, 'CHIL').forEach(function (c) {
          var id = byXref[(c.val || '').trim()];
          if (id) f.children.push(id);
        });
        var mr = kid(r, 'MARR');
        if (mr) {
          f.marriage.date = parseGedDate((kid(mr, 'DATE') || {}).val);
          f.marriage.place = ((kid(mr, 'PLAC') || {}).val || '');
        }
        if (kid(r, 'DIV')) f.divorced = true;
        tree.families[f.id] = f;
        famXref[r.xref] = f.id;
      }
    });
    var ids = Object.keys(tree.persons);
    tree.meta.rootId = ids[0] || null;
    return tree;
  }

  /* ---------------- импорт обычного текста ----------------
     Поддержаны строки вида:
       Фамилия Имя Отчество | м | 1935-05-12 | 1977 | с. Матур
       + ребёнок: Фамилия Имя Отчество
       = супруг: Фамилия Имя Отчество
     и простой отступ табуляцией — отступ означает «ребёнок предыдущего». */
  function importText(text) {
    var tree = U.emptyTree();
    tree.meta.name = 'Дерево из текста';
    var stack = [];
    String(text).split(/\r?\n/).forEach(function (raw) {
      if (!raw.trim()) return;
      var indent = (raw.match(/^[\t ]*/)[0] || '').replace(/ {2}/g, '\t').length;
      var line = raw.trim();
      var rel = null;
      if (/^[+•-]\s*(ребен|ребён|сын|доч)/i.test(line)) { rel = 'child'; line = line.replace(/^[+•-]\s*\S+\s*:?\s*/i, ''); }
      else if (/^=\s*(супруг|жена|муж)/i.test(line)) { rel = 'spouse'; line = line.replace(/^=\s*\S+\s*:?\s*/i, ''); }
      else if (/^[+•-]\s+/.test(line)) { rel = 'child'; line = line.replace(/^[+•-]\s+/, ''); }

      var cells = line.split(/\s*[|;]\s*/);
      var nameParts = (cells[0] || '').split(/\s+/).filter(Boolean);
      var p = U.newPerson({
        surname: nameParts[0] || '', given: nameParts[1] || '', patronymic: nameParts.slice(2).join(' ')
      });
      for (var i = 1; i < cells.length; i++) {
        var c = cells[i].trim();
        if (/^(м|муж|m|male)$/i.test(c)) p.sex = 'M';
        else if (/^(ж|жен|f|female)$/i.test(c)) p.sex = 'F';
        else if (/^\d{4}([-.\/]\d{1,2}([-.\/]\d{1,2})?)?$/.test(c)) {
          if (!p.birth.date) p.birth.date = norm(c); else { p.death.date = norm(c); p.living = false; }
        } else if (!p.birth.place) p.birth.place = c;
        else p.note = (p.note ? p.note + '\n' : '') + c;
      }
      tree.persons[p.id] = p;
      if (rel === 'spouse' && stack.length) {
        var f = U.newFamily();
        var prev = stack[stack.length - 1].id;
        var pr = tree.persons[prev];
        if (pr.sex === 'F') { f.wife = prev; f.husb = p.id; } else { f.husb = prev; f.wife = p.id; }
        tree.families[f.id] = f;
        return;
      }
      while (stack.length && stack[stack.length - 1].indent >= indent) stack.pop();
      var parent = stack[stack.length - 1];
      if (parent || rel === 'child') {
        var par = parent ? parent.id : null;
        if (par) {
          var fam = null;
          for (var fid in tree.families) {
            var ff = tree.families[fid];
            if (ff.husb === par || ff.wife === par) { fam = ff; break; }
          }
          if (!fam) {
            fam = U.newFamily();
            if (tree.persons[par].sex === 'F') fam.wife = par; else fam.husb = par;
            tree.families[fam.id] = fam;
          }
          fam.children.push(p.id);
        }
      }
      stack.push({ id: p.id, indent: indent });
    });
    tree.meta.rootId = Object.keys(tree.persons)[0] || null;
    return tree;
    function norm(c) { return c.replace(/[.\/]/g, '-'); }
  }

  /* ---------------- SVG дерева ---------------- */
  function exportSVG(treeView) {
    var res = treeView.compute();
    var W = res.w, H = res.h;
    var css = [
      '.n{stroke-width:1}',
      '.m{fill:url(#gm);stroke:#6aa9d4}',
      '.f{fill:url(#gf);stroke:#dd8fae}',
      '.u{fill:url(#gu);stroke:#bdb3a1}',
      '.mourn{fill:#15120f}',
      '.nm{font:700 12px "PT Sans",Arial,sans-serif;fill:#241f1a}',
      '.yr{font:11px "PT Mono",monospace;fill:#5d554a}',
      '.ln{fill:none;stroke:#bdb3a1;stroke-width:1.5}',
      '.cp{fill:none;stroke:#2f7fb8;stroke-width:2;opacity:.55}',
      '.ttl{font:700 20px "PT Serif",Georgia,serif;fill:#241f1a}',
      '.sub{font:12px "PT Sans",Arial,sans-serif;fill:#8d8577}'
    ].join('');
    var out = ['<?xml version="1.0" encoding="UTF-8"?>',
      '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + (H + 60) + '" viewBox="0 0 ' + W + ' ' + (H + 60) + '">',
      '<style>' + css + '</style>',
      '<defs>' +
      grad('gm', '#eaf5fd', '#cde6f7', '#afd4ee') +
      grad('gf', '#fdeef4', '#fbd3e2', '#f4b8ce') +
      grad('gu', '#f7f4ec', '#ece7dc', '#ded7c8') +
      '</defs>',
      '<rect width="100%" height="100%" fill="#f6f1e6"/>',
      '<text class="ttl" x="30" y="34">' + xml(S.tree.meta.name) + '</text>',
      '<text class="sub" x="30" y="52">Выгружено ' + new Date().toLocaleDateString('ru-RU') +
      ' · персон: ' + S.persons().length + '</text>',
      '<g transform="translate(0,60)">'];

    // линии
    var map = res.map, mode = treeView.mode;
    res.links.forEach(function (L) {
      if (L.kind === 'couple') {
        var a = map[L.a], b = map[L.b];
        if (!a || !b || typeof a !== 'object' || typeof b !== 'object') return;
        var p1 = mode === 'horizontal' ? [a.x + a.w / 2, a.y + a.h] : [a.x + a.w, a.y + a.h / 2];
        var p2 = mode === 'horizontal' ? [b.x + b.w / 2, b.y] : [b.x, b.y + b.h / 2];
        out.push('<path class="cp" d="M' + p1 + ' L' + p2 + '"/>');
      } else {
        var kidc = map[L.to];
        if (!kidc || typeof kidc !== 'object') return;
        var ps = L.from.map(function (id) { return map[id]; }).filter(function (c) { return c && typeof c === 'object'; });
        if (!ps.length) return;
        if (mode === 'horizontal') {
          var cy = ps.reduce(function (s, p) { return s + p.y + p.h / 2; }, 0) / ps.length;
          var sx = Math.max.apply(null, ps.map(function (p) { return p.x + p.w; }));
          var mx = (sx + kidc.x) / 2;
          out.push('<path class="ln" d="M' + sx + ',' + cy + ' H' + mx + ' V' + (kidc.y + kidc.h / 2) + ' H' + kidc.x + '"/>');
        } else {
          var cx = ps.reduce(function (s, p) { return s + p.x + p.w / 2; }, 0) / ps.length;
          var sy = Math.max.apply(null, ps.map(function (p) { return p.y + p.h; }));
          var my = (sy + kidc.y) / 2;
          out.push('<path class="ln" d="M' + cx + ',' + sy + ' V' + my + ' H' + (kidc.x + kidc.w / 2) + ' V' + kidc.y + '"/>');
        }
      }
    });
    // карточки
    var r = S.prefs.card.radius;
    res.cards.forEach(function (c) {
      var cls = c.person.sex === 'M' ? 'm' : c.person.sex === 'F' ? 'f' : 'u';
      out.push('<rect class="n ' + cls + '" x="' + c.x + '" y="' + c.y + '" width="' + c.w + '" height="' + c.h +
        '" rx="' + r + '" ry="' + r + '"/>');
      var pr = c.person;
      if ((pr.death && pr.death.date) || pr.living === false) {
        out.push('<path class="mourn" d="M' + c.x + ',' + (c.y + 13) + ' L' + c.x + ',' + (c.y + r) +
          ' Q' + c.x + ',' + c.y + ' ' + (c.x + r) + ',' + c.y +
          ' L' + (c.x + 13) + ',' + c.y + ' Z"/>');
      }
      var tx = c.x + 10, ty = c.y + 20;
      var name = S.shortName(c.person);
      wrap(name, Math.floor((c.w - 18) / 6.6)).forEach(function (ln, i) {
        out.push('<text class="nm" x="' + tx + '" y="' + (ty + i * 14) + '">' + xml(ln) + '</text>');
      });
      var years = S.years(c.person);
      if (years) out.push('<text class="yr" x="' + tx + '" y="' + (c.y + c.h - 9) + '">' + xml(years) + '</text>');
    });
    out.push('</g></svg>');
    return out.join('\n');

    function wrap(s, max) {
      var words = String(s).split(' '), lines = [], cur = '';
      words.forEach(function (w) {
        if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; }
        else cur = (cur ? cur + ' ' : '') + w;
      });
      if (cur) lines.push(cur);
      return lines.slice(0, 3);
    }
  }
  function grad(id, a, b, c) {
    return '<linearGradient id="' + id + '" x1="0" y1="0" x2="0.18" y2="1">' +
      '<stop offset="0" stop-color="' + a + '"/>' +
      '<stop offset="0.58" stop-color="' + b + '"/>' +
      '<stop offset="1" stop-color="' + c + '"/></linearGradient>';
  }
  function xml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c];
    });
  }

  /* ---------------- печать / PDF ---------------- */
  function printSVG(svgText) {
    var w = global.open('', '_blank');
    if (!w) return false;
    w.document.write('<!doctype html><meta charset="utf-8"><title>' + xml(S.tree.meta.name) +
      '</title><style>@page{size:auto;margin:8mm}body{margin:0}svg{width:100%;height:auto}</style>' +
      svgText.replace(/^<\?xml[^>]*\?>/, ''));
    w.document.close();
    w.focus();
    setTimeout(function () { try { w.print(); } catch (e) {} }, 400);
    return true;
  }

  /* ---------------- ZIP (без сжатия) ---------------- */
  var CRC = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(u8) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function zip(files) {       // files: [{name, data: Uint8Array}]
    var parts = [], central = [], offset = 0;
    var enc = new TextEncoder();
    files.forEach(function (f) {
      var nameBytes = enc.encode(f.name);
      var crc = crc32(f.data), size = f.data.length;
      var lh = new Uint8Array(30 + nameBytes.length);
      var dv = new DataView(lh.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true); dv.setUint16(8, 0, true);
      dv.setUint16(10, 0, true); dv.setUint16(12, 0, true);
      dv.setUint32(14, crc, true); dv.setUint32(18, size, true); dv.setUint32(22, size, true);
      dv.setUint16(26, nameBytes.length, true); dv.setUint16(28, 0, true);
      lh.set(nameBytes, 30);
      parts.push(lh, f.data);
      var ch = new Uint8Array(46 + nameBytes.length);
      var cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0, true);
      cv.setUint32(16, crc, true); cv.setUint32(20, size, true); cv.setUint32(24, size, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint32(42, offset, true);
      ch.set(nameBytes, 46);
      central.push(ch);
      offset += lh.length + size;
    });
    var cdSize = central.reduce(function (s, c) { return s + c.length; }, 0);
    var end = new Uint8Array(22);
    var ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [end]), { type: 'application/zip' });
  }

  /* полная резервная копия: GEDCOM + JSON + фото + SVG */
  function fullBackup(treeView, onStep) {
    var enc = new TextEncoder();
    var files = [];
    files.push({ name: 'tree.ged', data: enc.encode(exportGEDCOM()) });
    files.push({ name: 'tree.svg', data: enc.encode(exportSVG(treeView)) });
    files.push({ name: 'drevo.json', data: enc.encode(JSON.stringify(S.tree, null, 1)) });
    files.push({ name: 'ЧИТАТЬ.txt', data: enc.encode(readme()) });

    var media = S.allMedia();
    var i = 0;
    function next() {
      if (i >= media.length) return Promise.resolve();
      var m = media[i++];
      if (onStep) onStep(i, media.length);
      var isPrivate = m.encrypted;
      // приватные файлы кладём как есть — то есть зашифрованными
      var get = isPrivate ? U.blobGet(m.id) : S.mediaBlob(m.id);
      return get.then(function (b) {
        if (!b) return;
        return b.arrayBuffer().then(function (buf) {
          var folder = m.kind === 'photo' ? 'photo' : m.kind === 'audio' ? 'audio' : m.kind === 'video' ? 'video' : 'doc';
          var ext = isPrivate ? '.enc' : '';
          files.push({
            name: folder + '/' + m.id + '_' + safeName(m.name) + ext,
            data: new Uint8Array(buf)
          });
        });
      }).then(next);
    }
    return next().then(function () { return zip(files); });
  }
  function readme() {
    return [
      'Резервная копия «Семейное Древо»',
      'Создана: ' + new Date().toLocaleString('ru-RU'),
      'Дерево: ' + S.tree.meta.name,
      'Персон: ' + S.persons().length + ', семей: ' + S.families().length + ', файлов: ' + S.allMedia().length,
      '',
      'Что внутри:',
      '  tree.ged      — дерево в формате GEDCOM 5.5.1, открывается любой генеалогической программой',
      '  tree.svg      — схема дерева, открывается браузером, печатается в PDF без потери качества',
      '  drevo.json    — полная копия для возврата в «Семейное Древо» (Настройки → Данные)',
      '  photo/ audio/ video/ doc/ — вложенные файлы',
      '',
      'Файлы с расширением .enc зашифрованы (AES-256-GCM) — это записи,',
      'для которых был включён запрет просмотра. Они открываются только',
      'в «Семейном Древе» после ввода пароля дерева. Без пароля их не прочитать —',
      'в том числе и разработчику программы.'
    ].join('\n');
  }

  /* ---------------- сохранение файла ---------------- */
  function download(blob, filename) {
    try {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
      return true;
    } catch (e) { return false; }
  }

  global.IO = {
    exportGEDCOM: exportGEDCOM, importGEDCOM: importGEDCOM, importText: importText,
    exportSVG: exportSVG, printSVG: printSVG, fullBackup: fullBackup, zip: zip,
    download: download, gedDate: gedDate, xml: xml
  };
})(window);
</script>
<script>/* Семейное Древо — точки восстановления и откат.

   Зачем. Дерево общее: любой может поправить дату или удалить человека,
   и у администратора должен быть способ вернуть как было. Журнал «Изменения»
   показывает, что произошло, но не возвращает — для возврата нужны снимки.

   Как устроено. Снимок — это дерево без самих файлов (фотографии лежат
   отдельно и никуда не деваются), сжатое и положенное в хранилище браузера.
   Снимки делаются перед тем, как что-то может пропасть: перед приёмом чужих
   правок, перед импортом, перед очисткой, и просто по времени во время работы.

   Откат не «подменяет» дерево задним числом. Он вычисляет разницу между
   нынешним состоянием и снимком и применяет её как новые правки — иначе
   при следующей синхронизации чужое устройство вернуло бы всё обратно,
   ведь там записи «свежее». */
(function (global) {
  'use strict';

  var S = global.Store, U = S.util;
  var LS_INDEX = 'drevo.snaps';
  var MIN_GAP_MIN = 10;        // чаще этого по ходу работы не снимаем
  var KEEP = 80;               // сколько точек держим после прореживания

  function nowISO() { return new Date().toISOString(); }

  var History = {
    index: [],

    load: function () {
      try { this.index = JSON.parse(localStorage.getItem(LS_INDEX) || '[]'); }
      catch (e) { this.index = []; }
      if (!Array.isArray(this.index)) this.index = [];
      return this;
    },
    saveIndex: function () {
      try { localStorage.setItem(LS_INDEX, JSON.stringify(this.index)); } catch (e) {}
    },

    /** Слепок дерева без двоичных файлов. */
    capture: function () {
      var t = S.tree;
      return {
        meta: t.meta, persons: t.persons, families: t.families,
        media: t.media, tabs: t.tabs, users: t.users,
        invites: t.invites, tombstones: t.tombstones
      };
    },

    /** Снять точку восстановления. reason — чем вызвана, для подписи в списке. */
    snapshot: function (reason) {
      var self = this;
      var data = JSON.stringify(this.capture());
      var id = 'snap-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
      var who = (S.session && S.session.displayName) || 'кто-то';
      var rec = {
        id: id, at: nowISO(), by: who, byId: (S.session || {}).userId || null,
        reason: reason || 'работа',
        persons: Object.keys(S.tree.persons || {}).length,
        families: Object.keys(S.tree.families || {}).length,
        media: Object.keys(S.tree.media || {}).length,
        size: data.length
      };
      return U.blobPut(id, new Blob([data], { type: 'application/json' })).then(function () {
        self.index.push(rec);
        self.saveIndex();
        return self.prune().then(function () { return rec; });
      }, function () { return null; });
    },

    /** Снять, если с прошлого раза прошло достаточно времени. */
    maybeSnapshot: function (reason) {
      var last = this.index[this.index.length - 1];
      if (last && (Date.now() - new Date(last.at).getTime()) < MIN_GAP_MIN * 60000) {
        return Promise.resolve(null);
      }
      return this.snapshot(reason || 'работа');
    },

    /** Прореживание: свежее держим подробно, старое — по одной точке на день. */
    prune: function () {
      if (this.index.length <= KEEP) return Promise.resolve();
      var keep = {}, out = [];
      var day = 86400000, now = Date.now();
      // всё за последние сутки оставляем как есть
      for (var i = this.index.length - 1; i >= 0; i--) {
        var r = this.index[i], age = now - new Date(r.at).getTime();
        var key;
        if (age < day) key = r.id;                                    // всё
        else if (age < 30 * day) key = r.at.slice(0, 13);             // по часу
        else key = r.at.slice(0, 10);                                 // по дню
        if (keep[key]) { out.push(r.id); continue; }
        keep[key] = 1;
      }
      var left = this.index.filter(function (r) { return out.indexOf(r.id) < 0; });
      // если и так слишком много — срезаем самые старые
      while (left.length > KEEP) out.push(left.shift().id);
      this.index = left;
      this.saveIndex();
      out.forEach(function (id) { U.blobDel(id); });
      return Promise.resolve();
    },

    read: function (id) {
      return U.blobGet(id).then(function (b) {
        if (!b) return null;
        return b.text().then(function (t) {
          try { return JSON.parse(t); } catch (e) { return null; }
        });
      });
    },

    drop: function (id) {
      this.index = this.index.filter(function (r) { return r.id !== id; });
      this.saveIndex();
      return U.blobDel(id);
    },

    /** Что изменилось между снимком и нынешним деревом. */
    diff: function (snap) {
      var out = { persons: { back: 0, revive: 0, remove: 0 },
                  families: { back: 0, revive: 0, remove: 0 }, names: [] };
      ['persons', 'families'].forEach(function (kind) {
        var was = snap[kind] || {}, now = S.tree[kind] || {};
        for (var id in was) {
          if (!now[id]) { out[kind].revive++; if (kind === 'persons') out.names.push('вернётся: ' + name(was[id])); }
          else if (JSON.stringify(now[id]) !== JSON.stringify(was[id])) {
            out[kind].back++;
            if (kind === 'persons') out.names.push('как было: ' + name(now[id]));
          }
        }
        for (var id2 in now) {
          if (!was[id2]) { out[kind].remove++; if (kind === 'persons') out.names.push('исчезнет: ' + name(now[id2])); }
        }
      });
      return out;
      function name(p) {
        return [p.given, p.surname].filter(Boolean).join(' ') || 'без имени';
      }
    },

    /** Откат: превращаем разницу в новые правки, чтобы она разошлась по устройствам. */
    restore: function (id) {
      var self = this;
      return this.read(id).then(function (snap) {
        if (!snap) throw new Error('Точка восстановления не читается');
        // перед откатом сохраняем нынешнее состояние — вдруг откатили зря
        return self.snapshot('перед откатом').then(function () { return snap; });
      }).then(function (snap) {
        var stamp = nowISO();
        var t = S.tree;
        t.tombstones = t.tombstones || {};

        ['persons', 'families', 'media', 'tabs'].forEach(function (kind) {
          var was = snap[kind], now = t[kind];
          if (!was || !now || typeof was !== 'object') return;
          if (Array.isArray(now)) { t[kind] = JSON.parse(JSON.stringify(was)); return; }
          for (var id2 in was) {
            if (!now[id2] || JSON.stringify(now[id2]) !== JSON.stringify(was[id2])) {
              var rec = JSON.parse(JSON.stringify(was[id2]));
              rec.updated = stamp;            // свежее чужих правок — иначе откат отменят
              now[id2] = rec;
              delete t.tombstones[id2];
            }
          }
          for (var id3 in now) {
            if (!was[id3]) { delete now[id3]; t.tombstones[id3] = stamp; }
          }
        });

        var snapAt = (self.index.filter(function (r) { return r.id === id; })[0] || {}).at;
        S.log('rollback', 'Откат к состоянию на ' +
          (snapAt ? new Date(snapAt).toLocaleString('ru-RU') : 'выбранную точку'));
        S.save();
        return true;
      });
    },

    /** Список точек, сгруппированный так, как просят показать. */
    grouped: function (how) {
      var rows = this.index.slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; });
      if (how === 'all') return rows.map(function (r) { return { head: null, items: [r] }; });
      var map = {}, order = [];
      rows.forEach(function (r) {
        var d = new Date(r.at), key, head;
        if (how === 'hour') {
          key = r.at.slice(0, 13);
          head = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) + ', ' +
            d.getHours() + ':00';
        } else if (how === 'day') {
          key = r.at.slice(0, 10);
          head = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        } else {                         // по сеансам работы: тот же человек, перерыв меньше часа
          var prev = order.length ? map[order[order.length - 1]] : null;
          var cont = prev && prev.by === r.by &&
            Math.abs(new Date(prev.items[prev.items.length - 1].at) - d) < 3600000;
          if (cont) { prev.items.push(r); return; }
          key = r.id;
          head = r.by + ' · ' + d.toLocaleString('ru-RU',
            { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
        }
        if (!map[key]) { map[key] = { head: head, by: r.by, items: [] }; order.push(key); }
        map[key].items.push(r);
      });
      return order.map(function (k) { return map[k]; });
    }
  };

  History.load();
  global.History = History;
})(window);
</script>
<script>/* Семейное Древо — синхронизация.

   Дерево у всех родственников общее, поэтому правки сливаются, а не затирают
   друг друга: каждая персона, семья, файл и вкладка живут отдельно и имеют
   время последней правки. При встрече двух копий по каждой записи побеждает
   та, что правилась позже. Удаления помечаются «следами» (tombstones), иначе
   запись, стёртая на телефоне, вернулась бы с компьютера.

   Порядок: забрать общее → слить со своим → отдать обратно → разобраться
   с файлами. Слияние идемпотентно: если чья-то отправка перебила чужую,
   следующая синхронизация вернёт потерянное обратно.

   Три способа хранения общих данных — Supabase, свой сервер, файл в облачном
   диске — отличаются только четырьмя действиями: pull, push, putMedia, getMedia. */
(function (global) {
  'use strict';
  var S = global.Store, U = S.util;

  /* ===================== слияние ===================== */

  function ts(x) { return x ? Date.parse(x) || 0 : 0; }

  /** позже ли a, чем b */
  function newer(a, b) { return ts(a) > ts(b); }

  /** слить два дерева. Возвращает { tree, stats } */
  function merge(local, remote) {
    if (!remote || !remote.persons) return { tree: local, stats: zeroStats() };

    // Человек присоединяется к общему дереву, а у него на устройстве ещё лежит
    // нетронутый образец. Сливать их нельзя — вышли бы двойники.
    if (local.meta && local.meta.demo && Object.keys(remote.persons).length) {
      var taken = JSON.parse(JSON.stringify(remote));
      var zs = zeroStats();
      zs.persons.added = Object.keys(remote.persons).length;
      zs.families.added = Object.keys(remote.families || {}).length;
      zs.media.added = Object.keys(remote.media || {}).length;
      return { tree: taken, stats: zs, replaced: true };
    }

    var out = JSON.parse(JSON.stringify(local));
    var st = zeroStats();

    out.tombstones = out.tombstones || {};
    var rt = remote.tombstones || {};
    for (var tid in rt) {
      if (!out.tombstones[tid] || newer(rt[tid], out.tombstones[tid])) out.tombstones[tid] = rt[tid];
    }
    var graves = out.tombstones;

    /* --- словари записей: персоны, семьи, медиа --- */
    ['persons', 'families', 'media'].forEach(function (kind) {
      out[kind] = out[kind] || {};
      var mine = out[kind], theirs = remote[kind] || {};
      var stampField = kind === 'media' ? 'updated' : 'updated';

      for (var id in theirs) {
        var r = theirs[id], l = mine[id];
        var rStamp = r[stampField] || r.added || r.updated;
        if (graves[id] && !newer(rStamp, graves[id])) continue;      // удалено позже, чем правилось
        if (!l) { mine[id] = r; st[kind].added++; continue; }
        var lStamp = l[stampField] || l.added || l.updated;
        if (newer(rStamp, lStamp)) { mine[id] = r; st[kind].updated++; }
      }
      // применить чужие удаления к своим записям
      for (var id2 in mine) {
        var m = mine[id2];
        var mStamp = m[stampField] || m.added || m.updated;
        if (graves[id2] && !newer(mStamp, graves[id2])) { delete mine[id2]; st[kind].removed++; }
      }
    });

    /* --- учётные записи: по id, побеждает более поздняя правка --- */
    var users = {}, uorder = [];
    (out.users || []).concat(remote.users || []).forEach(function (u) {
      if (!u || !u.id) return;
      if (graves[u.id] && !newer(u.updated, graves[u.id])) return;
      if (!users[u.id]) { users[u.id] = u; uorder.push(u.id); }
      else if (newer(u.updated, users[u.id].updated)) users[u.id] = u;
    });
    out.users = uorder.map(function (id) { return users[id]; });

    /* --- приглашения --- */
    var invs = {}, iorder = [];
    (out.invites || []).concat(remote.invites || []).forEach(function (v) {
      if (!v || !v.id) return;
      if (!invs[v.id]) { invs[v.id] = v; iorder.push(v.id); }
      else if (newer(v.updated, invs[v.id].updated)) invs[v.id] = v;
    });
    out.invites = iorder.map(function (id) { return invs[id]; });

    /* --- вкладки: по id, встроенные не трогаем --- */
    var tabs = {}, order = [];
    (out.tabs || []).concat(remote.tabs || []).forEach(function (t) {
      if (graves[t.id] && !t.builtin && !newer(t.updated, graves[t.id])) return;
      if (!tabs[t.id]) { tabs[t.id] = t; order.push(t.id); }
      else if (newer(t.updated, tabs[t.id].updated)) tabs[t.id] = t;
    });
    out.tabs = order.map(function (id) { return tabs[id]; });

    /* --- журнал изменений: объединение без повторов --- */
    var seen = {}, log = [];
    (out.changes || []).concat(remote.changes || []).forEach(function (c) {
      if (!c || seen[c.id]) return;
      seen[c.id] = 1;
      log.push(c);
    });
    log.sort(function (a, b) { return (b.ts || '').localeCompare(a.ts || ''); });
    out.changes = log.slice(0, 1000);
    st.changes = log.length - (local.changes || []).length;

    /* --- шапка дерева --- */
    // Имя берём у того, кто правил позже; личность дерева (id и соль шифрования)
    // всегда остаётся за общим хранилищем, иначе зашифрованные файлы перестанут открываться.
    if (remote.meta) {
      if (newer(remote.meta.updated, out.meta.updated)) {
        out.meta.name = remote.meta.name;
        if (remote.meta.rootId && out.persons[remote.meta.rootId]) out.meta.rootId = remote.meta.rootId;
      }
      out.meta.id = remote.meta.id || out.meta.id;
      out.meta.salt = remote.meta.salt || out.meta.salt;
      out.meta.updated = newer(remote.meta.updated, out.meta.updated) ? remote.meta.updated : out.meta.updated;
    }
    if (!out.meta.rootId || !out.persons[out.meta.rootId]) {
      out.meta.rootId = Object.keys(out.persons)[0] || null;
    }

    /* --- ссылки, оставшиеся в пустоту --- */
    cleanup(out);
    return { tree: out, stats: st };
  }

  function zeroStats() {
    return {
      persons: { added: 0, updated: 0, removed: 0 },
      families: { added: 0, updated: 0, removed: 0 },
      media: { added: 0, updated: 0, removed: 0 },
      changes: 0
    };
  }

  /** убрать ссылки на исчезнувшие записи */
  function cleanup(t) {
    for (var fid in t.families) {
      var f = t.families[fid];
      if (f.husb && !t.persons[f.husb]) f.husb = null;
      if (f.wife && !t.persons[f.wife]) f.wife = null;
      f.children = (f.children || []).filter(function (c) { return !!t.persons[c]; });
      if (!f.husb && !f.wife && !f.children.length) delete t.families[fid];
    }
    for (var pid in t.persons) {
      var p = t.persons[pid];
      p.media = (p.media || []).filter(function (m) { return !!t.media[m]; });
      if (p.photo && !t.media[p.photo]) p.photo = p.media[0] || null;
    }
    for (var mid in t.media) {
      var m = t.media[mid];
      if (m.personId && !t.persons[m.personId]) delete t.media[mid];
    }
  }

  /** Понятное объяснение, почему файлы не передались. Чаще всего в Supabase
      просто не заведено хранилище файлов: таблица есть, фотографиям лечь некуда. */
  function mediaTrouble(report) {
    var all = report.failed.concat(report.failedDown);
    var why = (all[0] && all[0].why) || '';
    if (/bucket not found|404/i.test(why) && S.sync.mode === 'supabase') {
      return 'Фотографии некуда класть: в Supabase не создано хранилище файлов «drevo». ' +
        'Откройте в Supabase раздел Storage, создайте bucket с именем drevo — ' +
        'и нажмите «Синхронизировать» ещё раз, файлы уедут сами.';
    }
    if (/403|401|policy|permission/i.test(why)) {
      return 'Хранилище файлов не пускает: проверьте права доступа к нему. Ответ сервера: ' + why;
    }
    return 'Не передались файлы: ' + all.slice(0, 3).map(function (f) { return f.name; }).join(', ') +
      (all.length > 3 ? ' и ещё ' + (all.length - 3) : '') + '. ' + why;
  }

  function statsText(st) {
    var bits = [];
    function part(label, s) {
      var x = [];
      if (s.added) x.push('+' + s.added);
      if (s.updated) x.push('обновлено ' + s.updated);
      if (s.removed) x.push('убрано ' + s.removed);
      if (x.length) bits.push(label + ': ' + x.join(', '));
    }
    part('люди', st.persons);
    part('связи', st.families);
    part('файлы', st.media);
    return bits.length ? bits.join(' · ') : 'изменений нет';
  }

  /* ===================== ZIP для файлового режима ===================== */

  function unzip(buf) {
    var dv = new DataView(buf), u8 = new Uint8Array(buf);
    // найти конец центрального каталога
    var eocd = -1;
    for (var i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) return Promise.reject(new Error('Это не ZIP-файл'));
    var count = dv.getUint16(eocd + 10, true);
    var cdOff = dv.getUint32(eocd + 16, true);
    var dec = new TextDecoder('utf-8');
    var entries = [], p = cdOff;
    for (var n = 0; n < count; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      var method = dv.getUint16(p + 10, true);
      var csize = dv.getUint32(p + 20, true);
      var nameLen = dv.getUint16(p + 28, true);
      var extraLen = dv.getUint16(p + 30, true);
      var cmtLen = dv.getUint16(p + 32, true);
      var lho = dv.getUint32(p + 42, true);
      var name = dec.decode(u8.subarray(p + 46, p + 46 + nameLen));
      var lNameLen = dv.getUint16(lho + 26, true);
      var lExtraLen = dv.getUint16(lho + 28, true);
      var dataAt = lho + 30 + lNameLen + lExtraLen;
      entries.push({ name: name, method: method, data: u8.subarray(dataAt, dataAt + csize) });
      p += 46 + nameLen + extraLen + cmtLen;
    }
    // разжать всё, что сжато
    return Promise.all(entries.map(function (e) {
      if (e.method === 0) return Promise.resolve(e);
      if (!global.DecompressionStream) return Promise.reject(new Error('Браузер не умеет распаковывать этот архив'));
      var ds = new DecompressionStream('deflate-raw');
      return new Response(new Blob([e.data]).stream().pipeThrough(ds)).arrayBuffer()
        .then(function (b) { return { name: e.name, method: 0, data: new Uint8Array(b) }; });
    })).then(function (list) {
      var map = {};
      list.forEach(function (e) { map[e.name] = e.data; });
      return map;
    });
  }

  /* ===================== способы хранения ===================== */

  function httpErr(r, what) {
    return r.text().then(function (t) {
      throw new Error(what + ': ' + r.status + (t ? ' — ' + t.slice(0, 160) : ''));
    });
  }

  var backends = {

    /* ---------- Supabase ---------- */
    supabase: {
      label: 'Supabase',
      needs: ['url', 'key', 'treeId'],
      head: function (cfg) {
        return { apikey: cfg.key, Authorization: 'Bearer ' + cfg.key };
      },
      check: function (cfg) {
        var b = backends.supabase;
        /* Проверяем обе половины: таблицу для дерева и хранилище для файлов.
           Их заводят отдельно, и без второго фотографии остаются на одном
           устройстве — молча, что хуже всего. */
        return fetch(b.base(cfg) + '/rest/v1/trees?select=id&limit=1', { headers: b.head(cfg) })
          .then(function (r) {
            if (r.status === 404) return { ok: false, message: 'Таблица trees не создана — выполните SQL из инструкции' };
            if (r.status === 401 || r.status === 403) return { ok: false, message: 'Ключ не подошёл' };
            if (!r.ok) return { ok: false, message: 'Ответ сервера: ' + r.status };
            return b.checkStorage(cfg).then(function (st) {
              if (st.ok) return { ok: true, message: 'Связь есть: таблица и хранилище файлов на месте' };
              return { ok: false, message: 'Таблица найдена, но ' + st.message };
            });
          }, function (e) { return { ok: false, message: 'Сервер не отвечает: ' + e.message }; });
      },
      /** пробуем положить и убрать крошечный файл — иначе о проблеме узнаём поздно */
      checkStorage: function (cfg) {
        var b = backends.supabase;
        var path = '/storage/v1/object/drevo/' + encodeURIComponent(cfg.treeId || 'drevo') + '/__proba';
        return fetch(b.base(cfg) + path, {
          method: 'POST',
          headers: Object.assign(b.head(cfg), { 'x-upsert': 'true', 'Content-Type': 'application/octet-stream' }),
          body: new Blob([new Uint8Array([1])])
        }).then(function (r) {
          if (r.ok) {
            fetch(b.base(cfg) + path, { method: 'DELETE', headers: b.head(cfg) }).catch(function () {});
            return { ok: true };
          }
          return r.text().then(function (t) {
            if (r.status === 404 || /bucket not found/i.test(t)) {
              return { ok: false, message: 'хранилища файлов нет. В Supabase откройте Storage, ' +
                'создайте bucket с именем drevo — тогда поедут и фотографии.' };
            }
            if (r.status === 400 && /row-level security|policy/i.test(t)) {
              return { ok: false, message: 'хранилище drevo не разрешает запись. В Supabase: Storage → drevo → ' +
                'Policies, разрешите чтение и запись для anon.' };
            }
            return { ok: false, message: 'хранилище файлов отвечает ошибкой ' + r.status +
              (t ? ' — ' + t.slice(0, 120) : '') };
          });
        }, function (e) { return { ok: false, message: 'до хранилища файлов не достучаться: ' + e.message }; });
      },
      base: function (cfg) { return String(cfg.url || '').replace(/\/+$/, ''); },
      pull: function (cfg) {
        var b = backends.supabase;
        return fetch(b.base(cfg) + '/rest/v1/trees?id=eq.' + encodeURIComponent(cfg.treeId) + '&select=data',
          { headers: b.head(cfg) }).then(function (r) {
            if (!r.ok) return httpErr(r, 'Чтение дерева');
            return r.json();
          }).then(function (rows) { return rows && rows[0] ? rows[0].data : null; });
      },
      push: function (cfg, tree) {
        var b = backends.supabase;
        return fetch(b.base(cfg) + '/rest/v1/trees', {
          method: 'POST',
          headers: Object.assign(b.head(cfg), {
            'Content-Type': 'application/json',
            Prefer: 'resolution=merge-duplicates,return=minimal'
          }),
          body: JSON.stringify({ id: cfg.treeId, data: tree, updated_at: new Date().toISOString() })
        }).then(function (r) { if (!r.ok) return httpErr(r, 'Запись дерева'); });
      },
      putMedia: function (cfg, id, blob) {
        var b = backends.supabase;
        var path = '/storage/v1/object/drevo/' + encodeURIComponent(cfg.treeId) + '/' + encodeURIComponent(id);
        return fetch(b.base(cfg) + path, {
          method: 'POST',
          headers: Object.assign(b.head(cfg), { 'x-upsert': 'true', 'Content-Type': 'application/octet-stream' }),
          body: blob
        }).then(function (r) { if (!r.ok) return httpErr(r, 'Отправка файла'); });
      },
      getMedia: function (cfg, id) {
        var b = backends.supabase;
        var path = '/storage/v1/object/drevo/' + encodeURIComponent(cfg.treeId) + '/' + encodeURIComponent(id);
        return fetch(b.base(cfg) + path, { headers: b.head(cfg) })
          .then(function (r) { return r.ok ? r.blob() : null; });
      }
    },

    /* ---------- свой сервер ---------- */
    server: {
      label: 'Свой сервер',
      needs: ['url', 'key'],
      base: function (cfg) { return String(cfg.url || '').replace(/\/+$/, ''); },
      head: function (cfg) { return { 'X-Drevo-Key': cfg.key }; },
      check: function (cfg) {
        var b = backends.server;
        return fetch(b.base(cfg) + '/api/health', { headers: b.head(cfg) }).then(function (r) {
          if (r.ok) return r.json().then(function (j) {
            return { ok: true, message: 'Сервер отвечает, персон в хранилище: ' + (j.persons != null ? j.persons : '—') };
          });
          if (r.status === 401) return { ok: false, message: 'Ключ доступа не подошёл' };
          return { ok: false, message: 'Ответ сервера: ' + r.status };
        }, function (e) { return { ok: false, message: 'Сервер не отвечает: ' + e.message }; });
      },
      pull: function (cfg) {
        var b = backends.server;
        return fetch(b.base(cfg) + '/api/tree', { headers: b.head(cfg) }).then(function (r) {
          if (r.status === 404) return null;
          if (!r.ok) return httpErr(r, 'Чтение дерева');
          return r.json();
        }).then(function (j) { return j && j.persons ? j : null; });
      },
      push: function (cfg, tree) {
        var b = backends.server;
        return fetch(b.base(cfg) + '/api/tree', {
          method: 'PUT',
          headers: Object.assign(b.head(cfg), { 'Content-Type': 'application/json' }),
          body: JSON.stringify(tree)
        }).then(function (r) { if (!r.ok) return httpErr(r, 'Запись дерева'); });
      },
      putMedia: function (cfg, id, blob) {
        var b = backends.server;
        return fetch(b.base(cfg) + '/api/media/' + encodeURIComponent(id), {
          method: 'PUT',
          headers: Object.assign(b.head(cfg), { 'Content-Type': 'application/octet-stream' }),
          body: blob
        }).then(function (r) { if (!r.ok) return httpErr(r, 'Отправка файла'); });
      },
      getMedia: function (cfg, id) {
        var b = backends.server;
        return fetch(b.base(cfg) + '/api/media/' + encodeURIComponent(id), { headers: b.head(cfg) })
          .then(function (r) { return r.ok ? r.blob() : null; });
      }
    },

    /* ---------- файл в облачном диске ----------
       Работает через File System Access API: программа один раз получает
       разрешение на файл внутри папки Яндекс.Диска или Google Диска,
       дальше читает и пишет его сама. Диск разносит файл по устройствам. */
    file: {
      label: 'Облачный диск',
      needs: [],
      supported: function () {
        return typeof global.showOpenFilePicker === 'function' && typeof global.showSaveFilePicker === 'function';
      },
      handle: null,
      check: function () {
        if (!backends.file.supported()) {
          return Promise.resolve({
            ok: false,
            message: 'Этот браузер не умеет работать с файлом напрямую. На телефоне пользуйтесь обменом через «Данные → Полная копия».'
          });
        }
        if (!backends.file.handle) return Promise.resolve({ ok: false, message: 'Файл не выбран' });
        return backends.file.handle.getFile().then(function (f) {
          return { ok: true, message: 'Файл «' + f.name + '», ' + Math.round(f.size / 1024) + ' КБ' };
        }, function () { return { ok: false, message: 'Файл стал недоступен — выберите заново' }; });
      },
      /** выбрать существующий файл обмена */
      open: function () {
        return global.showOpenFilePicker({
          types: [{ description: 'Семейное Древо', accept: { 'application/zip': ['.drevo', '.zip'] } }],
          multiple: false
        }).then(function (hs) {
          backends.file.handle = hs[0];
          return saveHandle(hs[0]);
        });
      },
      /** создать новый файл обмена */
      create: function (name) {
        return global.showSaveFilePicker({
          suggestedName: (name || 'Семейное Древо') + '.drevo',
          types: [{ description: 'Семейное Древо', accept: { 'application/zip': ['.drevo'] } }]
        }).then(function (h) {
          backends.file.handle = h;
          return saveHandle(h);
        });
      },
      _cache: null,
      pull: function () {
        var b = backends.file;
        if (!b.handle) return Promise.reject(new Error('Файл обмена не выбран'));
        return b.handle.getFile().then(function (f) {
          if (!f.size) { b._cache = {}; return null; }
          return f.arrayBuffer().then(unzip).then(function (map) {
            b._cache = map;
            var j = map['drevo.json'];
            if (!j) return null;
            return JSON.parse(new TextDecoder().decode(j));
          });
        });
      },
      push: function (cfg, tree) {
        var b = backends.file;
        if (!b.handle) return Promise.reject(new Error('Файл обмена не выбран'));
