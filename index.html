          var folder = m.kind === 'photo' ? 'photo' : m.kind === 'audio' ? 'audio' : m.kind === 'video' ? 'video' : 'doc';
          var ext = isPrivate ? '.enc' : '';
          files.push({
            name: folder + '/' + m.id + '_' + safeName(m.name) + ext,
            data: new Uint8Array(buf)
          });
        });
      }).then(next);
    }
    return svgReady.then(next).then(function () { return zip(files); });
  }
  function readme() {
    return [
      'Резервная копия «Семейное Древо»',
      'Создана: ' + new Date().toLocaleString('ru-RU'),
      'Дерево: ' + S.tree.meta.name,
      'Персон: ' + S.persons().length + ', семей: ' + S.families().length + ', файлов: ' + S.allMedia().length,
      '',
      'Что внутри:',
      '  tree.ged      — дерево в формате GEDCOM 5.5.1, открывается любой генеалогической программой',
      '  tree.svg      — схема дерева, открывается браузером, печатается в PDF без потери качества',
      '  drevo.json    — полная копия для возврата в «Семейное Древо» (Настройки → Данные)',
      '  photo/ audio/ video/ doc/ — вложенные файлы',
      '',
      'Файлы с расширением .enc зашифрованы (AES-256-GCM) — это записи,',
      'для которых был включён запрет просмотра. Они открываются только',
      'в «Семейном Древе» после ввода пароля дерева. Без пароля их не прочитать —',
      'в том числе и разработчику программы.'
    ].join('\n');
  }

  /* ---------------- сохранение файла ---------------- */
  function download(blob, filename) {
    try {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
      return true;
    } catch (e) { return false; }
  }

  global.IO = {
    exportGEDCOM: exportGEDCOM, importGEDCOM: importGEDCOM, importText: importText,
    exportSVG: exportSVG, printSVG: printSVG, fullBackup: fullBackup, zip: zip,
    download: download, gedDate: gedDate, xml: xml
  };
})(window);
</script>
<script>/* Семейное Древо — точки восстановления и откат.

   Зачем. Дерево общее: любой может поправить дату или удалить человека,
   и у администратора должен быть способ вернуть как было. Журнал «Изменения»
   показывает, что произошло, но не возвращает — для возврата нужны снимки.

   Как устроено. Снимок — это дерево без самих файлов (фотографии лежат
   отдельно и никуда не деваются), сжатое и положенное в хранилище браузера.
   Снимки делаются перед тем, как что-то может пропасть: перед приёмом чужих
   правок, перед импортом, перед очисткой, и просто по времени во время работы.

   Откат не «подменяет» дерево задним числом. Он вычисляет разницу между
   нынешним состоянием и снимком и применяет её как новые правки — иначе
   при следующей синхронизации чужое устройство вернуло бы всё обратно,
   ведь там записи «свежее». */
(function (global) {
  'use strict';

  var S = global.Store, U = S.util;
  var LS_INDEX = 'drevo.snaps';
  var MIN_GAP_MIN = 10;        // чаще этого по ходу работы не снимаем
  var KEEP = 80;               // сколько точек держим после прореживания

  function nowISO() { return new Date().toISOString(); }

  var History = {
    index: [],

    load: function () {
      try { this.index = JSON.parse(localStorage.getItem(LS_INDEX) || '[]'); }
      catch (e) { this.index = []; }
      if (!Array.isArray(this.index)) this.index = [];
      return this;
    },
    saveIndex: function () {
      try { localStorage.setItem(LS_INDEX, JSON.stringify(this.index)); } catch (e) {}
    },

    /** Слепок дерева без двоичных файлов. */
    capture: function () {
      var t = S.tree;
      return {
        meta: t.meta, persons: t.persons, families: t.families,
        media: t.media, tabs: t.tabs, users: t.users,
        invites: t.invites, tombstones: t.tombstones
      };
    },

    /** Снять точку восстановления. reason — чем вызвана, для подписи в списке. */
    snapshot: function (reason) {
      var self = this;
      var data = JSON.stringify(this.capture());
      var id = 'snap-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
      var who = (S.session && S.session.displayName) || 'кто-то';
      var rec = {
        id: id, at: nowISO(), by: who, byId: (S.session || {}).userId || null,
        reason: reason || 'работа',
        persons: Object.keys(S.tree.persons || {}).length,
        families: Object.keys(S.tree.families || {}).length,
        media: Object.keys(S.tree.media || {}).length,
        size: data.length
      };
      return U.blobPut(id, new Blob([data], { type: 'application/json' })).then(function () {
        self.index.push(rec);
        self.saveIndex();
        return self.prune().then(function () { return rec; });
      }, function () { return null; });
    },

    /** Снять, если с прошлого раза прошло достаточно времени. */
    maybeSnapshot: function (reason) {
      var last = this.index[this.index.length - 1];
      if (last && (Date.now() - new Date(last.at).getTime()) < MIN_GAP_MIN * 60000) {
        return Promise.resolve(null);
      }
      return this.snapshot(reason || 'работа');
    },

    /** Прореживание: свежее держим подробно, старое — по одной точке на день. */
    prune: function () {
      if (this.index.length <= KEEP) return Promise.resolve();
      var keep = {}, out = [];
      var day = 86400000, now = Date.now();
      // всё за последние сутки оставляем как есть
      for (var i = this.index.length - 1; i >= 0; i--) {
        var r = this.index[i], age = now - new Date(r.at).getTime();
        var key;
        if (age < day) key = r.id;                                    // всё
        else if (age < 30 * day) key = r.at.slice(0, 13);             // по часу
        else key = r.at.slice(0, 10);                                 // по дню
        if (keep[key]) { out.push(r.id); continue; }
        keep[key] = 1;
      }
      var left = this.index.filter(function (r) { return out.indexOf(r.id) < 0; });
      // если и так слишком много — срезаем самые старые
      while (left.length > KEEP) out.push(left.shift().id);
      this.index = left;
      this.saveIndex();
      out.forEach(function (id) { U.blobDel(id); });
      return Promise.resolve();
    },

    read: function (id) {
      return U.blobGet(id).then(function (b) {
        if (!b) return null;
        return b.text().then(function (t) {
          try { return JSON.parse(t); } catch (e) { return null; }
        });
      });
    },

    drop: function (id) {
      this.index = this.index.filter(function (r) { return r.id !== id; });
      this.saveIndex();
      return U.blobDel(id);
    },

    /** Что изменилось между снимком и нынешним деревом. */
    diff: function (snap) {
      var out = { persons: { back: 0, revive: 0, remove: 0 },
                  families: { back: 0, revive: 0, remove: 0 }, names: [] };
      ['persons', 'families'].forEach(function (kind) {
        var was = snap[kind] || {}, now = S.tree[kind] || {};
        for (var id in was) {
          if (!now[id]) { out[kind].revive++; if (kind === 'persons') out.names.push('вернётся: ' + name(was[id])); }
          else if (JSON.stringify(now[id]) !== JSON.stringify(was[id])) {
            out[kind].back++;
            if (kind === 'persons') out.names.push('как было: ' + name(now[id]));
          }
        }
        for (var id2 in now) {
          if (!was[id2]) { out[kind].remove++; if (kind === 'persons') out.names.push('исчезнет: ' + name(now[id2])); }
        }
      });
      return out;
      function name(p) {
        return [p.given, p.surname].filter(Boolean).join(' ') || 'без имени';
      }
    },

    /** Откат: превращаем разницу в новые правки, чтобы она разошлась по устройствам. */
    restore: function (id) {
      var self = this;
      return this.read(id).then(function (snap) {
        if (!snap) throw new Error('Точка восстановления не читается');
        // перед откатом сохраняем нынешнее состояние — вдруг откатили зря
        return self.snapshot('перед откатом').then(function () { return snap; });
      }).then(function (snap) {
        var stamp = nowISO();
        var t = S.tree;
        t.tombstones = t.tombstones || {};

        ['persons', 'families', 'media', 'tabs'].forEach(function (kind) {
          var was = snap[kind], now = t[kind];
          if (!was || !now || typeof was !== 'object') return;
          if (Array.isArray(now)) { t[kind] = JSON.parse(JSON.stringify(was)); return; }
          for (var id2 in was) {
            if (!now[id2] || JSON.stringify(now[id2]) !== JSON.stringify(was[id2])) {
              var rec = JSON.parse(JSON.stringify(was[id2]));
              rec.updated = stamp;            // свежее чужих правок — иначе откат отменят
              now[id2] = rec;
              delete t.tombstones[id2];
            }
          }
          for (var id3 in now) {
            if (!was[id3]) { delete now[id3]; t.tombstones[id3] = stamp; }
          }
        });

        var snapAt = (self.index.filter(function (r) { return r.id === id; })[0] || {}).at;
        S.log('rollback', 'Откат к состоянию на ' +
          (snapAt ? new Date(snapAt).toLocaleString('ru-RU') : 'выбранную точку'));
        S.save();
        return true;
      });
    },

    /** Список точек, сгруппированный так, как просят показать. */
    grouped: function (how) {
      var rows = this.index.slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; });
      if (how === 'all') return rows.map(function (r) { return { head: null, items: [r] }; });
      var map = {}, order = [];
      rows.forEach(function (r) {
        var d = new Date(r.at), key, head;
        if (how === 'hour') {
          key = r.at.slice(0, 13);
          head = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) + ', ' +
            d.getHours() + ':00';
        } else if (how === 'day') {
          key = r.at.slice(0, 10);
          head = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
        } else {                         // по сеансам работы: тот же человек, перерыв меньше часа
          var prev = order.length ? map[order[order.length - 1]] : null;
          var cont = prev && prev.by === r.by &&
            Math.abs(new Date(prev.items[prev.items.length - 1].at) - d) < 3600000;
          if (cont) { prev.items.push(r); return; }
          key = r.id;
          head = r.by + ' · ' + d.toLocaleString('ru-RU',
            { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
        }
        if (!map[key]) { map[key] = { head: head, by: r.by, items: [] }; order.push(key); }
        map[key].items.push(r);
      });
      return order.map(function (k) { return map[k]; });
    }
  };

  History.load();
  global.History = History;
})(window);
</script>
<script>/* Семейное Древо — синхронизация.

   Дерево у всех родственников общее, поэтому правки сливаются, а не затирают
   друг друга: каждая персона, семья, файл и вкладка живут отдельно и имеют
   время последней правки. При встрече двух копий по каждой записи побеждает
   та, что правилась позже. Удаления помечаются «следами» (tombstones), иначе
   запись, стёртая на телефоне, вернулась бы с компьютера.

   Порядок: забрать общее → слить со своим → отдать обратно → разобраться
   с файлами. Слияние идемпотентно: если чья-то отправка перебила чужую,
   следующая синхронизация вернёт потерянное обратно.

   Три способа хранения общих данных — Supabase, свой сервер, файл в облачном
   диске — отличаются только четырьмя действиями: pull, push, putMedia, getMedia. */
(function (global) {
  'use strict';
  var S = global.Store, U = S.util;

  /* ===================== слияние ===================== */

  function ts(x) { return x ? Date.parse(x) || 0 : 0; }

  /** позже ли a, чем b */
  function newer(a, b) { return ts(a) > ts(b); }

  /** слить два дерева. Возвращает { tree, stats } */
  function merge(local, remote) {
    if (!remote || !remote.persons) return { tree: local, stats: zeroStats() };

    // Человек присоединяется к общему дереву, а у него на устройстве ещё лежит
    // нетронутый образец. Сливать их нельзя — вышли бы двойники.
    if (local.meta && local.meta.demo && Object.keys(remote.persons).length) {
      var taken = JSON.parse(JSON.stringify(remote));
      var zs = zeroStats();
      zs.persons.added = Object.keys(remote.persons).length;
      zs.families.added = Object.keys(remote.families || {}).length;
      zs.media.added = Object.keys(remote.media || {}).length;
      return { tree: taken, stats: zs, replaced: true };
    }

    var out = JSON.parse(JSON.stringify(local));
    var st = zeroStats();

    out.tombstones = out.tombstones || {};
    var rt = remote.tombstones || {};
    for (var tid in rt) {
      if (!out.tombstones[tid] || newer(rt[tid], out.tombstones[tid])) out.tombstones[tid] = rt[tid];
    }
    var graves = out.tombstones;

    /* --- словари записей: персоны, семьи, медиа --- */
    ['persons', 'families', 'media'].forEach(function (kind) {
      out[kind] = out[kind] || {};
      var mine = out[kind], theirs = remote[kind] || {};
      var stampField = kind === 'media' ? 'updated' : 'updated';

      for (var id in theirs) {
        var r = theirs[id], l = mine[id];
        var rStamp = r[stampField] || r.added || r.updated;
        if (graves[id] && !newer(rStamp, graves[id])) continue;      // удалено позже, чем правилось
        if (!l) { mine[id] = r; st[kind].added++; continue; }
        var lStamp = l[stampField] || l.added || l.updated;
        if (newer(rStamp, lStamp)) { mine[id] = r; st[kind].updated++; }
      }
      // применить чужие удаления к своим записям
      for (var id2 in mine) {
        var m = mine[id2];
        var mStamp = m[stampField] || m.added || m.updated;
        if (graves[id2] && !newer(mStamp, graves[id2])) { delete mine[id2]; st[kind].removed++; }
      }
    });

    /* --- корзина: общая для всех, иначе удалённое у одного нельзя вернуть
           с другого устройства. Запись уходит из корзины, когда её либо
           вернули (появилась снова в media), либо стёрли насовсем. --- */
    out.trash = out.trash || {};
    var rtr = remote.trash || {};
    for (var trid in rtr) {
      if (!out.trash[trid] || newer(rtr[trid].at, out.trash[trid].at)) out.trash[trid] = rtr[trid];
    }
    for (var trid2 in out.trash) {
      if (out.media[trid2] || (out.persons[trid2])) delete out.trash[trid2];   // уже вернули
    }

    /* --- учётные записи: по id, побеждает более поздняя правка --- */
    var users = {}, uorder = [];
    (out.users || []).concat(remote.users || []).forEach(function (u) {
      if (!u || !u.id) return;
      if (graves[u.id] && !newer(u.updated, graves[u.id])) return;
      if (!users[u.id]) { users[u.id] = u; uorder.push(u.id); }
      else if (newer(u.updated, users[u.id].updated)) users[u.id] = u;
    });
    out.users = uorder.map(function (id) { return users[id]; });

    /* --- приглашения --- */
    var invs = {}, iorder = [];
    (out.invites || []).concat(remote.invites || []).forEach(function (v) {
      if (!v || !v.id) return;
      if (!invs[v.id]) { invs[v.id] = v; iorder.push(v.id); }
      else if (newer(v.updated, invs[v.id].updated)) invs[v.id] = v;
    });
    out.invites = iorder.map(function (id) { return invs[id]; });

    /* --- вкладки: по id, встроенные не трогаем --- */
    var tabs = {}, order = [];
    (out.tabs || []).concat(remote.tabs || []).forEach(function (t) {
      if (graves[t.id] && !t.builtin && !newer(t.updated, graves[t.id])) return;
      if (!tabs[t.id]) { tabs[t.id] = t; order.push(t.id); }
      else if (newer(t.updated, tabs[t.id].updated)) tabs[t.id] = t;
    });
    out.tabs = order.map(function (id) { return tabs[id]; });

    /* --- журнал изменений: объединение без повторов --- */
    var seen = {}, log = [];
    (out.changes || []).concat(remote.changes || []).forEach(function (c) {
      if (!c || seen[c.id]) return;
      seen[c.id] = 1;
      log.push(c);
    });
    log.sort(function (a, b) { return (b.ts || '').localeCompare(a.ts || ''); });
    out.changes = log.slice(0, 1000);
    st.changes = log.length - (local.changes || []).length;

    /* --- шапка дерева --- */
    // Имя берём у того, кто правил позже; личность дерева (id и соль шифрования)
    // всегда остаётся за общим хранилищем, иначе зашифрованные файлы перестанут открываться.
    if (remote.meta) {
      if (newer(remote.meta.updated, out.meta.updated)) {
        out.meta.name = remote.meta.name;
        if (remote.meta.rootId && out.persons[remote.meta.rootId]) out.meta.rootId = remote.meta.rootId;
      }
      out.meta.id = remote.meta.id || out.meta.id;
      out.meta.salt = remote.meta.salt || out.meta.salt;
      out.meta.updated = newer(remote.meta.updated, out.meta.updated) ? remote.meta.updated : out.meta.updated;
    }
    if (!out.meta.rootId || !out.persons[out.meta.rootId]) {
      out.meta.rootId = Object.keys(out.persons)[0] || null;
    }

    /* --- ссылки, оставшиеся в пустоту --- */
    cleanup(out);
    return { tree: out, stats: st };
  }

  function zeroStats() {
    return {
      persons: { added: 0, updated: 0, removed: 0 },
      families: { added: 0, updated: 0, removed: 0 },
      media: { added: 0, updated: 0, removed: 0 },
      changes: 0
    };
  }

  /** убрать ссылки на исчезнувшие записи */
  function cleanup(t) {
    for (var fid in t.families) {
      var f = t.families[fid];
      if (f.husb && !t.persons[f.husb]) f.husb = null;
      if (f.wife && !t.persons[f.wife]) f.wife = null;
      f.children = (f.children || []).filter(function (c) { return !!t.persons[c]; });
      if (!f.husb && !f.wife && !f.children.length) delete t.families[fid];
    }
    for (var pid in t.persons) {
      var p = t.persons[pid];
      p.media = (p.media || []).filter(function (m) { return !!t.media[m]; });
      if (p.photo && !t.media[p.photo]) p.photo = p.media[0] || null;
    }
    for (var mid in t.media) {
      var m = t.media[mid];
      if (m.personId && !t.persons[m.personId]) delete t.media[mid];
    }
  }

  /** Понятное объяснение, почему файлы не передались. Чаще всего в Supabase
      просто не заведено хранилище файлов: таблица есть, фотографиям лечь некуда. */
  function mediaTrouble(report) {
    var all = report.failed.concat(report.failedDown);
    var why = (all[0] && all[0].why) || '';
    if (/bucket not found|404/i.test(why) && S.sync.mode === 'supabase') {
      return 'Фотографии некуда класть: в Supabase не создано хранилище файлов «drevo». ' +
        'Откройте в Supabase раздел Storage, создайте bucket с именем drevo — ' +
        'и нажмите «Синхронизировать» ещё раз, файлы уедут сами.';
    }
    if (/403|401|policy|permission/i.test(why)) {
      return 'Хранилище файлов не пускает: проверьте права доступа к нему. Ответ сервера: ' + why;
    }
    return 'Не передались файлы: ' + all.slice(0, 3).map(function (f) { return f.name; }).join(', ') +
      (all.length > 3 ? ' и ещё ' + (all.length - 3) : '') + '. ' + why;
  }

  function statsText(st) {
    var bits = [];
    function part(label, s) {
      var x = [];
      if (s.added) x.push('+' + s.added);
      if (s.updated) x.push('обновлено ' + s.updated);
      if (s.removed) x.push('убрано ' + s.removed);
      if (x.length) bits.push(label + ': ' + x.join(', '));
    }
    part('люди', st.persons);
    part('связи', st.families);
    part('файлы', st.media);
    return bits.length ? bits.join(' · ') : 'изменений нет';
  }

  /* ===================== ZIP для файлового режима ===================== */

  function unzip(buf) {
    var dv = new DataView(buf), u8 = new Uint8Array(buf);
    // найти конец центрального каталога
    var eocd = -1;
    for (var i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) return Promise.reject(new Error('Это не ZIP-файл'));
    var count = dv.getUint16(eocd + 10, true);
    var cdOff = dv.getUint32(eocd + 16, true);
    var dec = new TextDecoder('utf-8');
    var entries = [], p = cdOff;
    for (var n = 0; n < count; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      var method = dv.getUint16(p + 10, true);
      var csize = dv.getUint32(p + 20, true);
      var nameLen = dv.getUint16(p + 28, true);
      var extraLen = dv.getUint16(p + 30, true);
      var cmtLen = dv.getUint16(p + 32, true);
      var lho = dv.getUint32(p + 42, true);
      var name = dec.decode(u8.subarray(p + 46, p + 46 + nameLen));
      var lNameLen = dv.getUint16(lho + 26, true);
      var lExtraLen = dv.getUint16(lho + 28, true);
      var dataAt = lho + 30 + lNameLen + lExtraLen;
      entries.push({ name: name, method: method, data: u8.subarray(dataAt, dataAt + csize) });
      p += 46 + nameLen + extraLen + cmtLen;
    }
    // разжать всё, что сжато
    return Promise.all(entries.map(function (e) {
      if (e.method === 0) return Promise.resolve(e);
      if (!global.DecompressionStream) return Promise.reject(new Error('Браузер не умеет распаковывать этот архив'));
      var ds = new DecompressionStream('deflate-raw');
      return new Response(new Blob([e.data]).stream().pipeThrough(ds)).arrayBuffer()
        .then(function (b) { return { name: e.name, method: 0, data: new Uint8Array(b) }; });
    })).then(function (list) {
      var map = {};
      list.forEach(function (e) { map[e.name] = e.data; });
      return map;
    });
  }

  /* ===================== способы хранения ===================== */

  /* «Failed to fetch» — это всё, что браузер говорит, когда запрос не ушёл:
     нет сети, сервер не ответил, или соединение обрезал блокировщик рекламы
     либо встроенная защита браузера. Переводим на человеческий и пробуем ещё раз. */
  function netText(e) {
    var m = String((e && e.message) || e || '');
    if (/failed to fetch|networkerror|load failed|cancell?ed/i.test(m)) {
      return 'Связи с хранилищем нет. Бывает от слабого интернета, но чаще ' +
        'запрос режет защита браузера или блокировщик рекламы — в Яндекс.Браузере ' +
        'отключите «Защиту» для этого сайта и попробуйте снова.';
    }
    return m;
  }
  /** Два тихих повтора: на мобильной связи первый запрос часто срывается. */
  function retry(fn, tries) {
    tries = tries || 3;
    return fn().catch(function (e) {
      var m = String((e && e.message) || '');
      if (tries <= 1 || !/failed to fetch|networkerror|load failed/i.test(m)) throw e;
      return new Promise(function (r) { setTimeout(r, 900); }).then(function () {
        return retry(fn, tries - 1);
      });
    });
  }

  function httpErr(r, what) {
    return r.text().then(function (t) {
      throw new Error(what + ': ' + r.status + (t ? ' — ' + t.slice(0, 160) : ''));
    });
  }

  var backends = {

    /* ---------- Supabase ---------- */
    supabase: {
      label: 'Supabase',
      needs: ['url', 'key', 'treeId'],
      head: function (cfg) {
        return { apikey: cfg.key, Authorization: 'Bearer ' + cfg.key };
      },
      check: function (cfg) {
        var b = backends.supabase;
        /* Проверяем обе половины: таблицу для дерева и хранилище для файлов.
           Их заводят отдельно, и без второго фотографии остаются на одном
           устройстве — молча, что хуже всего. */
        return fetch(b.base(cfg) + '/rest/v1/trees?select=id&limit=1', { headers: b.head(cfg) })
          .then(function (r) {
            if (r.status === 404) return { ok: false, message: 'Таблица trees не создана — выполните SQL из инструкции' };
            if (r.status === 401 || r.status === 403) return { ok: false, message: 'Ключ не подошёл' };
            if (!r.ok) return { ok: false, message: 'Ответ сервера: ' + r.status };
            return b.checkStorage(cfg).then(function (st) {
              if (st.ok) return { ok: true, message: 'Связь есть: таблица и хранилище файлов на месте' };
              return { ok: false, message: 'Таблица найдена, но ' + st.message };
            });
          }, function (e) { return { ok: false, message: 'Сервер не отвечает: ' + e.message }; });
      },
      /** пробуем положить и убрать крошечный файл — иначе о проблеме узнаём поздно */
      checkStorage: function (cfg) {
        var b = backends.supabase;
        var path = '/storage/v1/object/drevo/' + encodeURIComponent(cfg.treeId || 'drevo') + '/__proba';
        return fetch(b.base(cfg) + path, {
          method: 'POST',
          headers: Object.assign(b.head(cfg), { 'x-upsert': 'true', 'Content-Type': 'application/octet-stream' }),
          body: new Blob([new Uint8Array([1])])
        }).then(function (r) {
          if (r.ok) {
            fetch(b.base(cfg) + path, { method: 'DELETE', headers: b.head(cfg) }).catch(function () {});
            return { ok: true };
          }
          return r.text().then(function (t) {
            if (r.status === 404 || /bucket not found/i.test(t)) {
              return { ok: false, message: 'хранилища файлов нет. В Supabase откройте Storage, ' +
                'создайте bucket с именем drevo — тогда поедут и фотографии.' };
            }
            if (r.status === 400 && /row-level security|policy/i.test(t)) {
              return { ok: false, message: 'хранилище drevo не разрешает запись. В Supabase: Storage → drevo → ' +
                'Policies, разрешите чтение и запись для anon.' };
            }
            return { ok: false, message: 'хранилище файлов отвечает ошибкой ' + r.status +
              (t ? ' — ' + t.slice(0, 120) : '') };
          });
        }, function (e) { return { ok: false, message: 'до хранилища файлов не достучаться: ' + e.message }; });
      },
      base: function (cfg) { return String(cfg.url || '').replace(/\/+$/, ''); },
      pull: function (cfg) {
        var b = backends.supabase;
        return retry(function () {
          return fetch(b.base(cfg) + '/rest/v1/trees?id=eq.' + encodeURIComponent(cfg.treeId) + '&select=data',
            { headers: b.head(cfg) });
        }).then(function (r) {
            if (!r.ok) return httpErr(r, 'Чтение дерева');
            return r.json();
          }).then(function (rows) { return rows && rows[0] ? rows[0].data : null; });
      },
      push: function (cfg, tree) {
        var b = backends.supabase;
        return retry(function () {
          return fetch(b.base(cfg) + '/rest/v1/trees', {
          method: 'POST',
          headers: Object.assign(b.head(cfg), {
            'Content-Type': 'application/json',
            Prefer: 'resolution=merge-duplicates,return=minimal'
          }),
          body: JSON.stringify({ id: cfg.treeId, data: tree, updated_at: new Date().toISOString() })
          });
        }).then(function (r) { if (!r.ok) return httpErr(r, 'Запись дерева'); });
      },
      putMedia: function (cfg, id, blob) {
        var b = backends.supabase;
        var path = '/storage/v1/object/drevo/' + encodeURIComponent(cfg.treeId) + '/' + encodeURIComponent(id);
        return fetch(b.base(cfg) + path, {
          method: 'POST',
          headers: Object.assign(b.head(cfg), { 'x-upsert': 'true', 'Content-Type': 'application/octet-stream' }),
          body: blob
        }).then(function (r) { if (!r.ok) return httpErr(r, 'Отправка файла'); });
      },
      getMedia: function (cfg, id) {
        var b = backends.supabase;
        var path = '/storage/v1/object/drevo/' + encodeURIComponent(cfg.treeId) + '/' + encodeURIComponent(id);
        return fetch(b.base(cfg) + path, { headers: b.head(cfg) })
          .then(function (r) { return r.ok ? r.blob() : null; });
      }
    },

    /* ---------- свой сервер ---------- */
    server: {
      label: 'Свой сервер',
      needs: ['url', 'key'],
      base: function (cfg) { return String(cfg.url || '').replace(/\/+$/, ''); },
      head: function (cfg) { return { 'X-Drevo-Key': cfg.key }; },
      check: function (cfg) {
        var b = backends.server;
        return fetch(b.base(cfg) + '/api/health', { headers: b.head(cfg) }).then(function (r) {
          if (r.ok) return r.json().then(function (j) {
            return { ok: true, message: 'Сервер отвечает, персон в хранилище: ' + (j.persons != null ? j.persons : '—') };
          });
          if (r.status === 401) return { ok: false, message: 'Ключ доступа не подошёл' };
          return { ok: false, message: 'Ответ сервера: ' + r.status };
        }, function (e) { return { ok: false, message: 'Сервер не отвечает: ' + e.message }; });
      },
      pull: function (cfg) {
        var b = backends.server;
        return fetch(b.base(cfg) + '/api/tree', { headers: b.head(cfg) }).then(function (r) {
          if (r.status === 404) return null;
          if (!r.ok) return httpErr(r, 'Чтение дерева');
          return r.json();
        }).then(function (j) { return j && j.persons ? j : null; });
      },
      push: function (cfg, tree) {
        var b = backends.server;
        return fetch(b.base(cfg) + '/api/tree', {
          method: 'PUT',
          headers: Object.assign(b.head(cfg), { 'Content-Type': 'application/json' }),
          body: JSON.stringify(tree)
        }).then(function (r) { if (!r.ok) return httpErr(r, 'Запись дерева'); });
      },
      putMedia: function (cfg, id, blob) {
        var b = backends.server;
        return fetch(b.base(cfg) + '/api/media/' + encodeURIComponent(id), {
          method: 'PUT',
          headers: Object.assign(b.head(cfg), { 'Content-Type': 'application/octet-stream' }),
          body: blob
        }).then(function (r) { if (!r.ok) return httpErr(r, 'Отправка файла'); });
      },
      getMedia: function (cfg, id) {
        var b = backends.server;
        return fetch(b.base(cfg) + '/api/media/' + encodeURIComponent(id), { headers: b.head(cfg) })
          .then(function (r) { return r.ok ? r.blob() : null; });
      }
    },

    /* ---------- файл в облачном диске ----------
       Работает через File System Access API: программа один раз получает
       разрешение на файл внутри папки Яндекс.Диска или Google Диска,
       дальше читает и пишет его сама. Диск разносит файл по устройствам. */
    file: {
      label: 'Облачный диск',
      needs: [],
      supported: function () {
        return typeof global.showOpenFilePicker === 'function' && typeof global.showSaveFilePicker === 'function';
      },
      handle: null,
      check: function () {
        if (!backends.file.supported()) {
          return Promise.resolve({
            ok: false,
            message: 'Этот браузер не умеет работать с файлом напрямую. На телефоне пользуйтесь обменом через «Данные → Полная копия».'
          });
        }
        if (!backends.file.handle) return Promise.resolve({ ok: false, message: 'Файл не выбран' });
        return backends.file.handle.getFile().then(function (f) {
          return { ok: true, message: 'Файл «' + f.name + '», ' + Math.round(f.size / 1024) + ' КБ' };
        }, function () { return { ok: false, message: 'Файл стал недоступен — выберите заново' }; });
      },
      /** выбрать существующий файл обмена */
      open: function () {
        return global.showOpenFilePicker({
          types: [{ description: 'Семейное Древо', accept: { 'application/zip': ['.drevo', '.zip'] } }],
          multiple: false
        }).then(function (hs) {
          backends.file.handle = hs[0];
          return saveHandle(hs[0]);
        });
      },
      /** создать новый файл обмена */
      create: function (name) {
        return global.showSaveFilePicker({
          suggestedName: (name || 'Семейное Древо') + '.drevo',
          types: [{ description: 'Семейное Древо', accept: { 'application/zip': ['.drevo'] } }]
        }).then(function (h) {
          backends.file.handle = h;
          return saveHandle(h);
        });
      },
      _cache: null,
      pull: function () {
        var b = backends.file;
        if (!b.handle) return Promise.reject(new Error('Файл обмена не выбран'));
        return b.handle.getFile().then(function (f) {
          if (!f.size) { b._cache = {}; return null; }
          return f.arrayBuffer().then(unzip).then(function (map) {
            b._cache = map;
            var j = map['drevo.json'];
            if (!j) return null;
            return JSON.parse(new TextDecoder().decode(j));
          });
        });
      },
      push: function (cfg, tree) {
        var b = backends.file;
        if (!b.handle) return Promise.reject(new Error('Файл обмена не выбран'));
        var files = [{ name: 'drevo.json', data: new TextEncoder().encode(JSON.stringify(tree)) }];
        var pend = b._pending || {};
        // всё, что уже лежало в файле, кроме перезаписанного
        var keep = b._cache || {};
        Object.keys(keep).forEach(function (n) {
          if (n === 'drevo.json') return;
          var id = n.replace(/^media\//, '');
          if (pend[id]) return;
          if (!tree.media[id]) return;                 // файл удалили — не переносим
          files.push({ name: n, data: keep[n] });
        });
        var ids = Object.keys(pend);
        return Promise.all(ids.map(function (id) {
          return pend[id].arrayBuffer().then(function (ab) {
            files.push({ name: 'media/' + id, data: new Uint8Array(ab) });
          });
        })).then(function () {
          var blob = global.IO.zip(files);
          return b.handle.createWritable().then(function (w) {
            return w.write(blob).then(function () { return w.close(); });
          });
        }).then(function () {
          b._pending = {};
          // обновить представление о содержимом файла
          var map = {};
          files.forEach(function (f) { map[f.name] = f.data; });
          b._cache = map;
        });
      },
      putMedia: function (cfg, id, blob) {
        var b = backends.file;
        b._pending = b._pending || {};
        b._pending[id] = blob;
        return Promise.resolve();
      },
      getMedia: function (cfg, id) {
        var b = backends.file;
        var d = b._cache && b._cache['media/' + id];
        return Promise.resolve(d ? new Blob([d]) : null);
      }
    }
  };

  /* запомнить выбранный файл между запусками */
  function saveHandle(h) {
    return U.blobPut('__sync_handle', h).catch(function () {});
  }
  function loadHandle() {
    return U.blobGet('__sync_handle').then(function (h) {
      if (!h || !h.queryPermission) return null;
      return h.queryPermission({ mode: 'readwrite' }).then(function (p) {
        if (p === 'granted') { backends.file.handle = h; return h; }
        return h;         // разрешение спросим при первой записи
      }).catch(function () { return null; });
    }).catch(function () { return null; });
  }

  /* ===================== запуск ===================== */

  var Sync = {
    backends: backends,
    merge: merge,
    unzip: unzip,
    statsText: statsText,
    busy: false,
    listeners: [],

    on: function (fn) { this.listeners.push(fn); },
    emit: function (state) {
      this.listeners.forEach(function (f) { try { f(state); } catch (e) {} });
    },

    cfg: function () {
      var s = S.sync || {};
      return s[s.mode] || {};
    },
    backend: function () {
      var s = S.sync || {};
      return backends[s.mode] || null;
    },
    ready: function () {
      var b = this.backend();
      if (!b) return false;
      if (b === backends.file) return !!backends.file.handle;
      var cfg = this.cfg();
      return b.needs.every(function (k) { return !!String(cfg[k] || '').trim(); });
    },

    restore: function () { return loadHandle(); },

    /** полный проход: забрать → слить → отдать → файлы */
    run: function (opts) {
      opts = opts || {};
      var self = this;
      var b = this.backend(), cfg = this.cfg();
      if (!b) return Promise.reject(new Error('Способ синхронизации не выбран'));
      if (!this.ready()) return Promise.reject(new Error('Синхронизация настроена не до конца'));
      if (this.busy) return Promise.reject(new Error('Синхронизация уже идёт'));

      this.busy = true;
      this.emit({ state: 'run', text: 'Синхронизация…' });
      var report = { pulled: null, stats: null, up: 0, down: 0, failed: [], failedDown: [] };

      return b.pull(cfg)
        .then(function (remote) {
          report.pulled = remote;
          // точка восстановления до чужих правок: если кто-то удалил человека,
          // администратору будет куда вернуться
          if (global.History && remote) global.History.maybeSnapshot('перед приёмом правок');
          var res = merge(S.tree, remote);
          report.stats = res.stats;
          // сохранить слияние у себя
          S.tree = res.tree;
          S.save(true);
          return b.push(cfg, S.tree);
        })
        .then(function () { return self.syncMedia(b, cfg, opts, report); })
        .then(function () {
          S.sync.lastAt = new Date().toISOString();
          S.dirty = false;
          var stuck = report.failed.length + report.failedDown.length;
          var txt = statsText(report.stats) +
            (report.up ? ' · отправлено файлов: ' + report.up : '') +
            (report.down ? ' · получено файлов: ' + report.down : '');
          if (stuck) {
            // молчать тут нельзя: человек будет уверен, что фотографии уехали
            S.sync.lastError = mediaTrouble(report);
            txt += ' · файлов не передалось: ' + stuck;
            S.saveSync();
            self.busy = false;
            self.emit({ state: 'warn', text: txt, report: report, detail: S.sync.lastError });
            return report;
          }
          S.sync.lastError = null;
          S.saveSync();
          self.busy = false;
          self.emit({ state: 'ok', text: txt, report: report });
          return report;
        })
        .catch(function (e) {
          self.busy = false;
          S.sync.lastError = netText(e);
          S.saveSync();
          self.emit({ state: 'error', text: netText(e) });
          throw e;
        });
    },

    /** отправить свои новые файлы; забрать чужие, если велено */
    syncMedia: function (b, cfg, opts, report) {
      var self = this;
      var mine = [], theirs = [];
      Object.keys(S.tree.media).forEach(function (id) {
        var m = S.tree.media[id];
        if (!m.uploaded) mine.push(id);
      });

      function upload() {
        if (!mine.length) return Promise.resolve();
        var i = 0;
        function step() {
          if (i >= mine.length) return Promise.resolve();
          var id = mine[i++];
          self.emit({ state: 'run', text: 'Отправка файлов ' + i + ' из ' + mine.length });
          return U.blobGet(id).then(function (blob) {
            if (!blob) { return; }                      // файла нет на этом устройстве
            return b.putMedia(cfg, id, blob).then(function () {
              if (S.tree.media[id]) {
                S.tree.media[id].uploaded = true;
                S.tree.media[id].updated = new Date().toISOString();
              }
              report.up++;
            });
          }).catch(function (e) {
            /* Раньше ошибка только писалась в консоль — человек видел «всё хорошо»,
               а фотографии оставались на одном устройстве. Теперь она доходит до отчёта. */
            report.failed.push({ id: id, name: (S.tree.media[id] || {}).name || id, why: e.message });
          }).then(step);
        }
        return step();
      }

      function findMissing() {
        var ids = Object.keys(S.tree.media).filter(function (id) { return S.tree.media[id].uploaded; });
        var i = 0, missing = [];
        function step() {
          if (i >= ids.length) return Promise.resolve(missing);
          var id = ids[i++];
          return U.blobGet(id).then(function (bl) { if (!bl) missing.push(id); }).then(step);
        }
        return step();
      }

      function download(list) {
        if (!list.length) return Promise.resolve();
        var i = 0;
        function step() {
          if (i >= list.length) return Promise.resolve();
          var id = list[i++];
          self.emit({ state: 'run', text: 'Загрузка файлов ' + i + ' из ' + list.length });
          return b.getMedia(cfg, id).then(function (blob) {
            if (blob) return U.blobPut(id, blob).then(function () { report.down++; });
          }).catch(function (e) {
            report.failedDown.push({ id: id, name: (S.tree.media[id] || {}).name || id, why: e.message });
          }).then(step);
        }
        return step();
      }

      return upload()
        .then(function () { return mine.length ? b.push(cfg, S.tree) : null; })  // отметки «отправлено»
        .then(findMissing)
        .then(function (missing) {
          report.missing = missing.length;
          if (opts.media === false) return null;      // откладываем до открытия файла
          return download(missing);
        })
        .then(function () { S.save(true); });
    },

    /** заглянуть в общее хранилище, ничего не меняя у себя */
    peek: function () {
      var b = this.backend();
      if (!b || !this.ready()) return Promise.resolve(null);
      return b.pull(this.cfg());
    },

    /** отдать своё дерево, не принимая чужого (для «заменить общее моим») */
    pushOnly: function () {
      var self = this, b = this.backend(), cfg = this.cfg();
      if (!b) return Promise.reject(new Error('Способ синхронизации не выбран'));
      this.busy = true;
      this.emit({ state: 'run', text: 'Отправка дерева…' });
      var report = { stats: zeroStats(), up: 0, down: 0, failed: [], failedDown: [] };
      return b.push(cfg, S.tree)
        .then(function () { return self.syncMedia(b, cfg, { media: false }, report); })
        .then(function () {
          S.sync.lastAt = new Date().toISOString();
          S.sync.lastError = null;
          S.dirty = false;
          S.saveSync();
          self.busy = false;
          self.emit({ state: 'ok', text: 'Дерево отправлено', report: report });
          return report;
        })
        .catch(function (e) {
          self.busy = false;
          S.sync.lastError = netText(e);
          S.saveSync();
          self.emit({ state: 'error', text: netText(e) });
          throw e;
        });
    },

    /** подтянуть один файл по требованию — когда его открывают, а локально его нет */
    fetchOne: function (id) {
      var b = this.backend(), cfg = this.cfg();
      var m = S.tree.media[id];
      if (!b || !m || !m.uploaded || !this.ready()) return Promise.resolve(null);
      return b.getMedia(cfg, id).then(function (blob) {
        if (!blob) return null;
        return U.blobPut(id, blob).then(function () { return blob; });
      }).catch(function () { return null; });
    },

    /* автоматический проход по таймеру */
    timer: null,
    schedule: function () {
      var self = this;
      clearInterval(this.timer);
      if (!S.sync || !S.sync.auto || S.sync.mode === 'off') return;
      var every = Math.max(30, S.sync.interval || 120) * 1000;
      this.timer = setInterval(function () {
        if (self.busy || !self.ready()) return;
        if (global.navigator && navigator.onLine === false) return;
        self.run({ media: true }).catch(function () {});
      }, every);
    },
    stop: function () { clearInterval(this.timer); this.timer = null; }
  };

  // дать хранилищу способ подтянуть недостающий файл
  S.fetchRemote = function (id) { return Sync.fetchOne(id); };

  global.Sync = Sync;
})(window);
</script>
<script>/* Семейное Древо — небольшая карта на тайлах OpenStreetMap, без внешних библиотек.
   Показывает места рождения, смерти и событий. */
(function (global) {
  'use strict';

  function MiniMap(host) {
    this.host = host;
    this.z = 4;
    this.cx = 55.75; this.cy = 37.62;     // широта/долгота центра
    this.pins = [];
    this.onPin = function () {};
    this._build();
  }
  var TILE = 256;

  function lon2x(lon, z) { return (lon + 180) / 360 * Math.pow(2, z) * TILE; }
  function lat2y(lat, z) {
    var s = Math.sin(lat * Math.PI / 180);
    return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * Math.pow(2, z) * TILE;
  }
  function x2lon(x, z) { return x / (Math.pow(2, z) * TILE) * 360 - 180; }
  function y2lat(y, z) {
    var n = Math.PI - 2 * Math.PI * y / (Math.pow(2, z) * TILE);
    return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
  }

  MiniMap.prototype._build = function () {
    var self = this;
    this.host.innerHTML =
      '<div class="map-ctl">' +
      '<button class="btn btn-sm" data-z="1" type="button" title="Приблизить" aria-label="Приблизить">' +
      global.Icon('plus') + '</button>' +
      '<button class="btn btn-sm" data-z="-1" type="button" title="Отдалить" aria-label="Отдалить">' +
      global.Icon('minus') + '</button>' +
      '<button class="btn btn-sm" data-fit="1" type="button" title="Показать все" aria-label="Показать все">' +
      global.Icon('expand') + '</button>' +
      '</div><div class="map-attr">© OpenStreetMap</div>';
    this.layer = document.createElement('div');
    this.layer.style.cssText = 'position:absolute;inset:0';
    this.host.insertBefore(this.layer, this.host.firstChild);

    this.onClick = null;      // выбор точки: fn(lat, lng)
    this.host.addEventListener('click', function (e) {
      var b = e.target.closest('[data-z]');
      if (b) { self.zoomTo(self.z + (+b.dataset.z)); return; }
      if (e.target.closest('[data-fit]')) { self.fit(); return; }
      if (e.target.closest('.map-ctl') || e.target.closest('.map-pin')) return;
      if (!self.onClick || self._moved) return;
      var r = self.host.getBoundingClientRect();
      var W = r.width, H = r.height, z = self.z;
      var left = lon2x(self.cy, z) - W / 2, top = lat2y(self.cx, z) - H / 2;
      self.onClick(y2lat(top + (e.clientY - r.top), z), x2lon(left + (e.clientX - r.left), z));
    });
    var drag = null;
    this.host.addEventListener('dragstart', function (e) { e.preventDefault(); });
    /* Щипок двумя пальцами: без него на телефоне карту было нечем приблизить.
       Тайлы бывают только целых уровней, поэтому уровень переключается,
       когда пальцы разошлись или сошлись заметно. */
    var pinch = null;
    this.host.addEventListener('touchstart', function (e) {
      if (e.touches.length === 2) { drag = null; pinch = { d: tdist(e.touches), z: self.z }; }
    }, { passive: true });
    this.host.addEventListener('touchmove', function (e) {
      if (!pinch || e.touches.length !== 2) return;
      e.preventDefault();
      var k = tdist(e.touches) / pinch.d;
      var nz = Math.max(2, Math.min(17, Math.round(pinch.z + Math.log(k) / Math.log(1.8))));
      if (nz !== self.z) { self.zoomTo(nz); }
    }, { passive: false });
    this.host.addEventListener('touchend', function (e) { if (e.touches.length < 2) pinch = null; });
    function tdist(t) {
      var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
      return Math.sqrt(dx * dx + dy * dy) || 1;
    }

    this.host.addEventListener('pointerdown', function (e) {
      if (e.target.closest('.map-ctl') || e.target.closest('.map-pin')) return;
      if (e.target.closest('.map-tools')) return;
      e.preventDefault();
      drag = { x: e.clientX, y: e.clientY, cx: self.cx, cy: self.cy };
      self._moved = false;
      self.host.setPointerCapture(e.pointerId);
      self.host.classList.add('grabbing');
    });
    this.host.addEventListener('pointermove', function (e) {
      if (!drag) return;
      if (Math.abs(e.clientX - drag.x) > 3 || Math.abs(e.clientY - drag.y) > 3) self._moved = true;
      var z = self.z;
      var px = lon2x(drag.cy, z) - (e.clientX - drag.x);
      var py = lat2y(drag.cx, z) - (e.clientY - drag.y);
      self.cy = x2lon(px, z); self.cx = y2lat(py, z);
      self.draw();
    });
    function end() { drag = null; self.host.classList.remove('grabbing'); }
    this.host.addEventListener('pointerup', end);
    this.host.addEventListener('pointercancel', end);
    this.host.addEventListener('wheel', function (e) {
      e.preventDefault();
      var r = self.host.getBoundingClientRect();
      self.zoomAt(self.z + (e.deltaY < 0 ? 1 : -1), e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });
  };

  /* Масштаб меняется вокруг того, что человек уже видит в середине, а если
     точка выбрана — вокруг неё. Иначе после каждого приближения приходится
     заново искать нужное место. */
  /** Масштаб колесом: точка под курсором остаётся на месте. */
  MiniMap.prototype.zoomAt = function (z, mx, my) {
    z = Math.max(2, Math.min(17, z));
    if (z === this.z) return;
    var r = this.host.getBoundingClientRect();
    var W = r.width || 600, H = r.height || 400;
    // что сейчас под курсором
    var left = lon2x(this.cy, this.z) - W / 2, top = lat2y(this.cx, this.z) - H / 2;
    var lng = x2lon(left + mx, this.z), lat = y2lat(top + my, this.z);
    this.z = z;
    // подбираем центр так, чтобы эта же точка осталась под курсором
    var px = lon2x(lng, z) - mx + W / 2, py = lat2y(lat, z) - my + H / 2;
    this.cy = x2lon(px, z);
    this.cx = y2lat(py, z);
    this.draw();
  };

  MiniMap.prototype.zoomTo = function (z) {
    z = Math.max(2, Math.min(17, z));
    if (z === this.z) return;
    this.z = z;
    if (this.marker) { this.cx = this.marker.lat; this.cy = this.marker.lng; }
    this.draw();
  };
  /** отметить выбранную точку; она держится в середине при масштабировании */
  MiniMap.prototype.setMarker = function (lat, lng, center) {
    if (lat == null || lng == null) { this.marker = null; return; }
    this.marker = { lat: lat, lng: lng };
    if (center !== false) { this.cx = lat; this.cy = lng; }
    this.draw();
  };

  MiniMap.prototype.setPins = function (pins) { this.pins = pins || []; this.draw(); };

  /** поставить центр и приближение */
  MiniMap.prototype.goTo = function (lat, lng, z) {
    this.cx = lat; this.cy = lng;
    if (z) this.z = Math.max(2, Math.min(18, z));
    this.draw();
  };

  MiniMap.prototype.fit = function () {
    if (!this.pins.length) return;
    var la = this.pins.map(function (p) { return p.lat; });
    var lo = this.pins.map(function (p) { return p.lng; });
    var minLa = Math.min.apply(null, la), maxLa = Math.max.apply(null, la);
    var minLo = Math.min.apply(null, lo), maxLo = Math.max.apply(null, lo);
    this.cx = (minLa + maxLa) / 2; this.cy = (minLo + maxLo) / 2;
    var r = this.host.getBoundingClientRect();
    var z = 17;
    while (z > 2) {
      var w = Math.abs(lon2x(maxLo, z) - lon2x(minLo, z));
      var h = Math.abs(lat2y(minLa, z) - lat2y(maxLa, z));
      if (w < r.width * 0.8 && h < r.height * 0.8) break;
      z--;
    }
    this.z = z;
    this.draw();
  };

  MiniMap.prototype.draw = function () {
    var self = this, r = this.host.getBoundingClientRect();
    var W = r.width || 600, H = r.height || 400, z = this.z;
    var px = lon2x(this.cy, z), py = lat2y(this.cx, z);
    var left = px - W / 2, top = py - H / 2;
    var x0 = Math.floor(left / TILE), y0 = Math.floor(top / TILE);
    var x1 = Math.ceil((left + W) / TILE), y1 = Math.ceil((top + H) / TILE);
    var max = Math.pow(2, z);
    var html = '';
    for (var x = x0; x < x1; x++) {
      for (var y = y0; y < y1; y++) {
        if (y < 0 || y >= max) continue;
        var tx = ((x % max) + max) % max;
        html += '<img class="map-tile" alt="" loading="lazy" draggable="false" ' +
          'src="https://tile.openstreetmap.org/' + z + '/' + tx + '/' + y + '.png" ' +
          'style="left:' + (x * TILE - left) + 'px;top:' + (y * TILE - top) + 'px">';
      }
    }
    this.pins.forEach(function (p, i) {
      var ppx = lon2x(p.lng, z) - left, ppy = lat2y(p.lat, z) - top;
      if (ppx < -40 || ppy < -40 || ppx > W + 40 || ppy > H + 40) return;
      var cls = p.kind === 'birth' ? 'birth' : p.kind === 'death' ? 'death' : 'event';
      html += '<button type="button" class="map-pin ' + cls + '" data-i="' + i + '" title="' +
        esc((p.label || '') + (p.place ? ' · ' + p.place : '')) + '" style="left:' + ppx + 'px;top:' + ppy + 'px"></button>';
    });
    this.layer.innerHTML = html;
    this.layer.querySelectorAll('.map-pin').forEach(function (b) {
      var pin = self.pins[+b.dataset.i];
      b.addEventListener('click', function (e) { e.stopPropagation(); self.onPin(pin); });
      // подсказка под курсором: то же окошко, что и в дереве
      b.addEventListener('mouseenter', function () { self.showCard(b, pin); });
      b.addEventListener('mouseleave', function () { self.hideCard(); });
      b.addEventListener('focus', function () { self.showCard(b, pin); });
      b.addEventListener('blur', function () { self.hideCard(); });
    });
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* Эскиз человека под курсором: имя, годы, фотография — как в дереве. */
  MiniMap.prototype.showCard = function (pinEl, pin) {
    var S2 = global.Store;
    var p = pin && pin.personId && S2.person(pin.personId);
    if (!p) return;
    this.hideCard();
    var box = document.createElement('div');
    box.className = 'map-card';
    box.innerHTML = '<span class="mc-ph">' +
      global.Icon(p.sex === 'M' ? 'personM' : p.sex === 'F' ? 'personF' : 'person') + '</span>' +
      '<span class="mc-txt"><b>' + esc(S2.shortName(p)) + '</b>' +
      '<span>' + esc(S2.years(p) || '') + '</span>' +
      (pin.place ? '<span>' + esc(pin.place) + '</span>' : '') + '</span>';
    this.host.appendChild(box);
    var hb = this.host.getBoundingClientRect(), pb = pinEl.getBoundingClientRect();
    var x = pb.left - hb.left + pb.width / 2, y = pb.top - hb.top;
    box.style.left = Math.max(6, Math.min(hb.width - box.offsetWidth - 6, x - box.offsetWidth / 2)) + 'px';
    box.style.top = Math.max(6, y - box.offsetHeight - 10) + 'px';
    this._card = box;
    if (p.photo) {
      S2.mediaURL(p.photo).then(function (url) {
        if (!url || !box.isConnected) return;
        var ph = box.querySelector('.mc-ph');
        ph.style.backgroundImage = 'url(' + url + ')';
        ph.innerHTML = '';
      });
    }
  };
  MiniMap.prototype.hideCard = function () {
    if (this._card) { this._card.remove(); this._card = null; }
  };

  /** Как называется это место: нужно, чтобы адрес сам попадал в строку «Место». */
  MiniMap.reverse = function (lat, lng) {
    return fetch('https://nominatim.openstreetmap.org/reverse?format=json&zoom=16' +
      '&accept-language=ru&lat=' + lat + '&lon=' + lng,
      { headers: { Accept: 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j) return '';
        var a = j.address || {};
        // короткий человеческий адрес вместо длинной строки Nominatim
        var parts = [a.country, a.state || a.region, a.county,
          a.city || a.town || a.village || a.hamlet,
          a.suburb, a.road, a.house_number].filter(Boolean);
        var seen = {}, out = [];
        parts.forEach(function (x) { if (!seen[x]) { seen[x] = 1; out.push(x); } });
        return out.join(', ') || j.display_name || '';
      })
      .catch(function () { return ''; });
  };

  global.MiniMap = MiniMap;
})(window);
</script>
<script>/* Семейное Древо — узнавание лиц.

   Зачем. Когда в семье набирается папка со старыми снимками, раскладывать их
   по людям вручную — работа на вечер. Программа сама находит лица, сравнивает
   с теми, кто уже есть в дереве, и предлагает: «кажется, это дед Григорий».
   Последнее слово всегда за человеком — программа ничего не раскладывает молча.

   Как устроено. Считать всё это умеет готовая библиотека (face-api), её вместе
   с обученными моделями мы держим рядом с программой, в папке face/. Весит это
   около восьми мегабайт, поэтому подгружается не при запуске, а один раз —
   когда узнавание действительно понадобилось. Дальше браузер держит их в кэше.

   Ничего никуда не отправляется: лица считаются прямо на устройстве. */
(function (global) {
  'use strict';

  var S = global.Store;

  var Faces = {
    ready: false,
    loading: null,
    api: null,
    /** насколько похожими считаем лица: меньше — строже */
    threshold: 0.5,

    /** Где искать библиотеку и модели.
        Рядом с программой — главный вариант: так узнавание работает без
        интернета. Но папку face легко забыть выложить на сайт, а на
        GitHub Pages программа часто лежит в подпапке — поэтому пробуем
        несколько мест по очереди, а последним — открытое хранилище
        библиотеки в интернете. Хоть откуда, лишь бы человек не остался
        с неработающей кнопкой. */
    places: function () {
      var here = location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '');
      var out = [{ где: 'рядом с программой', lib: here + 'face/face-api.js', models: here + 'face/model' }];
      var seg = (location.pathname || '').split('/').filter(Boolean);
      if (seg.length > 1 && location.origin.indexOf('http') === 0) {
        var корень = location.origin + '/' + seg[0] + '/face/';
        out.push({ где: 'в корне сайта', lib: корень + 'face-api.js', models: корень + 'model' });
      }
      if (location.origin.indexOf('http') === 0) {
        out.push({ где: 'в корне сайта', lib: location.origin + '/face/face-api.js',
                   models: location.origin + '/face/model' });
      }
      var cdn = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/';
      out.push({ где: 'из интернета', сеть: true, lib: cdn + 'dist/face-api.js', models: cdn + 'model' });
      // одинаковые адреса убираем, чтобы не стучаться дважды
      var было = {};
      return out.filter(function (x) {
        if (было[x.lib]) return false;
        было[x.lib] = 1;
        return true;
      });
    },

    /** Откуда в итоге загрузились — показываем в настройках. */
    source: '',

    /** Подгрузить библиотеку и модели. Возвращает обещание. */
    ensure: function (onProgress) {
      var self = this;
      if (this.ready) return Promise.resolve(true);
      if (this.loading) return this.loading;
      var say = onProgress || function () {};
      var места = this.places(), i = 0, беды = [];

      function библиотека() {
        if (global.faceapi) return Promise.resolve(места[Math.max(0, i - 1)]);
        if (i >= места.length) {
          return Promise.reject(new Error('Не удалось загрузить узнавание лиц. ' +
            'Проверил: ' + беды.join('; ') + '. Папку face нужно выложить на сайт ' +
            'рядом с программой — она есть в архиве «Сайт.zip».'));
        }
        var место = места[i++];
        say(место.сеть ? 'Загружаю узнавание лиц из интернета…' : 'Загружаю узнавание лиц…');
        return new Promise(function (ok) {
          var s = document.createElement('script');
          s.src = место.lib;
          s.onload = function () { ok(место); };
          s.onerror = function () { беды.push(место.lib); ok(null); };
          document.head.appendChild(s);
        }).then(function (взяли) { return взяли || библиотека(); });
      }

      function модели(место, запас) {
        var api = global.faceapi;
        say('Готовлю модели…');
        var m = место.models;
        /* Берём «тяжёлые» модели. Лёгкие (tiny) быстрее, но на семейных
           снимках — групповых, старых, снятых сбоку — они пропускают людей
           и хуже выравнивают лицо перед расчётом отпечатка, отчего разные
           люди начинают сходиться. Точность тут важнее пары секунд. */
        return Promise.all([
          api.nets.ssdMobilenetv1.loadFromUri(m),
          api.nets.faceLandmark68Net.loadFromUri(m),
          api.nets.faceRecognitionNet.loadFromUri(m),
          api.nets.tinyFaceDetector.loadFromUri(m),     // быстрый режим: лёгкий поиск лиц
          api.nets.faceLandmark68TinyNet.loadFromUri(m) // и лёгкая разметка к нему
        ]).then(function () {
          self.api = api;
          self.source = место.где;
          return true;
        }, function (e) {
          беды.push(m);
          if (!запас.length) throw new Error('Библиотека нашлась, а модели — нет. ' +
            'Проверил: ' + беды.join('; ') + '. В папке face должна лежать папка model ' +
            'со всеми файлами из архива «Сайт.zip».');
          return модели(запас.shift(), запас);
        });
      }

      this.loading = библиотека().then(function (место) {
        var запас = места.filter(function (x) { return x !== место; });
        return модели(место, запас);
      }).then(function () {
        self.ready = true;
        say('');
        return true;
      }).catch(function (e) {
        self.loading = null;
        throw e;
      });
      return this.loading;
    },

    /** Самое маленькое лицо, которое принимаем во внимание, в долях кадра.
        Лица в толпе на заднем плане узнаются плохо и только путают. */
    minFace: 0.06,
    /** Насколько уверенно это вообще лицо. */
    minScore: 0.5,
    /* Быстрый разбор берёт лёгкую модель: втрое быстрее, но на групповых,
       старых и снятых сбоку снимках пропускает людей. Поэтому порог для
       автоматического присвоения в этом режиме строже — лучше спросить. */
    get fast() { return !!(S.prefs && S.prefs.faceFast); },

    scanImage: function (img) {
      var api = this.api, self = this;
      var opts = this.fast
        ? new api.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: this.minScore })
        : new api.SsdMobilenetv1Options({ minConfidence: this.minScore, maxResults: 40 });
      return api.detectAllFaces(img, opts)
        .withFaceLandmarks(this.fast)
        .withFaceDescriptors()
        .then(function (list) {
          var side = Math.min(img.width || img.naturalWidth, img.height || img.naturalHeight);
          return list.filter(function (d) {
            // мелкие лица с дальнего плана отбрасываем: по ним ошибиться проще, чем узнать
            return Math.min(d.detection.box.width, d.detection.box.height) >= side * self.minFace;
          }).map(function (d) {
            return {
              descriptor: Array.from(d.descriptor),
              box: {
                x: Math.round(d.detection.box.x), y: Math.round(d.detection.box.y),
                w: Math.round(d.detection.box.width), h: Math.round(d.detection.box.height)
              },
              score: d.detection.score
            };
          });
        });
    },

    /* Снимок намеренно не ужимаем. Пробовали — поиск быстрее не стал (время
       уходит не на поиск лиц, а на расчёт «отпечатка» каждого лица), зато
       отпечатки получались грубее, и разные люди начинали сходиться.
       Точность здесь важнее: ошибочно приписанный снимок хуже лишней минуты. */
    workSize: 0,

    scanBlob: function (blob) {
      var self = this;
      return new Promise(function (done, fail) {
        var url = URL.createObjectURL(blob);
        var img = new Image();
        img.onload = function () {
          var w = img.naturalWidth, h = img.naturalHeight;
          var k = self.workSize ? Math.min(1, self.workSize / Math.max(w, h)) : 1;
          var src = img;
          if (k < 1) {
            var cv = document.createElement('canvas');
            cv.width = Math.round(w * k); cv.height = Math.round(h * k);
            cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
            src = cv;
          }
          self.scanImage(src).then(function (r) {
            URL.revokeObjectURL(url);
            // рамки лиц возвращаем в размерах исходного снимка
            if (k < 1) r.forEach(function (f) {
              f.box.x = Math.round(f.box.x / k); f.box.y = Math.round(f.box.y / k);
              f.box.w = Math.round(f.box.w / k); f.box.h = Math.round(f.box.h / k);
            });
            done({ faces: r, width: w, height: h });
          }, function (e) { URL.revokeObjectURL(url); fail(e); });
        };
        img.onerror = function () { URL.revokeObjectURL(url); fail(new Error('Картинка не открылась')); };
        img.src = url;
      });
    },

    /* ---------- кто нам уже известен ---------- */
    /** Отпечатки лиц хранятся в дереве, рядом с человеком: однажды подтверждённое
        узнавание помогает в следующий раз, в том числе на другом устройстве. */
    known: function () {
      var out = [];
      S.persons().forEach(function (p) {
        (p.faces || []).forEach(function (f) {
          out.push({ personId: p.id, descriptor: f.d });
        });
      });
      return out;
    },
    remember: function (personId, descriptor) {
      var p = S.person(personId);
      if (!p) return;
      p.faces = p.faces || [];
      /* Одинаковые отпечатки копить незачем: нужны разные ракурсы и возраст,
         иначе десять похожих снимков вытеснят единственный ценный. */
      for (var i = 0; i < p.faces.length; i++) {
        if (this.distance(p.faces[i].d, descriptor) < 0.2) return;
      }
      if (p.faces.length >= 8) p.faces.shift();
      p.faces.push({ d: descriptor, at: new Date().toISOString() });
      p.updated = new Date().toISOString();
    },

    /** Познакомить программу с человеком по его главному фото — тогда
        узнавание заработает сразу, без ручных подтверждений. */
    learnFromPhotos: function (onProgress) {
      var self = this;
      var list = S.persons().filter(function (p) { return p.photo && !(p.faces || []).length; });
      var i = 0, found = 0;
      function step() {
        if (i >= list.length) return Promise.resolve(found);
        var p = list[i++];
        if (onProgress) onProgress(i, list.length, S.fullName(p));
        return S.mediaBlob(p.photo).then(function (b) {
          if (!b) return;
          return self.scanBlob(b).then(function (r) {
            // на главном фото человека берём самое крупное лицо
            var big = null;
            (r.faces || []).forEach(function (f) {
              if (!big || f.box.w * f.box.h > big.box.w * big.box.h) big = f;
            });
            if (big) { self.remember(p.id, big.descriptor); found++; }
          });
        }).catch(function () {}).then(step);
      }
      return step().then(function (n) { S.save(true); return n; });
    },

    distance: function (a, b) {
      var sum = 0;
      for (var i = 0; i < a.length; i++) { var d = a[i] - b[i]; sum += d * d; }
      return Math.sqrt(sum);
    },

    /* Пороги и правила отбора взяты из «Двойников» — там этот алгоритм
       обкатан на больших папках семейных снимков. Смысл правил тот же,
       числа пересчитаны под здешнюю меру похожести (расстояние: меньше — ближе).

       join   — строже этого присваиваем сами, без вопросов;
       maybe  — до этого показываем как догадку, но выбор оставляем человеку;
       margin — отрыв от второго кандидата: двое похожи поровну → молчим;
       named  — к человеку с именем приписываем строже, чем в безымянную кучу:
                лишняя неразобранная фотография лучше чужого лица в карточке деда;
       user   — если человек уже отклонял эту догадку, в следующий раз требуем больше. */
    threshold: 0.42,
    maybe: 0.52,
    margin: 0.06,
    namedMargin: 0.03,
    userMargin: 0.08,

    /** Сколько лучших совпадений усреднять. Одно случайно похожее фото
        не должно перетягивать: смотрим на несколько. */
    topK: function (n) { return Math.max(3, Math.min(10, Math.round(n / 4))); },

    /** Похожесть лица на человека: среднее нескольких лучших совпадений
        с его отпечатками, а не одно ближайшее. */
    scoreTo: function (descriptor, list) {
      if (!list || !list.length) return Infinity;
      var ds = list.map(function (d) { return this.distance(descriptor, d); }, this);
      ds.sort(function (a, b) { return a - b; });
      var k = Math.min(ds.length, this.topK(ds.length));
      var sum = 0;
      for (var i = 0; i < k; i++) sum += ds[i];
      return sum / k;
    },

    /** Кто это. Возвращает {personId, distance, sure} или null.
        sure=false — догадка, которую стоит показать, но не применять молча. */
    match: function (descriptor, known, rejected) {
      known = known || this.known();
      var self = this;
      var byPerson = {};
      known.forEach(function (k) {
        (byPerson[k.personId] = byPerson[k.personId] || []).push(k.descriptor);
      });
      var ranked = Object.keys(byPerson).map(function (id) {
        return { personId: id, distance: self.scoreTo(descriptor, byPerson[id]) };
      }).sort(function (a, b) { return a.distance - b.distance; });
      if (!ranked.length) return null;

      var best = ranked[0], second = ranked[1];
      // к человеку с именем — строже; к отклонённому раньше — ещё строже
      var need = this.threshold - this.namedMargin;
      if (this.fast) need -= 0.04;        // лёгкая модель ошибается чаще — требуем больше
      if (rejected && rejected[best.personId]) need -= this.userMargin;

      if (best.distance <= need &&
          (!second || second.distance - best.distance >= this.margin)) {
        return { personId: best.personId, distance: best.distance, sure: true };
      }
      if (best.distance <= this.maybe) {
        return { personId: best.personId, distance: best.distance, sure: false };
      }
      return null;
    },

    confidence: function (dist) {
      if (dist < 0.33) return 'уверенно';
      if (dist < 0.42) return 'скорее всего';
      return 'возможно';
    },

    /* ---------- дата съёмки ---------- */
    /** Дата из самого снимка (EXIF). Нужна, чтобы разложить по годам. */
    shotDate: function (blob) {
      return blob.slice(0, 196608).arrayBuffer().then(function (buf) {
        try { return parseExifDate(new DataView(buf)); } catch (e) { return null; }
      }).catch(function () { return null; });
    }
  };

  /* Разбор EXIF вручную: тянуть ради одной даты целую библиотеку незачем. */
  function parseExifDate(dv) {
    if (dv.byteLength < 4 || dv.getUint16(0) !== 0xFFD8) return null;   // не JPEG
    var off = 2;
    while (off + 4 < dv.byteLength) {
      if (dv.getUint8(off) !== 0xFF) { off++; continue; }
      var marker = dv.getUint8(off + 1);
      var size = dv.getUint16(off + 2);
      if (marker === 0xE1) {                                            // APP1 — здесь EXIF
        var start = off + 4;
        if (dv.getUint32(start) !== 0x45786966) return null;            // "Exif"
        var tiff = start + 6;
        var little = dv.getUint16(tiff) === 0x4949;
        var ifd0 = tiff + dv.getUint32(tiff + 4, little);
        var date = readIfdDate(dv, tiff, ifd0, little, 0);
        if (date) return date;
        return null;
      }
      if (marker === 0xDA) break;                                       // пошли данные картинки
      off += 2 + size;
    }
    return null;
  }
  function readIfdDate(dv, tiff, ifd, little, depth) {
    if (depth > 2 || ifd + 2 > dv.byteLength) return null;
    var n = dv.getUint16(ifd, little);
    var exifIfd = 0;
    for (var i = 0; i < n; i++) {
      var e = ifd + 2 + i * 12;
      if (e + 12 > dv.byteLength) break;
      var tag = dv.getUint16(e, little);
      var type = dv.getUint16(e + 2, little);
      var count = dv.getUint32(e + 4, little);
      var valOff = dv.getUint32(e + 8, little);
      if (tag === 0x8769) exifIfd = valOff;                             // указатель на блок EXIF
      // 0x9003 — снято, 0x9004 — оцифровано, 0x0132 — изменено
      if ((tag === 0x9003 || tag === 0x9004 || tag === 0x0132) && type === 2 && count >= 19) {
        var p = tiff + valOff, s = '';
        for (var k = 0; k < 19; k++) s += String.fromCharCode(dv.getUint8(p + k));
        var m = s.match(/^(\d{4}):(\d{2}):(\d{2})/);
        if (m && +m[1] > 1900) return m[1] + '-' + m[2] + '-' + m[3];
      }
    }
    if (exifIfd) return readIfdDate(dv, tiff, tiff + exifIfd, little, depth + 1);
    return null;
  }

  global.Faces = Faces;
})(window);
</script>
<script>/* Семейное Древо — узнавание лиц в фоне.

   Человек добавляет снимки и идёт заниматься своими делами. Программа
   сама, не торопясь, просматривает их: ищет лица и сверяет с теми, кого
   уже знает по карточкам. Кого узнала уверенно — подписывает; остальное
   оставляет человеку, кнопка «Кто на снимке» рядом.

   Очередь лежит в памяти устройства. Закрыли программу на середине —
   при следующем запуске разбор продолжится с того места, где встал.
   Совсем «во сне», при закрытой вкладке, браузер считать не даёт:
   страница останавливается вместе с окном. */
(function (global) {
  'use strict';

  var S = global.Store;

  var FaceQueue = {
    ids: [],          // что осталось посмотреть
    busy: false,
    halt: false,
    seen: 0,
    found: 0,

    key: function () {
      return 'drevo.faces.todo.' + ((S.session && S.session.userId) || 'me');
    },
    load: function () {
      try { this.ids = JSON.parse(localStorage.getItem(this.key()) || '[]') || []; }
      catch (e) { this.ids = []; }
      return this.ids;
    },
    keep: function () {
      try { localStorage.setItem(this.key(), JSON.stringify(this.ids)); } catch (e) {}
    },

    /** Поставить снимки в очередь. Уже стоящие и уже разобранные пропускаем. */
    add: function (ids) {
      var have = {}, self = this;
      this.ids.forEach(function (i) { have[i] = 1; });
      (ids || []).forEach(function (id) {
        var m = S.tree.media[id];
        if (!m || m.kind !== 'photo' || have[id]) return;
        have[id] = 1;
        self.ids.push(id);
      });
      this.keep();
      return this.ids.length;
    },

    /** Все снимки, которых программа ещё ни разу не смотрела. */
    addUnscanned: function () {
      var ids = S.allMedia().filter(function (m) {
        return m.kind === 'photo' && !m.scanned;
      }).map(function (m) { return m.id; });
      this.add(ids);
      return ids.length;
    },

    left: function () { return this.ids.length; },

    /** Показать, чем занята, в разделе «Фото и файлы». */
    say: function (text) {
      var el = document.getElementById('faceState');
      if (el) el.textContent = text || '';
    },

    /** Запустить разбор. Повторный вызов ничего не ломает: очередь одна. */
    run: function (opts) {
      var self = this;
      opts = opts || {};
      this.load();
      if (this.busy || !this.ids.length) return Promise.resolve(0);
      /* Если библиотеки узнавания рядом с программой нет, второй раз за
         сеанс об этом не напоминаем: снимки всё равно уже добавлены. */
      if (this.blocked && !opts.loud) return Promise.resolve(0);
      if (!S.persons().length) return Promise.resolve(0);
      this.busy = true; this.halt = false;
      this.seen = 0; this.found = 0;

      this.say('Смотрю лица на снимках: осталось ' + this.ids.length);
      return global.Faces.ensure(function (t) { self.say(t); }).then(function () {
        // если программа ещё никого не знает в лицо — знакомим по главным фото
        if (!global.Faces.known().length) {
          return global.Faces.learnFromPhotos(function (i, n, who) {
            self.say('Запоминаю лица из карточек: ' + i + ' из ' + n + ' · ' + who);
          });
        }
      }).then(function () {
        return self.step();
      }).then(function () {
        self.busy = false;
        self.say('');
        if (self.found && !opts.quiet) {
          global.App.toast('Узнала людей на ' + self.found + ' ' +
            plural(self.found, 'снимке', 'снимках', 'снимках'));
        } else if (!self.found && opts.loud) {
          global.App.toast('Знакомых лиц на этих снимках не нашлось');
        }
        if (global.App.activeTab === 'photos' && global.Files) global.Files.render();
        return self.found;
      }, function (e) {
        self.busy = false;
        self.blocked = true;
        self.say('');
        /* Молчать нельзя: человек ждёт, что лица разберутся сами, и не
           поймёт, почему ничего не происходит. Но и повторять одно и то
           же при каждой папке незачем — говорим один раз за сеанс. */
        if (opts.loud || !self.toldOnce) {
          self.toldOnce = true;
          global.App.toast('Узнавание лиц не вышло: ' + e.message);
        }
        return 0;
      });
    },

    pause: function () { this.halt = true; },

    step: function () {
      var self = this;
      if (this.halt || !this.ids.length) return Promise.resolve();
      var id = this.ids[0];
      var m = S.tree.media[id];
      if (!m || m.kind !== 'photo') { this.ids.shift(); this.keep(); return this.next(); }
      this.say('Смотрю лица: осталось ' + this.ids.length);

      return S.mediaBlob(id).then(function (blob) {
        if (!blob) throw new Error('файла нет на этом устройстве');
        return global.Faces.scanBlob(blob);
      }).then(function (r) {
        self.applyFaces(m, (r && r.faces) || []);
        self.seen++;
      }).catch(function () {
        /* Не открылся, не расшифровался, нет на устройстве — не беда:
           помечаем просмотренным, чтобы очередь не ходила по кругу. */
        m.scanned = true;
      }).then(function () {
        self.ids.shift();
        self.keep();
        S.save(true);
        return self.next();
      });
    },

    /** Передышка между снимками: страница должна оставаться живой. */
    next: function () {
      var self = this;
      return new Promise(function (go) {
        var run = function () { go(self.step()); };
        if (global.requestIdleCallback) global.requestIdleCallback(run, { timeout: 400 });
        else setTimeout(run, 60);
      });
    },

    /** Что нашли на снимке — записать в его карточку. */
    applyFaces: function (m, faces) {
      var known = global.Faces.known();
      // крупные и чёткие лица рассматриваем первыми: по ним ошибиться труднее
      faces = faces.slice().sort(function (a, b) {
        return (b.box.w * b.box.h * b.score) - (a.box.w * a.box.h * a.score);
      });
      var tags = [], named = [], main = null;
      faces.forEach(function (f) {
        var mt = global.Faces.match(f.descriptor, known);
        var who = (mt && mt.sure) ? mt.personId : '';
        tags.push({ x: f.box.x, y: f.box.y, w: f.box.w, h: f.box.h, person: who });
        if (!who) return;
        if (named.indexOf(who) < 0) named.push(who);
        var area = f.box.w * f.box.h;
        if (!main || area > main.area) main = { id: who, area: area };
      });
      m.faces = tags;
      m.scanned = true;
      m.updated = new Date().toISOString();
      if (!tags.length || !named.length) return;

      this.found++;
      /* Снимок отдаём тому, чьё лицо крупнее: обычно он и есть герой кадра.
         Остальных узнанных записываем в подпись, чтобы групповое фото
         не потеряло имён. Если у снимка уже есть хозяин — не трогаем. */
      if (!m.personId && main) {
        m.personId = main.id;
        var p = S.person(main.id);
        if (p) {
          p.media = p.media || [];
          if (p.media.indexOf(m.id) < 0) p.media.push(m.id);
          if (!p.photo) p.photo = m.id;
          S.log('media', 'Узнала на снимке «' + (m.caption || m.name) + '»: ' +
            S.fullName(p), main.id);
        }
      }
      if (named.length > 1 && !m.caption) {
        m.caption = 'На снимке: ' + named.map(function (id) {
          return S.callName(S.person(id));
        }).filter(Boolean).join(', ');
      }
    }
  };

  function plural(n, a, b, c) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return a;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return b;
    return c;
  }

  global.FaceQueue = FaceQueue;
})(window);
</script>
<script>/* Семейное Древо — «Кто на снимке».

   Окно показывает найденные на фотографии лица и даёт каждому имя.
   Нужно оно в двух случаях: программа никого не узнала (старый снимок,
   человек снят сбоку, таких лиц она ещё не видела) и программа ошиблась.

   Каждое подтверждённое имя программа запоминает: в следующий раз этого
