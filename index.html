<!doctype html>
<html lang="ru">
<head>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Семейное Древо</title>
<meta name="theme-color" content="#2f7fb8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:wght@400;700&family=PT+Mono&display=swap">
<style>/* Семейное Древо — оформление.
   Композиция: верхняя панель → вкладки → полотно во всю высоту;
   слева выдвижная карточка персоны, справа внизу переключатель вида дерева. */

:root {
  /* бумага и чернила: палитра старого семейного альбома */
  --paper:        #f6f1e6;
  --paper-2:      #fffdf8;
  --ink:          #241f1a;
  --ink-soft:     #5d554a;
  --ink-faint:    #8d8577;
  --line:         #ddd3c0;
  --accent:       #2f7fb8;
  --accent-ink:   #ffffff;
  --male:         #cde6f7;
  --male-top:     #eaf5fd;
  --male-bot:     #afd4ee;
  --male-edge:    #6aa9d4;
  --female:       #fbd3e2;
  --female-top:   #fdeef4;
  --female-bot:   #f4b8ce;
  --female-edge:  #dd8fae;
  --neutral:      #ece7dc;
  --neutral-top:  #f7f4ec;
  --neutral-bot:  #ded7c8;
  --neutral-edge: #bdb3a1;
  --mourn:        #15120f;
  --line-tree:    #a69c89;
  --good:         #3f7d5a;
  --warn:         #a9741f;
  --bad:          #a4402f;
  --shadow:       0 1px 2px rgba(40,32,20,.14), 0 6px 18px rgba(40,32,20,.08);
  --radius:       10px;

  --font-display: "PT Serif", Georgia, "Times New Roman", serif;
  --font-body:    "PT Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data:    "PT Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --ui-size:      14px;
  --tab-size:     14px;
  --icon-size:    17px;
  --tree-bg:      var(--paper);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:        #1a1714;
    --paper-2:      #221e1a;
    --ink:          #ece5d9;
    --ink-soft:     #b3a998;
    --ink-faint:    #837a6c;
    --line:         #3a342c;
    --accent:       #5fa8dc;
    --accent-ink:   #10212c;
    --male:         #1d3444;
    --male-top:     #27465c;
    --male-bot:     #16262f;
    --male-edge:    #3f6f93;
    --female:       #3c2230;
    --female-top:   #4e2d3f;
    --female-bot:   #2d1924;
    --female-edge:  #8d5570;
    --neutral:      #2a251f;
    --neutral-top:  #38322a;
    --neutral-bot:  #1f1b16;
    --neutral-edge: #4d463c;
    --mourn:        #000000;
    --line-tree:    #6b6353;
    --good:         #6fae89;
    --warn:         #d3a55c;
    --bad:          #d47a68;
    --shadow:       0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper:        #1a1714;
  --paper-2:      #221e1a;
  --ink:          #ece5d9;
  --ink-soft:     #b3a998;
  --ink-faint:    #837a6c;
  --line:         #3a342c;
  --accent:       #5fa8dc;
  --accent-ink:   #10212c;
  --male:         #1d3444;
  --male-top:     #27465c;
  --male-bot:     #16262f;
  --male-edge:    #3f6f93;
  --female:       #3c2230;
  --female-top:   #4e2d3f;
  --female-bot:   #2d1924;
  --female-edge:  #8d5570;
  --neutral:      #2a251f;
  --neutral-top:  #38322a;
  --neutral-bot:  #1f1b16;
  --neutral-edge: #4d463c;
  --mourn:        #000000;
  --line-tree:    #6b6353;
  --good:         #6fae89;
  --warn:         #d3a55c;
  --bad:          #d47a68;
  --shadow:       0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* flex и grid перебивают стандартное поведение hidden — возвращаем его */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--ui-size);
  background: var(--paper);
  color: var(--ink);
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; margin: 0; }
a { color: var(--accent); }

/* ---------- каркас ---------- */
#app { display: flex; flex-direction: column; height: 100%; }

.topbar {
  display: flex; align-items: center; gap: 10px;
  padding-block: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--paper-2);
  border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
}
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand-mark {
  width: 26px; height: 26px; flex: 0 0 auto; border-radius: 7px;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 15px;
}
.brand-name { font-family: var(--font-display); font-size: 16px; font-weight: 700; white-space: nowrap; }
.tree-name {
  font-size: 12px; color: var(--ink-faint); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}

.search-wrap { position: relative; flex: 1 1 auto; max-width: 440px; min-width: 0; }
.search-wrap input {
  width: 100%; padding: 7px 64px 7px 30px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--paper); outline: none;
}
.search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,127,184,.18); }
.search-ico {
  position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
  color: var(--ink-faint); font-size: 15px; display: flex; pointer-events: none;
}
.search-mic, .search-clear {
  position: absolute; top: 50%; transform: translateY(-50%);
  border: 0; background: transparent; padding: 5px; border-radius: 50%;
  line-height: 0; color: var(--ink-faint); font-size: 15px;
}
.search-mic:hover, .search-clear:hover { background: var(--neutral); color: var(--ink); }
.search-mic { right: 6px; }
.search-mic.rec { color: var(--bad); animation: pulse 1.1s infinite; }
.search-clear { right: 32px; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .search-mic.rec { animation: none; } }

.results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 60;
  background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow); max-height: 60vh; overflow: auto; padding: 4px;
}
.results button {
  display: flex; gap: 10px; align-items: center; width: 100%; text-align: left;
  border: 0; background: transparent; padding: 7px 8px; border-radius: 8px;
}
.results button:hover, .results button:focus-visible { background: var(--neutral); }
.results .r-sub { font-size: 12px; color: var(--ink-faint); }

.topbar-right { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.ico { width: 1.25em; height: 1.25em; flex: 0 0 auto; display: block; }

.icon-btn {
  border: 1px solid transparent; background: transparent; color: var(--ink-soft);
  min-width: calc(var(--icon-size) * 2);
  height: calc(var(--icon-size) * 2);
  padding: 0 calc(var(--icon-size) * 0.4);
  border-radius: 9px; display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; font-size: var(--icon-size); line-height: 1;
}
.icon-btn .lbl { font-size: calc(var(--ui-size) * 0.92); font-family: var(--font-body); }
.icon-btn:hover { background: var(--neutral); color: var(--ink); }
.icon-btn.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.icon-btn.accent:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
@media (max-width: 1180px) { .icon-btn .lbl { display: none; } }
/* корзина в верхней панели: цифра показывает, что там что-то лежит */
#btnTrash { position: relative; }
#btnTrash.has-items { color: var(--warn); }
.trash-count {
  position: absolute; top: 1px; right: 1px; min-width: 15px; height: 15px;
  padding: 0 3px; border-radius: 999px; background: var(--warn); color: #fff;
  font-size: 10px; line-height: 15px; text-align: center; font-family: var(--font-body);
}
.trash-count[hidden] { display: none !important; }

.who { font-size: 12px; color: var(--ink-faint); white-space: nowrap; }
.who b { color: var(--ink); font-weight: 700; }

/* ---------- вкладки ---------- */
.tabs {
  display: flex; align-items: stretch; gap: 2px; overflow-x: auto; flex: 0 0 auto;
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  background: var(--paper-2); border-bottom: 1px solid var(--line);
  scrollbar-width: thin;
}
.tabs button {
  border: 0; background: transparent; color: var(--ink-soft);
  padding: 9px 14px; font-size: var(--tab-size); white-space: nowrap;
  border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 6px;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
.tabs .tab-add { color: var(--ink-faint); font-size: 16px; padding-inline: 10px; }
.tabs .tab-close { font-size: 12px; opacity: .5; }

/* ---------- панели ---------- */
.panes { position: relative; flex: 1 1 auto; min-height: 0; }
.pane { position: absolute; inset: 0; display: none; }
.pane.active { display: block; }
.pane-scroll { position: absolute; inset: 0; overflow: auto;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- полотно дерева ---------- */
#treeHost {
  position: absolute; inset: 0; overflow: hidden; touch-action: none;
  background: var(--tree-bg);
  cursor: grab;
}
/* своя картинка под деревом; приглушается слоем цвета сверху */
#treeBgImage {
  position: absolute; inset: 0; pointer-events: none;
  background-position: center; background-repeat: no-repeat;
  background-size: cover;
}
#treeBgImage.tile { background-repeat: repeat; background-size: auto; }
#treeBgImage::after {
  content: ""; position: absolute; inset: 0;
  background: var(--tree-bg); opacity: var(--tree-fade, .35);
}
#treeHost.grid {
  background:
    radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0/28px 28px,
    var(--tree-bg);
}
#treeHost.grabbing { cursor: grabbing; }
#treeCanvas, #treeLines { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#treeLines { pointer-events: none; }
/* Все связи одного цвета: разноцветные линии читались как разные по смыслу,
   хотя смысл у них один — родство. Повороты скруглены, поэтому crispEdges
   здесь нельзя: он превратил бы дуги в лесенку. Чёткость держится на целых
   координатах и чётной толщине штриха. */
.lnk-parent, .lnk-couple {
  fill: none; stroke: var(--line-tree); stroke-width: 2;
  stroke-linecap: round; stroke-linejoin: round;
}

.node {
  position: absolute; display: flex; align-items: center; gap: 8px;
  padding: 6px 8px;
  background: linear-gradient(170deg, var(--neutral-top) 0%, var(--neutral) 58%, var(--neutral-bot) 100%);
  border: 1px solid var(--neutral-edge);
  box-shadow: var(--shadow);
  transition: box-shadow .12s, transform .12s;
}
.node:hover { transform: translateY(-1px); box-shadow: 0 2px 4px rgba(40,32,20,.2), 0 10px 24px rgba(40,32,20,.14); }
.node.sex-m {
  background: linear-gradient(170deg, var(--male-top) 0%, var(--male) 58%, var(--male-bot) 100%);
  border-color: var(--male-edge);
}
.node.sex-f {
  background: linear-gradient(170deg, var(--female-top) 0%, var(--female) 58%, var(--female-bot) 100%);
  border-color: var(--female-edge);
}
/* раскрыта карточка этого человека — пометка снимается при закрытии */
.node.is-open { outline: 2px solid var(--accent); outline-offset: 1px; }

/* Траурная лента: человека нет в живых. Лежит на верхнем левом углу
   фотокарточки под 45°, обрезается её же формой — поэтому видна и при
   круглом фото, и при любом скруглении. */
/* Полоса идёт под 45° через верхний левый угол фотокарточки.
   Толщина и отступ от угла настраиваются: --mourn-w и --mourn-gap. */
.node-ph .mourn-corner,
.pv-ph .mourn-corner,
.sheet-ph .mourn-corner {
  position: absolute; left: 0; top: 0; right: 0; bottom: 0;
  pointer-events: none; z-index: 3;
  background: linear-gradient(135deg,
    transparent 0 var(--mourn-gap, 0px),
    var(--mourn) var(--mourn-gap, 0px),
    var(--mourn) calc(var(--mourn-gap, 0px) + var(--mourn-w, 14px)),
    transparent calc(var(--mourn-gap, 0px) + var(--mourn-w, 14px)));
}
/* Если фотокарточка отключена, лента ложится на угол самого эскиза. */
.node-mourn {
  position: absolute; inset: 0; border-radius: inherit;
  overflow: hidden; pointer-events: none; z-index: 4;
}
.node-mourn::before {
  content: ""; position: absolute; left: 0; top: 0; width: 70px; height: 70px;
  background: linear-gradient(135deg,
    transparent 0 var(--mourn-gap, 0px),
    var(--mourn) var(--mourn-gap, 0px),
    var(--mourn) calc(var(--mourn-gap, 0px) + var(--mourn-w, 14px)),
    transparent calc(var(--mourn-gap, 0px) + var(--mourn-w, 14px)));
}

.node-ph {
  flex: 0 0 auto; background: var(--paper-2) center/cover no-repeat;
  border: 1px solid rgba(0,0,0,.08); position: relative; overflow: hidden;
}
.node-ph .ico { width: 72%; height: 72%; margin: 14%; color: var(--ink-faint); opacity: .45; }
.node-ph.has-img .ico { display: none; }
.node-txt { min-width: 0; flex: 1 1 auto; overflow: hidden; }
.node-name { font-weight: 700; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.node-years { color: var(--ink-soft); font-family: var(--font-data); margin-top: 2px; }
.node-lock { position: absolute; top: 2px; right: 3px; line-height: 0; opacity: .65; }
.node-plus {
  position: absolute; left: 50%; bottom: -11px; transform: translateX(-50%);
  width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--good);
  background: var(--paper-2); color: var(--good); line-height: 0;
  display: grid; place-items: center; padding: 0; z-index: 3;
  box-shadow: 0 1px 3px rgba(0,0,0,.25); opacity: 0; transition: opacity .12s;
}
.node-plus .ico { width: 14px; height: 14px; }
.node-plus:hover { background: var(--good); color: var(--paper-2); }
.node:hover .node-plus, .node-plus:focus-visible { opacity: 1; }
@media (pointer: coarse) { .node-plus { opacity: .92; } }

/* плавающие кнопки вида дерева — справа внизу */
.viewdock {
  position: absolute; z-index: 30;
  right: calc(12px + env(safe-area-inset-right, 0px));
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 6px; background: var(--paper-2);
  border: 1px solid var(--line); border-radius: 12px; padding: 4px; box-shadow: var(--shadow);
}
.viewdock button {
  border: 0; background: transparent; color: var(--ink-soft);
  padding: 7px 10px; border-radius: 9px; font-size: 13px;
  display: flex; align-items: center; gap: 6px;
}
.viewdock button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.zoomdock {
  position: absolute; z-index: 30;
  right: calc(12px + env(safe-area-inset-right, 0px));
  bottom: calc(62px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 4px;
}
.zoomdock button {
  width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--paper-2); color: var(--ink-soft); box-shadow: var(--shadow);
  font-size: 15px; display: grid; place-items: center;
}
.zoomdock button:hover { color: var(--ink); background: var(--neutral); }

/* ---------- карточка персоны ---------- */
.sheet {
  position: absolute; z-index: 50; background: var(--paper-2);
  border: 1px solid var(--line); box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  left: max(10px, env(safe-area-inset-left, 0px)); top: 10px; bottom: 10px; width: 370px;
  border-radius: 14px; overflow: hidden;
}
.sheet[hidden] { display: none !important; }
@media (max-width: 760px) {
  .sheet { left: 0; right: 0; width: auto; top: auto; height: 76%; border-radius: 16px 16px 0 0; bottom: 0; }
}
.sheet-head {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px;
  border-bottom: 1px solid var(--line); flex: 0 0 auto;
}
.sheet-ph {
  width: 64px; height: 64px; border-radius: 10px; flex: 0 0 auto;
  background: var(--neutral) center/cover no-repeat; border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 24px; color: var(--ink-faint);
}
.sheet-title { font-family: var(--font-display); font-size: 17px; line-height: 1.25; }
.sheet-sub { font-size: 12px; color: var(--ink-faint); margin-top: 3px; font-family: var(--font-data); }
.sheet-body { flex: 1 1 auto; overflow: auto; padding: 12px; }
.sheet-tabs { display: flex; flex-wrap: wrap; gap: 2px 0; padding: 0 10px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.sheet-tabs button {
  border: 0; background: transparent; color: var(--ink-soft); padding: 8px 10px;
  font-size: 13px; border-bottom: 2px solid transparent; white-space: nowrap;
}
.sheet-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }

/* Название сверху, поле под ним во всю ширину: длинные значения
   (адрес, место, имя) помещаются целиком. */
.row { display: grid; grid-template-columns: 1fr; gap: 3px; margin-bottom: 10px; }
.row > label {
  font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
  color: var(--ink-faint); padding: 0;
}
.row input:not([type=checkbox]):not([type=radio]),
.row select, .row textarea, .field-val {
  width: 100%; min-width: 0; padding: 7px 9px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--paper); outline: none;
}
.row input:not([type=checkbox]):focus, .row select:focus, .row textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,127,184,.16);
}
.row textarea { min-height: 70px; resize: vertical; }

/* Галочки и переключатели: свой размер, без растягивания на всю строку */
input[type=checkbox], input[type=radio] {
  width: 17px; height: 17px; flex: 0 0 auto; margin: 0;
  accent-color: var(--accent); cursor: pointer;
}
.row input[type=checkbox] { margin-top: 3px; }
label.inline { cursor: pointer; }
.inline { display: flex; gap: 6px; align-items: center; }
.inline > * { min-width: 0; }

.btn {
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  padding: 7px 12px; border-radius: 9px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--neutral); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn-primary:hover { filter: brightness(1.07); background: var(--accent); }
.btn-danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn-sm { padding: 4px 8px; font-size: 12px; border-radius: 7px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px;
  border-radius: 999px; background: var(--neutral); font-size: 12px; color: var(--ink-soft);
}
.chip.lock { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }

.sect-title {
  font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--ink-faint); margin: 14px 0 7px;
}
.sect-title:first-child { margin-top: 0; }

.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 7px; }
.media-tile {
  position: relative; aspect-ratio: 1; border-radius: 9px; overflow: hidden;
  border: 1px solid var(--line); background: var(--neutral) center/cover no-repeat;
  display: grid; place-items: center; font-size: 22px; color: var(--ink-faint); padding: 0;
}
.media-tile .m-name {
  position: absolute; inset: auto 0 0 0; background: rgba(0,0,0,.55); color: #fff;
  font-size: 10px; padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.media-tile .m-lock { position: absolute; top: 3px; right: 3px; font-size: 11px; }

.list { display: flex; flex-direction: column; gap: 6px; }
.list-item {
  display: flex; gap: 9px; align-items: center; padding: 8px 10px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--paper);
}
.list-item .li-main { flex: 1 1 auto; min-width: 0; }
.list-item .li-sub { font-size: 12px; color: var(--ink-faint); }
.mini-ph {
  width: 34px; height: 34px; border-radius: 8px; flex: 0 0 auto;
  background: var(--neutral) center/cover no-repeat; display: grid; place-items: center;
  font-size: 15px; color: var(--ink-faint); border: 1px solid var(--line);
}
.mini-ph .ico { width: 20px; height: 20px; }
.sheet-ph { position: relative; overflow: hidden; }
.sheet-ph .ico { width: 34px; height: 34px; opacity: .45; }
.media-tile .ico { width: 26px; height: 26px; }
.m-lock .ico { width: 13px; height: 13px; }
.node-lock .ico { width: 11px; height: 11px; }
.tab-close .ico { width: 12px; height: 12px; vertical-align: -1px; }
.mic-btn { padding: 5px 7px; line-height: 0; }
.btn .ico { width: 1.1em; height: 1.1em; }

/* ---------- модальные окна ---------- */
.modal-back {
  position: fixed; inset: 0; z-index: 100; background: rgba(20,14,8,.45);
  display: grid; place-items: center; padding: 16px;
}
.modal-back[hidden] { display: none !important; }
.modal {
  background: var(--paper-2); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: var(--shadow); width: min(560px, 100%); max-height: 88vh;
  display: flex; flex-direction: column; overflow: hidden;
}
/* настройки шире: иначе ползунки и образец тесно жмутся друг к другу */
.modal.wide { width: min(880px, 100%); max-height: 92vh; }
/* вкладки настроек закреплены, прокручивается только содержимое */
.modal.wide .modal-body {
  padding: 0; display: flex; flex-direction: column; overflow: hidden; min-height: 0;
}
.modal.wide #setTabs {
  flex: 0 0 auto; margin: 0; padding: 0 15px;
  border-bottom: 1px solid var(--line); background: var(--paper-2);
}
.modal.wide #setBody {
  flex: 1 1 auto; overflow: auto; min-height: 0;
  padding: 0 15px 15px;
}
.modal-head { padding: 13px 15px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.modal-head h2 { font-size: 16px; flex: 1 1 auto; }
.modal-body { padding: 15px; overflow: auto; }
.modal-foot { padding: 11px 15px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* ---------- экран входа ---------- */
.gate {
  position: fixed; inset: 0; z-index: 200; display: grid; place-items: center;
  background: var(--paper);
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: auto;
}
.gate[hidden] { display: none !important; }
.gate-card {
  position: relative;
  width: min(400px, 100%); background: var(--paper-2); border: 1px solid var(--line);
  border-radius: 16px; padding: 22px; box-shadow: var(--shadow);
}
/* крестик вместо второй кнопки: уйти с экрана, ничего не меняя */
.gate-close {
  position: absolute; right: 10px; top: 10px;
  width: 32px; height: 32px; border: 0; border-radius: 9px;
  background: transparent; color: var(--ink-faint); line-height: 0;
  display: grid; place-items: center; cursor: pointer;
}
.gate-close .ico { width: 18px; height: 18px; }
.gate-close:hover { background: var(--neutral); color: var(--ink); }
.gate-card h1 { padding-right: 36px; }
.gate h1 { font-size: 24px; margin-bottom: 4px; }
.gate .lede { color: var(--ink-soft); font-size: 13px; margin: 0 0 18px; line-height: 1.5; }
.gate label { display: block; font-size: 12px; color: var(--ink-faint); margin: 10px 0 4px; }
.gate input {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line);
  border-radius: 9px; background: var(--paper); outline: none;
}
.gate input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,127,184,.18); }
.gate .err { color: var(--bad); font-size: 12px; min-height: 16px; margin-top: 8px; }
.gate .alt { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
/* номер сборки — чтобы было видно, обновилась ли программа на этом устройстве */
.gate-ver {
  margin: 18px 0 0; padding-top: 10px; border-top: 1px solid var(--line);
  font-size: 11px; color: var(--ink-faint); text-align: right; letter-spacing: .02em;
}

/* ---------- фото, изменения, календарь, карта ---------- */
.photo-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 9px; }
.photo-wall .media-tile { aspect-ratio: 4/3; }

.change {
  display: flex; gap: 10px; padding: 9px 11px; border-bottom: 1px solid var(--line); align-items: flex-start;
}
.change:last-child { border-bottom: 0; }
.change .c-dot {
  width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; margin-top: 6px; background: var(--accent);
}
.change.add .c-dot { background: var(--good); }
.change.delete .c-dot { background: var(--bad); }
.change.media .c-dot { background: var(--warn); }
.change .c-meta { font-size: 12px; color: var(--ink-faint); font-family: var(--font-data); }

.cal-day {
  display: flex; gap: 10px; align-items: center; padding: 9px 11px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--paper); margin-bottom: 7px;
}
.cal-when {
  flex: 0 0 auto; width: 62px; text-align: center; font-family: var(--font-data);
  font-size: 12px; color: var(--ink-soft); line-height: 1.3;
}
.cal-when b { display: block; font-size: 17px; color: var(--ink); }
.cal-soon { color: var(--good); font-weight: 700; }

#mapCanvas, .map-host {
  position: relative; width: 100%; height: 100%; overflow: hidden;
  background: var(--neutral); touch-action: none; cursor: grab;
  user-select: none; -webkit-user-select: none;
}
.map-tile { -webkit-user-drag: none; user-drag: none; pointer-events: none; }
#mapCanvas.grabbing { cursor: grabbing; }
.map-tile { position: absolute; width: 256px; height: 256px; }
.map-pin {
  position: absolute; width: 20px; height: 20px; margin: -20px 0 0 -10px;
  border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
  border: 2px solid var(--paper-2); box-shadow: 0 1px 4px rgba(0,0,0,.4); padding: 0;
}
.map-pin.birth { background: var(--good); }
.map-pin.death { background: var(--ink-soft); }
.map-pin.event { background: var(--warn); }
.map-attr {
  position: absolute; right: 4px; bottom: 2px; font-size: 10px;
  background: rgba(255,255,255,.8); color: #333; padding: 1px 5px; border-radius: 4px;
}
.map-ctl { position: absolute; left: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 5; }
.map-ctl .btn { width: 32px; height: 32px; padding: 0; display: grid; place-items: center; }

/* панель над картой выбора точки */
.map-tools {
  position: absolute; z-index: 6; left: 50px; right: 10px; top: 10px;
  display: flex; gap: 6px; align-items: center;
}
.map-tools input {
  flex: 1 1 auto; min-width: 0; padding: 7px 10px; border: 1px solid var(--line);
  border-radius: 9px; background: var(--paper-2); outline: none;
}
.map-tools input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,127,184,.18); }
.map-tools .btn { background: var(--paper-2); }
.map-hits {
  position: absolute; z-index: 7; left: 50px; right: 10px; top: 50px;
  background: var(--paper-2); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow); max-height: 220px; overflow: auto; padding: 4px;
}
.map-hits[hidden] { display: none !important; }
.map-hits button {
  display: block; width: 100%; text-align: left; border: 0; background: transparent;
  padding: 7px 9px; border-radius: 7px; font-size: 13px;
}
.map-hits button:hover { background: var(--neutral); }
.map-pick-wrap { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.map-pick-wrap.full {
  position: fixed; inset: 0; z-index: 140; border-radius: 0; border: 0;
}
.map-crosshair {
  position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px;
  pointer-events: none; z-index: 5; opacity: .5; color: var(--ink);
}

/* ---------- настройки ---------- */
.set-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.set-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--paper-2); }
.set-card h3 { font-size: 14px; margin-bottom: 10px; }
.set-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin-bottom: 9px; font-size: 13px; }
.set-row input[type=range] { width: 120px; }
.set-row output { font-family: var(--font-data); font-size: 12px; color: var(--ink-faint); min-width: 38px; text-align: right; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { width: 26px; height: 26px; border-radius: 7px; border: 2px solid transparent; padding: 0; }
.swatch[aria-pressed="true"] { border-color: var(--ink); }

.preview-node {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 8px;
  background: var(--male); border: 1px solid var(--male-edge); box-shadow: var(--shadow);
}

.empty { color: var(--ink-faint); font-size: 13px; text-align: center; padding: 34px 16px; line-height: 1.6; }
.toast {
  position: fixed; z-index: 300; left: 50%; transform: translateX(-50%);
  bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--paper); padding: 9px 15px; border-radius: 10px;
  font-size: 13px; box-shadow: var(--shadow); max-width: 90vw;
}
.toast[hidden] { display: none !important; }

.note { font-size: 12px; color: var(--ink-faint); line-height: 1.5; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th, table.data td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.data th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); font-weight: 400; }

/* ---------- узкие экраны ---------- */
@media (max-width: 720px) {
  .brand-name, .tree-name { display: none; }
  .who { display: none; }
  .topbar { gap: 7px; }
  .icon-btn { width: 32px; height: 32px; font-size: 15px; }
  .viewdock button { padding: 7px 9px; font-size: 12px; }
  .viewdock button .lbl { display: none; }
}
@media (max-width: 420px) {
  #btnCalendar, #btnMap { display: none; }
  .viewdock { right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
  .zoomdock { bottom: calc(56px + env(safe-area-inset-bottom, 0px)); right: 8px; }
}

/* ---------- значок синхронизации ---------- */
#btnSync.spin .ico { animation: sync-spin 1.1s linear infinite; }
#btnSync.spin { color: var(--accent); }
#btnSync.bad { color: var(--warn); }
@keyframes sync-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { #btnSync.spin .ico { animation: none; } #btnSync.spin { opacity: .6; } }
.set-card details summary { outline-offset: 3px; }
.set-card ol { margin: 8px 0 0; }

/* ---------- приглашение в пустом дереве ---------- */
.tree-empty {
  position: absolute; inset: 0; z-index: 4;
  display: grid; place-items: center;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.tree-empty[hidden] { display: none !important; }
.tree-empty > div {
  pointer-events: auto; text-align: center; max-width: 420px;
  background: var(--paper-2); border: 1px solid var(--line);
  border-radius: 16px; padding: 26px 22px; box-shadow: var(--shadow);
}
.tree-empty h2 { font-size: 19px; margin-bottom: 8px; }
.tree-empty p { color: var(--ink-soft); font-size: 13px; line-height: 1.6; margin: 0 0 16px; }
.tree-empty .ico { width: 42px; height: 42px; color: var(--accent); margin: 0 auto 12px; }
.tree-empty .btn-row { justify-content: center; }

/* ---------- живой образец окошка в настройках ---------- */
.preview-stage {
  border: 1px solid var(--line); border-radius: 12px;
  padding: 20px 14px; display: grid; place-items: center; gap: 12px;
  min-height: 132px; overflow: hidden;
}
.preview-stage .pv-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }
.pv-node {
  position: relative; display: flex; align-items: center; gap: 8px; padding: 6px 8px;
  border: 1px solid var(--neutral-edge);
  background: linear-gradient(170deg, var(--neutral-top) 0%, var(--neutral) 58%, var(--neutral-bot) 100%);
  box-shadow: var(--shadow); flex: 0 0 auto;
}
.pv-node.m {
  background: linear-gradient(170deg, var(--male-top) 0%, var(--male) 58%, var(--male-bot) 100%);
  border-color: var(--male-edge);
}
.pv-node.f {
  background: linear-gradient(170deg, var(--female-top) 0%, var(--female) 58%, var(--female-bot) 100%);
  border-color: var(--female-edge);
}

.pv-txt { overflow: hidden; }
.pv-ph {
  position: relative;        /* без этого лента ложилась не на фото, а на весь эскиз */
  flex: 0 0 auto; background: var(--paper-2); border: 1px solid rgba(0,0,0,.08);
  display: grid; place-items: center; color: var(--ink-faint); overflow: hidden;
}
.pv-ph .ico { width: 72%; height: 72%; opacity: .45; }
.pv-txt { min-width: 0; }
.pv-name { font-weight: 700; line-height: 1.2; }
.pv-years { color: var(--ink-soft); font-family: var(--font-data); margin-top: 2px; }
.preview-hint { font-size: 11px; color: var(--ink-faint); text-align: center; }

/* ---------- выбор цвета ---------- */
.color-pick { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.color-pick input[type=color] {
  width: 34px; height: 28px; padding: 0; border: 1px solid var(--line);
  border-radius: 7px; background: transparent; cursor: pointer;
}

/* ---------- строка журнала с удалением ---------- */
.change { position: relative; }
.change .c-del {
  opacity: 0; border: 0; background: transparent; color: var(--ink-faint);
  padding: 4px; border-radius: 7px; line-height: 0; flex: 0 0 auto; align-self: center;
}
.change:hover .c-del, .change .c-del:focus-visible { opacity: 1; }
.change .c-del:hover { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
@media (pointer: coarse) { .change .c-del { opacity: .65; } }

/* ---------- настройки на узком экране ---------- */
@media (max-width: 560px) {
  .set-row {
    grid-template-columns: 1fr;
    justify-items: start;
    gap: 5px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }
  .set-row:last-child { border-bottom: 0; }
  .set-row > span:first-child { color: var(--ink-faint); font-size: 12px; }
  .set-row input[type=range] { width: 100%; max-width: 260px; }
  .set-row .inline { width: 100%; }
  .set-row select { max-width: 100%; }
  .color-pick { width: 100%; }
}

/* ---------- полоса сохранения в карточке ---------- */
.sheet-bar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; border-top: 1px solid var(--line);
  background: color-mix(in srgb, var(--warn) 12%, var(--paper-2));
}
.sheet-bar .bar-count { flex: 1 1 auto; font-size: 12px; color: var(--ink-soft); min-width: 0; }
/* сохранять нечего — полоса остаётся на месте, но не бросается в глаза */
.sheet-bar.quiet { background: var(--paper-2); }
.sheet-bar.quiet .bar-count { color: var(--ink-faint); }


/* ---------- строка «на карте» ---------- */
.map-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.map-link {
  display: inline-flex; align-items: center; gap: 5px; text-decoration: none;
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px;
  font-size: 13px; background: var(--paper);
}
.map-link:hover { background: var(--neutral); }
.map-link .ico { width: 14px; height: 14px; }
.map-coord { font-family: var(--font-data); font-size: 11px; color: var(--ink-faint); }

/* ---------- настройки: образец остаётся на виду ---------- */
.set-sticky {
  position: sticky; top: 0; z-index: 4;
  background: var(--paper-2);
  padding-top: 14px; margin: 0 0 14px;
}
.set-sticky .set-card { margin: 0; }
.set-sticky::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -14px; height: 14px;
  background: linear-gradient(var(--paper-2), transparent);
  pointer-events: none;
}
@media (min-width: 900px) {
  .modal.wide .set-grid-2 {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start;
  }
}

/* ---------- сортируемые таблицы ---------- */
table.data th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
table.data th.sortable:hover { color: var(--ink); }
table.data th .sort-mark { opacity: .45; margin-left: 4px; font-size: 10px; }
table.data th[aria-sort] { color: var(--ink); font-weight: 700; }
table.data th[aria-sort] .sort-mark { opacity: 1; color: var(--accent); }
table.data tbody tr:hover { background: var(--neutral); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--paper-2); }
.table-wrap table.data { min-width: 560px; }
.sort-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 0 0 12px; }

.sort-bar .btn[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700;
}
.chip.add { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.chip.delete { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.chip.media { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }

/* адрес: широкое поле на несколько строк */
.field-wide {
  width: 100%; margin-top: 5px; padding: 7px 9px; min-height: 46px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--paper);
  outline: none; resize: vertical; line-height: 1.45; font: inherit;
}
.field-wide:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,127,184,.16); }

/* ---------- кому видна запись ---------- */
.acl-ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.acl-ctl select { flex: 0 1 auto; width: auto; min-width: 170px; }
.acl-names {
  display: block; margin-top: 3px; font-size: 11px; color: var(--ink-faint);
  overflow-wrap: anywhere;
}
.viewer-list {
  display: flex; flex-direction: column; gap: 4px;
  max-height: 46vh; overflow: auto;
  border: 1px solid var(--line); border-radius: 10px; padding: 5px; background: var(--paper);
}
.viewer-row {
  display: flex; align-items: center; gap: 10px; padding: 7px 9px;
  border-radius: 8px; cursor: pointer;
}
.viewer-row:hover { background: var(--neutral); }
.viewer-row .li-main { display: flex; flex-direction: column; min-width: 0; }
.viewer-row .mini-ph { width: 28px; height: 28px; }
.viewer-row .mini-ph .ico { width: 16px; height: 16px; }

/* ---------- показать пароль ---------- */
.pw-wrap { position: relative; display: block; }
.gate .pw-wrap input, .row .pw-wrap input { width: 100%; padding-right: 40px; }
.pw-eye {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  border: 0; background: transparent; color: var(--ink-faint);
  padding: 5px; border-radius: 7px; line-height: 0; cursor: pointer;
}
.pw-eye .ico { width: 18px; height: 18px; }
.pw-eye:hover { color: var(--ink); background: var(--neutral); }

/* ---------- раздел «Фото и файлы» ---------- */
.files-top {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;
}
.files-path { display: flex; align-items: center; gap: 8px; min-width: 0; }
.files-here { font-family: var(--font-display); font-size: 17px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 6px; }
.files-tools { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.files-views { display: inline-flex; gap: 2px; }
.files-views .btn[aria-pressed="true"],
.files-tools .btn[aria-pressed="true"] {
  background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
}
@media (max-width: 760px) { .files-tools .lbl { display: none; } }

.files-bar {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 8px 10px; margin: 0 0 12px;
  border: 1px solid var(--line); border-radius: 10px;
  background: color-mix(in srgb, var(--accent) 8%, var(--paper-2));
  font-size: 13px;
}
.files-bar .spacer { flex: 1 1 auto; }
.files-bar .btn[disabled] { opacity: .45; pointer-events: none; }

.folder-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.folder-tile {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 12px; border: 1px solid var(--line); border-radius: 11px;
  background: var(--paper-2); color: var(--ink); font-size: 13px;
}
.folder-tile:hover { background: var(--neutral); }
.folder-tile .ico { width: 18px; height: 18px; color: var(--warn); }
.folder-tile .f-count { color: var(--ink-faint); font-family: var(--font-data); font-size: 11px; }

.photo-wall.small { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
.media-tile.is-sel { outline: 3px solid var(--accent); outline-offset: -3px; }
.media-tile .tile-pick { position: absolute; left: 6px; top: 6px; z-index: 3; }
.media-tile .tile-ico { display: grid; place-items: center; width: 100%; height: 100%; }
.media-tile.has-img .tile-ico { display: none; }
.media-tile .tile-play {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,.5); color: #fff;
  display: grid; place-items: center; pointer-events: none;
}
.media-tile .tile-play .ico { width: 16px; height: 16px; }
tr.file-row { cursor: pointer; }
tr.file-row.is-sel { background: color-mix(in srgb, var(--accent) 14%, transparent); }

/* ---------- просмотрщик ---------- */
.viewer {
  position: fixed; inset: 0; z-index: 400; background: #0d0c0b; color: #f2ece1;
  display: grid; grid-template-rows: auto 1fr auto;
  /* Ширину задаёт экран, а не содержимое. Без этого ряд кнопок сверху
     растягивал просмотрщик шире телефона, и снимок уезжал за край:
     «вписан» он был в ту, растянутую, область. */
  grid-template-columns: minmax(0, 1fr);
  width: 100vw; max-width: 100vw; overflow: hidden;
  user-select: none;
}
.vw-top {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  min-width: 0; flex-wrap: nowrap;
  padding-top: max(8px, env(safe-area-inset-top, 0px));
  background: rgba(0,0,0,.5); position: relative; z-index: 3;
}
.vw-top .spacer { flex: 1 1 auto; }
.vw-title {
  font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  max-width: 46vw; flex: 0 1 auto; min-width: 0;
}
.vw-count { color: #b5ac9d; font-size: 12px; font-family: var(--font-data); }
.vw-btn {
  border: 0; background: transparent; color: #e8e1d5; padding: 7px; border-radius: 9px;
  line-height: 0; cursor: pointer;
}
.vw-btn:hover { background: rgba(255,255,255,.14); }
.vw-btn .ico { width: 19px; height: 19px; }
.vw-btn[hidden] { display: none !important; }

.vw-stage {
  position: relative; overflow: hidden; display: grid; place-items: center;
  min-width: 0; min-height: 0;
  touch-action: none;
}
/* Снимок позиционируем сами: браузерное «вписывание» через max-width плохо
   дружит с масштабированием — картинка прыгала и по краям появлялись полоски. */
.vw-stage img {
  position: absolute; left: 50%; top: 50%;
  transform-origin: center center;
  /* ширину снимку задаёт просмотрщик — никаких внешних ограничений,
     иначе картинка то сжимается, то считается заново не в том размере */
  max-width: none; max-height: none;
  image-rendering: auto; -webkit-user-drag: none; user-select: none;
}
.vw-stage video { max-width: 100%; max-height: 100%; background: #000; }
.vw-wait { color: #b5ac9d; font-size: 14px; text-align: center; line-height: 1.6; }
.vw-doc {
  text-align: center; max-width: 440px; padding: 20px; display: grid; gap: 10px; justify-items: center;
}
.vw-doc .ico { width: 46px; height: 46px; color: #8d8577; }
.vw-doc .note { color: #b5ac9d; }
.vw-doc audio { width: 100%; }

.vw-nav {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
  width: 46px; height: 68px; border: 0; border-radius: 10px;
  background: rgba(0,0,0,.35); color: #fff; display: grid; place-items: center; cursor: pointer;
}
.vw-nav:hover { background: rgba(0,0,0,.6); }
.vw-nav.prev { left: 10px; }
.vw-nav.next { right: 10px; }
.vw-nav .ico { width: 24px; height: 24px; }

.vw-zoom {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 8px; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px));
  background: rgba(0,0,0,.5); font-size: 12px; font-family: var(--font-data);
}
.vw-info {
  position: absolute; right: 0; top: 52px; bottom: 44px; width: min(340px, 86vw); z-index: 4;
  background: rgba(20,18,16,.96); border-left: 1px solid rgba(255,255,255,.12);
  padding: 14px; overflow: auto;
}
.vw-info[hidden] { display: none !important; }
.vw-info h3 { font-size: 15px; margin-bottom: 8px; }
.vw-info table.data th { color: #9a9084; font-weight: 400; width: 44%; vertical-align: top; }
.vw-info table.data th, .vw-info table.data td {
  border-bottom: 1px solid rgba(255,255,255,.08); font-size: 12px;
}

.vw-edit {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 56px; z-index: 5;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  background: rgba(20,18,16,.96); border: 1px solid rgba(255,255,255,.14);
  border-radius: 12px; padding: 8px; max-width: 94vw;
}
.vw-edit[hidden] { display: none !important; }
.vw-edit .spacer { width: 10px; }
.vw-edit .btn { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); color: #f2ece1; }
.vw-edit .btn:hover { background: rgba(255,255,255,.18); }
.vw-edit .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }

.vw-crop {
  position: absolute; border: 2px dashed #fff; box-shadow: 0 0 0 9999px rgba(0,0,0,.45);
  cursor: move; z-index: 3;
}
.vw-crop::after {
  content: ""; position: absolute; right: -6px; bottom: -6px; width: 16px; height: 16px;
  background: #fff; border-radius: 3px; cursor: nwse-resize;
}
@media (max-width: 560px) {
  .vw-title { max-width: 26vw; }
  .vw-count { display: none; }
  .vw-btn { padding: 5px; }
  .vw-btn .ico { width: 17px; height: 17px; }
  .vw-nav { width: 38px; height: 56px; }
}

/* ---------- предложение установить программу ---------- */
.install-bar {
  position: fixed; z-index: 320; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  max-width: min(560px, calc(100vw - 24px));
  padding: 12px 14px; border-radius: 14px;
  background: var(--paper-2); border: 1px solid var(--line); box-shadow: var(--shadow);
  font-size: 13px;
}
.install-bar .ico { width: 24px; height: 24px; color: var(--accent); }
.install-bar div { flex: 1 1 200px; min-width: 0; line-height: 1.45; }

/* ---------- события в карточке человека ---------- */
.ev-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.ev-item {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px;
  background: var(--paper); cursor: pointer; position: relative;
}
.ev-item:hover { background: var(--neutral); }
.ev-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ev-when {
  flex: 0 0 auto; width: 58px; text-align: center; line-height: 1.25;
  font-family: var(--font-data); color: var(--ink-soft); font-size: 11px;
}
.ev-when b { display: block; font-size: 15px; color: var(--ink); font-family: var(--font-body); }
.ev-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 1 auto; }
.ev-type { font-weight: 700; line-height: 1.25; }
.ev-place, .ev-note { font-size: 12px; color: var(--ink-soft); overflow-wrap: anywhere; }
.ev-place { display: inline-flex; align-items: center; gap: 5px; }
.ev-place .ico { width: 13px; height: 13px; flex: 0 0 auto; color: var(--ink-faint); }
.ev-lock { color: var(--warn); line-height: 0; align-self: center; }
.ev-lock .ico { width: 14px; height: 14px; }

/* ---------- отбор по людям в галерее ---------- */
.people-bar { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }

/* ---------- карточка человека: ширина ---------- */
.sheet-grip {
  position: absolute; right: -4px; top: 0; bottom: 0; width: 10px; z-index: 5;
  cursor: ew-resize; touch-action: none;
}
.sheet-grip::after {
  content: ""; position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 46px; border-radius: 3px; background: var(--line);
}
.sheet-grip:hover::after { background: var(--accent); }
@media (max-width: 760px) { .sheet-grip { display: none; } }

/* эскизы в корзине */
.trash-thumb { background: var(--neutral) center/cover no-repeat; position: relative; }
.trash-thumb .thumb-play {
  position: absolute; inset: 0; display: grid; place-items: center;
  background: rgba(0,0,0,.35); color: #fff; border-radius: inherit;
}
.trash-thumb .thumb-play .ico { width: 14px; height: 14px; }

/* окошко человека над меткой карты */
.map-card {
  position: absolute; z-index: 8; pointer-events: none;
  display: flex; align-items: center; gap: 8px; padding: 6px 9px;
  background: var(--paper-2); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: var(--shadow); max-width: 240px;
}
.map-card .mc-ph {
  width: 38px; height: 38px; flex: 0 0 auto; border-radius: 8px;
  background: var(--neutral) center/cover no-repeat; display: grid; place-items: center;
  color: var(--ink-faint); overflow: hidden;
}
.map-card .mc-ph .ico { width: 72%; height: 72%; opacity: .5; }
.map-card .mc-txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.map-card .mc-txt b { font-size: 13px; }
.map-card .mc-txt span { font-size: 11px; color: var(--ink-faint); overflow-wrap: anywhere; }
.map-pin { cursor: pointer; }

/* ---------- ближайшие даты на главном экране ---------- */
.home-dates {
  position: absolute; z-index: 20;
  right: calc(12px + env(safe-area-inset-right, 0px)); top: 12px;
  display: flex; flex-direction: column; gap: 6px; max-width: 250px;
}
.home-dates[hidden] { display: none !important; }
.home-date {
  display: flex; align-items: center; gap: 9px; text-align: left;
  padding: 7px 10px; border: 1px solid var(--line); border-radius: 11px;
  background: color-mix(in srgb, var(--paper-2) 92%, transparent);
  box-shadow: var(--shadow); backdrop-filter: blur(3px);
}
.home-date:hover { background: var(--paper-2); }
.home-date.soon { border-color: var(--good); }
.hd-day {
  flex: 0 0 auto; width: 34px; text-align: center; line-height: 1.15;
  font-family: var(--font-data); font-size: 10px; color: var(--ink-faint);
}
.hd-day b { display: block; font-size: 15px; color: var(--ink); font-family: var(--font-body); }
.hd-txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.hd-txt b { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hd-txt span { font-size: 11px; color: var(--ink-faint); }
@media (max-width: 760px) {
  .home-dates { max-width: 190px; top: 8px; right: 8px; }
  .home-date { padding: 5px 8px; }
  .hd-txt b { font-size: 11px; }
}
table.data.cal-kinds th:nth-child(2), table.data.cal-kinds th:nth-child(3),
table.data.cal-kinds td:nth-child(2), table.data.cal-kinds td:nth-child(3) {
  text-align: center; width: 110px;
}

/* ---------- сетка календаря ---------- */
.cal-head {
  display: flex; align-items: center; gap: 8px; margin: 0 0 10px;
}
.cal-head b { font-family: var(--font-display); font-size: 17px; min-width: 170px; }
.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 18px;
}
.cal-wd {
  font-size: 11px; color: var(--ink-faint); text-align: center; padding: 2px 0;
  text-transform: uppercase; letter-spacing: .04em;
}
.cal-cell {
  min-height: 74px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--paper-2); padding: 4px 5px; display: flex; flex-direction: column; gap: 2px;
}
.cal-cell.empty { border: 0; background: transparent; }
.cal-cell.has { cursor: pointer; }
.cal-cell.has:hover { background: var(--neutral); }
.cal-cell.is-today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.cal-num { font-family: var(--font-data); font-size: 12px; color: var(--ink-soft); }
.cal-cell.is-today .cal-num { color: var(--accent); font-weight: 700; }
.cal-mark {
  font-size: 10px; line-height: 1.25; padding: 1px 4px; border-radius: 5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  background: var(--neutral); color: var(--ink-soft);
}
.cal-mark.birth { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }
.cal-mark.wedding { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.cal-mark.memory { background: color-mix(in srgb, var(--ink-soft) 16%, transparent); }
.cal-mark.event { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.cal-more { font-size: 10px; color: var(--ink-faint); }
.cal-day[data-person] { cursor: pointer; }
.cal-day[data-person]:hover { background: var(--neutral); }
@media (max-width: 700px) {
  .cal-cell { min-height: 56px; padding: 3px; }
  .cal-mark { font-size: 9px; }
  .cal-head b { min-width: 120px; font-size: 15px; }
}

/* ---------- меню «ещё» в разделе файлов ---------- */
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 160;
  min-width: 232px; width: max-content; max-width: min(92vw, 420px); padding: 6px;
  background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow); max-height: 70vh; overflow: auto;
}
.menu[hidden] { display: none !important; }
.menu button {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
  border: 0; background: transparent; color: var(--ink);
  padding: 7px 9px; border-radius: 8px; font-size: 13px;
  /* название пункта не переносим и не обрезаем — меню шире, чем длиннее текст */
  white-space: nowrap;
}
.menu button .ico { flex: 0 0 auto; }
.menu button:hover { background: var(--neutral); }
.menu button.on { background: color-mix(in srgb, var(--accent) 14%, transparent); font-weight: 700; }
.menu button.danger { color: var(--bad); }
.menu .menu-head {
  font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-faint); padding: 8px 9px 3px;
}
.menu .menu-row {
  display: flex; align-items: center; gap: 8px; padding: 4px 9px 8px; font-size: 13px;
}
.menu .menu-row input[type=range] { flex: 1 1 auto; }
.folder-group { margin-bottom: 12px; }
.folder-owner {
  font-size: 11px; letter-spacing: .05em; text-transform: uppercase;
  color: var(--ink-faint); margin: 0 0 5px;
}
.files-top .spacer { flex: 1 1 auto; }

/* фотография в списке людей */
.people-name { display: inline-flex; align-items: center; gap: 9px; }
.people-name .mini-ph { width: 30px; height: 30px; }
.people-name .mini-ph .ico { width: 70%; height: 70%; opacity: .5; }

/* ---------- разбор папки со снимками ---------- */
.fi-bar { height: 6px; border-radius: 6px; background: var(--neutral); overflow: hidden; margin: 8px 0; }
.fi-bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.fi-list { display: flex; flex-direction: column; gap: 6px; max-height: 52vh; overflow: auto; margin-top: 10px; }
.fi-row {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 9px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper);
}
.fi-thumb {
  width: 52px; height: 52px; flex: 0 0 auto; border-radius: 8px;
  background: var(--neutral) center/cover no-repeat; border: 1px solid var(--line);
}
.fi-on { flex: 0 0 auto; width: 17px; height: 17px; }

/* ---------- кто на снимке ---------- */
.fe-wrap { position: relative; display: block; max-width: 100%; margin: 0 auto 12px; }
.fe-wrap img { display: block; max-width: 100%; max-height: 46vh; border-radius: 10px; margin: 0 auto; }
.fe-box {
  position: absolute; border: 2px solid var(--warn); border-radius: 6px;
  box-shadow: 0 0 0 1px rgba(0,0,0,.35); cursor: pointer;
}
.fe-box.named { border-color: var(--good); }
.fe-box b {
  position: absolute; left: -1px; top: -18px; font-size: 11px; line-height: 16px;
  padding: 0 5px; border-radius: 5px; background: var(--warn); color: #fff;
}
.fe-box.named b { background: var(--good); }
.fe-list { display: flex; flex-direction: column; gap: 6px; max-height: 34vh; overflow: auto; }
.fe-row {
  display: flex; align-items: center; gap: 10px; padding: 6px 8px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--paper);
}
.fe-num {
  flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%;
  background: var(--neutral); color: var(--ink-soft);
  font-size: 11px; line-height: 20px; text-align: center;
}
.fe-cut { flex: 0 0 auto; width: 56px; height: 56px; border-radius: 8px; background: var(--neutral); }
.fe-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 1 auto; }
.fe-main select { max-width: 280px; }
.fi-main { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
.fi-name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fi-sub { font-size: 11px; color: var(--ink-faint); }
.fi-who { max-width: 230px; }
@media (max-width: 620px) { .fi-who { max-width: 140px; } }
</style>
</head>
<body>


<!-- ввод в программу -->
<div class="gate" id="gate"></div>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">Д</span>
      <span>
        <span class="brand-name">Семейное Древо</span>
        <span class="tree-name" id="treeName"></span>
      </span>
    </div>

    <div class="search-wrap">
      <span class="search-ico" id="qIco" aria-hidden="true"></span>
      <label class="sr" for="q">Поиск по людям и данным</label>
      <input id="q" type="search" placeholder="Имя, место, год, запись…" autocomplete="off">
      <button class="search-clear" id="qClear" type="button" title="Очистить" aria-label="Очистить"></button>
      <button class="search-mic" id="qMic" type="button" title="Найти голосом" aria-label="Найти голосом"></button>
      <div class="results" id="qResults" hidden></div>
    </div>

    <div class="topbar-right">
      <button class="icon-btn accent" id="btnAdd" type="button" title="Добавить человека">
        <span class="lbl">Добавить</span></button>
      <button class="icon-btn" id="btnSync" type="button" title="Синхронизировать" hidden></button>
      <button class="icon-btn" id="btnTrash" type="button" title="Корзина">
        <span class="trash-count" id="trashCount" hidden></span></button>
      <button class="icon-btn" id="btnCalendar" type="button" title="Календарь дат"></button>
      <button class="icon-btn" id="btnMap" type="button" title="Карта мест"></button>
      <button class="icon-btn" id="btnSettings" type="button" title="Настройки">
        <span class="lbl">Настройки</span></button>
      <span class="who" id="who"></span>
      <button class="icon-btn" id="btnLogout" type="button" title="Выйти из программы">
        <span class="lbl">Выйти</span></button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <main class="panes">
    <!-- дерево -->
    <section class="pane active" id="pane-tree">
      <div id="treeHost">
        <div id="treeBgImage" hidden></div>
        <svg id="treeLines" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="treeCanvas"></div>
      </div>
      <div class="tree-empty" id="treeEmpty" hidden></div>
      <div class="home-dates" id="homeDates" hidden></div>
      <div class="zoomdock">
        <button id="zoomIn" type="button" title="Приблизить" aria-label="Приблизить"></button>
        <button id="zoomOut" type="button" title="Отдалить" aria-label="Отдалить"></button>
        <button id="zoomFit" type="button" title="Вписать всё дерево" aria-label="Вписать всё дерево"></button>
        <button id="zoomHome" type="button" title="Вернуть исходный вид" aria-label="Вернуть исходный вид"></button>
      </div>
      <div class="viewdock" id="viewdock" role="group" aria-label="Вид дерева">
        <button type="button" data-view="vertical" aria-pressed="true" title="Вертикальное дерево"><span class="lbl">Вертикальное</span></button>
        <button type="button" data-view="horizontal" aria-pressed="false" title="Горизонтальное дерево"><span class="lbl">Горизонтальное</span></button>

<script>/* Семейное Древо — слой данных.
   Дерево и люди общие для всех пользователей; оформление — у каждого своё.
   Медиафайлы лежат в IndexedDB, приватные — в зашифрованном виде (AES-GCM). */
(function (global) {
  'use strict';

  var DB_NAME = 'drevo';
  var DB_VER = 1;
  var LS_TREE = 'drevo.tree';
  var LS_USERS = 'drevo.users';
  var LS_SESSION = 'drevo.session';
  var LS_PREFS = 'drevo.prefs.';
  var LS_DEVICE = 'drevo.device';
  var LS_SYNC = 'drevo.sync';

  /* ---------- маленькие помощники ---------- */
  function uid(prefix) {
    return (prefix || 'x') + '-' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function nowISO() { return new Date().toISOString(); }
  function bytesToB64(buf) {
    var b = new Uint8Array(buf), s = '', i;
    for (i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s);
  }
  function b64ToBytes(s) {
    var bin = atob(s), b = new Uint8Array(bin.length), i;
    for (i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    return b;
  }

  /* ---------- IndexedDB для медиа ---------- */
  var dbp = null;
  function openDB() {
    if (dbp) return dbp;
    dbp = new Promise(function (res, rej) {
      if (!global.indexedDB) { rej(new Error('IndexedDB недоступна')); return; }
      var rq = indexedDB.open(DB_NAME, DB_VER);
      rq.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs');
      };
      rq.onsuccess = function () { res(rq.result); };
      rq.onerror = function () { rej(rq.error); };
    });
    return dbp;
  }
  function blobPut(key, blob) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction('blobs', 'readwrite');
        tx.objectStore('blobs').put(blob, key);
        tx.oncomplete = function () { res(key); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function blobGet(key) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction('blobs', 'readonly');
        var rq = tx.objectStore('blobs').get(key);
        rq.onsuccess = function () { res(rq.result || null); };
        rq.onerror = function () { rej(rq.error); };
      });
    });
  }
  function blobDel(key) {
    return openDB().then(function (db) {
      return new Promise(function (res) {
        var tx = db.transaction('blobs', 'readwrite');
        tx.objectStore('blobs').delete(key);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { res(); };
      });
    });
  }

  /* ---------- шифрование приватных файлов и записей ---------- */
  var cryptoKey = null;          // CryptoKey текущего дерева
  var subtle = global.crypto && global.crypto.subtle ? global.crypto.subtle : null;

  function deriveKey(passphrase, saltB64) {
    if (!subtle) return Promise.resolve(null);
    var salt = b64ToBytes(saltB64);
    return subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: 200000, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      });
  }
  function encryptBlob(blob) {
    if (!cryptoKey) return Promise.resolve({ blob: blob, enc: false });
    return blob.arrayBuffer().then(function (buf) {
      var iv = crypto.getRandomValues(new Uint8Array(12));
      return subtle.encrypt({ name: 'AES-GCM', iv: iv }, cryptoKey, buf).then(function (ct) {
        var out = new Uint8Array(12 + ct.byteLength);
        out.set(iv, 0); out.set(new Uint8Array(ct), 12);
        return { blob: new Blob([out], { type: 'application/octet-stream' }), enc: true };
      });
    });
  }
  function decryptBlob(blob, mime) {
    if (!cryptoKey) return Promise.reject(new Error('Нет ключа расшифровки'));
    return blob.arrayBuffer().then(function (buf) {
      var all = new Uint8Array(buf);
      var iv = all.slice(0, 12), ct = all.slice(12);
      return subtle.decrypt({ name: 'AES-GCM', iv: iv }, cryptoKey, ct).then(function (pt) {
        return new Blob([pt], { type: mime || 'application/octet-stream' });
      });
    });
  }
  function encryptText(str) {
    if (!cryptoKey) return Promise.resolve(null);
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return subtle.encrypt({ name: 'AES-GCM', iv: iv }, cryptoKey, new TextEncoder().encode(str))
      .then(function (ct) { return bytesToB64(iv) + '.' + bytesToB64(ct); });
  }
  function decryptText(packed) {
    if (!cryptoKey || !packed) return Promise.resolve('');
    var parts = String(packed).split('.');
    if (parts.length !== 2) return Promise.resolve('');
    return subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(parts[0]) }, cryptoKey, b64ToBytes(parts[1]))
      .then(function (pt) { return new TextDecoder().decode(pt); })
      .catch(function () { return ''; });
  }
  /* Пароль хранится свёрткой PBKDF2 с личной солью. Раньше это был простой
     SHA-256; такие записи ещё проверяются, но при первом же удачном входе
     пересчитываются по-новому. Список пользователей едет вместе с деревом,
     поэтому свёртка должна быть дорогой для подбора. */
  var KDF_ITERS = 210000;

  function hashPassword(password, saltB64, iters) {
    saltB64 = saltB64 || bytesToB64(crypto.getRandomValues(new Uint8Array(16)));
    iters = iters || KDF_ITERS;
    if (!subtle) {
      return sha256hex(password + '::' + saltB64).then(function (h) {
        return { algo: 'sha256-plain', salt: saltB64, iters: 1, hash: h };
      });
    }
    return subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) {
        return subtle.deriveBits(
          { name: 'PBKDF2', salt: b64ToBytes(saltB64), iterations: iters, hash: 'SHA-256' },
          base, 256);
      })
      .then(function (bits) {
        return { algo: 'pbkdf2-sha256', salt: saltB64, iters: iters, hash: bytesToB64(bits) };
      });
  }

  /** одинаковы ли две строки — без подсказок по времени сравнения */
  function sameSecret(a, b) {
    a = String(a || ''); b = String(b || '');
    if (a.length !== b.length) return false;
    var diff = 0;
    for (var i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
    return diff === 0;
  }

  function verifyPassword(user, password) {
    if (!user) return Promise.resolve(false);
    if (user.kdf && user.kdf.algo === 'pbkdf2-sha256') {
      return hashPassword(password, user.kdf.salt, user.kdf.iters)
        .then(function (r) { return sameSecret(r.hash, user.kdf.hash); });
    }
    if (user.kdf && user.kdf.algo === 'sha256-plain') {
      return sha256hex(password + '::' + user.kdf.salt)
        .then(function (h) { return sameSecret(h, user.kdf.hash); });
    }
    // записи старого образца
    return sha256hex(password + '::' + user.login)
      .then(function (h) { return sameSecret(h, user.hash); });
  }

  function sha256hex(str) {
    if (!subtle) return Promise.resolve('plain:' + str);
    return subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function (b) {
      return Array.prototype.map.call(new Uint8Array(b), function (x) {
        return ('0' + x.toString(16)).slice(-2);
      }).join('');
    });
  }

  /* ---------- структура дерева ---------- */
  function emptyTree() {
    return {
      meta: {
        id: uid('tree'),
        name: 'Моё дерево',
        created: nowISO(),
        salt: bytesToB64(crypto.getRandomValues(new Uint8Array(16))),
        rootId: null,
        version: 1
      },
      persons: {},
      families: {},
      media: {},
      changes: [],
      tabs: [
        { id: 'tree', title: 'Дерево', icon: 'tree', builtin: true },
        { id: "photos", title: "Галерея", icon: "photo", builtin: true },
        { id: 'changes', title: 'Изменения', icon: 'clock', builtin: true }
      ],
      /* Учётные записи лежат в самом дереве, а не на устройстве: иначе
         логин, заведённый на компьютере, не существовал бы на телефоне.
         Пароли хранятся только как PBKDF2-свёртка с личной солью. */
      users: [],
      /* Приглашения: администратор создаёт ссылку, родственник открывает её
         и сам заводит себе имя, логин и пароль. */
      invites: [],
      /* следы удалённых записей: id -> когда удалили.
         Без них удаление, сделанное на одном устройстве, вернулось бы
         обратно при первой же синхронизации с другого. */
      tombstones: {},
      /* Корзина: удалённое не пропадает сразу, а ждёт здесь.
         Сам файл с диска не стирается до окончательного удаления. */
      trash: {}
    };
  }

  function newPerson(patch) {
    var p = {
      id: uid('I'),
      sex: 'U',
      surname: '', given: '', patronymic: '', maiden: '',
      birth: { date: '', place: '', lat: null, lng: null },
      death: { date: '', place: '', lat: null, lng: null },
      living: true,
      photo: null,          // id медиа, которое показывается в окошке
      note: '',
      fields: [],           // произвольные строки {id,label,value,type,acl}
      events: [],           // {id,type,date,place,lat,lng,note,acl}
      media: [],            // id медиа
      acl: { level: 'public', locked: false },
      updated: nowISO()
    };
    if (patch) for (var k in patch) p[k] = patch[k];
    return p;
  }

  /** настройки синхронизации; хранятся отдельно от дерева — у каждого устройства свои */
  function defaultSync() {
    return {
      mode: 'off',            // off | supabase | server | file
      auto: true,             // синхронизировать самостоятельно
      interval: 120,          // как часто, секунд
      lastAt: null,           // когда прошла последняя
      lastError: null,
      siteUrl: '',            // адрес установленной программы — основа для ссылок
      supabase: { url: '', key: '', treeId: '' },
      server: { url: '', key: '' },
      file: { handleName: '' }
    };
  }

  function newFamily(patch) {
    var f = {
      id: uid('F'), husb: null, wife: null, children: [],
      marriage: { date: '', place: '', lat: null, lng: null },
      divorced: false, updated: nowISO()
    };
    if (patch) for (var k in patch) f[k] = patch[k];
    return f;
  }

  /* ---------- Store ---------- */
  var Store = {
    tree: emptyTree(),
    session: null,
    prefs: null,
    listeners: [],

    on: function (fn) { this.listeners.push(fn); },
    emit: function (what) {
      var self = this;
      this.listeners.forEach(function (fn) { try { fn(what, self); } catch (e) { console.error(e); } });
    },

    /* --- загрузка/сохранение --- */
    load: function () {
      try {
        var raw = localStorage.getItem(LS_TREE);
        if (raw) this.tree = JSON.parse(raw);
      } catch (e) { console.warn('Дерево не прочиталось', e); }
      if (!this.tree || !this.tree.persons) this.tree = emptyTree();
      if (!this.tree.tabs) this.tree.tabs = emptyTree().tabs;
      if (!this.tree.tombstones) this.tree.tombstones = {};
      if (!this.tree.trash) this.tree.trash = {};
      // раздел переименован: у давних деревьев название лежит в данных
      (this.tree.tabs || []).forEach(function (t) {
        if (t.id === 'photos' && (t.title === 'Фото' || t.title === 'Фото и файлы')) t.title = 'Галерея';
      });
      if (!this.tree.meta.updated) this.tree.meta.updated = nowISO();
      try {
        this.deviceId = localStorage.getItem(LS_DEVICE);
        if (!this.deviceId) {
          this.deviceId = uid('dev');
          localStorage.setItem(LS_DEVICE, this.deviceId);
        }
        this.sync = JSON.parse(localStorage.getItem(LS_SYNC) || 'null') || defaultSync();
      } catch (e) { this.deviceId = uid('dev'); this.sync = defaultSync(); }
      if (!Array.isArray(this.tree.users)) this.tree.users = [];
      if (!Array.isArray(this.tree.invites)) this.tree.invites = [];
      // перенос со старых версий, где список лежал отдельно на устройстве
      try {
        var old = localStorage.getItem(LS_USERS);
        if (old && !this.tree.users.length) {
          var list = JSON.parse(old);
          if (Array.isArray(list) && list.length) {
            this.tree.users = list.map(function (u) {
              u.updated = u.updated || u.created || nowISO();
              return u;
            });
            this.save(true);
          }
        }
        if (old) localStorage.removeItem(LS_USERS);
      } catch (e) {}
      try {
        var s = localStorage.getItem(LS_SESSION);
        this.session = s ? JSON.parse(s) : null;
      } catch (e) { this.session = null; }
      return this;
    },
    save: function (silent) {
      this.tree.meta.version = (this.tree.meta.version || 1) + 1;
      this.tree.meta.updated = nowISO();
      // первая же правка руками снимает метку «это образец»
      if (!silent && this.tree.meta.demo) delete this.tree.meta.demo;
      this.dirty = true;
      try { localStorage.setItem(LS_TREE, JSON.stringify(this.tree)); }
      catch (e) { console.error('Не удалось сохранить дерево', e); }
      if (!silent) this.emit('tree');
    },
    saveUsers: function () { this.save(true); },
    saveSync: function () {
      try { localStorage.setItem(LS_SYNC, JSON.stringify(this.sync)); } catch (e) {}
      this.emit('sync');
    },
    /** пометить запись удалённой, чтобы удаление разошлось по устройствам */
    bury: function (id) {
      this.tree.tombstones = this.tree.tombstones || {};
      this.tree.tombstones[id] = nowISO();
    },
    setSession: function (s) {
      this.session = s;
      try {
        if (s) localStorage.setItem(LS_SESSION, JSON.stringify(s));
        else localStorage.removeItem(LS_SESSION);
      } catch (e) {}
    },

    /* --- настройки оформления (у каждого пользователя свои) --- */
    defaultPrefs: function () {
      return {
        theme: 'auto',
        accent: '#2f7fb8',
        layout: 'vertical',
        card: { w: 168, h: 76, radius: 10, photo: 44, nameSize: 12, dateSize: 11,
                shape: 'rounded', dateWeight: 400,
                mournWidth: 14, mournGap: 0 },
        ui: { fontSize: 14, tabSize: 14, iconSize: 17 },
        treeBg: 'auto',      // 'auto' — как у страницы, иначе цвет
        treeGrid: false,     // точечная сетка на полотне
        treeImage: false,    // своя картинка под деревом
        treeImageFit: 'cover',   // cover | tile
        treeImageFade: 35,   // насколько приглушить, %
        showPhotos: true,
        showDates: true,
        /* какие даты показывать и о каких напоминать */
        calShow: { birth: true, memory: true, wedding: true, event: true },
        calNotify: { birth: true, memory: true, wedding: true, event: false },
        homeDates: true,        // окошки ближайших дат на главном экране
        sheetWidth: 370,       // ширина карточки человека
        filesView: 'tiles',    // вид списка файлов
        tileSize: 132,         // размер эскизов в плитках
        faceFast: false,       // узнавание лиц: быстро (лёгкая модель) или точно
        nameOrder: 'given-first'   // given-first: Иван Петров · surname-first: Петров Иван

      };
    },
    loadPrefs: function (userId) {
      var d = this.defaultPrefs();
      try {
        var raw = localStorage.getItem(LS_PREFS + userId);
        if (raw) {
          var p = JSON.parse(raw);
          for (var k in p) {
            if (p[k] && typeof p[k] === 'object' && d[k]) { for (var j in p[k]) d[k][j] = p[k][j]; }
            else d[k] = p[k];
          }
        }
      } catch (e) {}
      this.prefs = d;
      return d;
    },
    savePrefs: function () {
      if (!this.session) return;
      try { localStorage.setItem(LS_PREFS + this.session.userId, JSON.stringify(this.prefs)); } catch (e) {}
      this.emit('prefs');
    },

    /* --- журнал изменений --- */
    log: function (action, summary, targetId) {
      this.tree.changes.unshift({
        id: uid('c'), ts: nowISO(),
        user: this.session ? this.session.displayName : 'система',
        userId: this.session ? this.session.userId : null,
        action: action, summary: summary, target: targetId || null
      });
      if (this.tree.changes.length > 1000) this.tree.changes.length = 1000;
    },

    /* --- персоны --- */
    persons: function () {
      var t = this.tree, out = [];
      for (var id in t.persons) out.push(t.persons[id]);
      return out;
    },
    person: function (id) { return this.tree.persons[id] || null; },
    addPerson: function (patch) {
      var p = newPerson(patch);
      this.tree.persons[p.id] = p;
      if (!this.tree.meta.rootId) this.tree.meta.rootId = p.id;
      this.log('add', 'Добавлена персона: ' + this.fullName(p), p.id);
      this.save();
      return p;
    },
    updatePerson: function (id, patch, quiet) {
      var p = this.tree.persons[id];
      if (!p) return null;
      for (var k in patch) p[k] = patch[k];
      p.updated = nowISO();
      if (!quiet) this.log('edit', 'Изменена карточка: ' + this.fullName(p), id);
      this.save();
      return p;
    },
    removePerson: function (id) {
      var p = this.tree.persons[id];
      if (!p) return;
      var name = this.fullName(p);
      var self = this;
      (p.media || []).forEach(function (mid) { self.removeMedia(mid, true); });
      delete this.tree.persons[id];
      this.bury(id);
      for (var fid in this.tree.families) {
        var f = this.tree.families[fid];
        var hit = false;
        if (f.husb === id) { f.husb = null; hit = true; }
        if (f.wife === id) { f.wife = null; hit = true; }
        if (f.children.indexOf(id) >= 0) {
          f.children = f.children.filter(function (c) { return c !== id; });
          hit = true;
        }
        if (hit) f.updated = nowISO();
        if (!f.husb && !f.wife && !f.children.length) { delete this.tree.families[fid]; this.bury(fid); }
      }
      if (this.tree.meta.rootId === id) {
        var rest = Object.keys(this.tree.persons);
        this.tree.meta.rootId = rest.length ? rest[0] : null;
      }
      this.log('delete', 'Удалена персона: ' + name, null);
      this.save();
    },
    fullName: function (p) {
      if (!p) return '';
      var parts = [p.surname, p.given, p.patronymic].filter(Boolean);
      var n = parts.join(' ').trim();
      return n || 'Без имени';
    },
    /** Имя на эскизе. Порядок имени и фамилии выбирается в настройках,
        отчество всегда идёт последним. */
    shortName: function (p) {
      if (!p) return '';
      var given = p.given || '', sur = p.surname || '', pat = p.patronymic || '';
      var order = (this.prefs && this.prefs.nameOrder) || 'given-first';
      var head = order === 'surname-first'
        ? [sur, given].filter(Boolean).join(' ')
        : [given, sur].filter(Boolean).join(' ');
      return [head, pat].filter(Boolean).join(' ').trim() || 'Без имени';
    },
    /** имя для обращения в окнах: имя и фамилия, без отчества */
    callName: function (p) {
      if (!p) return '';
