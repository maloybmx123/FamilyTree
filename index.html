      return [p.given, p.surname].filter(Boolean).join(' ') || this.fullName(p);
    },
    years: function (p) {
      if (!p) return '';
      var b = yr(p.birth && p.birth.date), d = yr(p.death && p.death.date);
      if (b && d) return b + ' – ' + d;
      if (b) return b;
      if (d) return '? – ' + d;
      return '';
    },

    /* --- семьи и связи --- */
    families: function () {
      var out = [];
      for (var id in this.tree.families) out.push(this.tree.families[id]);
      return out;
    },
    family: function (id) { return this.tree.families[id] || null; },
    addFamily: function (patch) {
      var f = newFamily(patch);
      this.tree.families[f.id] = f;
      return f;
    },
    /** семья, где человек — супруг */
    spouseFamilies: function (id) {
      return this.families().filter(function (f) { return f.husb === id || f.wife === id; });
    },
    /** семья, где человек — ребёнок */
    childFamily: function (id) {
      var all = this.families();
      for (var i = 0; i < all.length; i++) if (all[i].children.indexOf(id) >= 0) return all[i];
      return null;
    },
    parentsOf: function (id) {
      var f = this.childFamily(id);
      if (!f) return [];
      return [f.husb, f.wife].filter(Boolean).map(this.person.bind(this)).filter(Boolean);
    },
    childrenOf: function (id) {
      var self = this, out = [];
      this.spouseFamilies(id).forEach(function (f) {
        f.children.forEach(function (c) { if (out.indexOf(c) < 0) out.push(c); });
      });
      return out.map(function (c) { return self.person(c); }).filter(Boolean);
    },
    spousesOf: function (id) {
      var self = this, out = [];
      this.spouseFamilies(id).forEach(function (f) {
        var other = f.husb === id ? f.wife : f.husb;
        if (other && out.indexOf(other) < 0) out.push(other);
      });
      return out.map(function (c) { return self.person(c); }).filter(Boolean);
    },
    siblingsOf: function (id) {
      var f = this.childFamily(id);
      if (!f) return [];
      var self = this;
      return f.children.filter(function (c) { return c !== id; })
        .map(function (c) { return self.person(c); }).filter(Boolean);
    },
    linkChild: function (parentId, childId) {
      var fams = this.spouseFamilies(parentId), f;
      if (fams.length) f = fams[0];
      else {
        var p = this.person(parentId);
        f = this.addFamily(p && p.sex === 'F' ? { wife: parentId } : { husb: parentId });
      }
      if (f.children.indexOf(childId) < 0) f.children.push(childId);
      f.updated = nowISO();
      var old = this.childFamily(childId);
      if (old && old.id !== f.id) {
        old.children = old.children.filter(function (c) { return c !== childId; });
        old.updated = nowISO();
      }
      this.save();
      return f;
    },
    linkSpouse: function (aId, bId) {
      var a = this.person(aId), b = this.person(bId);
      if (!a || !b) return null;
      var fams = this.spouseFamilies(aId);
      var free = fams.filter(function (f) { return !f.husb || !f.wife; })[0];
      var f = free || this.addFamily({});
      if (a.sex === 'F') { f.wife = aId; f.husb = bId; }
      else { f.husb = aId; f.wife = bId; }
      f.updated = nowISO();
      this.save();
      return f;
    },
    linkParent: function (childId, parentId) {
      var f = this.childFamily(childId);
      var p = this.person(parentId);
      if (!f) f = this.addFamily({ children: [childId] });
      if (p && p.sex === 'F') f.wife = parentId; else f.husb = parentId;
      f.updated = nowISO();
      this.save();
      return f;
    },
    unlink: function (aId, bId) {
      var self = this;
      this.families().forEach(function (f) {
        var pair = (f.husb === aId && f.wife === bId) || (f.husb === bId && f.wife === aId);
        var hit = false;
        if (pair) { f.husb = null; f.wife = null; hit = true; }
        if ((f.husb === aId || f.wife === aId) && f.children.indexOf(bId) >= 0) {
          f.children = f.children.filter(function (c) { return c !== bId; }); hit = true;
        }
        if ((f.husb === bId || f.wife === bId) && f.children.indexOf(aId) >= 0) {
          f.children = f.children.filter(function (c) { return c !== aId; }); hit = true;
        }
        if (hit) f.updated = nowISO();
        if (!f.husb && !f.wife && !f.children.length) { delete self.tree.families[f.id]; self.bury(f.id); }
      });
      this.save();
    },

    /* --- медиа --- */
    addMedia: function (personId, file, opts) {
      var self = this;
      opts = opts || {};
      var id = uid('M');
      var acl = opts.acl || { level: 'public', locked: false };
      var isPrivate = acl.locked || acl.level === 'admin' || acl.level === 'owner';
      var step = isPrivate ? encryptBlob(file) : Promise.resolve({ blob: file, enc: false });
      return step.then(function (r) {
        return blobPut(id, r.blob).then(function () {
          var m = {
            id: id, personId: personId, kind: opts.kind || kindOf(file.type, file.name),
            name: file.name || 'файл', mime: file.type || 'application/octet-stream',
            size: file.size || 0, caption: opts.caption || '', date: opts.date || '',
            acl: acl, encrypted: r.enc, added: nowISO(),
            addedBy: self.session ? self.session.displayName : '',
            updated: nowISO(),
            uploaded: false,      // файл ещё не ушёл в общее хранилище
            origin: self.deviceId
          };
          self.tree.media[id] = m;
          var p = self.person(personId);
          if (p) {
            p.media = p.media || [];
            p.media.push(id);
            if (!p.photo && m.kind === 'photo') p.photo = id;
          }
          self.log('media', 'Добавлен файл «' + m.name + '»' +
            (p ? ' к ' + self.fullName(p) : ' в общую галерею'), personId);
          self.save();
          return m;
        });
      });
    },
    /** Заменить содержимое файла, сохранив его место в дереве и права доступа.
        Нужно для правки снимка: id остаётся прежним, поэтому не рвутся ссылки
        на главное фото и не плодятся дубликаты. */
    replaceMedia: function (id, file) {
      var self = this;
      var m = this.tree.media[id];
      if (!m) return Promise.reject(new Error('Файла нет в дереве'));
      var isPrivate = m.acl && (m.acl.locked || m.acl.level === 'admin' || m.acl.level === 'owner');
      var step = isPrivate ? encryptBlob(file) : Promise.resolve({ blob: file, enc: false });
      return step.then(function (r) {
        return blobPut(id, r.blob).then(function () {
          m.size = file.size || 0;
          m.mime = file.type || m.mime;
          m.encrypted = r.enc;
          m.updated = nowISO();
          m.uploaded = false;          // изменённый файл должен уехать заново
          self.log('media', 'Изменён файл «' + m.name + '»', m.personId);
          self.save();
          return m;
        });
      });
    },

    /** Удаление файла: по умолчанию в корзину, сам файл остаётся на диске.
        hard — окончательно, без возврата. */
    removeMedia: function (id, quiet, hard) {
      var m = this.tree.media[id];
      if (!m) return;
      var p = this.person(m.personId);
      var wasPhoto = p && p.photo === id;
      if (p) {
        p.media = (p.media || []).filter(function (x) { return x !== id; });
        if (wasPhoto) p.photo = (p.media || []).filter(function (x) {
          return (this.tree.media[x] || {}).kind === 'photo';
        }.bind(this))[0] || null;
      }
      delete this.tree.media[id];
      this.bury(id);
      if (hard) blobDel(id);
      else this.toTrash(id, { what: 'media', rec: m, personId: m.personId, wasPhoto: wasPhoto });
      if (p) p.updated = nowISO();
      if (!quiet) {
        this.log('media', (hard ? 'Удалён навсегда файл «' : 'В корзину: файл «') + m.name + '»', m.personId);
        this.save();
      }
    },

    /* --- корзина --- */
    toTrash: function (id, item) {
      this.tree.trash = this.tree.trash || {};
      item.at = nowISO();
      item.by = this.session ? this.session.displayName : 'система';
      item.id = id;
      this.tree.trash[id] = item;
    },
    trashList: function () {
      var t = this.tree.trash || {}, out = [];
      for (var id in t) out.push(t[id]);
      return out.sort(function (a, b) { return (b.at || '').localeCompare(a.at || ''); });
    },
    /** Вернуть из корзины. Отметка времени ставится новая, иначе при
        синхронизации чужое устройство снова сочтёт запись удалённой. */
    restoreTrash: function (id) {
      var t = this.tree.trash || {}, it = t[id];
      if (!it) return false;
      var stamp = nowISO();
      if (it.what === 'media') {
        var m = it.rec;
        m.updated = stamp;
        this.tree.media[id] = m;
        var p = this.person(it.personId);
        if (p) {
          p.media = p.media || [];
          if (p.media.indexOf(id) < 0) p.media.push(id);
          if (it.wasPhoto && !p.photo) p.photo = id;
          p.updated = stamp;
        }
        this.log('media', 'Файл «' + m.name + '» возвращён из корзины', it.personId);
      } else if (it.what === 'event') {
        var pe = this.person(it.personId);
        if (!pe) return false;
        pe.events = pe.events || [];
        pe.events.push(it.rec);
        pe.updated = stamp;
        this.log('edit', 'Событие возвращено из корзины: ' + this.fullName(pe), it.personId);
      } else if (it.what === 'field') {
        var p2 = this.person(it.personId);
        if (!p2) return false;
        p2.fields = p2.fields || [];
        p2.fields.push(it.rec);
        p2.updated = stamp;
        this.log('edit', 'Запись возвращена из корзины: ' + this.fullName(p2), it.personId);
      }
      delete this.tree.tombstones[id];
      delete t[id];
      this.save();
      return true;
    },
    /** Убрать из корзины окончательно: вот теперь файл стирается с диска. */
    purgeTrash: function (id) {
      var t = this.tree.trash || {}, it = t[id];
      if (!it) return false;
      if (it.what === 'media') blobDel(id);
      delete t[id];
      this.save();
      return true;
    },
    emptyTrash: function () {
      var t = this.tree.trash || {}, self = this, n = 0;
      Object.keys(t).forEach(function (id) { self.purgeTrash(id); n++; });
      if (n) this.log('delete', 'Корзина очищена: ' + n + ' ' + (n === 1 ? 'запись' : 'записей'));
      this.save();
      return n;
    },
    mediaOf: function (personId) {
      var t = this.tree, out = [];
      (this.person(personId) || { media: [] }).media.forEach(function (id) {
        if (t.media[id]) out.push(t.media[id]);
      });
      return out;
    },
    allMedia: function () {
      var out = [];
      for (var id in this.tree.media) out.push(this.tree.media[id]);
      return out.sort(function (a, b) { return (b.added || '').localeCompare(a.added || ''); });
    },
    /** достать файл с диска, а если его тут нет — из общего хранилища */
    rawBlob: function (id) {
      var self = this;
      return blobGet(id).then(function (b) {
        if (b) return b;
        if (typeof self.fetchRemote === 'function') return self.fetchRemote(id);
        return null;
      });
    },
    /** URL для показа; расшифровывает приватные файлы на лету */
    mediaURL: function (id) {
      var m = this.tree.media[id];
      if (!m) return Promise.resolve(null);
      if (!this.canSee(m.acl)) return Promise.resolve(null);
      return this.rawBlob(id).then(function (b) {
        if (!b) return null;
        if (!m.encrypted) return URL.createObjectURL(b);
        return decryptBlob(b, m.mime).then(function (d) { return URL.createObjectURL(d); })
          .catch(function () { return null; });
      });
    },
    /** Ссылка на файл, который лежит в корзине: его записи в описи уже нет,
        поэтому обычный mediaURL о нём ничего не знает. */
    trashURL: function (id) {
      var it = (this.tree.trash || {})[id];
      if (!it || it.what !== 'media') return Promise.resolve(null);
      var m = it.rec;
      return blobGet(id).then(function (b) {
        if (!b) return null;
        if (!m.encrypted) return URL.createObjectURL(b);
        return decryptBlob(b, m.mime).then(function (d) { return URL.createObjectURL(d); })
          .catch(function () { return null; });
      });
    },
    mediaBlob: function (id) {
      var m = this.tree.media[id];
      if (!m) return Promise.resolve(null);
      return this.rawBlob(id).then(function (b) {
        if (!b) return null;
        if (!m.encrypted) return b;
        return decryptBlob(b, m.mime).catch(function () { return null; });
      });
    },

    /* --- права доступа --- */
    isAdmin: function () { return !!(this.session && this.session.role === 'admin'); },
    canSee: function (acl) {
      if (!acl) return true;
      if (this.isAdmin()) return true;
      if (acl.level === 'admin' || acl.level === 'owner') return false;
      // «только выбранным»: поимённый список тех, кому запись открыта
      if (acl.level === 'chosen') {
        return !!(this.session && (acl.allow || []).indexOf(this.session.userId) >= 0);
      }
      if (acl.level === 'group') return !!this.session;
      return true;
    },
    canEdit: function (acl) {
      if (this.isAdmin()) return true;
      if (!acl) return !!this.session;
      if (acl.locked) return false;
      if (acl.level === 'admin' || acl.level === 'owner') return false;
      if (acl.level === 'chosen') return this.canSee(acl);
      return !!this.session;
    },
    /** имена тех, кому открыта запись */
    allowedNames: function (acl) {
      var self = this;
      return ((acl && acl.allow) || []).map(function (id) {
        var u = self.users.filter(function (x) { return x.id === id; })[0];
        return u ? u.displayName : null;
      }).filter(Boolean);
    },

    /* --- пользователи --- */
    createUser: function (login, password, role, displayName) {
      var self = this;
      return hashPassword(password).then(function (kdf) {
        var u = {
          id: uid('U'), login: String(login).toLowerCase().trim(), kdf: kdf,
          role: role || 'user', displayName: displayName || login,
          created: nowISO(), updated: nowISO(),
          invite: uid('inv'), active: true, webauthn: null
        };
        self.users.push(u);
        self.log('user', 'Создан пользователь ' + u.displayName + ' (' +
          (u.role === 'admin' ? 'администратор' : 'пользователь') + ')');
        self.save();
        return u;
      });
    },
    /* --- приглашения --- */
    invites: function () {
      if (!Array.isArray(this.tree.invites)) this.tree.invites = [];
      return this.tree.invites;
    },
    createInvite: function (role, note) {
      var inv = {
        id: uid('inv'), token: uid('t') + uid('k'),
        role: role === 'admin' ? 'admin' : 'user',
        note: note || '', created: nowISO(), updated: nowISO(),
        by: this.session ? this.session.displayName : '',
        usedBy: null, usedAt: null
      };
      this.invites().push(inv);
      this.log('user', 'Создано приглашение' + (inv.role === 'admin' ? ' (администратор)' : ''));
      this.save();
      return inv;
    },
    findInvite: function (token) {
      return this.invites().filter(function (i) { return i.token === token && !i.usedBy; })[0] || null;
    },
    dropInvite: function (id) {
      this.tree.invites = this.invites().filter(function (i) { return i.id !== id; });
      this.save();
    },
    /** родственник перешёл по ссылке и заводит себе запись */
    acceptInvite: function (token, login, password, displayName) {
      var self = this;
      var inv = this.findInvite(token);
      if (!inv) return Promise.resolve({ error: 'Ссылка уже использована или больше не действует' });
      login = String(login || '').toLowerCase().trim();
      if (this.users.some(function (u) { return u.login === login; })) {
        return Promise.resolve({ error: 'Такой логин уже занят — придумайте другой' });
      }
      return this.createUser(login, password, inv.role, displayName).then(function (u) {
        inv.usedBy = u.id;
        inv.usedAt = nowISO();
        inv.updated = nowISO();
        self.save();
        return { user: u };
      });
    },

    /** задать новый пароль (приглашение, смена) */
    setPassword: function (user, password) {
      var self = this;
      return hashPassword(password).then(function (kdf) {
        user.kdf = kdf;
        delete user.hash;
        user.updated = nowISO();
        self.save();
        return user;
      });
    },
    auth: function (login, password) {
      var self = this;
      var u = this.users.filter(function (x) {
        return x.login === String(login).toLowerCase().trim();
      })[0];
      if (!u || !u.active) return Promise.resolve(null);
      return verifyPassword(u, password).then(function (ok) {
        if (!ok) return null;
        // запись старого образца — пересчитать по-новому
        if (!u.kdf || u.kdf.algo !== 'pbkdf2-sha256') {
          return self.setPassword(u, password).then(function () { return u; });
        }
        return u;
      });
    },
    unlockCrypto: function (passphrase) {
      var self = this;
      return deriveKey(passphrase + '::' + this.tree.meta.id, this.tree.meta.salt).then(function (k) {
        cryptoKey = k;
        return !!k;
      });
    },
    hasCryptoKey: function () { return !!cryptoKey; },

    /* --- вкладки --- */
    addTab: function (title, kind) {
      var t = {
        id: uid('tab'), title: title, kind: kind || 'notes',
        builtin: false, content: '', updated: nowISO()
      };
      this.tree.tabs.push(t);
      this.log('tab', 'Добавлена вкладка «' + title + '»');
      this.save();
      return t;
    },
    removeTab: function (id) {
      var had = this.tree.tabs.some(function (t) { return t.id === id && !t.builtin; });
      this.tree.tabs = this.tree.tabs.filter(function (t) { return t.id !== id || t.builtin; });
      if (had) this.bury(id);
      this.save();
    },

    /* --- поиск --- */
    search: function (q) {
      q = String(q || '').trim().toLowerCase();
      if (!q) return [];
      var self = this, res = [];
      this.persons().forEach(function (p) {
        var hay = [p.surname, p.given, p.patronymic, p.maiden, p.note,
          p.birth && p.birth.place, p.death && p.death.place,
          p.birth && p.birth.date, p.death && p.death.date].filter(Boolean).join(' ').toLowerCase();
        (p.fields || []).forEach(function (f) {
          if (self.canSee(f.acl)) hay += ' ' + (f.label || '') + ' ' + (f.value || '');
        });
        (p.events || []).forEach(function (e) {
          hay += ' ' + (e.type || '') + ' ' + (e.place || '') + ' ' + (e.note || '');
        });
        var i = hay.indexOf(q);
        if (i >= 0) res.push({ person: p, score: (self.fullName(p).toLowerCase().indexOf(q) === 0 ? 0 : 1) + i / 1000 });
      });
      this.allMedia().forEach(function (m) {
        if (!self.canSee(m.acl)) return;
        var hay = ((m.name || '') + ' ' + (m.caption || '')).toLowerCase();
        if (hay.indexOf(q) >= 0) res.push({ media: m, person: self.person(m.personId), score: 2 });
      });
      return res.sort(function (a, b) { return a.score - b.score; }).slice(0, 60);
    },

    /* --- календарь --- */
    upcoming: function (days) {
      days = days || 60;
      var self = this, today = new Date(), out = [];
      function push(p, kind, dateStr) {
        var d = parseDate(dateStr);
        if (!d || !d.m || !d.d) return;
        var year = today.getFullYear();
        var next = new Date(year, d.m - 1, d.d);
        if (next < new Date(year, today.getMonth(), today.getDate())) next = new Date(year + 1, d.m - 1, d.d);
        var diff = Math.round((next - new Date(year, today.getMonth(), today.getDate())) / 86400000);
        if (diff <= days) out.push({ person: p, kind: kind, date: next, in: diff, age: d.y ? next.getFullYear() - d.y : null });
      }
      this.persons().forEach(function (p) {
        if (p.living !== false && !(p.death && p.death.date)) push(p, 'birth', p.birth && p.birth.date);
        else push(p, 'memory', p.death && p.death.date);
        (p.events || []).forEach(function (e) {
          if (!self.canSee(e.acl) || !e.date) return;
          // свадьбу выделяем отдельно: годовщину помнят так же, как день рождения
          var t = (e.type || '').toLowerCase();
          var kind = /свадьб|брак|венчан|женит|замуж/.test(t) ? 'wedding' : 'event';
          var r = out.length;
          push(p, kind, e.date);
          if (out.length > r) out[out.length - 1].title = e.type || '';
        });
      });
      var allow = (this.prefs && this.prefs.calShow) || null;
      if (allow) out = out.filter(function (e) { return allow[e.kind] !== false; });
      return out.sort(function (a, b) { return a.in - b.in; });
    },

    /* --- точки для карты --- */
    places: function () {
      var self = this, out = [];
      function add(p, kind, obj) {
        if (!obj || obj.lat == null || obj.lng == null) return;
        out.push({ person: p, kind: kind, lat: +obj.lat, lng: +obj.lng, place: obj.place || '', date: obj.date || '' });
      }
      this.persons().forEach(function (p) {
        add(p, 'birth', p.birth);
        add(p, 'death', p.death);
        (p.events || []).forEach(function (e) { if (self.canSee(e.acl)) add(p, e.type || 'event', e); });
      });
      return out;
    }
  };

  function kindOf(mime, name) {
    mime = mime || ''; name = (name || '').toLowerCase();
    if (mime.indexOf('image/') === 0) return 'photo';
    if (mime.indexOf('audio/') === 0) return 'audio';
    if (mime.indexOf('video/') === 0) return 'video';
    if (/\.(jpg|jpeg|png|gif|webp|heic)$/.test(name)) return 'photo';
    if (/\.(mp3|m4a|ogg|wav|opus)$/.test(name)) return 'audio';
    if (/\.(mp4|mov|webm|avi)$/.test(name)) return 'video';
    return 'doc';
  }

  function yr(s) {
    if (!s) return '';
    var m = String(s).match(/(\d{4})/);
    return m ? m[1] : '';
  }
  function parseDate(s) {
    if (!s) return null;
    s = String(s).trim();
    var m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return { y: +m[1], m: +m[2], d: +m[3] };
    m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/);
    if (m) return { y: +m[3], m: +m[2], d: +m[1] };
    m = s.match(/^(\d{4})$/);
    if (m) return { y: +m[1], m: 0, d: 0 };
    var d = new Date(s);
    if (!isNaN(d)) return { y: d.getFullYear(), m: d.getMonth() + 1, d: d.getDate() };
    return null;
  }
  function formatDate(s) {
    var d = parseDate(s);
    if (!d) return s || '';
    if (!d.m || !d.d) return String(d.y);
    var mon = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
    return d.d + ' ' + mon[d.m - 1] + ' ' + d.y;
  }

  // список пользователей — это всегда tree.users, какое бы дерево ни подставили
  Object.defineProperty(Store, 'users', {
    get: function () {
      if (!Array.isArray(this.tree.users)) this.tree.users = [];
      if (!Array.isArray(this.tree.invites)) this.tree.invites = [];
      return this.tree.users;
    },
    set: function (v) { this.tree.users = Array.isArray(v) ? v : []; }
  });

  Store.util = {
    uid: uid, clone: clone, nowISO: nowISO, parseDate: parseDate, formatDate: formatDate,
    yr: yr, kindOf: kindOf, sha256hex: sha256hex,
    hashPassword: hashPassword, verifyPassword: verifyPassword,
    encryptText: encryptText, decryptText: decryptText,
    encryptBlob: encryptBlob, decryptBlob: decryptBlob,
    blobPut: blobPut, blobGet: blobGet, blobDel: blobDel,
    newPerson: newPerson, newFamily: newFamily, emptyTree: emptyTree,
    defaultSync: defaultSync,
    bytesToB64: bytesToB64, b64ToBytes: b64ToBytes
  };

  global.Store = Store;
})(window);
</script>
<script>/* Семейное Древо — раскладка и отрисовка дерева.
   Три вида: вертикальный, горизонтальный, «бабочка».
   Расчёт идёт в абстрактных координатах (поколение × позиция),
   затем переводится в пиксели по выбранному виду. */
(function (global) {
  'use strict';

  var S = global.Store;

  function Tree(opts) {
    this.host = opts.host;                 // контейнер со скроллом
    this.canvas = opts.canvas;             // слой с карточками
    this.svg = opts.svg;                   // слой с линиями
    this.focusId = null;
    this.mode = 'vertical';
    this.up = 3;                           // поколений вверх
    this.down = 3;                         // поколений вниз
    this.scale = 1;
    this.tx = 0; this.ty = 0;
    this.onSelect = opts.onSelect || function () {};
    this.onAdd = opts.onAdd || function () {};
    this.onRender = opts.onRender || function () {};
    this.openId = null;        // чья карточка сейчас раскрыта сбоку
    this.cards = [];
    this.links = [];
    this._bindPanZoom();
  }

  Tree.prototype.setFocus = function (id) { this.focusId = id; this.render(true); };
  /** пометить эскиз, карточка которого открыта; null — снять пометку */
  Tree.prototype.setOpen = function (id) {
    if (this.openId === id) return;
    this.openId = id;
    var self = this;
    this.canvas.querySelectorAll('.node').forEach(function (n) {
      n.classList.toggle('is-open', n.dataset.id === self.openId);
    });
  };
  Tree.prototype.setMode = function (m) { this.mode = m; this.render(true); };

  /* ---------------- раскладка ---------------- */
  /* ---------------- «бабочка» ----------------
     Фокус в середине. Предки по отцу расходятся веером влево, по матери —
     вправо, потомки уходят вниз. Это другая раскладка, а не вертикальная
     с перекосом, поэтому считается отдельно. */
  Tree.prototype.computeButterfly = function () {
    var prefs = S.prefs;
    var CW = prefs.card.w, CH = prefs.card.h;
    var COL = CW + 64;          // шаг между поколениями предков вбок
    var VGAP = 18;              // просвет между соседями по вертикали
    var LEVEL = CH + 78;        // шаг между поколениями потомков
    var MATE = CW + 14;         // шаг внутри пары супругов
    var KGAP = 26;              // просвет между ветками потомков

    var focus = S.person(this.focusId);
    if (!focus) return { cards: [], links: [], w: 0, h: 0, map: {}, butterfly: true };

    var cards = [], links = [], placed = {}, used = {};
    function put(person, x, y, role) {
      var c = { id: person.id, person: person, x: x, y: y, w: CW, h: CH, role: role || 'blood' };
      cards.push(c); placed[person.id] = c;
      return c;
    }

    used[focus.id] = 1;

    /* ---- крылья предков: дерево «человек → его родители» ---- */
    function ancNode(pid, gen, depth) {
      used[pid] = 1;
      var n = { id: pid, gen: gen, w: CH, kids: [] };   // разводим по вертикали
      if (depth > 0) {
        S.parentsOf(pid).forEach(function (p) {
          if (used[p.id]) return;
          n.kids.push(ancNode(p.id, gen + 1, depth - 1));
        });
      }
      return n;
    }

    var parents = S.parentsOf(focus.id);
    var father = parents.filter(function (p) { return p.sex !== 'F'; })[0] || parents[0] || null;
    var mother = parents.filter(function (p) { return p !== father; })[0] || null;

    /* ---- супруги фокуса справа ---- */
    var mates = S.spousesOf(focus.id).filter(function (x) { return !used[x.id]; });
    mates.forEach(function (m) { used[m.id] = 1; });
    var mateRight = CW / 2;                       // правый край занятого фокусом и супругами
    if (mates.length) mateRight = CW / 2 + 14 + (mates.length - 1) * MATE + CW;
    // правое крыло отодвигаем, чтобы не наехать на супругов
    var shiftR = Math.max(0, mateRight + 28 - (COL - CW / 2));

    function wing(rootPerson, side) {
      if (!rootPerson) return null;
      var tree = ancNode(rootPerson.id, 1, self_up - 1);
      tidy(tree, VGAP);
      var list = [];
      placeTree(tree, 0, list);
      list.forEach(function (n) {
        var p = S.person(n.id);
        if (!p) return;
        var x = side * n.gen * COL - CW / 2 + (side > 0 ? shiftR : 0);
        put(p, x, n.x - CH / 2);
      });
      // связи: родитель → ребёнок, и связка между двумя родителями
      (function links2(n) {
        if (n.kids.length === 2) links.push({ kind: 'couple', a: n.kids[0].id, b: n.kids[1].id });
        n.kids.forEach(function (k) {
          links.push({ kind: 'wing', from: k.id, to: n.id });
          links2(k);
        });
      })(tree);
      return tree;
    }
    var self_up = this.up;
    var wl = wing(father, -1), wr = wing(mother, 1);

    /* ---- фокус и супруги ---- */
    put(focus, -CW / 2, -CH / 2, 'focus');
    mates.forEach(function (m, i) {
      put(m, CW / 2 + 14 + i * MATE, -CH / 2, 'spouse');
      links.push({ kind: 'couple', a: i === 0 ? focus.id : mates[i - 1].id, b: m.id });
    });
    // от фокуса к его родителям
    if (father) links.push({ kind: 'wing', from: father.id, to: focus.id });
    if (mother) links.push({ kind: 'wing', from: mother.id, to: focus.id });

    /* ---- потомки вниз, тем же алгоритмом ---- */
    function unitOf(pid) {
      var u = [pid];
      S.spousesOf(pid).forEach(function (sp) {
        if (u.indexOf(sp.id) < 0 && !used[sp.id]) u.push(sp.id);
      });
      return u;
    }
    function kidNode(ids, gen, depth) {
      ids.forEach(function (id) { used[id] = 1; });
      var n = { ids: ids, gen: gen, bloodId: ids[0], w: (ids.length - 1) * MATE + CW, kids: [] };
      if (depth > 0) {
        var seen = {};
        ids.forEach(function (pid) {
          S.childrenOf(pid).forEach(function (ch) {
            if (seen[ch.id] || used[ch.id]) return;
            seen[ch.id] = 1;
            n.kids.push(kidNode(unitOf(ch.id), gen + 1, depth - 1));
          });
        });
      }
      return n;
    }
    var rootIds = [focus.id].concat(mates.map(function (m) { return m.id; }));
    var kidsRoot = { ids: rootIds, gen: 0, w: (rootIds.length - 1) * MATE + CW, kids: [] };
    var seenK = {}, this_down = this.down;
    rootIds.forEach(function (pid) {
      S.childrenOf(pid).forEach(function (ch) {
        if (seenK[ch.id] || used[ch.id]) return;
        seenK[ch.id] = 1;
        kidsRoot.kids.push(kidNode(unitOf(ch.id), 1, this_down - 1));
      });
    });

    if (kidsRoot.kids.length) {
      tidy(kidsRoot, KGAP);
      var klist = [];
      placeTree(kidsRoot, (mates.length ? (mateRight - CW / 2) / 2 : 0), klist);

      /* Потомки опускаются ниже всего, что висит над ними в тех же столбцах:
         иначе длинное крыло предков спускается прямо на детей. */
      var top = CH / 2 + 46;
      klist.forEach(function (n) {
        if (n === kidsRoot) return;
        var l = n.x - n.w / 2, r = n.x + n.w / 2;
        cards.forEach(function (c) {
          if (c.x + c.w <= l || c.x >= r) return;         // столбцы не пересекаются
          top = Math.max(top, c.y + c.h + 40);
        });
      });
      klist.forEach(function (n) {
        if (n === kidsRoot) return;
        var left = n.x - n.w / 2;
        n.ids.forEach(function (pid, i) {
          var p = S.person(pid);
          if (p && !placed[pid]) put(p, left + i * MATE, top + (n.gen - 1) * LEVEL);
        });
        for (var i2 = 1; i2 < n.ids.length; i2++) {
          links.push({ kind: 'couple', a: n.ids[i2 - 1], b: n.ids[i2] });
        }
      });
      (function kidLinks(n) {
        n.kids.forEach(function (k) {
          var par = n.ids.filter(function (pid) {
            return S.childrenOf(pid).some(function (c) { return c.id === k.bloodId; });
          });
          links.push({ kind: 'parent', from: par.length ? par : n.ids, to: k.bloodId });
          kidLinks(k);
        });
      })(kidsRoot);
    }

    /* ---- в пиксели ---- */
    var PAD = 60;
    var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    cards.forEach(function (c) {
      minX = Math.min(minX, c.x); maxX = Math.max(maxX, c.x + c.w);
      minY = Math.min(minY, c.y); maxY = Math.max(maxY, c.y + c.h);
    });
    cards.forEach(function (c) {
      c.x = Math.round(c.x - minX + PAD);
      c.y = Math.round(c.y - minY + PAD);
    });
    return {
      cards: cards, links: links, map: placed,
      w: (maxX - minX) + PAD * 2, h: (maxY - minY) + PAD * 2,
      butterfly: true
    };
  };

  /* ---------------- укладка по контурам ----------------
     Приём Райнгольда–Тилфорда в варианте Уокера, тот же, что под деревьями
     в MyHeritage и Gramps. Соседние ветки разводятся не по приблизительной
     ширине, а по фактическому контуру поддерева на каждом уровне, поэтому
     наложение невозможно по построению, а не потому что зазор угадан.
     node: { w, kids: [] } → после укладки у каждого узла есть rel —
     смещение его центра относительно центра родителя. */
  function tidy(node, gap) {
    var kids = node.kids || [];
    kids.forEach(function (k) { tidy(k, gap); });
    if (!kids.length) {
      node.cl = [-node.w / 2];
      node.cr = [node.w / 2];
      return;
    }
    var cl = null, cr = null;          // контуры уже уложенных соседей
    kids.forEach(function (k, i) {
      if (i === 0) k.off = 0;
      else {
        var need = 0, L = Math.min(cr.length, k.cl.length);
        for (var d = 0; d < L; d++) need = Math.max(need, cr[d] - k.cl[d] + gap);
        k.off = need;
      }
      var a = k.cl.map(function (v) { return v + k.off; });
      var b = k.cr.map(function (v) { return v + k.off; });
      if (!cl) { cl = a; cr = b; }
      else {
        for (var d2 = 0; d2 < a.length; d2++) {
          if (d2 < cl.length) { cl[d2] = Math.min(cl[d2], a[d2]); cr[d2] = Math.max(cr[d2], b[d2]); }
          else { cl.push(a[d2]); cr.push(b[d2]); }
        }
      }
    });
    var mid = (kids[0].off + kids[kids.length - 1].off) / 2;
    kids.forEach(function (k) { k.rel = k.off - mid; });
    node.cl = [-node.w / 2];
    node.cr = [node.w / 2];
    for (var d3 = 0; d3 < cl.length; d3++) {
      node.cl.push(cl[d3] - mid);
      node.cr.push(cr[d3] - mid);
    }
  }
  function placeTree(node, x, out) {
    node.x = x;
    out.push(node);
    (node.kids || []).forEach(function (k) { placeTree(k, x + k.rel, out); });
  }

  Tree.prototype.compute = function () {
    if (this.mode === 'butterfly') return this.computeButterfly();
    var self = this, prefs = S.prefs;
    var CW = prefs.card.w, CH = prefs.card.h;
    var mode = this.mode;

    // шаг вдоль оси «братья-сёстры» и шаг между поколениями
    var SLOT, LEVEL;
    if (mode === 'horizontal') { SLOT = CH + 22; LEVEL = CW + 110; }
    else { SLOT = CW + 26; LEVEL = CH + 78; }
    var MATE = (mode === 'horizontal') ? CH + 10 : CW + 12;  // шаг внутри пары супругов
    // Протяжённость самой карточки вдоль оси «братья-сёстры». SLOT шире неё
    // на зазор; если ставить карточки по SLOT, центр пары уезжает от центра
    // детей на половину зазора — и линия вниз получается с изломом.
    var CARD = (mode === 'horizontal') ? CH : CW;

    var GAP = SLOT - CARD;              // просвет между соседними эскизами

    var cards = [], links = [];
    var focus = S.person(this.focusId);
    if (!focus) return { cards: [], links: [], w: 0, h: 0, map: {} };

    var placed = {};           // personId -> card
    var used = {};             // кто уже попал в какой-нибудь узел

    /* Узел укладки — «юнит»: пара супругов или одиночка, то есть люди,
       которые всегда стоят рядом и двигаются вместе. */
    function makeUnit(ids, gen) {
      ids.forEach(function (id) { used[id] = 1; });
      // при втором и третьем браке в юните больше двух человек —
      // ширина обязана расти с каждым, иначе соседи наезжают
      return { ids: ids, gen: gen, w: (ids.length - 1) * MATE + CARD, kids: [] };
    }
    function unitOf(pid) {
      var u = [pid];
      S.spousesOf(pid).forEach(function (sp) {
        if (u.indexOf(sp.id) < 0 && !used[sp.id]) u.push(sp.id);
      });
      return u;
    }

    /* вниз: дети юнита становятся его ветками */
    function buildDown(node, depth) {
      if (depth <= 0) return node;
      var seen = {}, kids = [];
      node.ids.forEach(function (pid) {
        S.childrenOf(pid).forEach(function (ch) {
          if (!seen[ch.id] && !used[ch.id]) { seen[ch.id] = 1; kids.push(ch.id); }
        });
      });
      kids.forEach(function (kid) {
        if (used[kid]) return;
        var kn = makeUnit(unitOf(kid), node.gen + 1);
        kn.bloodId = kid;
        node.kids.push(kn);
        buildDown(kn, depth - 1);
      });
      return node;
    }

    /* вверх: родительская пара каждого члена юнита становится веткой */
    function buildUp(node, depth) {
      if (depth <= 0) return node;
      node.ids.forEach(function (pid) {
        var par = S.parentsOf(pid).filter(function (p) { return !used[p.id]; });
        if (!par.length) return;
        var pn = makeUnit(par.map(function (p) { return p.id; }), node.gen - 1);
        pn.childOf = pid;
        node.kids.push(pn);
        buildUp(pn, depth - 1);
      });
      return node;
    }

    /* опора — родительская пара фокуса: тогда рядом видны братья и сёстры */
    var pivotFam = S.childFamily(focus.id);
    var onParents = !!(pivotFam && (pivotFam.husb || pivotFam.wife));
    var rootIds = onParents
      ? [pivotFam.husb, pivotFam.wife].filter(Boolean)
      : unitOf(focus.id);
    var root = makeUnit(rootIds, onParents ? -1 : 0);
    root.bloodId = rootIds[0];
    buildDown(root, this.down + (onParents ? 1 : 0));

    /* Предки висят на том же корне. Два дерева с общим корнем укладываются
       порознь, но корень у обоих в нуле — поэтому они стыкуются без зазора
       и без наложения: уровни у них разные. */
    var upRoot = { ids: root.ids, gen: root.gen, w: root.w, kids: [] };
    buildUp(upRoot, this.up);

    tidy(root, GAP);
    tidy(upRoot, GAP);
    var downNodes = [], upNodes = [];
    placeTree(root, 0, downNodes);
    placeTree(upRoot, 0, upNodes);

    function emit(nodes, skip) {
      nodes.forEach(function (n) {
        if (n === skip) return;
        var left = n.x - n.w / 2;
        n.ids.forEach(function (pid, i) {
          if (placed[pid]) return;
          var p = S.person(pid);
          if (!p) return;
          var c = { id: pid, person: p, gen: n.gen, pos: left + i * MATE,
            role: i === 0 ? 'blood' : 'spouse' };
          cards.push(c); placed[pid] = c;
        });
      });
    }
    emit(downNodes, null);
    emit(upNodes, upRoot);

    // связка рисуется между каждыми соседями в юните: при втором браке
    // супруги стоят цепочкой, и одной линии на всех не хватает
    function coupleLinks(n) {
      for (var i = 1; i < n.ids.length; i++) {
        links.push({ kind: 'couple', a: n.ids[i - 1], b: n.ids[i] });
      }
    }
    downNodes.forEach(function (n) {
      coupleLinks(n);
      n.kids.forEach(function (k) {
        // линия к ребёнку идёт от той пары, в которой он родился
        var par = n.ids.filter(function (pid) {
          return S.childrenOf(pid).some(function (c) { return c.id === k.bloodId; });
        });
        links.push({ kind: 'parent', from: par.length ? par : n.ids, to: k.bloodId });
      });
    });
    upNodes.forEach(function (n) {
      if (n === upRoot) return;
      coupleLinks(n);
      links.push({ kind: 'parent', from: n.ids, to: n.childOf });
    });

    /* перевод в пиксели */
    var minPos = Infinity, maxPos = -Infinity, minGen = Infinity, maxGen = -Infinity;
    cards.forEach(function (c) {
      minPos = Math.min(minPos, c.pos); maxPos = Math.max(maxPos, c.pos);
      minGen = Math.min(minGen, c.gen); maxGen = Math.max(maxGen, c.gen);
    });
    var PAD = 60;
    cards.forEach(function (c) {
      var p = Math.round(c.pos - minPos), g = c.gen - minGen;
      if (mode === 'horizontal') { c.x = PAD + g * LEVEL; c.y = PAD + p; }
      else { c.x = PAD + p; c.y = PAD + g * LEVEL; }
      c.w = CW; c.h = CH;
    });

    var w = PAD * 2 + (mode === 'horizontal' ? (maxGen - minGen) * LEVEL + CW : (maxPos - minPos) + CW);
    var h = PAD * 2 + (mode === 'horizontal' ? (maxPos - minPos) + CH : (maxGen - minGen) * LEVEL + CH);

    return { cards: cards, links: links, w: w, h: h, map: placed };
  };

  /* Пути связей строятся в одном месте: и для экрана, и для выгрузки в файл.
     Раньше у выгрузки была своя, более простая отрисовка — оттого линии
     в сохранённом дереве не доходили до эскизов и не скруглялись. */
  function buildLinkPaths(res, mode) {
    var paths = [], map = res.map;
    var horiz = mode === 'horizontal';   // «бабочка» ведёт потомков вниз, как вертикальная
    var OVER = 1;                      // заход под рамку, чтобы не было волоска зазора
    // Координаты округляем до целого: на дробных линия размазывается между
    // двумя столбцами точек и на глаз выглядит кривой.
    function q(v) { return Math.round(v); }

    /* Ломаная со скруглёнными поворотами. Углы срезаются дугой, радиус
       уменьшается сам, если колено короткое, — иначе дуга съела бы весь отрезок. */
    var BEND = 10;
    function poly(pts) {
      var p = pts.map(function (o) { return { x: q(o.x), y: q(o.y) }; });
      if (p.length < 2) return '';
      var d = 'M' + p[0].x + ',' + p[0].y;
      for (var i = 1; i < p.length - 1; i++) {
        var a = p[i - 1], c = p[i], b = p[i + 1];
        var la = Math.abs(c.x - a.x) + Math.abs(c.y - a.y);
        var lb = Math.abs(b.x - c.x) + Math.abs(b.y - c.y);
        var r = Math.min(BEND, la / 2, lb / 2);
        if (r < 1) { d += ' L' + c.x + ',' + c.y; continue; }
        var ax = c.x + (a.x - c.x) / la * r, ay = c.y + (a.y - c.y) / la * r;
        var bx = c.x + (b.x - c.x) / lb * r, by = c.y + (b.y - c.y) / lb * r;
        d += ' L' + Math.round(ax) + ',' + Math.round(ay) +
             ' Q' + c.x + ',' + c.y + ' ' + Math.round(bx) + ',' + Math.round(by);
      }
      var z = p[p.length - 1];
      return d + ' L' + z.x + ',' + z.y;
    }

    function coupleLine(a, b) {
      return horiz
        ? { x1: a.x + a.w / 2, y1: a.y + a.h, x2: b.x + b.w / 2, y2: b.y }
        : { x1: a.x + a.w, y1: a.y + a.h / 2, x2: b.x, y2: b.y + b.h / 2 };
    }

    res.links.forEach(function (L) {
      if (L.kind === 'couple') {
        var a = map[L.a], b = map[L.b];
        if (!a || !b || typeof a !== 'object' || typeof b !== 'object') return;
        var ln = coupleLine(a, b);
        paths.push({
          d: 'M' + q(ln.x1 - OVER * (horiz ? 0 : 1)) + ',' + q(ln.y1 - OVER * (horiz ? 1 : 0)) +
            ' L' + q(ln.x2 + OVER * (horiz ? 0 : 1)) + ',' + q(ln.y2 + OVER * (horiz ? 1 : 0)),
          cls: 'lnk-couple'
        });
        return;
      }
      if (L.kind === 'wing') {
        // крыло «бабочки»: родитель сбоку, ребёнок ближе к середине
        var par = map[L.from], ch = map[L.to];
        if (!par || !ch || typeof par !== 'object' || typeof ch !== 'object') return;
        var toLeft = par.x < ch.x;
        var sx = toLeft ? par.x + par.w - OVER : par.x + OVER;
        var ex = toLeft ? ch.x + OVER : ch.x + ch.w - OVER;
        var mx2 = (sx + ex) / 2;
        var py = par.y + par.h / 2, cy = ch.y + ch.h / 2;
        paths.push({
          d: poly([{ x: sx, y: py }, { x: mx2, y: py }, { x: mx2, y: cy }, { x: ex, y: cy }]),
          cls: 'lnk-parent'
        });
        return;
      }
      if (L.kind !== 'parent') return;

      var kid = map[L.to];
      if (!kid || typeof kid !== 'object') return;
      var ps = L.from.map(function (id) { return map[id]; })
        .filter(function (c) { return c && typeof c === 'object'; });
      if (!ps.length) return;

      // точка выхода: середина связки супругов либо край одиночного эскиза
      var ox, oy;
      if (ps.length === 2) {
        var ln2 = coupleLine(ps[0], ps[1]);
        ox = (ln2.x1 + ln2.x2) / 2;
        oy = (ln2.y1 + ln2.y2) / 2;
      } else if (horiz) {
        ox = ps[0].x + ps[0].w - OVER; oy = ps[0].y + ps[0].h / 2;
      } else {
        ox = ps[0].x + ps[0].w / 2; oy = ps[0].y + ps[0].h - OVER;
      }

      if (horiz) {
        var tx = kid.x + OVER, ty = kid.y + kid.h / 2;
        var mx = Math.max(ox + 12, (ox + tx) / 2);
        paths.push({
          d: poly([{ x: ox, y: oy }, { x: mx, y: oy }, { x: mx, y: ty }, { x: tx, y: ty }]),
          cls: 'lnk-parent'
        });
      } else {
        var tx2 = kid.x + kid.w / 2, ty2 = kid.y + OVER;
        var my = Math.max(oy + 12, (oy + ty2) / 2);
        paths.push({
          d: poly([{ x: ox, y: oy }, { x: ox, y: my }, { x: tx2, y: my }, { x: tx2, y: ty2 }]),
          cls: 'lnk-parent'
        });
      }
    });
    return paths;
  }

  /* ---------------- отрисовка ---------------- */
  Tree.prototype.render = function (recenter) {
    var self = this;
    this.host.classList.toggle('grid', !!(S.prefs && S.prefs.treeGrid));
    if (!S.persons().length) {
      this.canvas.innerHTML = '';
      this.svg.innerHTML = '';
      this.cards = []; this.links = [];
      this.onRender(this);
      return;
    }
    if (!this.focusId || !S.person(this.focusId)) {
      this.focusId = S.tree.meta.rootId && S.person(S.tree.meta.rootId)
        ? S.tree.meta.rootId : Object.keys(S.tree.persons)[0];
    }
    var res = this.compute();
    this.cards = res.cards; this.links = res.links;
    var prefs = S.prefs;

    this.canvas.style.width = res.w + 'px';
    this.canvas.style.height = res.h + 'px';
    this.svg.setAttribute('width', res.w);
    this.svg.setAttribute('height', res.h);
    this.svg.setAttribute('viewBox', '0 0 ' + res.w + ' ' + res.h);

    /* Линии. Главное правило: каждый конец упирается в край эскиза, а не
       повисает в воздухе. Линия от пары детей выходит из середины связки
       супругов — то есть с отрезка, который уже нарисован между ними. */
    var paths = buildLinkPaths(res, this.mode);
    this.svg.innerHTML = paths.map(function (p) {
      return '<path d="' + p.d + '" class="' + p.cls + '"/>';
    }).join('');

    // карточки
    var frag = document.createDocumentFragment();
    res.cards.forEach(function (c) { frag.appendChild(self.cardEl(c)); });
    this.canvas.innerHTML = '';
    this.canvas.appendChild(frag);

    this.applyTransform();
    if (recenter) this.centerOn(this.focusId);
    this.onRender(this);
  };

  /** человека нет в живых: есть дата смерти или снята отметка «жив» */
  function isGone(p) {
    return !!(p && ((p.death && p.death.date) || p.living === false));
  }

  Tree.prototype.cardEl = function (c) {
    var self = this, p = c.person, prefs = S.prefs;
    var el = document.createElement('div');
    var radius = prefs.card.shape === 'circle' ? Math.round(c.h / 2) : prefs.card.radius;
    el.className = 'node sex-' + (p.sex || 'U').toLowerCase() +
      (p.id === this.openId ? ' is-open' : '') +
      (isGone(p) ? ' is-gone' : '');
    el.style.left = c.x + 'px';
    el.style.top = c.y + 'px';
    el.style.width = c.w + 'px';
    el.style.height = c.h + 'px';
    el.style.borderRadius = radius + 'px';
    el.dataset.id = p.id;

    var gone = isGone(p);
    var hasPhoto = prefs.showPhotos && prefs.card.photo > 0;
    var html = '';
    if (hasPhoto) {
      var silhouette = p.sex === 'M' ? 'personM' : p.sex === 'F' ? 'personF' : 'person';
      html += '<div class="node-ph" style="width:' + prefs.card.photo + 'px;height:' + prefs.card.photo +
        'px;border-radius:' + (prefs.card.shape === 'circle' ? '50%' : Math.max(2, prefs.card.radius - 4) + 'px') +
        '">' + global.Icon(silhouette) +
        (gone ? '<span class="mourn-corner" aria-hidden="true"></span>' : '') + '</div>';
    }
    html += '<div class="node-txt"><div class="node-name" style="font-size:' + prefs.card.nameSize + 'px">' +
      esc(S.shortName(p)) + '</div>';
    if (prefs.showDates) {
      html += '<div class="node-years" style="font-size:' + prefs.card.dateSize +
        'px;font-weight:' + (prefs.card.dateWeight || 400) + '">' + esc(S.years(p)) + '</div>';
    }
    html += '</div>';
    // без фотокарточки лента ложится на угол самого эскиза
    if (gone && !hasPhoto) html += '<span class="node-mourn" aria-hidden="true"></span>';
    if (p.acl && (p.acl.locked || p.acl.level !== 'public')) {
      html += '<span class="node-lock" title="Ограниченный доступ">' + global.Icon('lock') + '</span>';
    }
    el.innerHTML = html;

    // кнопка «добавить родственника»
    var plus = document.createElement('button');
    plus.className = 'node-plus';
    plus.type = 'button';
    plus.innerHTML = global.Icon('plus');
    plus.title = 'Добавить родственника к ' + S.callName(p);
    plus.setAttribute('aria-label', plus.title);
    plus.addEventListener('click', function (e) { e.stopPropagation(); self.onAdd(p.id, plus); });
    el.appendChild(plus);

    el.addEventListener('click', function () { self.onSelect(p.id); });
    el.addEventListener('dblclick', function () { self.setFocus(p.id); });

    if (prefs.showPhotos && p.photo) {
      S.mediaURL(p.photo).then(function (url) {
        var ph = el.querySelector('.node-ph');
        if (url && ph) {
          ph.style.backgroundImage = 'url(' + url + ')';
          ph.classList.add('has-img');
          ph.innerHTML = gone ? '<span class="mourn-corner"></span>' : '';
        }
      });
    }
    return el;
  };

  /* ---------------- масштаб и перетаскивание ---------------- */
  Tree.prototype.applyTransform = function () {
    var t = 'translate(' + this.tx + 'px,' + this.ty + 'px) scale(' + this.scale + ')';
    this.canvas.style.transform = t;
    this.svg.style.transform = t;
  };
  Tree.prototype.zoom = function (factor, cx, cy) {
    var rect = this.host.getBoundingClientRect();
    cx = cx == null ? rect.width / 2 : cx;
    cy = cy == null ? rect.height / 2 : cy;
    var ns = Math.min(2.5, Math.max(0.2, this.scale * factor));
    var k = ns / this.scale;
    this.tx = cx - k * (cx - this.tx);
    this.ty = cy - k * (cy - this.ty);
    this.scale = ns;
    this.applyTransform();
  };
  /* keepReadable: если всё дерево пришлось бы ужать до нечитаемого размера,
     показываем ближний круг выбранного человека — родителей, супругов, детей */
  Tree.prototype.fit = function (keepReadable) {
    var rect = this.host.getBoundingClientRect();
    var w = parseFloat(this.canvas.style.width) || 1, h = parseFloat(this.canvas.style.height) || 1;
    var s = Math.min(rect.width / w, rect.height / h, 1) * 0.96;
    if (keepReadable && s < 0.45) { this.fitCircle(); return; }
    this.scale = Math.max(0.2, s);
    this.tx = (rect.width - w * this.scale) / 2;
    this.ty = (rect.height - h * this.scale) / 2;
    this.applyTransform();
  };

  /** вписать ближний круг выбранного человека */
  Tree.prototype.fitCircle = function () {
    var S2 = global.Store, id = this.focusId;
    var want = {};
    want[id] = 1;
    [S2.parentsOf(id), S2.spousesOf(id), S2.childrenOf(id), S2.siblingsOf(id)].forEach(function (arr) {
      arr.forEach(function (p) { want[p.id] = 1; });
    });
    var box = null;
    this.cards.forEach(function (c) {
      if (!want[c.id]) return;
      if (!box) box = { x1: c.x, y1: c.y, x2: c.x + c.w, y2: c.y + c.h };
      else {
        box.x1 = Math.min(box.x1, c.x); box.y1 = Math.min(box.y1, c.y);
        box.x2 = Math.max(box.x2, c.x + c.w); box.y2 = Math.max(box.y2, c.y + c.h);
      }
    });
    if (!box) { this.centerOn(id); return; }
    var rect = this.host.getBoundingClientRect();
    var bw = (box.x2 - box.x1) + 48, bh = (box.y2 - box.y1) + 48;
    this.scale = Math.max(0.42, Math.min(1, Math.min(rect.width / bw, rect.height / bh)));
    this.tx = rect.width / 2 - ((box.x1 + box.x2) / 2) * this.scale;
    this.ty = rect.height / 2 - ((box.y1 + box.y2) / 2) * this.scale;
    this.applyTransform();
  };

  /** Подвести к человеку, не трогая раскладку.
      Раньше календарь, карта и поиск звали setFocus — и дерево
      перестраивалось от этого человека, будто нажали «в центр дерева».
      Человек шёл посмотреть день рождения, а возвращался к другому дереву.
      Теперь, если он уже нарисован, мы просто подвозим к нему полотно. */
  Tree.prototype.reveal = function (id) {
    var есть = this.cards.some(function (c) { return c.id === id; });
    if (!есть) { this.setFocus(id); return; }
    this.centerOn(id);
  };

  Tree.prototype.centerOn = function (id) {
    var c = this.cards.filter(function (x) { return x.id === id; })[0] || this.cards[0];
    if (!c) return;
    var rect = this.host.getBoundingClientRect();
    this.tx = rect.width / 2 - (c.x + c.w / 2) * this.scale;
    this.ty = rect.height / 2 - (c.y + c.h / 2) * this.scale;
    this.applyTransform();
  };
  Tree.prototype._bindPanZoom = function () {
    var self = this, drag = null, pinch = null;
    this.host.addEventListener('pointerdown', function (e) {
      if (e.target.closest('.node')) return;
      drag = { x: e.clientX, y: e.clientY, tx: self.tx, ty: self.ty, id: e.pointerId };
      self.host.setPointerCapture(e.pointerId);
      self.host.classList.add('grabbing');
    });
    this.host.addEventListener('pointermove', function (e) {
      if (pinch) { drag = null; return; }          // идёт щипок — не тащим
      if (!drag || drag.id !== e.pointerId) return;
      self.tx = drag.tx + (e.clientX - drag.x);
      self.ty = drag.ty + (e.clientY - drag.y);
      self.applyTransform();
    });
    function end() { drag = null; self.host.classList.remove('grabbing'); }
    this.host.addEventListener('pointerup', end);
    this.host.addEventListener('pointercancel', end);
    this.host.addEventListener('wheel', function (e) {
      e.preventDefault();
      var r = self.host.getBoundingClientRect();
      self.zoom(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });

    /* Щипок на сенсорном экране.
       Здесь была причина, по которой дерево на телефоне уезжало вбок:
       первый палец уже запустил перетаскивание, и пока второй масштабировал,
       pointermove продолжал тащить холст — два движения складывались.
       Поэтому при появлении второго пальца перетаскивание отменяется,
       а после щипка не возобновляется, пока палец не поднимут. */
    this.host.addEventListener('touchstart', function (e) {
      if (e.touches.length === 2) {
        drag = null;
        self.host.classList.remove('grabbing');
        var r0 = self.host.getBoundingClientRect();
        pinch = {
          d: dist(e.touches), s: self.scale,
          cx: (e.touches[0].clientX + e.touches[1].clientX) / 2 - r0.left,
          cy: (e.touches[0].clientY + e.touches[1].clientY) / 2 - r0.top,
          tx: self.tx, ty: self.ty
        };
      }
    }, { passive: true });
    this.host.addEventListener('touchmove', function (e) {
      if (pinch && e.touches.length === 2) {
        e.preventDefault();
        drag = null;
        var d = dist(e.touches);
        // считаем от состояния на начало щипка, а не от предыдущего кадра:
        // так не копится ошибка округления и картинка не ползёт
        var ns = Math.min(2.5, Math.max(0.2, pinch.s * (d / pinch.d)));
        var k = ns / pinch.s;
        self.scale = ns;
        self.tx = pinch.cx - k * (pinch.cx - pinch.tx);
        self.ty = pinch.cy - k * (pinch.cy - pinch.ty);
        self.applyTransform();
      }
    }, { passive: false });
    this.host.addEventListener('touchend', function (e) {
      if (e.touches.length < 2) { pinch = null; drag = null; }
    });
    function dist(t) {
      var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
      return Math.sqrt(dx * dx + dy * dy) || 1;
    }
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  Tree.esc = esc;
  Tree.linkPaths = buildLinkPaths;
  global.TreeView = Tree;
})(window);
</script>
<script>/* Семейное Древо — импорт, экспорт и резервные копии.
   GEDCOM 5.5.1 (UTF-8), простой текст, SVG, PDF (через печать), ZIP с фотографиями. */
(function (global) {
  'use strict';
  var S = global.Store;
  var U = S.util;

  var MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

  /* ---------------- GEDCOM: выгрузка ---------------- */
  function gedDate(s) {
    var d = U.parseDate(s);
    if (!d) return s || '';
    if (!d.m || !d.d) return String(d.y);
    return d.d + ' ' + MON[d.m - 1] + ' ' + d.y;
  }
  function exportGEDCOM() {
    var t = S.tree, L = [];
    L.push('0 HEAD');
    L.push('1 SOUR SEMDREVO');
    L.push('2 NAME Семейное Древо');
    L.push('2 VERS 1.0');
    L.push('1 DATE ' + gedDate(new Date().toISOString().slice(0, 10)));
    L.push('1 CHAR UTF-8');
    L.push('1 GEDC');
    L.push('2 VERS 5.5.1');
    L.push('2 FORM LINEAGE-LINKED');
    L.push('1 FILE ' + (t.meta.name || 'tree') + '.ged');

    var pid = {}, fid = {}, n = 1;
    S.persons().forEach(function (p) { pid[p.id] = '@I' + (n++) + '@'; });
    n = 1;
    S.families().forEach(function (f) { fid[f.id] = '@F' + (n++) + '@'; });

    S.persons().forEach(function (p) {
      L.push('0 ' + pid[p.id] + ' INDI');
      var given = [p.given, p.patronymic].filter(Boolean).join(' ');
      L.push('1 NAME ' + given + ' /' + (p.surname || '') + '/');
      if (given) L.push('2 GIVN ' + given);
      if (p.surname) L.push('2 SURN ' + p.surname);
      if (p.maiden) { L.push('1 NAME /' + p.maiden + '/'); L.push('2 TYPE maiden'); }
      L.push('1 SEX ' + (p.sex === 'M' || p.sex === 'F' ? p.sex : 'U'));
      if (p.birth && (p.birth.date || p.birth.place)) {
        L.push('1 BIRT');
        if (p.birth.date) L.push('2 DATE ' + gedDate(p.birth.date));
        if (p.birth.place) L.push('2 PLAC ' + p.birth.place);
        if (p.birth.lat != null && p.birth.lng != null) {
          L.push('2 MAP'); L.push('3 LATI ' + mapCoord(p.birth.lat, 'N', 'S')); L.push('3 LONG ' + mapCoord(p.birth.lng, 'E', 'W'));
        }
      }
      if (p.death && (p.death.date || p.death.place)) {
        L.push('1 DEAT');
        if (p.death.date) L.push('2 DATE ' + gedDate(p.death.date));
        if (p.death.place) L.push('2 PLAC ' + p.death.place);
      }
      (p.events || []).forEach(function (e) {
        if (!S.canSee(e.acl)) return;
        L.push('1 EVEN' + (e.note ? ' ' + oneLine(e.note) : ''));
        L.push('2 TYPE ' + (e.type || 'событие'));
        if (e.date) L.push('2 DATE ' + gedDate(e.date));
        if (e.place) L.push('2 PLAC ' + e.place);
      });
      (p.fields || []).forEach(function (f) {
        if (!S.canSee(f.acl)) return;
        if (f.type === 'phone') L.push('1 PHON ' + oneLine(f.value));
        else if (f.type === 'email') L.push('1 EMAIL ' + oneLine(f.value));
        else if (f.type === 'addr') L.push('1 ADDR ' + oneLine(f.value));
        else { L.push('1 FACT ' + oneLine(f.value)); L.push('2 TYPE ' + oneLine(f.label || 'сведения')); }
      });
      if (p.note) pushNote(L, 1, p.note);
      var cf = S.childFamily(p.id);
      if (cf) L.push('1 FAMC ' + fid[cf.id]);
      S.spouseFamilies(p.id).forEach(function (f) { L.push('1 FAMS ' + fid[f.id]); });
      (p.media || []).forEach(function (mid) {
        var m = S.tree.media[mid];
        if (!m || !S.canSee(m.acl)) return;
        L.push('1 OBJE');
        L.push('2 FILE media/' + mid + '_' + safeName(m.name));
        L.push('2 FORM ' + (m.mime || '').split('/').pop());
        if (m.caption) L.push('2 TITL ' + oneLine(m.caption));
      });
      L.push('1 CHAN');
      L.push('2 DATE ' + gedDate((p.updated || '').slice(0, 10)));
    });

    S.families().forEach(function (f) {
      L.push('0 ' + fid[f.id] + ' FAM');
      if (f.husb && pid[f.husb]) L.push('1 HUSB ' + pid[f.husb]);
      if (f.wife && pid[f.wife]) L.push('1 WIFE ' + pid[f.wife]);
      f.children.forEach(function (c) { if (pid[c]) L.push('1 CHIL ' + pid[c]); });
      if (f.marriage && (f.marriage.date || f.marriage.place)) {
        L.push('1 MARR');
        if (f.marriage.date) L.push('2 DATE ' + gedDate(f.marriage.date));
        if (f.marriage.place) L.push('2 PLAC ' + f.marriage.place);
      }
      if (f.divorced) L.push('1 DIV Y');
    });

    L.push('0 TRLR');
    return L.join('\r\n') + '\r\n';
  }
  function mapCoord(v, pos, neg) { return (v >= 0 ? pos : neg) + Math.abs(v).toFixed(6); }
  function oneLine(s) { return String(s || '').replace(/\s*\n\s*/g, ' ').trim(); }
  function safeName(s) { return String(s || 'file').replace(/[^\wа-яА-ЯёЁ.\-]+/g, '_'); }
  function pushNote(L, lvl, text) {
    var lines = String(text).split(/\r?\n/);
    L.push(lvl + ' NOTE ' + lines[0]);
    for (var i = 1; i < lines.length; i++) L.push((lvl + 1) + ' CONT ' + lines[i]);
  }

  /* ---------------- GEDCOM: загрузка ---------------- */
  function parseGedDate(s) {
    if (!s) return '';
    s = s.replace(/^(ABT|EST|CAL|BEF|AFT|FROM|TO)\s+/i, '').trim();
    var m = s.match(/^(\d{1,2})\s+([A-Z]{3})\s+(\d{4})$/i);
    if (m) {
      var mi = MON.indexOf(m[2].toUpperCase());
      if (mi >= 0) return m[3] + '-' + pad(mi + 1) + '-' + pad(+m[1]);
    }
    m = s.match(/^([A-Z]{3})\s+(\d{4})$/i);
    if (m) { var k = MON.indexOf(m[1].toUpperCase()); if (k >= 0) return m[2] + '-' + pad(k + 1); }
    m = s.match(/(\d{4})/);
    return m ? m[1] : s;
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function importGEDCOM(text) {
    var lines = String(text).replace(/﻿/g, '').split(/\r?\n/);
    var recs = [], cur = null, stack = [];
    lines.forEach(function (raw) {
      var m = raw.match(/^\s*(\d+)\s+(@[^@]+@\s+)?(\w+)\s?(.*)$/);
      if (!m) return;
      var lvl = +m[1], xref = (m[2] || '').trim(), tag = m[3], val = m[4] || '';
      var node = { lvl: lvl, xref: xref, tag: tag, val: val, kids: [] };
      if (lvl === 0) { cur = node; recs.push(node); stack = [node]; return; }
      if (!stack.length) return;
      stack.length = Math.min(stack.length, lvl);
      var parent = stack[lvl - 1];
      if (!parent) return;
      if (tag === 'CONT') { parent.val += '\n' + val; return; }
      if (tag === 'CONC') { parent.val += val; return; }
      parent.kids.push(node);
      stack[lvl] = node;
    });

    var tree = U.emptyTree();
    tree.meta.name = 'Импортированное дерево';
    var byXref = {}, famXref = {};
    function kid(node, tag) { return node.kids.filter(function (k) { return k.tag === tag; })[0]; }
    function kids(node, tag) { return node.kids.filter(function (k) { return k.tag === tag; }); }

    recs.forEach(function (r) {
      if (r.tag === 'INDI') {
        var p = U.newPerson();
        var nameNode = kid(r, 'NAME');
        if (nameNode) {
          var nm = nameNode.val || '';
          var sur = (nm.match(/\/([^\/]*)\//) || [])[1] || '';
          var giv = nm.replace(/\/[^\/]*\//, '').trim();
          var gn = kid(nameNode, 'GIVN'), sn = kid(nameNode, 'SURN');
          p.surname = (sn && sn.val) || sur;
          var parts = ((gn && gn.val) || giv).split(/\s+/).filter(Boolean);
          p.given = parts[0] || '';
          p.patronymic = parts.slice(1).join(' ');
        }
        var sx = kid(r, 'SEX');
        p.sex = sx && /^[MF]/.test(sx.val) ? sx.val[0] : 'U';
        var b = kid(r, 'BIRT');
        if (b) {
          p.birth.date = parseGedDate((kid(b, 'DATE') || {}).val);
          p.birth.place = ((kid(b, 'PLAC') || {}).val || '').trim();
        }
        var d = kid(r, 'DEAT');
        if (d) {
          p.death.date = parseGedDate((kid(d, 'DATE') || {}).val);
          p.death.place = ((kid(d, 'PLAC') || {}).val || '').trim();
          p.living = false;
        }
        var note = kid(r, 'NOTE');
        if (note) p.note = note.val;
        kids(r, 'PHON').forEach(function (x) {
          p.fields.push({ id: U.uid('f'), label: 'Телефон', value: x.val, type: 'phone', acl: { level: 'group', locked: false } });
        });
        kids(r, 'EMAIL').forEach(function (x) {
          p.fields.push({ id: U.uid('f'), label: 'Почта', value: x.val, type: 'email', acl: { level: 'group', locked: false } });
        });
        kids(r, 'EVEN').forEach(function (x) {
          p.events.push({
            id: U.uid('e'), type: ((kid(x, 'TYPE') || {}).val) || 'Событие',
            date: parseGedDate((kid(x, 'DATE') || {}).val), place: ((kid(x, 'PLAC') || {}).val || ''),
            note: x.val || '', lat: null, lng: null, acl: { level: 'public', locked: false }
          });
        });
        tree.persons[p.id] = p;
        byXref[r.xref] = p.id;
      }
    });
    recs.forEach(function (r) {
      if (r.tag === 'FAM') {
        var f = U.newFamily();
        var h = kid(r, 'HUSB'), w = kid(r, 'WIFE');
        if (h) f.husb = byXref[(h.val || '').trim()] || null;
        if (w) f.wife = byXref[(w.val || '').trim()] || null;
        kids(r, 'CHIL').forEach(function (c) {
          var id = byXref[(c.val || '').trim()];
          if (id) f.children.push(id);
        });
        var mr = kid(r, 'MARR');
        if (mr) {
          f.marriage.date = parseGedDate((kid(mr, 'DATE') || {}).val);
          f.marriage.place = ((kid(mr, 'PLAC') || {}).val || '');
        }
        if (kid(r, 'DIV')) f.divorced = true;
        tree.families[f.id] = f;
        famXref[r.xref] = f.id;
      }
    });
    var ids = Object.keys(tree.persons);
    tree.meta.rootId = ids[0] || null;
    return tree;
  }

  /* ---------------- импорт обычного текста ----------------
     Поддержаны строки вида:
       Фамилия Имя Отчество | м | 1935-05-12 | 1977 | с. Матур
       + ребёнок: Фамилия Имя Отчество
       = супруг: Фамилия Имя Отчество
     и простой отступ табуляцией — отступ означает «ребёнок предыдущего». */
  function importText(text) {
    var tree = U.emptyTree();
    tree.meta.name = 'Дерево из текста';
    var stack = [];
    String(text).split(/\r?\n/).forEach(function (raw) {
      if (!raw.trim()) return;
      var indent = (raw.match(/^[\t ]*/)[0] || '').replace(/ {2}/g, '\t').length;
      var line = raw.trim();
      var rel = null;
      if (/^[+•-]\s*(ребен|ребён|сын|доч)/i.test(line)) { rel = 'child'; line = line.replace(/^[+•-]\s*\S+\s*:?\s*/i, ''); }
      else if (/^=\s*(супруг|жена|муж)/i.test(line)) { rel = 'spouse'; line = line.replace(/^=\s*\S+\s*:?\s*/i, ''); }
      else if (/^[+•-]\s+/.test(line)) { rel = 'child'; line = line.replace(/^[+•-]\s+/, ''); }

      var cells = line.split(/\s*[|;]\s*/);
      var nameParts = (cells[0] || '').split(/\s+/).filter(Boolean);
      var p = U.newPerson({
        surname: nameParts[0] || '', given: nameParts[1] || '', patronymic: nameParts.slice(2).join(' ')
      });
      for (var i = 1; i < cells.length; i++) {
        var c = cells[i].trim();
        if (/^(м|муж|m|male)$/i.test(c)) p.sex = 'M';
        else if (/^(ж|жен|f|female)$/i.test(c)) p.sex = 'F';
        else if (/^\d{4}([-.\/]\d{1,2}([-.\/]\d{1,2})?)?$/.test(c)) {
          if (!p.birth.date) p.birth.date = norm(c); else { p.death.date = norm(c); p.living = false; }
        } else if (!p.birth.place) p.birth.place = c;
        else p.note = (p.note ? p.note + '\n' : '') + c;
      }
      tree.persons[p.id] = p;
      if (rel === 'spouse' && stack.length) {
        var f = U.newFamily();
        var prev = stack[stack.length - 1].id;
        var pr = tree.persons[prev];
        if (pr.sex === 'F') { f.wife = prev; f.husb = p.id; } else { f.husb = prev; f.wife = p.id; }
        tree.families[f.id] = f;
        return;
      }
      while (stack.length && stack[stack.length - 1].indent >= indent) stack.pop();
      var parent = stack[stack.length - 1];
      if (parent || rel === 'child') {
        var par = parent ? parent.id : null;
        if (par) {
          var fam = null;
          for (var fid in tree.families) {
            var ff = tree.families[fid];
            if (ff.husb === par || ff.wife === par) { fam = ff; break; }
          }
          if (!fam) {
            fam = U.newFamily();
            if (tree.persons[par].sex === 'F') fam.wife = par; else fam.husb = par;
            tree.families[fam.id] = fam;
          }
          fam.children.push(p.id);
        }
      }
      stack.push({ id: p.id, indent: indent });
    });
    tree.meta.rootId = Object.keys(tree.persons)[0] || null;
    return tree;
    function norm(c) { return c.replace(/[.\/]/g, '-'); }
  }

  /* ---------------- SVG дерева ---------------- */
  /* Выгрузка дерева в файл. Рисуем ровно то же, что видно на экране:
     те же пути связей (их строит tree.js), фотографии, траурная лента на углу
     фотокарточки. Фотографии читаются с диска, поэтому результат — обещание. */
  function exportSVG(treeView, opts) {
    opts = opts || {};
    var plain = !!opts.plain;          // без заливки: экономит краску при печати
    var res = treeView.compute();
    var W = res.w, H = res.h;
    var prefs = S.prefs, card = prefs.card;
    var mournW = card.mournWidth == null ? 14 : card.mournWidth;
    var mournGap = card.mournGap || 0;
    var r = card.shape === 'circle' ? Math.round(card.h / 2) : card.radius;
    var photoSize = (prefs.showPhotos && card.photo > 0) ? card.photo : 0;
    var pr = card.shape === 'circle' ? photoSize / 2 : Math.max(2, card.radius - 4);

    var css = [
      '.n{stroke-width:1}',
      plain ? '.m,.f,.u{fill:#fff;stroke:#555}' : '.m{fill:url(#gm);stroke:#6aa9d4}',
      plain ? '' : '.f{fill:url(#gf);stroke:#dd8fae}',
      plain ? '' : '.u{fill:url(#gu);stroke:#bdb3a1}',
      '.ph{fill:#fffdf8;stroke:rgba(0,0,0,.09);stroke-width:1}',
      '.mourn{fill:#15120f}',
      '.nm{font:700 ' + card.nameSize + 'px "PT Sans",Arial,sans-serif;fill:#241f1a}',
      '.yr{font:' + (card.dateWeight >= 600 ? '700 ' : '') + card.dateSize +
        'px "PT Mono",monospace;fill:#5d554a}',
      '.lnk-parent,.lnk-couple{fill:none;stroke:#a69c89;stroke-width:2;' +
        'stroke-linecap:round;stroke-linejoin:round}',
      '.ttl{font:700 20px "PT Serif",Georgia,serif;fill:#241f1a}',
      '.sub{font:12px "PT Sans",Arial,sans-serif;fill:#8d8577}'
    ].join('');

    // сначала собираем фотографии: без них эскизы выходили пустыми
    var shots = {};
    var need = photoSize ? res.cards.filter(function (c) { return c.person.photo; }) : [];
    var step = need.reduce(function (chain, c) {
      return chain.then(function () {
        return S.mediaBlob(c.person.photo).then(function (b) {
          if (!b) return null;
          return new Promise(function (done) {
            var fr = new FileReader();
            fr.onload = function () { shots[c.id] = fr.result; done(); };
            fr.onerror = function () { done(); };
            fr.readAsDataURL(b);
          });
        }).catch(function () {});
      });
    }, Promise.resolve());

    return step.then(function () {
      var out = ['<?xml version="1.0" encoding="UTF-8"?>',
        '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" ' +
        'width="' + W + '" height="' + (H + 60) + '" viewBox="0 0 ' + W + ' ' + (H + 60) + '">',
        '<style>' + css + '</style>',
        '<defs>' +
        grad('gm', '#eaf5fd', '#cde6f7', '#afd4ee') +
        grad('gf', '#fdeef4', '#fbd3e2', '#f4b8ce') +
        grad('gu', '#f7f4ec', '#ece7dc', '#ded7c8') +
        '</defs>',
        (plain ? '<rect width="100%" height="100%" fill="#ffffff"/>'
               : '<rect width="100%" height="100%" fill="#f6f1e6"/>'),
        '<text class="ttl" x="30" y="34">' + xml(S.tree.meta.name) + '</text>',
        '<text class="sub" x="30" y="52">Выгружено ' + new Date().toLocaleDateString('ru-RU') +
        ' · персон: ' + S.persons().length + '</text>',
        '<g transform="translate(0,60)">'];

      // связи — те же пути, что и на экране
      global.TreeView.linkPaths(res, treeView.mode).forEach(function (pth) {
        out.push('<path class="' + pth.cls + '" d="' + pth.d + '"/>');
      });

      res.cards.forEach(function (c) {
        var p = c.person;
        var cls = p.sex === 'M' ? 'm' : p.sex === 'F' ? 'f' : 'u';
        out.push('<rect class="n ' + cls + '" x="' + c.x + '" y="' + c.y + '" width="' + c.w +
          '" height="' + c.h + '" rx="' + r + '" ry="' + r + '"/>');

        var gone = (p.death && p.death.date) || p.living === false;
        var textLeft = c.x + 10;

        if (photoSize) {
          var px = c.x + 8, py = c.y + (c.h - photoSize) / 2;
          textLeft = px + photoSize + 8;
          var clip = 'cl' + c.id.replace(/[^\w]/g, '');
          out.push('<clipPath id="' + clip + '"><rect x="' + px + '" y="' + py + '" width="' + photoSize +
            '" height="' + photoSize + '" rx="' + pr + '" ry="' + pr + '"/></clipPath>');
          if (shots[c.id]) {
            out.push('<image xlink:href="' + shots[c.id] + '" x="' + px + '" y="' + py +
              '" width="' + photoSize + '" height="' + photoSize +
              '" preserveAspectRatio="xMidYMid slice" clip-path="url(#' + clip + ')"/>');
          } else {
            out.push('<rect class="ph" x="' + px + '" y="' + py + '" width="' + photoSize +
              '" height="' + photoSize + '" rx="' + pr + '" ry="' + pr + '"/>');
            /* Обрезку и сдвиг держим на разных слоях: если повесить их на один
               элемент, его transform сдвинет и саму область обрезки. */
            out.push('<g clip-path="url(#' + clip + ')"><g transform="translate(' +
              (px + photoSize * 0.14) + ',' + (py + photoSize * 0.14) + ') scale(' +
              (photoSize * 0.72 / 24) + ')" fill="#8d8577" opacity="0.45">' +
              global.Icon.paths[p.sex === 'M' ? 'personM' : p.sex === 'F' ? 'personF' : 'person'] +
              '</g></g>');
          }
          // траурная лента: та же, что на экране — под 45° на углу фотокарточки
          if (gone && mournW > 0) {
            out.push('<g clip-path="url(#' + clip + ')">' +
              mournBand(px, py, photoSize, mournGap, mournW) + '</g>');
          }
        } else if (gone && mournW > 0) {
          var clip2 = 'cc' + c.id.replace(/[^\w]/g, '');
          out.push('<clipPath id="' + clip2 + '"><rect x="' + c.x + '" y="' + c.y + '" width="' + c.w +
            '" height="' + c.h + '" rx="' + r + '" ry="' + r + '"/></clipPath>');
          out.push('<g clip-path="url(#' + clip2 + ')">' +
            mournBand(c.x, c.y, Math.max(c.w, c.h), mournGap, mournW) + '</g>');
        }

        var name = S.shortName(p);
        var avail = c.w - (textLeft - c.x) - 10;
        var lines = wrap(name, Math.max(6, Math.floor(avail / (card.nameSize * 0.55))));
        var years = prefs.showDates ? S.years(p) : '';
        var blockH = lines.length * (card.nameSize + 2) + (years ? card.dateSize + 3 : 0);
        var ty = c.y + (c.h - blockH) / 2 + card.nameSize;
        lines.forEach(function (ln, i) {
          out.push('<text class="nm" x="' + textLeft + '" y="' + (ty + i * (card.nameSize + 2)) +
            '">' + xml(ln) + '</text>');
        });
        if (years) {
          out.push('<text class="yr" x="' + textLeft + '" y="' +
            (ty + lines.length * (card.nameSize + 2) + card.dateSize - 2) + '">' + xml(years) + '</text>');
        }
      });

      out.push('</g></svg>');
      return out.join('\n');
    });

    /** полоса под 45° через верхний левый угол квадрата */
    function mournBand(x, y, size, gap, width) {
      var a = gap, b = gap + width;
      return '<path class="mourn" d="M' + (x + a) + ',' + y + ' L' + (x + b) + ',' + y +
        ' L' + x + ',' + (y + b) + ' L' + x + ',' + (y + a) + ' Z"/>';
    }

    function wrap(s, max) {
      var words = String(s).split(' '), lines = [], cur = '';
      words.forEach(function (w) {
        if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; }
        else cur = (cur ? cur + ' ' : '') + w;
      });
      if (cur) lines.push(cur);
      return lines.slice(0, 3);
    }
  }

  function grad(id, a, b, c) {
    return '<linearGradient id="' + id + '" x1="0" y1="0" x2="0.18" y2="1">' +
      '<stop offset="0" stop-color="' + a + '"/>' +
      '<stop offset="0.58" stop-color="' + b + '"/>' +
      '<stop offset="1" stop-color="' + c + '"/></linearGradient>';
  }
  function xml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c];
    });
  }

  /* ---------------- печать / PDF ---------------- */
  function printSVG(svgText) {
    var w = global.open('', '_blank');
    if (!w) return false;
    w.document.write('<!doctype html><meta charset="utf-8"><title>' + xml(S.tree.meta.name) +
      '</title><style>@page{size:auto;margin:8mm}body{margin:0}svg{width:100%;height:auto}</style>' +
      svgText.replace(/^<\?xml[^>]*\?>/, ''));
    w.document.close();
    w.focus();
    setTimeout(function () { try { w.print(); } catch (e) {} }, 400);
    return true;
  }

  /* ---------------- ZIP (без сжатия) ---------------- */
  var CRC = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(u8) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function zip(files) {       // files: [{name, data: Uint8Array}]
    var parts = [], central = [], offset = 0;
    var enc = new TextEncoder();
    files.forEach(function (f) {
      var nameBytes = enc.encode(f.name);
      var crc = crc32(f.data), size = f.data.length;
      var lh = new Uint8Array(30 + nameBytes.length);
      var dv = new DataView(lh.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true); dv.setUint16(8, 0, true);
      dv.setUint16(10, 0, true); dv.setUint16(12, 0, true);
      dv.setUint32(14, crc, true); dv.setUint32(18, size, true); dv.setUint32(22, size, true);
      dv.setUint16(26, nameBytes.length, true); dv.setUint16(28, 0, true);
      lh.set(nameBytes, 30);
      parts.push(lh, f.data);
      var ch = new Uint8Array(46 + nameBytes.length);
      var cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0, true);
      cv.setUint32(16, crc, true); cv.setUint32(20, size, true); cv.setUint32(24, size, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint32(42, offset, true);
      ch.set(nameBytes, 46);
      central.push(ch);
      offset += lh.length + size;
    });
    var cdSize = central.reduce(function (s, c) { return s + c.length; }, 0);
    var end = new Uint8Array(22);
    var ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);
    return new Blob(parts.concat(central, [end]), { type: 'application/zip' });
  }

  /* полная резервная копия: GEDCOM + JSON + фото + SVG */
  function fullBackup(treeView, onStep) {
    var enc = new TextEncoder();
    var files = [];
    files.push({ name: 'tree.ged', data: enc.encode(exportGEDCOM()) });
    files.push({ name: 'drevo.json', data: enc.encode(JSON.stringify(S.tree, null, 1)) });
    files.push({ name: 'ЧИТАТЬ.txt', data: enc.encode(readme()) });

    var media = S.allMedia();
    var i = 0;
    // картинку дерева собираем первой: она ждёт фотографий с диска
    var svgReady = exportSVG(treeView).then(function (svg) {
      files.push({ name: 'tree.svg', data: enc.encode(svg) });
    }, function () {});
    function next() {
      if (i >= media.length) return Promise.resolve();
      var m = media[i++];
      if (onStep) onStep(i, media.length);
      var isPrivate = m.encrypted;
      // приватные файлы кладём как есть — то есть зашифрованными
      var get = isPrivate ? U.blobGet(m.id) : S.mediaBlob(m.id);
      return get.then(function (b) {
        if (!b) return;
        return b.arrayBuffer().then(function (buf) {
