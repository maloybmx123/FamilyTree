   человека она узнает сама, в том числе на других устройствах — отпечатки
   лиц едут вместе с деревом. */
(function (global) {
  'use strict';

  var S = global.Store;
  function esc(s) { return global.TreeView.esc(s); }
  function I(n) { return global.Icon(n); }

  var FaceEdit = {
    mediaId: null,
    faces: [],        // {descriptor, box, person}
    url: null,

    open: function (mediaId, after) {
      var self = this, App = global.App;
      var m = S.tree.media[mediaId];
      if (!m || m.kind !== 'photo') { App.toast('Лица ищутся только на снимках'); return; }
      this.mediaId = mediaId;
      this.after = after || function () {};
      this.faces = [];

      App.modal('Кто на снимке',
        '<p class="note" id="feState">Смотрю снимок…</p>' +
        '<div class="fi-bar"><div id="feFill" style="width:40%"></div></div>', []);

      var blob = null;
      S.mediaBlob(mediaId).then(function (b) {
        if (!b) throw new Error('Файла нет на этом устройстве — он подтянется при синхронизации');
        blob = b;
        return global.Faces.ensure(function (t) {
          var el = document.getElementById('feState');
          if (el && t) el.textContent = t;
        });
      }).then(function () {
        return global.Faces.scanBlob(blob);
      }).then(function (r) {
        self.url = URL.createObjectURL(blob);
        global.App._mediaUrls.push(self.url);
        var known = global.Faces.known();
        self.faces = ((r && r.faces) || []).map(function (f) {
          var mt = global.Faces.match(f.descriptor, known);
          return {
            descriptor: f.descriptor, box: f.box, score: f.score,
            person: self.saved(m, f.box) || ((mt && mt.sure) ? mt.personId : ''),
            hint: (mt && !mt.sure) ? mt.personId : '',
            distance: mt ? mt.distance : null
          };
        }).sort(function (a, b) { return a.box.x - b.box.x; });
        self.draw(r);
      }).catch(function (e) {
        App.closeAllModals();
        App.modal('Не получилось', '<p class="note">' + esc(e.message) + '</p>', []);
      });
    },

    /** Имя, которое уже стояло у этой рамки раньше. */
    saved: function (m, box) {
      var best = '', bestOverlap = 0.3;
      (m.faces || []).forEach(function (t) {
        if (!t.person) return;
        var x1 = Math.max(t.x, box.x), y1 = Math.max(t.y, box.y);
        var x2 = Math.min(t.x + t.w, box.x + box.w), y2 = Math.min(t.y + t.h, box.y + box.h);
        if (x2 <= x1 || y2 <= y1) return;
        var over = (x2 - x1) * (y2 - y1);
        var all = t.w * t.h + box.w * box.h - over;
        var k = over / all;
        if (k > bestOverlap) { bestOverlap = k; best = t.person; }
      });
      return best;
    },

    draw: function (scan) {
      var self = this, App = global.App;
      var m = S.tree.media[this.mediaId];
      var people = S.persons().slice().sort(function (a, b) {
        return S.fullName(a).localeCompare(S.fullName(b), 'ru');
      });
      var opts = '<option value="">— не указан —</option>' + people.map(function (p) {
        return '<option value="' + esc(p.id) + '">' + esc(S.fullName(p)) + '</option>';
      }).join('');

      var w = (scan && scan.width) || 1, h = (scan && scan.height) || 1;
      var boxes = this.faces.map(function (f, i) {
        return '<span class="fe-box" data-box="' + i + '" style="' +
          'left:' + (f.box.x / w * 100) + '%;top:' + (f.box.y / h * 100) + '%;' +
          'width:' + (f.box.w / w * 100) + '%;height:' + (f.box.h / h * 100) + '%">' +
          '<b>' + (i + 1) + '</b></span>';
      }).join('');

      var rows = this.faces.length
        ? this.faces.map(function (f, i) {
            return '<div class="fe-row" data-i="' + i + '">' +
              '<span class="fe-num">' + (i + 1) + '</span>' +
              '<canvas class="fe-cut" data-cut="' + i + '" width="56" height="56"></canvas>' +
              '<span class="fe-main">' +
              '<select class="fe-who" data-i="' + i + '">' + opts + '</select>' +
              '<span class="note">' +
              (f.hint ? 'похоже на: ' + esc(S.callName(S.person(f.hint))) + ', проверьте'
                      : f.person ? 'узнан' + (f.distance != null
                          ? ' · ' + global.Faces.confidence(f.distance) : '')
                      : 'не узнан') +
              '</span></span></div>';
          }).join('')
        : '<p class="note">Лиц на этом снимке программа не нашла. ' +
          'Так бывает с мелкими, боковыми и сильно выцветшими фотографиями.</p>';

      App.closeAllModals();
      App.modal('Кто на снимке',
        '<div class="fe-wrap"><img src="' + this.url + '" alt="">' + boxes + '</div>' +
        '<div class="fe-list">' + rows + '</div>' +
        '<p class="note">Подтверждённые имена программа запоминает и дальше узнаёт ' +
        'этих людей сама.</p>',
        this.faces.length
          ? [{ text: 'Сохранить', primary: true, fn: function () { self.save(); } }]
          : [],
        { wide: true });

      /* Рамки лежат в долях от снимка, поэтому обёртка должна быть ровно
         по картинке. Сама по себе она шире: ширину ей задаёт окно, а
         картинку ужимает ограничение по высоте — рамки уезжали вправо. */
      var wrap = document.querySelector('.fe-wrap');
      var big = wrap && wrap.querySelector('img');
      if (big) {
        var поРазмеру = function () {
          wrap.style.width = big.clientWidth + 'px';
          wrap.style.height = big.clientHeight + 'px';
        };
        if (big.complete && big.clientWidth) поРазмеру();
        big.addEventListener('load', поРазмеру);
        if (global.ResizeObserver) {
          this._ro = new global.ResizeObserver(поРазмеру);
          this._ro.observe(big);
        }
      }

      // подставляем выбранных и режем лица для списка
      this.faces.forEach(function (f, i) {
        var sel = document.querySelector('.fe-who[data-i="' + i + '"]');
        if (sel) sel.value = f.person || '';
        self.cut(i);
      });
      document.querySelectorAll('.fe-who').forEach(function (sel) {
        sel.addEventListener('change', function () {
          self.faces[+sel.dataset.i].person = sel.value;
          self.markBoxes();
        });
      });
      document.querySelectorAll('[data-box]').forEach(function (b) {
        b.addEventListener('click', function () {
          var sel = document.querySelector('.fe-who[data-i="' + b.dataset.box + '"]');
          if (sel) { sel.focus(); sel.scrollIntoView({ block: 'nearest' }); }
        });
      });
      this.markBoxes();
    },

    markBoxes: function () {
      var self = this;
      document.querySelectorAll('[data-box]').forEach(function (b) {
        b.classList.toggle('named', !!self.faces[+b.dataset.box].person);
      });
    },

    /** вырезать лицо в кружок рядом со списком */
    cut: function (i) {
      var f = this.faces[i];
      var cv = document.querySelector('[data-cut="' + i + '"]');
      if (!cv || !f) return;
      var img = new Image();
      img.onload = function () {
        var pad = Math.round(f.box.w * 0.15);
        var sx = Math.max(0, f.box.x - pad), sy = Math.max(0, f.box.y - pad);
        var sw = Math.min(img.naturalWidth - sx, f.box.w + pad * 2);
        var sh = Math.min(img.naturalHeight - sy, f.box.h + pad * 2);
        cv.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
      };
      img.src = this.url;
    },

    save: function () {
      var m = S.tree.media[this.mediaId];
      if (!m) return;
      var named = [], main = null;
      var tags = this.faces.map(function (f) {
        if (f.person) {
          // имя подтвердил человек — запоминаем отпечаток, это самый ценный случай
          global.Faces.remember(f.person, f.descriptor);
          if (named.indexOf(f.person) < 0) named.push(f.person);
          var area = f.box.w * f.box.h;
          if (!main || area > main.area) main = { id: f.person, area: area };
        }
        return { x: f.box.x, y: f.box.y, w: f.box.w, h: f.box.h, person: f.person };
      });
      m.faces = tags;
      m.scanned = true;
      m.updated = new Date().toISOString();

      if (main && !m.personId) {
        m.personId = main.id;
        var p = S.person(main.id);
        if (p) {
          p.media = p.media || [];
          if (p.media.indexOf(m.id) < 0) p.media.push(m.id);
          if (!p.photo) p.photo = m.id;
        }
      }
      if (named.length > 1) {
        m.caption = 'На снимке: ' + named.map(function (id) {
          return S.callName(S.person(id));
        }).filter(Boolean).join(', ');
      }
      S.log('media', 'Отмечены лица на снимке «' + (m.caption || m.name) + '»',
        m.personId || '');
      S.save();
      global.App.closeAllModals();
      global.App.toast(named.length
        ? 'Запомнила: ' + named.map(function (id) { return S.callName(S.person(id)); }).join(', ')
        : 'Сохранено');
      global.App.tree.render();
      if (global.App.activeTab === 'photos' && global.Files) global.Files.render();
      this.after();
    }
  };

  global.FaceEdit = FaceEdit;
})(window);
</script>
<script>/* Семейное Древо — раздел «Фото и файлы».

   Что здесь: папки, три вида отображения, выделение нескольких файлов,
   скачивание (по одному, выделенные, всё, папкой) и действия над выделенным
   — удалить, сделать главным снимком, изменить, кому виден файл.

   Папки живут отдельным списком (tree.folders), а у файла хранится только
   folderId. Так папку можно переименовать, не трогая файлы, и пустая папка
   не исчезает сама собой. */
(function (global) {
  'use strict';

  var S = global.Store, U = S.util;
  function esc(s) { return global.TreeView.esc(s); }
  function I(n) { return global.Icon(n); }

  function plural(n, a, b, c) {
    var m = n % 100, k = n % 10;
    if (m > 10 && m < 20) return c;
    if (k === 1) return a;
    if (k >= 2 && k <= 4) return b;
    return c;
  }

  /* Один и тот же вид работает в двух местах: в разделе «Галерея» (все файлы
     дерева) и в карточке человека (только его файлы). Поэтому это не один
     объект на всю программу, а вид со своим состоянием. */
  function FilesView(opts) {
    opts = opts || {};
    this.personId = opts.personId || null;   // null — вся галерея
    this.hostSel = opts.host || '#pane-photos .pane-scroll';
    this.sel = {};
    this.folderId = null;
    this.editing = false;
    this.sort = 'added';
    this.people = null;        // в галерее: отбор по людям, null — все
  }

  FilesView.prototype = {

    /* ---------- папки ---------- */
    folders: function () {
      var f = S.tree.folders || {};
      var out = [];
      for (var id in f) out.push(f[id]);
      return out.sort(function (a, b) { return (a.name || '').localeCompare(b.name || '', 'ru'); });
    },
    addFolder: function (name) {
      S.tree.folders = S.tree.folders || {};
      var id = U.uid('fld');
      S.tree.folders[id] = { id: id, name: name, personId: this.personId || null,
        created: new Date().toISOString(), updated: new Date().toISOString() };
      S.save();
      return id;
    },
    renameFolder: function (id, name) {
      var f = (S.tree.folders || {})[id];
      if (!f) return;
      f.name = name; f.updated = new Date().toISOString();
      S.save();
    },
    /** Удаляем только папку: файлы из неё возвращаются в общий список. */
    dropFolder: function (id) {
      var f = (S.tree.folders || {})[id];
      if (!f) return;
      S.allMedia().forEach(function (m) { if (m.folderId === id) { m.folderId = null; m.updated = new Date().toISOString(); } });
      delete S.tree.folders[id];
      S.bury(id);
      S.log('delete', 'Удалена папка «' + f.name + '»');
      S.save();
    },

    /* ---------- добавление ---------- */
    pickAdd: function (folder) {
      var self = this;
      global.App.pickFiles(function (files) { self.addFiles(files, folder); }, { folder: !!folder });
    },

    /** Положить выбранное в дерево. Папку раскладываем по годам съёмки,
        а снимки отправляем в очередь на узнавание лиц — она разберёт их
        потом, не держа человека у экрана. */
    addFiles: function (files, byYear) {
      var self = this, App = global.App;
      var list = Array.prototype.slice.call(files || []).filter(function (f) {
        // мусор из системных папок брать незачем
        return f.size > 0 && !/^\./.test(f.name) && f.name !== 'Thumbs.db';
      });
      if (!list.length) { App.toast('Файлов не нашлось'); return; }

      App.askAccess(function (acl) {
        App.modal('Добавляю файлы',
          '<p class="note" id="afState">Готовлюсь…</p>' +
          '<div class="fi-bar"><div id="afFill"></div></div>', []);
        var st = document.getElementById('afState'), fl = document.getElementById('afFill');
        var added = [], photos = [], folders = {};

        function dates() {
          if (!byYear) return Promise.resolve({});
          var out = {}, i = 0;
          function step() {
            if (i >= list.length) return Promise.resolve(out);
            var f = list[i++];
            if (st) st.textContent = 'Смотрю даты съёмки: ' + i + ' из ' + list.length;
            if (!/^image\//.test(f.type)) return step();
            return global.Faces.shotDate(f).then(function (d) {
              if (d) out[f.name + ':' + f.size] = d;
              return step();
            }, step);
          }
          return step();
        }

        dates().then(function (byName) {
          var have = {};
          (S.tree.folders && Object.keys(S.tree.folders) || []).forEach(function (id) {
            have[S.tree.folders[id].name] = id;
          });
          var i = 0;
          function step() {
            if (i >= list.length) return Promise.resolve();
            var f = list[i++];
            if (st) st.textContent = 'Добавляю: ' + i + ' из ' + list.length + ' · ' + f.name;
            if (fl) fl.style.width = Math.round(i / list.length * 100) + '%';
            var date = byName[f.name + ':' + f.size] || '';
            return S.addMedia(self.personId || '', f, { acl: acl, date: date })
              .then(function (m) {
                added.push(m.id);
                if (m.kind === 'photo') photos.push(m.id);
                var year = date ? date.slice(0, 4) : null;
                if (byYear && year) {
                  if (!folders[year]) folders[year] = have[year] || self.addFolder(year);
                  m.folderId = folders[year];
                } else if (self.folderId) {
                  m.folderId = self.folderId;
                }
              }, function () {})
              .then(step);
          }
          return step();
        }).then(function () {
          S.save();
          App.closeAllModals();
          App.tree.render();
          self.render();
          var годы = Object.keys(folders).sort();
          App.toast('Добавлено: ' + added.length + ' ' +
            plural(added.length, 'файл', 'файла', 'файлов') +
            (годы.length ? ' · папки: ' + годы.join(', ') : ''));
          if (photos.length) {
            global.FaceQueue.add(photos);
            global.FaceQueue.run();
          }
        });
      });
    },

    /* ---------- что показываем ---------- */
    list: function () {
      var self = this;
      var all = S.allMedia().filter(function (m) { return S.canSee(m.acl); });
      if (this.personId) all = all.filter(function (m) { return m.personId === self.personId; });
      else if (this.people && this.people.length) {
        all = all.filter(function (m) { return self.people.indexOf(m.personId) >= 0; });
      }
      if (this.folderId) all = all.filter(function (m) { return m.folderId === self.folderId; });
      var order = this.sort || 'added';
      var by = {
        added: function (a, b) { return (b.added || '').localeCompare(a.added || ''); },
        name: function (a, b) { return (a.caption || a.name || '').localeCompare(b.caption || b.name || '', 'ru'); },
        person: function (a, b) {
          return S.fullName(S.person(a.personId)).localeCompare(S.fullName(S.person(b.personId)), 'ru');
        },
        size: function (a, b) { return (b.size || 0) - (a.size || 0); },
        kind: function (a, b) { return (a.kind || '').localeCompare(b.kind || ''); }
      };
      return all.slice().sort(by[order] || by.added);
    },

    selected: function () {
      var self = this;
      return this.list().filter(function (m) { return self.sel[m.id]; });
    },

    /* ---------- отрисовка ---------- */
    host: function () {
      return typeof this.hostSel === 'function' ? this.hostSel() : document.querySelector(this.hostSel);
    },

    render: function () {
      var host = this.host();
      if (!host) return;
      var self = this;
      var view = (S.prefs.filesView || 'tiles');
      var tile = S.prefs.tileSize || 132;
      var items = this.list();
      var cur = this.folderId ? (S.tree.folders || {})[this.folderId] : null;
      var nSel = this.selected().length;

      /* Шапка: сперва то, чем пользуются каждый день, остальное — под «⋯».
         Раньше десяток кнопок стоял в ряд и терялось главное. */
      var head = '<div class="files-top">' +
        (this.personId || cur ? '' : '<h2 style="margin:0 10px 0 0">Галерея</h2>') +
        /* Одна кнопка на всё добавление: и отдельные файлы, и папка целиком.
           Раньше папка пряталась в «⋯» отдельным пунктом, и её не находили. */
        '<div class="menu-wrap">' +
        '<button class="btn btn-primary btn-sm" id="flAdd">' + I('upload') +
        ' Добавить файлы</button>' +
        '<div class="menu" id="flAddMenu" hidden>' +
        '<button data-ai="files">' + I('upload') + ' Выбрать файлы</button>' +
        '<button data-ai="folder">' + I('folderPlus') + ' Выбрать папку целиком</button>' +
        '</div></div>' +
        (cur ? '<button class="btn btn-sm" id="flUp" title="Выйти из папки">' +
               I('up') + ' Все файлы</button>' +
               '<span class="files-here">' + I('folder') + ' ' + esc(cur.name) + '</span>'
             : '') +
        (this.personId
          ? '<button class="btn btn-sm" data-act="recVoice">' + I('mic') +
            '<span class="lbl"> Голосовая заметка</span></button>'
          : '') +
        '<span class="spacer"></span>' +
        (this.personId ? '' : this.peopleBtn()) +
        '<div class="menu-wrap">' +
        '<button class="btn btn-sm" id="flMore" title="Ещё" aria-label="Ещё">' + I('dots') + '</button>' +
        '<div class="menu" id="flMenu" hidden>' +
        '<div class="menu-head">Папки</div>' +
        '<button data-mi="newFolder">' + I('folderPlus') + ' Создать папку</button>' +
        (cur ? '<button data-mi="renameFolder">Переименовать «' + esc(cur.name) + '»</button>' +
               '<button data-mi="dropFolder" class="danger">Удалить папку</button>' : '') +
        '<div class="menu-head">Вид</div>' +
        '<button data-mi="view-tiles"' + (view === 'tiles' ? ' class="on"' : '') + '>' + I('grid') + ' Плитки</button>' +
        '<button data-mi="view-small"' + (view === 'small' ? ' class="on"' : '') + '>' + I('photo') + ' Мелкие плитки</button>' +
        '<button data-mi="view-list"' + (view === 'list' ? ' class="on"' : '') + '>' + I('list') + ' Список</button>' +
        '<div class="menu-row"><span>Размер</span>' +
        '<input type="range" id="flSize" min="80" max="260" step="10" value="' + tile + '"></div>' +
        '<div class="menu-head">Порядок</div>' +
        [['added', 'по дате'], ['name', 'по названию'], ['person', 'по человеку'],
         ['kind', 'по виду'], ['size', 'по размеру']].map(function (l) {
          return '<button data-mi="sort-' + l[0] + '"' +
            ((self.sort || 'added') === l[0] ? ' class="on"' : '') + '>' + l[1] + '</button>';
        }).join('') +
        '<div class="menu-head">Действия</div>' +
        '<button data-mi="faces">' + I('person') + ' Узнать лица на снимках</button>' +
        '<button data-mi="select">' + I('check') + ' Выбрать несколько</button>' +
        '<button data-mi="saveAll">' + I('download') + ' Скачать всё</button>' +
        '</div></div></div>';

      var bar = this.editing
        ? '<div class="files-bar">' +
          '<span>' + (nSel ? 'Выбрано: ' + nSel : 'Ничего не выбрано') + '</span>' +
          '<button class="btn btn-sm" id="flAll">Выбрать все</button>' +
          '<button class="btn btn-sm" id="flNone">Снять</button>' +
          '<span class="spacer"></span>' +
          '<button class="btn btn-sm" id="flGet"' + (nSel ? '' : ' disabled') + '>' +
          I('download') + ' Скачать</button>' +
          '<button class="btn btn-sm" id="flMove"' + (nSel ? '' : ' disabled') + '>' +
          I('folder') + ' В папку</button>' +
          '<button class="btn btn-sm" id="flMain"' + (nSel === 1 ? '' : ' disabled') + '>' +
          I('star') + ' Главным</button>' +
          '<button class="btn btn-sm" id="flFaces"' + (nSel ? '' : ' disabled') + '>' +
          I('person') + ' Узнать лица</button>' +
          '<button class="btn btn-sm" id="flAcl"' + (nSel ? '' : ' disabled') + '>' +
          I('lock') + ' Кому видно</button>' +
          '<button class="btn btn-sm btn-danger" id="flDel"' + (nSel ? '' : ' disabled') + '>' +
          I('trash') + ' Удалить</button>' +
          '<button class="btn btn-sm" id="flDone">Готово</button>' +
          '</div>'
        : '';

      host.innerHTML = head + '<div id="recState" class="note"></div>' +
        '<div id="faceState" class="note"></div>' +
        bar + this.foldersHtml() + this.itemsHtml(items, view, tile);
      this.paintThumbs(host);
      this.bind(host);
    },

    /** Папки идут первыми; в галерее сгруппированы по людям. */
    foldersHtml: function () {
      if (this.folderId) return '';
      var self = this;
      var list = this.folders().filter(function (f) {
        return self.personId ? f.personId === self.personId : true;
      });
      if (!list.length) return '';
      function tile(f) {
        var n = S.allMedia().filter(function (m) { return m.folderId === f.id; }).length;
        return '<button class="folder-tile" data-folder="' + esc(f.id) + '">' +
          I('folder') + '<span class="f-name">' + esc(f.name) + '</span>' +
          '<span class="f-count">' + n + '</span></button>';
      }
      if (this.personId) return '<div class="folder-row">' + list.map(tile).join('') + '</div>';

      // в галерее подписываем, чьи это папки
      var byPerson = {}, order = [];
      list.forEach(function (f) {
        var key = f.personId || '';
        if (!byPerson[key]) { byPerson[key] = []; order.push(key); }
        byPerson[key].push(f);
      });
      return order.map(function (key) {
        var p = key && S.person(key);
        return '<div class="folder-group">' +
          '<div class="folder-owner">' + esc(p ? S.fullName(p) : 'Общие папки') + '</div>' +
          '<div class="folder-row">' + byPerson[key].map(tile).join('') + '</div></div>';
      }).join('');
    },

    itemsHtml: function (items, view, tile) {
      var self = this;
      if (!items.length) {
        return '<div class="empty">' + (this.folderId ? 'В этой папке пока пусто.'
          : 'Файлов пока нет.<br>Добавьте фотографии или документы к человеку.') + '</div>';
      }
      if (view === 'list') {
        return '<div class="table-wrap"><table class="data"><tbody>' + items.map(function (m) {
          var who = S.person(m.personId);
          return '<tr data-id="' + esc(m.id) + '" class="file-row' + (self.sel[m.id] ? ' is-sel' : '') + '">' +
            (self.editing ? '<td style="width:30px"><input type="checkbox" data-pick="' + esc(m.id) + '"' +
              (self.sel[m.id] ? ' checked' : '') + '></td>' : '') +
            '<td style="width:34px">' + I(self.iconOf(m)) + '</td>' +
            '<td>' + esc(m.caption || m.name) + '</td>' +
            '<td>' + esc(who ? S.fullName(who) : '') + '</td>' +
            '<td style="white-space:nowrap">' + Math.round((m.size || 0) / 1024) + ' КБ</td>' +
            '<td style="white-space:nowrap">' + (m.added ? new Date(m.added).toLocaleDateString('ru-RU') : '') + '</td>' +
            '</tr>';
        }).join('') + '</tbody></table></div>';
      }
      var w = view === 'small' ? Math.round(tile * 0.62) : tile;
      return '<div class="photo-wall" style="grid-template-columns:repeat(auto-fill,minmax(' +
        w + 'px,1fr))">' + items.map(function (m) {
          var who = S.person(m.personId);
          return '<div class="media-tile' + (self.sel[m.id] ? ' is-sel' : '') +
            '" data-id="' + esc(m.id) + '" title="' + esc(m.name) + '">' +
            (self.editing ? '<input class="tile-pick" type="checkbox" data-pick="' + esc(m.id) + '"' +
              (self.sel[m.id] ? ' checked' : '') + '>' : '') +
            '<span class="tile-ico">' + I(self.iconOf(m)) + '</span>' +
            (m.kind === 'video' ? '<span class="tile-play">' + I('play') + '</span>' : '') +
            '<span class="m-name">' + esc(m.caption || (who ? S.fullName(who) : m.name)) + '</span></div>';
        }).join('') + '</div>';
    },

    peopleBtn: function () {
      var withFiles = {};
      S.allMedia().forEach(function (m) { if (m.personId) withFiles[m.personId] = 1; });
      if (Object.keys(withFiles).length < 2) return '';
      var chosen = this.people || [];
      var label = !chosen.length ? 'Все люди'
        : chosen.length === 1 ? S.fullName(S.person(chosen[0]))
        : 'Людей: ' + chosen.length;
      return '<button class="btn btn-sm" id="flWho">' + I('person') + ' ' + esc(label) + '</button>' +
        (chosen.length ? '<button class="btn btn-sm" id="flWhoAll" title="Показать всех">' +
          I('close') + '</button>' : '');
    },

    pickPeople: function () {
      var self = this, App = global.App;
      var withFiles = {};
      S.allMedia().forEach(function (m) { if (m.personId) withFiles[m.personId] = 1; });
      var people = Object.keys(withFiles).map(function (id) { return S.person(id); })
        .filter(Boolean)
        .sort(function (a, b) { return S.fullName(a).localeCompare(S.fullName(b), 'ru'); });
      var chosen = this.people || [];
      App.modal('Чьи файлы показывать',
        '<p class="note" style="margin-bottom:8px">Если никого не отметить, показываются все.</p>' +
        '<div class="viewer-list">' + people.map(function (p) {
          var n = S.allMedia().filter(function (m) { return m.personId === p.id; }).length;
          return '<label class="viewer-row"><input type="checkbox" data-who="' + esc(p.id) + '"' +
            (chosen.indexOf(p.id) >= 0 ? ' checked' : '') + '>' +
            '<span class="mini-ph">' + I('person') + '</span>' +
            '<span class="li-main"><span>' + esc(S.fullName(p)) + '</span>' +
            '<span class="li-sub">' + n + ' ' + plural(n, 'файл', 'файла', 'файлов') + '</span></span></label>';
        }).join('') + '</div>',
        [{ text: 'Показать', primary: true, fn: function () {
          var picked = [];
          document.querySelectorAll('[data-who]').forEach(function (c) {
            if (c.checked) picked.push(c.dataset.who);
          });
          self.people = picked.length ? picked : null;
          App.closeModal();
          self.render();
        } }]);
    },

    /** Обновить только пометки и нижнюю панель, не трогая сам список. */
    repaintSelection: function (host) {
      host = host || document.querySelector('#pane-photos .pane-scroll');
      if (!host) return;
      var self = this;
      host.querySelectorAll('[data-id]').forEach(function (el) {
        var on = !!self.sel[el.dataset.id];
        el.classList.toggle('is-sel', on);
        var c = el.querySelector('[data-pick]');
        if (c) c.checked = on;
      });
      var n = this.selected().length;
      var bar = host.querySelector('.files-bar');
      if (!bar) return;
      var label = bar.querySelector('span');
      if (label) label.textContent = n ? 'Выбрано: ' + n : 'Ничего не выбрано';
      ['#flGet', '#flMove', '#flAcl', '#flDel'].forEach(function (id) {
        var b = bar.querySelector(id);
        if (b) b.disabled = !n;
      });
      var main = bar.querySelector('#flMain');
      if (main) main.disabled = n !== 1;
    },

    iconOf: function (m) {
      return m.kind === 'photo' ? 'photo' : m.kind === 'audio' ? 'mic'
        : m.kind === 'video' ? 'play' : 'note';
    },

    /** Подставить настоящие картинки в плитки — по мере готовности. */
    paintThumbs: function (host) {
      host.querySelectorAll('.media-tile[data-id]').forEach(function (el) {
        var m = S.tree.media[el.dataset.id];
        if (!m || m.kind !== 'photo') return;
        S.mediaURL(m.id).then(function (url) {
          if (!url || !el.isConnected) return;
          el.style.backgroundImage = 'url(' + url + ')';
          el.classList.add('has-img');
          global.App._mediaUrls.push(url);
        });
      });
    },

    /* Меню раньше висело на `position:absolute; right:0` внутри кнопки.
       У кнопки слева (как «Добавить файлы») оно уезжало за левый край, а в
       карточке человека его обрезала прокрутка. Теперь кладём его по
       месту кнопки и следим, чтобы целиком попало в окно. */
    dropdown: function (btn, menu) {
      var self = this;
      if (!btn || !menu) return;
      function place() {
        var r = btn.getBoundingClientRect();
        menu.style.position = 'fixed';
        menu.style.right = 'auto';
        menu.style.maxHeight = '';
        var w = menu.offsetWidth, h = menu.offsetHeight;
        var left = Math.min(Math.max(8, r.left), Math.max(8, global.innerWidth - w - 8));
        var top = r.bottom + 6;
        if (top + h > global.innerHeight - 8) {
          // не влезло снизу — показываем над кнопкой, а совсем некуда — поджимаем
          if (r.top - 6 > h) top = r.top - h - 6;
          else { top = 8; menu.style.maxHeight = (global.innerHeight - 16) + 'px'; }
        }
        menu.style.left = Math.round(left) + 'px';
        menu.style.top = Math.round(top) + 'px';
      }
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!menu.hidden) { menu.hidden = true; return; }
        menu.hidden = false;
        place();
        var close = function (ev) {
          if (ev && ev.type === 'click' && menu.contains(ev.target)) return;
          menu.hidden = true;
          document.removeEventListener('click', close);
          global.removeEventListener('resize', close);
          global.removeEventListener('scroll', close, true);
        };
        setTimeout(function () {
          document.addEventListener('click', close);
          global.addEventListener('resize', close);
          global.addEventListener('scroll', close, true);
        }, 0);
      });
      self._place = place;
    },

    bind: function (host) {
      var self = this, App = global.App;
      var on = function (sel, fn) { var b = host.querySelector(sel); if (b) b.addEventListener('click', fn); };

      // «Добавить файлы» — меню из двух пунктов
      var add = host.querySelector('#flAdd'), addMenu = host.querySelector('#flAddMenu');
      if (add && addMenu) {
        this.dropdown(add, addMenu);
        addMenu.querySelectorAll('[data-ai]').forEach(function (b) {
          b.addEventListener('click', function () {
            addMenu.hidden = true;
            self.pickAdd(b.dataset.ai === 'folder');
          });
        });
      }
      on('#flFaces', function () {
        var ids = self.selected().filter(function (m) { return m.kind === 'photo'; })
          .map(function (m) { return m.id; });
        if (!ids.length) { App.toast('Выберите снимки'); return; }
        if (ids.length === 1) { global.FaceEdit.open(ids[0], function () { self.render(); }); return; }
        global.FaceQueue.add(ids);
        global.FaceQueue.run({ loud: true });
      });
      on('#flWho', function () { self.pickPeople(); });
      on('#flWhoAll', function () { self.people = null; self.render(); });
      on('#flUp', function () { self.folderId = null; self.render(); });

      // меню «ещё»
      var more = host.querySelector('#flMore'), menu = host.querySelector('#flMenu');
      if (more && menu) {
        this.dropdown(more, menu);
        var size = menu.querySelector('#flSize');
        if (size) {
          size.addEventListener('click', function (e) { e.stopPropagation(); });
          // пока ползунок едет — только плитки, запись настроек по отпусканию
          size.addEventListener('input', function () {
            var w = +this.value;
            var wall = host.querySelector('.photo-wall');
            if (wall) {
              var k = (S.prefs.filesView === 'small') ? 0.62 : 1;
              wall.style.gridTemplateColumns = 'repeat(auto-fill,minmax(' + Math.round(w * k) + 'px,1fr))';
            }
          });
          size.addEventListener('change', function () {
            S.prefs.tileSize = +this.value; S.savePrefs();
          });
        }
        menu.querySelectorAll('[data-mi]').forEach(function (b) {
          b.addEventListener('click', function () {
            menu.hidden = true;
            self.menuAction(b.dataset.mi);
          });
        });
      }

      host.querySelectorAll('[data-folder]').forEach(function (b) {
        b.addEventListener('click', function () { self.folderId = b.dataset.folder; self.render(); });
      });

      host.querySelectorAll('[data-pick]').forEach(function (c) {
        c.addEventListener('click', function (e) { e.stopPropagation(); });
        c.addEventListener('change', function () {
          if (c.checked) self.sel[c.dataset.pick] = 1; else delete self.sel[c.dataset.pick];
          self.repaintSelection(host);
        });
      });

      function openOrPick(id) {
        if (self.editing) {
          if (self.sel[id]) delete self.sel[id]; else self.sel[id] = 1;
          self.repaintSelection(host);
          return;
        }
        global.Viewer.open(self.list(), id);
      }
      host.querySelectorAll('.media-tile[data-id]').forEach(function (el) {
        el.addEventListener('click', function () { openOrPick(el.dataset.id); });
      });
      host.querySelectorAll('tr.file-row').forEach(function (tr) {
        tr.addEventListener('click', function () { openOrPick(tr.dataset.id); });
      });

      on('#flAll', function () {
        self.list().forEach(function (m) { self.sel[m.id] = 1; });
        self.repaintSelection(host);
      });
      on('#flNone', function () { self.sel = {}; self.repaintSelection(host); });
      on('#flDone', function () { self.editing = false; self.sel = {}; self.render(); });
      on('#flGet', function () { self.download(self.selected(), 'Выбранные файлы'); });
      on('#flMove', function () { self.moveDialog(self.selected()); });
      on('#flMain', function () {
        var m = self.selected()[0];
        if (!m) return;
        if (m.kind !== 'photo') { App.toast('Главным может быть только снимок'); return; }
        S.updatePerson(m.personId, { photo: m.id });
        App.toast('Теперь это главное фото');
        App.tree.render();
        self.render();
      });
      on('#flAcl', function () { self.aclDialog(self.selected()); });
      on('#flDel', function () {
        var list = self.selected();
        App.confirm('Удалить ' + list.length + ' ' + plural(list.length, 'файл', 'файла', 'файлов') + '?',
          'Файлы уйдут в корзину — оттуда их можно вернуть.', function () {
            list.forEach(function (m) { S.removeMedia(m.id, true); });
            S.save();
            self.sel = {};
            App.paintTrash();
            App.tree.render();
            self.render();
            App.toast('Перенесено в корзину');
          });
      });
    },

    menuAction: function (mi) {
      var self = this, App = global.App;
      if (mi === 'newFolder') {
        App.prompt('Новая папка', 'Как её назвать?', '', function (name) {
          if (!name || !name.trim()) return;
          self.addFolder(name.trim());
          self.render();
        });
      } else if (mi === 'renameFolder') {
        var f = (S.tree.folders || {})[this.folderId];
        if (!f) return;
        App.prompt('Новое название', '', f.name, function (v) {
          if (v && v.trim()) { self.renameFolder(self.folderId, v.trim()); self.render(); }
        });
      } else if (mi === 'dropFolder') {
        var id = this.folderId;
        var fd = (S.tree.folders || {})[id];
        if (!fd) return;
        App.confirm('Удалить папку «' + fd.name + '»?',
          'Файлы из неё не пропадут — они вернутся в общий список.', function () {
            App.closeAllModals();
            self.dropFolder(id);
            self.folderId = null;
            self.render();
          });
      } else if (mi.indexOf('view-') === 0) {
        S.prefs.filesView = mi.slice(5); S.savePrefs(); this.render();
      } else if (mi.indexOf('sort-') === 0) {
        this.sort = mi.slice(5); this.render();
      } else if (mi === 'faces') {
        var n = global.FaceQueue.addUnscanned();
        if (!n && !global.FaceQueue.left()) {
          App.toast('Все снимки уже просмотрены. Поправить имена можно в самом снимке — кнопка «Кто на снимке».');
          return;
        }
        global.FaceQueue.run({ loud: true });
      } else if (mi === 'select') {
        this.editing = true; this.render();
      } else if (mi === 'saveAll') {
        this.download(this.list(), this.folderId
          ? ((S.tree.folders[this.folderId] || {}).name || 'папка') : 'Все файлы');
      }
    },

    folderMenu: function (id) {
      var self = this, App = global.App;
      var f = (S.tree.folders || {})[id];
      if (!f) return;
      App.modal('Папка «' + f.name + '»',
        '<p class="note">Если удалить папку, файлы из неё не пропадут — они вернутся в общий список.</p>',
        [
          { text: 'Переименовать', fn: function () {
            App.closeModal();
            App.prompt('Новое название', '', f.name, function (v) {
              if (v && v.trim()) { self.renameFolder(id, v.trim()); self.render(); }
            });
          } },
          { text: 'Удалить папку', danger: true, fn: function () {
            App.closeModal();
            self.dropFolder(id);
            if (self.folderId === id) self.folderId = null;
            self.render();
          } }
        ]);
    },

    moveDialog: function (list) {
      var self = this, App = global.App;
      var folders = this.folders();
      App.modal('Переложить ' + list.length + ' ' + plural(list.length, 'файл', 'файла', 'файлов'),
        '<div class="row"><label for="mvFld">Куда</label><select id="mvFld">' +
        '<option value="">Без папки</option>' +
        folders.map(function (f) { return '<option value="' + esc(f.id) + '">' + esc(f.name) + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="btn-row"><button class="btn btn-sm" id="mvNew">+ Новая папка</button></div>',
        [{ text: 'Переложить', primary: true, fn: function () {
          var v = document.getElementById('mvFld').value || null;
          var stamp = new Date().toISOString();
          list.forEach(function (m) { m.folderId = v; m.updated = stamp; });
          S.save();
          App.closeModal();
          self.sel = {};
          self.render();
          App.toast('Переложено');
        } }]);
      document.getElementById('mvNew').addEventListener('click', function () {
        App.prompt('Новая папка', 'Как её назвать?', '', function (name) {
          if (!name || !name.trim()) return;
          var id = self.addFolder(name.trim());
          var sel = document.getElementById('mvFld');
          if (sel) {
            var o = document.createElement('option');
            o.value = id; o.textContent = name.trim();
            sel.appendChild(o); sel.value = id;
          }
        });
      });
    },

    aclDialog: function (list) {
      var self = this, App = global.App;
      App.modal('Кому видны эти файлы',
        '<div class="row"><label for="faLvl">Доступ</label><select id="faLvl">' +
        '<option value="public">Всем, кто открыл дерево</option>' +
        '<option value="group">Только вошедшим</option>' +
        '<option value="chosen">Только выбранным</option>' +
        '<option value="admin">Только администратору</option>' +
        '</select></div>' +
        '<p class="note" id="faNote">Выбор применится сразу ко всем ' + list.length + ' файлам.</p>',
        [{ text: 'Применить', primary: true, fn: function () {
          var lvl = document.getElementById('faLvl').value;
          var stamp = new Date().toISOString();
          function apply(allow) {
            list.forEach(function (m) {
              m.acl = m.acl || {};
              m.acl.level = lvl;
              if (lvl === 'chosen') m.acl.allow = (allow || []).slice();
              m.updated = stamp;
            });
            S.save();
            App.closeAllModals();
            self.sel = {};
            self.render();
            App.toast('Доступ изменён');
          }
          if (lvl === 'chosen') {
            var tmp = { level: 'chosen', allow: [] };
            App.pickViewers(tmp, function () { apply(tmp.allow); });
          } else apply();
        } }]);
    },

    /* ---------- скачивание ---------- */
    /** Один файл отдаём как есть, несколько — архивом. */
    download: function (list, zipName) {
      var App = global.App;
      if (!list || !list.length) { App.toast('Нечего скачивать'); return; }
      if (list.length === 1) {
        var m = list[0];
        S.mediaBlob(m.id).then(function (b) {
          if (!b) { App.toast('Файл не нашёлся на этом устройстве'); return; }
          App.saveFile(b, m.name || 'файл');
        });
        return;
      }
      App.toast('Собираю архив…');
      var files = [], i = 0, used = {};
      (function step() {
        if (i >= list.length) {
          if (!files.length) { App.toast('Ни один файл не нашёлся на этом устройстве'); return; }
          var blob = global.IO.zip(files);
          App.saveFile(blob, (zipName || 'Файлы') + '.zip');
          return;
        }
        var m = list[i++];
        S.mediaBlob(m.id).then(function (b) {
          if (!b) return step();
          var name = m.name || (m.id + '.bin');
          if (used[name]) name = name.replace(/(\.[^.]+)?$/, '-' + used[name] + '$1');
          used[m.name] = (used[m.name] || 0) + 1;
          return b.arrayBuffer().then(function (ab) {
            files.push({ name: name, data: new Uint8Array(ab) });
            step();
          });
        }, step);
      })();
    }
  };

  /* Статические помощники: ими пользуются просмотрщик и другие части. */
  FilesView.download = function (list, zipName) {
    return FilesView.prototype.download.call({}, list, zipName);
  };

  global.FilesView = FilesView;
  global.Gallery = new FilesView({});
  global.Files = global.Gallery;      // прежнее имя: раздел «Галерея»
})(window);
</script>
<script>/* Семейное Древо — просмотрщик фотографий, видео и документов.

   Повадки взяты у «Фотографий» Windows 10: открывается во весь экран,
   стрелки листают, колесо приближает, пробел — пауза у видео, есть сведения
   о файле и простое редактирование — поворот, отражение, обрезка.

   Правка не затирает исходник: сохранить можно поверх или отдельной копией. */
(function (global) {
  'use strict';

  var S = global.Store;
  function esc(s) { return global.TreeView.esc(s); }
  function I(n) { return global.Icon(n); }

  var Viewer = {
    list: [], i: 0, el: null, scale: 1, tx: 0, ty: 0,
    editing: false, rot: 0, flip: false, crop: null,
    urls: [],

    open: function (list, id) {
      var self = this;
      // если просмотрщик уже открыт, сперва убираем старый: иначе окна
      // наслаиваются друг на друга и видно нижнее
      if (this.el) this.close();
      this.list = (list || []).filter(function (m) { return S.canSee(m.acl); });
      this.i = Math.max(0, this.list.findIndex(function (m) { return m.id === id; }));
      if (!this.list.length) return;
      this.build();
      this.show();
      // во весь экран — как в «Фотографиях»; если браузер не даст, останемся
      // в своём полноэкранном слое, он и так на всё окно
      if (this.el.requestFullscreen) this.el.requestFullscreen().catch(function () {});
      document.addEventListener('keydown', this._key = function (e) { self.onKey(e); });
    },

    close: function () {
      if (document.fullscreenElement) document.exitFullscreen().catch(function () {});
      document.removeEventListener('keydown', this._key);
      if (this._ro) { this._ro.disconnect(); this._ro = null; }
      this.revoke();
      if (this.el) { this.el.remove(); this.el = null; }
    },
    revoke: function () {
      this.urls.forEach(function (u) { try { URL.revokeObjectURL(u); } catch (e) {} });
      this.urls = [];
    },

    cur: function () { return this.list[this.i]; },

    build: function () {
      var self = this;
      var el = document.createElement('div');
      el.className = 'viewer';
      el.innerHTML =
        '<div class="vw-top">' +
        '<span class="vw-title" id="vwTitle"></span>' +
        '<span class="vw-count" id="vwCount"></span>' +
        '<span class="spacer"></span>' +
        '<button class="vw-btn" id="vwInfo" title="Сведения">' + I('info') + '</button>' +
        '<button class="vw-btn" id="vwFaces" title="Кто на снимке">' + I('person') + '</button>' +
        '<button class="vw-btn" id="vwEdit" title="Изменить">' + I('crop') + '</button>' +
        '<button class="vw-btn" id="vwGet" title="Скачать">' + I('download') + '</button>' +
        '<button class="vw-btn" id="vwStar" title="Сделать главным фото">' + I('star') + '</button>' +
        '<button class="vw-btn" id="vwDel" title="Удалить">' + I('trash') + '</button>' +
        '<button class="vw-btn" id="vwFull" title="Во весь экран">' + I('fullscreen') + '</button>' +
        '<button class="vw-btn" id="vwClose" title="Закрыть (Esc)">' + I('close') + '</button>' +
        '</div>' +
        '<button class="vw-nav prev" id="vwPrev" title="Предыдущий">' + I('prev') + '</button>' +
        '<button class="vw-nav next" id="vwNext" title="Следующий">' + I('next') + '</button>' +
        '<div class="vw-stage" id="vwStage"></div>' +
        '<aside class="vw-info" id="vwPane" hidden></aside>' +
        '<div class="vw-edit" id="vwEditBar" hidden>' +
        '<button class="btn btn-sm" data-ed="rot">' + I('rotate') + ' Повернуть</button>' +
        '<button class="btn btn-sm" data-ed="flip">Отразить</button>' +
        '<button class="btn btn-sm" data-ed="crop">' + I('crop') + ' Обрезать</button>' +
        '<span class="spacer"></span>' +
        '<button class="btn btn-sm" data-ed="cancel">Отмена</button>' +
        '<button class="btn btn-sm" data-ed="copy">Сохранить копией</button>' +
        '<button class="btn btn-sm btn-primary" data-ed="save">Сохранить</button>' +
        '</div>' +
        '<div class="vw-zoom">' +
        '<button class="vw-btn" id="vwOut" title="Отдалить">' + I('minus') + '</button>' +
        '<span id="vwScale">100%</span>' +
        '<button class="vw-btn" id="vwIn" title="Приблизить">' + I('plus') + '</button>' +
        '<button class="vw-btn" id="vwFit" title="Вписать">' + I('expand') + '</button>' +
        '</div>';
      document.body.appendChild(el);
      this.el = el;

      var on = function (id, fn) { el.querySelector(id).addEventListener('click', fn); };
      on('#vwClose', function () { self.close(); });
      on('#vwPrev', function () { self.step(-1); });
      on('#vwNext', function () { self.step(1); });
      on('#vwIn', function () { self.zoom(1.25); });
      on('#vwOut', function () { self.zoom(1 / 1.25); });
      on('#vwFit', function () { self.fit(); });
      on('#vwInfo', function () {
        var pane = el.querySelector('#vwPane');
        pane.hidden = !pane.hidden;
        if (!pane.hidden) self.paintInfo();
      });
      on('#vwFull', function () {
        if (document.fullscreenElement) document.exitFullscreen();
        else if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
      });
      on('#vwGet', function () { global.Files.download([self.cur()], 'файл'); });
      on('#vwStar', function () {
        var m = self.cur();
        if (m.kind !== 'photo') { global.App.toast('Главным может быть только снимок'); return; }
        S.updatePerson(m.personId, { photo: m.id });
        global.App.toast('Теперь это главное фото');
        global.App.tree.render();
      });
      on('#vwDel', function () {
        var m = self.cur();
        global.App.confirm('Удалить «' + (m.caption || m.name) + '»?',
          'Файл уйдёт в корзину — оттуда его можно вернуть.', function () {
            S.removeMedia(m.id);
            global.App.paintTrash();
            global.App.tree.render();
            self.list.splice(self.i, 1);
            if (!self.list.length) { self.close(); }
            else { if (self.i >= self.list.length) self.i = self.list.length - 1; self.show(); }
            if (global.App.activeTab === 'photos') global.Files.render();
          });
      });
      on('#vwEdit', function () { self.toggleEdit(); });
      on('#vwFaces', function () {
        var m = self.cur();
        if (!m) return;
        /* Просмотрщик открыт во весь экран, и окно поверх него браузер
           просто не покажет. Поэтому снимок закрываем, разбираем лица —
           и возвращаемся к нему же. */
        var list = self.list.slice();
        self.close();
        global.FaceEdit.open(m.id, function () { global.Viewer.open(list, m.id); });
      });

      el.querySelectorAll('[data-ed]').forEach(function (b) {
        b.addEventListener('click', function () { self.editAction(b.dataset.ed); });
      });

      var stage = el.querySelector('#vwStage');
      stage.addEventListener('wheel', function (e) {
        if (self.cur().kind !== 'photo') return;
        e.preventDefault();
        self.zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY);
      }, { passive: false });

      var drag = null;
      stage.addEventListener('pointerdown', function (e) {
        if (self.scale <= 1 || self.editing) return;
        drag = { x: e.clientX, y: e.clientY, tx: self.tx, ty: self.ty };
        stage.setPointerCapture(e.pointerId);
      });
      stage.addEventListener('pointermove', function (e) {
        if (!drag) return;
        self.tx = drag.tx + (e.clientX - drag.x);
        self.ty = drag.ty + (e.clientY - drag.y);
        self.applyT();
      });
      stage.addEventListener('pointerup', function () { drag = null; });
      stage.addEventListener('dblclick', function () {
        if (self.scale > 1) self.fit(); else self.zoom(2);
      });
    },

    onKey: function (e) {
      if (!this.el) return;
      if (e.key === 'Escape') { e.preventDefault(); this.close(); }
      else if (e.key === 'ArrowRight') this.step(1);
      else if (e.key === 'ArrowLeft') this.step(-1);
      else if (e.key === '+' || e.key === '=') this.zoom(1.25);
      else if (e.key === '-') this.zoom(1 / 1.25);
      else if (e.key === '0') this.fit();
      else if (e.key === ' ') {
        var v = this.el.querySelector('video');
        if (v) { e.preventDefault(); if (v.paused) v.play(); else v.pause(); }
      }
    },

    step: function (d) {
      if (this.editing) return;
      this.i = (this.i + d + this.list.length) % this.list.length;
      this.show();
    },

    show: function () {
      var self = this, m = this.cur();
      if (!m) return;
      this.scale = 1; this.tx = 0; this.ty = 0; this._baked = null;
      this.rot = 0; this.flip = false; this.crop = null;
      this.editing = false;
      this.el.querySelector('#vwEditBar').hidden = true;
      this.el.querySelector('#vwTitle').textContent = m.caption || m.name || '';
      this.el.querySelector('#vwCount').textContent = (this.i + 1) + ' из ' + this.list.length;
      this.el.querySelector('#vwEdit').hidden = m.kind !== 'photo';
      this.el.querySelector('#vwFaces').hidden = m.kind !== 'photo';
      this.el.querySelector('#vwStar').hidden = m.kind !== 'photo';
      var stage = this.el.querySelector('#vwStage');
      stage.innerHTML = '<div class="vw-wait">Открываю…</div>';
      this.revoke();

      S.mediaURL(m.id).then(function (url) {
        if (!url) {
          stage.innerHTML = '<div class="vw-wait">Файла нет на этом устройстве.<br>' +
            'Он подтянется при синхронизации.</div>';
          return;
        }
        self.urls.push(url);
        if (m.kind === 'photo') {
          stage.innerHTML = '<img id="vwImg" src="' + url + '" alt="" draggable="false">';
          var img = stage.querySelector('img');
          img.addEventListener('load', function () { self.fit(); });
          // размеры области меняются при повороте телефона и показе сведений
          if (self._ro) self._ro.disconnect();
          if (global.ResizeObserver) {
            self._ro = new ResizeObserver(function () { if (!self._userZoom) self.fit(); });
            self._ro.observe(stage);
          }
        } else if (m.kind === 'video') {
          self.showVideo(stage, m, url);
        } else if (m.kind === 'audio') {
          stage.innerHTML = '<div class="vw-doc">' + I('mic') +
            '<div>' + esc(m.name) + '</div><audio controls src="' + url + '"></audio></div>';
        } else {
          stage.innerHTML = '<div class="vw-doc">' + I('note') +
            '<div>' + esc(m.name) + '</div>' +
            '<p class="note">Этот файл программа показать не умеет — скачайте его ' +
            'и откройте в своей программе.</p>' +
            '<button class="btn btn-sm" id="vwDocGet">' + I('download') + ' Скачать</button></div>';
          var g = stage.querySelector('#vwDocGet');
          if (g) g.addEventListener('click', function () { global.Files.download([m], 'файл'); });
        }
        if (!self.el.querySelector('#vwPane').hidden) self.paintInfo();
      });
    },

    /* Видео: браузер умеет не всякий формат. Если не берёт — говорим прямо,
       что это за формат и что с ним делать, вместо чёрного прямоугольника. */
    showVideo: function (stage, m, url) {
      var self = this;
      stage.innerHTML = '<video id="vwVid" controls autoplay playsinline src="' + url + '"></video>';
      var v = stage.querySelector('video');
      v.addEventListener('error', function () {
        var fmt = (m.name.match(/\.([a-z0-9]+)$/i) || [, ''])[1].toUpperCase();
        stage.innerHTML = '<div class="vw-doc">' + I('play') +
          '<div>' + esc(m.name) + '</div>' +
          '<p class="note">Это видео браузер проигрывать не умеет' +
          (fmt ? ' (' + esc(fmt) + ')' : '') + '. Чаще всего так бывает с записями ' +
          'с телефона в формате HEVC и со старыми AVI.</p>' +
          '<p class="note">Файл цел и хранится в дереве — скачайте его и откройте ' +
          'любым проигрывателем на компьютере или телефоне.</p>' +
          '<button class="btn btn-sm" id="vwVidGet">' + I('download') + ' Скачать видео</button></div>';
        var g = stage.querySelector('#vwVidGet');
        if (g) g.addEventListener('click', function () { global.Files.download([m], 'видео'); });
      });
    },

    paintInfo: function () {
      var m = this.cur(), who = S.person(m.personId);
      var pane = this.el.querySelector('#vwPane');
      var img = this.el.querySelector('#vwImg');
      var rows = [
        ['Название', m.caption || m.name],
        ['Имя файла', m.name],
        ['Человек', who ? S.fullName(who) : '—'],
        ['Вид', { photo: 'фотография', video: 'видео', audio: 'запись звука' }[m.kind] || 'документ'],
        ['Тип', m.mime || '—'],
        ['Размер', Math.round((m.size || 0) / 1024) + ' КБ'],
        ['Добавлен', m.added ? new Date(m.added).toLocaleString('ru-RU') : '—'],
        ['Изменён', m.updated ? new Date(m.updated).toLocaleString('ru-RU') : '—'],
        ['Защита', m.encrypted ? 'зашифрован' : 'обычный'],
        ['Кому виден', { public: 'всем', group: 'вошедшим', chosen: 'выбранным',
          admin: 'администратору' }[(m.acl || {}).level] || 'всем']
      ];
      if (img && img.naturalWidth) {
        rows.splice(5, 0, ['Размер снимка', img.naturalWidth + ' × ' + img.naturalHeight + ' точек']);
      }
      if (m.folderId && S.tree.folders && S.tree.folders[m.folderId]) {
        rows.splice(2, 0, ['Папка', S.tree.folders[m.folderId].name]);
      }
      pane.innerHTML = '<h3>Сведения</h3><table class="data"><tbody>' +
        rows.map(function (r) {
          return '<tr><th>' + esc(r[0]) + '</th><td>' + esc(r[1]) + '</td></tr>';
        }).join('') + '</tbody></table>';
    },

    /* ---------- масштаб ----------
       Масштаб считается от настоящего размера снимка, а «вписать» подбирает
       его так, чтобы фотография целиком помещалась в окно. */
    /* Размер снимка задаём самой картинке, а не transform. Уменьшенная
       через transform фотография выглядит мыльной: видеокарта берёт грубую
       выборку из полного кадра, и мелкие детали смазываются — потому при
       увеличении резкость будто «возвращалась». Заданная ширина
       пересчитывается браузером честно, и снимок резкий с первого взгляда.
       На время жеста (колесо, щипок) оставляем transform — так плавнее, —
       а через мгновение после него размер пересчитывается. */
    applyT: function (live) {
      var img = this.el.querySelector('#vwImg');
      if (!img) return;
      var k = 1, nw = img.naturalWidth, nh = img.naturalHeight;
      if (nw && nh) {
        if (!live || this._baked == null) this._baked = this.scale;
        img.style.width = Math.max(1, Math.round(nw * this._baked)) + 'px';
        img.style.height = Math.max(1, Math.round(nh * this._baked)) + 'px';
        k = this.scale / this._baked;
      }
      img.style.transform = 'translate(-50%,-50%) translate(' + Math.round(this.tx) + 'px,' +
        Math.round(this.ty) + 'px) scale(' + k + ')' +
        ' rotate(' + this.rot + 'deg)' + (this.flip ? ' scaleX(-1)' : '');
      var s = this.el.querySelector('#vwScale');
      if (s) s.textContent = Math.round(this.scale * 100) + '%';
    },
    /** довести размер картинки до текущего масштаба, когда жест закончился */
    bakeSoon: function () {
      var self = this;
      clearTimeout(this._bakeT);
      this._bakeT = setTimeout(function () { self.applyT(); }, 160);
    },
    zoom: function (k, cx, cy) {
      var img = this.el.querySelector('#vwImg');
      if (!img) return;
      this._userZoom = true;
      var ns = Math.min(8, Math.max(0.05, this.scale * k));
      var stage = this.el.querySelector('#vwStage').getBoundingClientRect();
      // середина окна, если не сказано иначе
      var mx = stage.left + stage.width / 2 + this.tx;
      var my = stage.top + stage.height / 2 + this.ty;
      if (cx == null) { cx = mx; cy = my; }
      var kk = ns / this.scale;
      this.tx = this.tx - (cx - mx) * (kk - 1);
      this.ty = this.ty - (cy - my) * (kk - 1);
      this.scale = ns;
      this.applyT(true);
      this.bakeSoon();
    },
    fit: function () {
      var img = this.el.querySelector('#vwImg');
      var stage = this.el.querySelector('#vwStage');
      this.tx = 0; this.ty = 0;
      this._userZoom = false;
      if (!img || !img.naturalWidth || !stage) { this.scale = 1; this.applyT(); return; }
      var r = stage.getBoundingClientRect();
      var swap = (this.rot === 90 || this.rot === 270);
      var iw = swap ? img.naturalHeight : img.naturalWidth;
      var ih = swap ? img.naturalWidth : img.naturalHeight;
      var pad = 24;
      // вписываем, но не раздуваем: маленький снимок показываем как есть,
      // иначе получится мыльное пятно во весь экран
      this.scale = Math.min((r.width - pad) / iw, (r.height - pad) / ih, 1);
      if (!isFinite(this.scale) || this.scale <= 0) this.scale = 1;
      this.applyT();
    },

    /* ---------- правка ---------- */
    toggleEdit: function () {
      if (this.cur().kind !== 'photo') return;
      this.editing = !this.editing;
      this.el.querySelector('#vwEditBar').hidden = !this.editing;
      this.el.classList.toggle('is-editing', this.editing);
      if (!this.editing) { this.rot = 0; this.flip = false; this.clearCrop(); this.applyT(); }
    },
    editAction: function (what) {
      var self = this;
      if (what === 'rot') { this.rot = (this.rot + 90) % 360; this.fit(); }
      else if (what === 'flip') { this.flip = !this.flip; this.applyT(); }
      else if (what === 'crop') { this.startCrop(); }
      else if (what === 'cancel') { this.toggleEdit(); this.show(); }
      else if (what === 'save' || what === 'copy') { this.saveEdited(what === 'copy'); }
    },

    startCrop: function () {
      var self = this, stage = this.el.querySelector('#vwStage');
      var img = stage.querySelector('#vwImg');
      if (!img) return;
      this.clearCrop();
      var box = document.createElement('div');
      box.className = 'vw-crop';
      stage.appendChild(box);
      var r = img.getBoundingClientRect(), sr = stage.getBoundingClientRect();
      var c = { x: r.left - sr.left + r.width * 0.1, y: r.top - sr.top + r.height * 0.1,
                w: r.width * 0.8, h: r.height * 0.8 };
      function paint() {
        box.style.left = c.x + 'px'; box.style.top = c.y + 'px';
        box.style.width = c.w + 'px'; box.style.height = c.h + 'px';
      }
      paint();
      var drag = null;
      box.addEventListener('pointerdown', function (e) {
        var b = box.getBoundingClientRect();
        var corner = (e.clientX > b.right - 24 && e.clientY > b.bottom - 24);
        drag = { x: e.clientX, y: e.clientY, c: { x: c.x, y: c.y, w: c.w, h: c.h }, corner: corner };
        box.setPointerCapture(e.pointerId);
      });
      box.addEventListener('pointermove', function (e) {
        if (!drag) return;
        var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (drag.corner) { c.w = Math.max(24, drag.c.w + dx); c.h = Math.max(24, drag.c.h + dy); }
        else { c.x = drag.c.x + dx; c.y = drag.c.y + dy; }
        paint();
      });
      box.addEventListener('pointerup', function () { drag = null; });
      this.crop = { box: box, rect: c, img: img };
    },
    clearCrop: function () {
      if (this.crop && this.crop.box) this.crop.box.remove();
      this.crop = null;
    },

    /** Перерисовываем снимок в холсте с учётом поворота, отражения и рамки. */
    saveEdited: function (asCopy) {
      var self = this, m = this.cur();
      var img = this.el.querySelector('#vwImg');
      if (!img) return;
      var natural = { w: img.naturalWidth, h: img.naturalHeight };
      var shown = img.getBoundingClientRect();
      var sx = 0, sy = 0, sw = natural.w, sh = natural.h;
      if (this.crop) {
        var sr = this.el.querySelector('#vwStage').getBoundingClientRect();
        var c = this.crop.rect;
        var k = natural.w / shown.width;
        sx = Math.max(0, (c.x + sr.left - shown.left) * k);
        sy = Math.max(0, (c.y + sr.top - shown.top) * k);
        sw = Math.min(natural.w - sx, c.w * k);
        sh = Math.min(natural.h - sy, c.h * k);
      }
      var rot = this.rot, flip = this.flip;
      var cv = document.createElement('canvas');
      var swap = (rot === 90 || rot === 270);
      cv.width = Math.round(swap ? sh : sw);
      cv.height = Math.round(swap ? sw : sh);
      var g = cv.getContext('2d');
      g.translate(cv.width / 2, cv.height / 2);
      g.rotate(rot * Math.PI / 180);
      if (flip) g.scale(-1, 1);
      g.drawImage(img, sx, sy, sw, sh, -sw / 2, -sh / 2, sw, sh);
      cv.toBlob(function (blob) {
        if (!blob) { global.App.toast('Не получилось сохранить'); return; }
        var name = m.name || 'фото.jpg';
        if (asCopy) name = name.replace(/(\.[^.]+)?$/, '-правка$1');
        var file = new File([blob], name, { type: blob.type || 'image/jpeg' });
        if (asCopy) {
          S.addMedia(m.personId, file, { acl: m.acl }).then(function (nm) {
            global.App.toast('Сохранено копией');
            self.toggleEdit();
            if (global.App.activeTab === 'photos') global.Files.render();
            self.list.push(S.tree.media[nm.id || nm]);
            self.i = self.list.length - 1;
            self.show();
          });
        } else {
          S.replaceMedia(m.id, file).then(function () {
            global.App.toast('Сохранено');
            self.toggleEdit();
            global.App.tree.render();
            if (global.App.activeTab === 'photos') global.Files.render();
            self.show();
          }, function (e) { global.App.toast('Не вышло: ' + e.message); });
        }
      }, 'image/jpeg', 0.92);
    }
  };

  global.Viewer = Viewer;
})(window);
</script>
<script>/* Семейное Древо — карточка персоны: сведения, медиа, записи, контакты, события, доступ, родня. */
(function (global) {
  'use strict';
  var S = global.Store;
  var U = S.util;
  var esc = global.TreeView.esc;
  var I = global.Icon;

  var ACL_LEVELS = [
    { v: 'public', t: 'Видно всем' },
    { v: 'group', t: 'Только вошедшим' },
    { v: 'chosen', t: 'Только выбранным' },
    { v: 'admin', t: 'Только администратору' }
  ];

  function Sheet(opts) {
    this.el = opts.el;
    this.onChange = opts.onChange || function () {};
    this.onFocus = opts.onFocus || function () {};
    this.onOpen = opts.onOpen || function () {};
    this.pending = [];
    this.toast = opts.toast || function () {};
    this.personId = null;
    this.tab = 'info';
    this.urls = [];
    this._bind();
  }

  Sheet.prototype.open = function (id) {
    var self = this;
    if (this.personId && this.personId !== id && this.hasPending()) {
      this.guard(function () { self.openNow(id); });
      return;
    }
    this.openNow(id);
  };
  Sheet.prototype.openNow = function (id) {
    this.pending = [];
    this.personId = id;
    this.el.hidden = false;
    this.render();
    if (this.onOpen) this.onOpen(id);
  };
  Sheet.prototype.close = function () {
    var self = this;
    this.guard(function () {
      self.el.hidden = true;
      self.revoke();
      self.personId = null;
      self.pending = [];
      if (self.onOpen) self.onOpen(null);
    });
  };
  Sheet.prototype.revoke = function () {
    this.urls.forEach(function (u) { try { URL.revokeObjectURL(u); } catch (e) {} });
    this.urls = [];
  };
  Sheet.prototype._bind = function () {
    var self = this;
    this.el.addEventListener('click', function (e) {
      var t = e.target.closest('[data-act]');
      if (!t) return;
      var act = t.dataset.act;
      if (self.actions[act]) { e.preventDefault(); self.actions[act].call(self, t); }
    });
    function onEdit(e) {
      var f = e.target.closest('[data-bind]');
      if (f) self.applyField(f);
    }
    this.el.addEventListener('change', onEdit);
    this.el.addEventListener('input', onEdit);
  };

  /* --------- чтение и запись полей --------- */
  Sheet.prototype.applyField = function (input) {
    var p = S.person(this.personId);
    if (!p) return;
    var path = input.dataset.bind.split('.');
    var val = input.type === 'checkbox' ? input.checked : input.value;
    var self = this;
    /* Персону берём в момент сохранения, а не сейчас: пока правка ждёт
       кнопки, могла прийти синхронизация и подменить объект дерева —
       запись в старый объект просто пропала бы. */
    this.stage('bind:' + input.dataset.bind, function () {
      var o = S.person(self.personId);
      if (!o) return;
      for (var i = 0; i < path.length - 1; i++) { o[path[i]] = o[path[i]] || {}; o = o[path[i]]; }
      o[path[path.length - 1]] = val;
    });
  };

  /* --------- отрисовка --------- */
  Sheet.prototype.render = function () {
    var p = S.person(this.personId);
    if (!p) { this.close(); return; }
    this.revoke();
    /* «Доступ» — хозяйская вкладка: обычному родственнику решать, кому что
       видно, всё равно нельзя, и лишний раздел только путает. */
    var tabs = [
      ['info', 'Сведения'], ['media', 'Фото и файлы'], ['notes', 'Записи'],
      ['contacts', 'Контакты'], ['events', 'События'], ['family', 'Родня']
    ];
    if (S.isAdmin()) tabs.push(['access', 'Доступ']);
    if (!S.isAdmin() && this.tab === 'access') this.tab = 'info';
    this.el.innerHTML =
      '<div class="sheet-head">' +
      '<div class="sheet-ph" id="shPhoto"></div>' +
      '<div style="flex:1 1 auto;min-width:0">' +
      '<div class="sheet-title" id="shName"></div>' +
      '<div class="sheet-sub" id="shSub"></div>' +
      '<div class="btn-row" style="margin-top:6px">' +
      '<button class="btn btn-sm" data-act="focus">В центр дерева</button>' +
      '<button class="btn btn-sm" data-act="addRel">+ Родственник</button>' +
      '</div></div>' +
      '<button class="icon-btn" data-act="close" title="Закрыть" aria-label="Закрыть">' + I('close') + '</button>' +
      '</div>' +
      '<div class="sheet-tabs" role="tablist">' +
      tabs.map(function (t) {
        return '<button role="tab" data-act="tab" data-tab="' + t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>' +
      '<div class="sheet-body" id="shBody"></div>' +
      /* Полоса сохранения стоит всегда. Раньше она появлялась только после
         правки, и кнопку «Сохранить» просто не находили глазами: человек
         не знал, записалось введённое или нет. */
      '<div class="sheet-bar" id="shBar">' +
      '<span class="bar-count"></span>' +
      '<button class="btn btn-sm" data-act="discard">Отменить</button>' +
      '<button class="btn btn-sm btn-primary" data-act="commit">Сохранить</button>' +
      '</div>' +
      '<div class="sheet-grip" id="shGrip" title="Потянуть, чтобы сделать шире"></div>';
    this.applyWidth();
    this.bindGrip();
    this.renderHead();
    this.renderBody();
    this.paintBar();
  };

  /* Ширина карточки: на широком мониторе хочется видеть больше, на ноутбуке —
     чтобы карточка не закрывала дерево. Выбор запоминается у каждого свой. */
  Sheet.prototype.applyWidth = function () {
    var w = (S.prefs && S.prefs.sheetWidth) || 370;
    this.el.style.width = Math.max(300, Math.min(900, w)) + 'px';
  };
  Sheet.prototype.bindGrip = function () {
    var self = this, grip = this.el.querySelector('#shGrip');
    if (!grip) return;
    var drag = null;
    grip.addEventListener('pointerdown', function (e) {
      drag = { x: e.clientX, w: self.el.getBoundingClientRect().width };
      grip.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    grip.addEventListener('pointermove', function (e) {
      if (!drag) return;
      self.el.style.width = Math.max(300, Math.min(900, drag.w + (e.clientX - drag.x))) + 'px';
    });
    function stop() {
      if (!drag) return;
      drag = null;
      S.prefs.sheetWidth = Math.round(self.el.getBoundingClientRect().width);
      S.savePrefs();
    }
    grip.addEventListener('pointerup', stop);
    grip.addEventListener('pointercancel', stop);
    grip.addEventListener('dblclick', function () {
      S.prefs.sheetWidth = 370; S.savePrefs(); self.applyWidth();
    });
  };

  Sheet.prototype.renderHead = function () {
    var p = S.person(this.personId), self = this;
    if (!p) return;
    this.el.querySelector('#shName').textContent = S.fullName(p);
    var bits = [];
    if (S.years(p)) bits.push(S.years(p));
    if (p.birth && p.birth.place) bits.push(p.birth.place);
    this.el.querySelector('#shSub').textContent = bits.join(' · ') || 'даты не указаны';
    var ph = this.el.querySelector('#shPhoto');
    ph.style.backgroundImage = '';
    var gone = (p.death && p.death.date) || p.living === false;
    ph.innerHTML = I(p.sex === 'M' ? 'personM' : p.sex === 'F' ? 'personF' : 'person') +
      (gone ? '<span class="mourn-corner"></span>' : '');
    if (p.photo) {
      S.mediaURL(p.photo).then(function (url) {
        if (!url) return;
        self.urls.push(url);
        ph.style.backgroundImage = 'url(' + url + ')';
        ph.innerHTML = gone ? '<span class="mourn-corner"></span>' : '';
      });
    }
    this.el.querySelectorAll('[data-act="tab"]').forEach(function (b) {
      b.setAttribute('aria-selected', b.dataset.tab === self.tab ? 'true' : 'false');
    });
  };

  Sheet.prototype.renderBody = function () {
    var p = S.person(this.personId);
    if (!p) return;
    var body = this.el.querySelector('#shBody');
    body.innerHTML = this.views[this.tab].call(this, p);
    this.after[this.tab] && this.after[this.tab].call(this, p, body);
    var self = this;
    this.el.querySelectorAll('[data-act="tab"]').forEach(function (b) {
      b.setAttribute('aria-selected', b.dataset.tab === self.tab ? 'true' : 'false');
    });
  };

  var MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн',
    'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

  function micBtn(target) {
    return '<button class="btn btn-sm mic-btn" data-act="dictate" data-target="' + target +
      '" title="Надиктовать" aria-label="Надиктовать">' + I('mic') + '</button>';
  }
  /** Выбор видимости: список уровней, а для «только выбранным» — кнопка
      с поимённым перечнем тех, кому запись открыта. */
  /* Кому видна запись решает хозяин дерева. Остальным этот выбор не
     показываем — только пометку, если запись закрыта. */
  function aclSelect(bindAttr, acl) {
    acl = acl || { level: 'public', locked: false };
    if (!S.isAdmin()) {
      if (acl.level === 'public' && !acl.locked) return '';
      return '<span class="chip lock">' + I('lock') + ' ограниченный доступ</span>';
    }
    var out = '<select data-acl="' + bindAttr + '">' + ACL_LEVELS.map(function (l) {
      return '<option value="' + l.v + '"' + (acl.level === l.v ? ' selected' : '') + '>' + l.t + '</option>';
    }).join('') + '</select>';
    if (acl.level === 'chosen') {
      var names = S.allowedNames(acl);
      out += '<button class="btn btn-sm" data-act="pickViewers" data-key="' + bindAttr + '" ' +
        'title="Кому открыта эта запись">' + I('person') +
        (names.length ? ' ' + names.length : ' выбрать') + '</button>';
      if (names.length) out += '<span class="note acl-names">' + esc(names.join(', ')) + '</span>';
    }
    return out;
  }

  Sheet.prototype.views = {
    info: function (p) {
      return '' +
        row('Фамилия', '<input data-bind="surname" value="' + esc(p.surname) + '">') +
        row('Имя', '<input data-bind="given" value="' + esc(p.given) + '">') +
        row('Отчество', '<input data-bind="patronymic" value="' + esc(p.patronymic) + '">') +

        'выберите «Только вошедшим» или «Только администратору».</p><div class="list">' +

    events: function (p) {
      /* Раньше каждое событие было развёрнутой формой, и вкладка выглядела

         открывается отдельным окном по нажатию. */
      var evs = (p.events || []).slice().sort(function (a, b) {
        var ad = a.date || '', bd = b.date || '';
        if (!ad && !bd) return 0;

        return ad.localeCompare(bd);

      if (!evs.length) {

          (e.note ? '<span class="ev-note">' + esc(e.note) + '</span>' : '') +

          (e.acl && (e.acl.locked || e.acl.level !== 'public')
            ? '<span class="ev-lock" title="Ограниченный доступ">' + I('lock') + '</span>' : '') +

    family: function (p) {
      var par = S.parentsOf(p.id), sp = S.spousesOf(p.id), ch = S.childrenOf(p.id), sib = S.siblingsOf(p.id);
      function group(title, arr, rel) {

    access: function (p) {

        'каждый своим замком на соответствующих вкладках.</p>' +
        row('Видимость', '<div class="acl-ctl">' + aclSelect('person', a) + '</div>') +
        row('Замок', '<label class="inline"><input type="checkbox" data-lock="person"' + (a.locked ? ' checked' : '') +
          '> <span class="note">запретить изменение всем, кроме администратора</span></label>') +
        '<div class="sect-title">Что это значит</div>' +
        '<p class="note"><b>Видно всем</b> — запись открыта любому, кто откроет дерево.<br>' +
        '<b>Только вошедшим</b> — её видят все, у кого есть логин.<br>' +
        '<b>Только выбранным</b> — вы сами отмечаете, кому из родственников она видна; ' +

        '<b>Только администратору</b> — скрыта у всех обычных пользователей.</p>' +
