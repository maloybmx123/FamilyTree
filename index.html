        'Ключ выводится из пароля дерева и нигде не хранится.</p>';
    }
  };

  Sheet.prototype.after = {
    media: function (p, body) {
      // свой вид файлов на каждого человека, чтобы выбор и открытая папка
      // не перепрыгивали с одной карточки на другую
      if (!this.filesView || this.filesView.personId !== p.id) {
        this.filesView = new global.FilesView({
          personId: p.id,
          host: function () { return document.getElementById('shFiles'); }
        });
      }
      this.filesView.render();
    },
    family: function (p, body) {
      var self = this;
      body.querySelectorAll('[data-ph]').forEach(function (el) {
        var per = S.person(el.dataset.ph);
        if (!per || !per.photo) return;
        S.mediaURL(per.photo).then(function (url) {
          if (!url) return;
          self.urls.push(url);
          el.style.backgroundImage = 'url(' + url + ')';
          el.innerHTML = '';
        });
      });
    },
    notes: function (p, body) { this.bindFields(body); },
    contacts: function (p, body) { this.bindFields(body); },
    events: function (p, body) { this.bindEvents(body); },
    access: function (p, body) { this.bindAcl(body); },
    info: function () {}
  };

  /* --------- отложенные правки ---------
     Поля не записываются в дерево сразу: правка попадает в очередь,
     внизу карточки появляется полоса «Сохранить / Отменить». Так случайное
     нажатие не уходит к родственникам при следующей синхронизации. */

  Sheet.prototype.stage = function (key, apply, label) {
    this.pending = this.pending || [];
    var found = false;
    for (var i = 0; i < this.pending.length; i++) {
      if (this.pending[i].key === key) { this.pending[i].apply = apply; found = true; break; }
    }
    if (!found) this.pending.push({ key: key, apply: apply, label: label || '' });
    this.paintBar();
  };
  Sheet.prototype.hasPending = function () { return !!(this.pending && this.pending.length); };

  Sheet.prototype.paintBar = function () {
    var bar = this.el.querySelector('#shBar');
    if (!bar) return;
    var n = this.pending ? this.pending.length : 0;
    /* Кнопки остаются рабочими всегда: серая кнопка читается как сломанная,
       а нажать «Сохранить» лишний раз ничему не вредит. */
    bar.classList.toggle('quiet', !n);
    bar.querySelector('.bar-count').textContent = n
      ? 'Не сохранено: ' + n + ' ' + plural(n, 'правка', 'правки', 'правок')
      : 'Всё сохранено';
  };

  Sheet.prototype.commit = function () {
    var p = S.person(this.personId);
    if (!p) return;
    if (!this.hasPending()) {
      this.pending = []; this.paintBar();
      this.toast('Всё уже сохранено');
      return;
    }
    this.pending.forEach(function (x) { try { x.apply(); } catch (e) { console.error(e); } });
    this.pending = [];
    S.updatePerson(p.id, {});
    this.paintBar();
    this.renderHead();
    this.renderBody();
    this.onChange();
    this.toast('Сохранено');
  };

  Sheet.prototype.discard = function () {
    this.pending = [];
    this.paintBar();
    this.renderBody();
  };

  /** спросить, если есть несохранённые правки; then() вызывается, когда можно идти дальше */
  Sheet.prototype.guard = function (then) {
    var self = this;
    if (!this.hasPending()) { then(); return; }
    global.App.modal('Сохранить изменения?',
      '<p class="note">В карточке ' + esc(S.fullName(S.person(this.personId))) +
      ' есть несохранённые правки: ' + this.pending.length + '. Что с ними сделать?</p>',
      [
        { text: 'Сохранить', primary: true, fn: function () {
          global.App.closeModal(); self.commit(); then();
        } },
        { text: 'Не сохранять', danger: true, fn: function () {
          global.App.closeModal(); self.pending = []; self.paintBar(); then();
        } }
      ]);
  };

  Sheet.prototype.bindFields = function (body) {
    var self = this, p = S.person(this.personId);
    body.querySelectorAll('input[data-f$=".value"][data-kind="phone"]').forEach(function (inp) {
      inp.addEventListener('focus', function () {
        if (!inp.value.trim()) { inp.value = '+7 '; }
        // курсор в конец, чтобы не править код страны случайно
        setTimeout(function () { inp.setSelectionRange(inp.value.length, inp.value.length); }, 0);
      });
    });
    body.querySelectorAll('textarea.field-wide').forEach(function (ta) {
      function grow() {
        ta.style.height = 'auto';
        ta.style.height = Math.min(220, Math.max(46, ta.scrollHeight)) + 'px';
      }
      ta.addEventListener('input', grow);
      grow();
    });
    body.querySelectorAll('[data-f]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var parts = inp.dataset.f.split('.');
        var v = inp.value;
        self.stage('f:' + inp.dataset.f, function () {
          var pp = S.person(self.personId);
          var f = pp && (pp.fields || []).filter(function (x) { return x.id === parts[0]; })[0];
          if (f) f[parts[1]] = v;
        });
      });
    });
    self.bindAclSelects(body);
  };

  /* Права применяются сразу, а не через очередь: это осознанный выбор,
     от него зависит сам вид строки (появляется список людей), и закрытие
     карточки не должно молча отменять ограничение. */
  Sheet.prototype.bindAclSelects = function (body) {
    var self = this;
    body.querySelectorAll('select[data-acl]').forEach(function (sel) {
      sel.addEventListener('change', function () {
        var acl = self.aclByKey(sel.dataset.acl);
        if (!acl) return;
        acl.level = sel.value;
        if (acl.level === 'chosen') acl.allow = acl.allow || [];
        S.updatePerson(self.personId, {});
        self.onChange();
        self.renderBody();
        if (acl.level === 'chosen' && !acl.allow.length) self.pickViewers(sel.dataset.acl);
      });
    });
  };

  Sheet.prototype.bindEvents = function (body) {
    var self = this, p = S.person(this.personId);
    body.querySelectorAll('[data-ev]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var parts = inp.dataset.ev.split('.');
        var v = inp.value;
        self.stage('ev:' + inp.dataset.ev, function () {
          var pp = S.person(self.personId);
          var e = pp && (pp.events || []).filter(function (x) { return x.id === parts[0]; })[0];
          if (e) e[parts[1]] = v;
        });
      });
    });
    self.bindAclSelects(body);
  };

  Sheet.prototype.bindAcl = function (body) {
    var self = this, p = S.person(this.personId);
    self.bindAclSelects(body);
    var lock = body.querySelector('[data-lock="person"]');
    if (lock) lock.addEventListener('change', function () {
      var v = lock.checked;
      self.stage('person.lock', function () {
        var pp = S.person(self.personId);
        if (!pp) return;
        pp.acl = pp.acl || {}; pp.acl.locked = v;
      });
    });
  };

  function plural(n, one, few, many) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  /* --------- действия --------- */
  Sheet.prototype.actions = {
    close: function () { this.close(); },
    commit: function () { this.commit(); },
    discard: function () { this.discard(); },
    tab: function (btn) {
      var self = this, t = btn.dataset.tab;
      this.guard(function () { self.tab = t; self.renderBody(); self.renderHead(); });
    },
    focus: function () { this.onFocus(this.personId); },
    goto: function (btn) { this.open(btn.dataset.id); },
    pickPlace: function (btn) { this.pickPlace(btn.dataset.key); },
    pickViewers: function (btn) { this.pickViewers(btn.dataset.key); },
    dropPlace: function (btn) {
      var self = this, key = btn.dataset.key;
      global.App.confirm('Убрать точку с карты?',
        'Место словами останется в карточке — пропадёт только метка на карте.',
        function () {
          self.setPlace(key, null, null);
          self.renderBody();
          self.toast('Точка убрана');
        });
    },
    delPerson: function () {
      var p = S.person(this.personId);
      var self = this;
      global.App.confirm('Удалить ' + S.fullName(p) + '?', 'Связи с другими персонами тоже будут сняты. Отменить нельзя.', function () {
        S.removePerson(self.personId);
        self.close();
        self.onChange();
      });
    },
    addRel: function () { global.App.addRelative(this.personId); },
    unlink: function (btn) {
      S.unlink(this.personId, btn.dataset.id);
      this.renderBody();
      this.onChange();
    },
    addField: function (btn) {
      this.commit();
      var p = S.person(this.personId);
      var type = btn.dataset.type;
      var labels = { phone: 'Телефон', email: 'Почта', addr: 'Адрес', link: 'Ссылка', text: 'Новая строка' };
      p.fields = p.fields || [];
      p.fields.push({
        id: U.uid('f'), label: labels[type] || 'Строка',
        value: type === 'phone' ? '+7 ' : '',      // дальше человек просто дописывает номер
        type: type,
        acl: { level: type === 'text' ? 'public' : 'group', locked: false }
      });
      S.updatePerson(p.id, {});
      this.renderBody();
      this.onChange();
    },
    delField: function (btn) {
      var self = this, p = S.person(this.personId);
      var f = (p.fields || []).filter(function (x) { return x.id === btn.dataset.id; })[0];
      if (!f) return;
      var what = (f.label || f.title || 'запись');
      global.App.confirm('Удалить «' + what + '»?',
        'Запись уйдёт в корзину — её можно будет вернуть.', function () {
          p.fields = (p.fields || []).filter(function (x) { return x.id !== f.id; });
          S.toTrash(f.id, { what: 'field', rec: f, personId: p.id });
          S.bury(f.id);
          S.updatePerson(p.id, {});
          self.renderBody();
          self.onChange();
          global.App.paintTrash();
        });
    },
    addEvent: function () {
      this.commit();
      var p = S.person(this.personId);
      p.events = p.events || [];
      var e = {
        id: U.uid('e'), type: '', date: '', place: '', lat: null, lng: null, note: '',
        acl: { level: 'public', locked: false }
      };
      p.events.push(e);
      S.updatePerson(p.id, {});
      this.eventDialog(e.id, true);
    },
    editEvent: function (btn) {
      this.eventDialog(btn.dataset.id, false);
    },
    delEvent: function (btn) {
      var self = this, p = S.person(this.personId);
      var e = (p.events || []).filter(function (x) { return x.id === btn.dataset.id; })[0];
      global.App.confirm('Удалить событие' + (e && e.type ? ' «' + e.type + '»' : '') + '?',
        'Событие уйдёт в корзину — его можно будет вернуть.', function () {
          p.events = (p.events || []).filter(function (x) { return x.id !== btn.dataset.id; });
          if (e) { S.toTrash(e.id, { what: 'event', rec: e, personId: p.id }); S.bury(e.id); }
          S.updatePerson(p.id, {});
          global.App.closeAllModals();
          self.renderBody();
          self.onChange();
          global.App.paintTrash();
        });
    },
    openMedia: function (btn) { global.App.viewMedia(btn.dataset.id, this); },
    recVoice: function (btn) { this.recordVoice(btn); },
    dictate: function (btn) { this.dictate(btn.dataset.target, btn); }
  };

  /* Правка события в отдельном окне: во вкладке остаётся спокойный список,
     а все поля — здесь, по одному делу за раз. */
  Sheet.prototype.eventDialog = function (id, isNew) {
    var self = this, App = global.App;
    var p = S.person(this.personId);
    var e = (p.events || []).filter(function (x) { return x.id === id; })[0];
    if (!e) return;
    var before = JSON.stringify(e);

    App.modal(isNew ? 'Новое событие' : 'Событие',
      '<div class="row"><label for="evType">Что произошло</label>' +
      '<input id="evType" value="' + esc(e.type) + '" placeholder="Свадьба, переезд, служба…"></div>' +
      '<div class="row"><label for="evDate">Когда</label>' +
      '<input id="evDate" type="date" value="' + esc(dateVal(e.date)) + '"></div>' +
      '<div class="row"><label for="evPlace">Место</label>' +
      '<textarea id="evPlace" class="field-wide" rows="2" ' +
      'placeholder="Город, улица — или выберите точку на карте">' + esc(e.place) + '</textarea></div>' +
      '<div class="row"><label>На карте</label><div id="evMapRow">' + mapRow('ev:' + e.id, e) + '</div></div>' +
      '<div class="row"><label for="evNote">Подробности</label>' +
      '<textarea id="evNote" class="field-wide" rows="3">' + esc(e.note) + '</textarea></div>' +
      (S.isAdmin() ? '<div class="row"><label>Кому видно</label>' +
        '<div class="acl-ctl">' + aclSelect('ev:' + e.id, e.acl) + '</div></div>' : ''),
      [
        { text: 'Удалить', danger: true, fn: function () {
          self.actions.delEvent.call(self, { dataset: { id: e.id } });
        } },
        { text: 'Готово', primary: true, fn: function () {
          e.type = document.getElementById('evType').value.trim();
          e.date = document.getElementById('evDate').value;
          e.place = document.getElementById('evPlace').value.trim();
          e.note = document.getElementById('evNote').value.trim();
          if (!e.type && !e.date && !e.place && !e.note) {
            // пустое событие сохранять незачем
            p.events = (p.events || []).filter(function (x) { return x.id !== e.id; });
          }
          S.updatePerson(p.id, {});
          App.closeModal();
          self.renderBody();
          self.onChange();
        } }
      ], { onClose: function () {
        if (isNew && JSON.stringify(e) === before) {
          // открыли и закрыли, ничего не написав — пустую строку не оставляем
          p.events = (p.events || []).filter(function (x) { return x.id !== e.id; });
          S.updatePerson(p.id, {});
          self.renderBody();
        }
      } });

    var body = document.getElementById('modalBack');
    self.bindAclSelects(body);
    body.querySelectorAll('[data-act]').forEach(function (b) {
      b.addEventListener('click', function (ev) {
        ev.preventDefault();
        var act = b.dataset.act;
        if (self.actions[act]) self.actions[act].call(self, b);
      });
    });
  };

  /* --------- кому видна запись --------- */

  /** найти объект прав по ключу вида person | f:<id> | ev:<id> */
  Sheet.prototype.aclByKey = function (key) {
    var p = S.person(this.personId);
    if (!p) return null;
    var host = null;
    if (key === 'person') host = p;
    else if (key.indexOf('f:') === 0) {
      host = (p.fields || []).filter(function (x) { return x.id === key.slice(2); })[0];
    } else if (key.indexOf('ev:') === 0) {
      host = (p.events || []).filter(function (x) { return x.id === key.slice(3); })[0];
    }
    if (!host) return null;
    host.acl = host.acl || { level: 'public', locked: false };
    return host.acl;
  };

  Sheet.prototype.pickViewers = function (key) {
    var self = this;
    var acl = this.aclByKey(key);
    if (!acl) return;
    global.App.pickViewers(acl, function () {
      S.updatePerson(self.personId, {});
      self.onChange();
      self.renderBody();
    });
  };

  /* --------- точка на карте --------- */
  /* Точку записываем сразу: в окне карты человек уже нажал «Сохранить точку»,
     второе подтверждение внизу карточки было бы лишним. */
  /** force — адрес пришёл из окна выбора точки и заменяет прежний,
      в том числе пустой: иначе стёртый адрес возвращался бы сам. */
  Sheet.prototype.setPlace = function (key, lat, lng, address, force) {
    var p = S.person(this.personId);
    if (!p) return;
    if (key.indexOf('ev:') === 0) {
      var e = (p.events || []).filter(function (x) { return x.id === key.slice(3); })[0];
      if (e) {
        e.lat = lat; e.lng = lng;
        if (force) e.place = address || '';
        else if (address && !e.place) e.place = address;
      }
    } else {
      p[key] = p[key] || {};
      p[key].lat = lat;
      p[key].lng = lng;
      if (force) p[key].place = address || '';
      else if (address && !p[key].place) p[key].place = address;
    }
    S.updatePerson(p.id, {});
    this.onChange();
  };

  Sheet.prototype.pickPlace = function (key) {
    var self = this, p = S.person(this.personId);
    var cur = key.indexOf('ev:') === 0
      ? (p.events || []).filter(function (x) { return x.id === key.slice(3); })[0]
      : p[key];
    var placeName = (cur && cur.place) || '';
    var chosen = { lat: cur && cur.lat != null ? +cur.lat : null,
      lng: cur && cur.lng != null ? +cur.lng : null };

    global.App.modal('Где это было?',
      '<p class="note" style="margin:0 0 10px">Найдите место по названию или нажмите на карту. ' +
      'Карта двигается перетаскиванием, масштаб — колесом, щипком или кнопками слева.</p>' +
      '<div class="map-pick-wrap" id="pkWrap" style="height:56vh;min-height:300px">' +
      '<div class="map-host" id="pkMap"></div>' +
      '<div class="map-tools">' +
      '<input id="pkFind" type="search" placeholder="Город, село, улица…" autocomplete="off" ' +
      'value="' + esc(placeName) + '">' +
      '<button class="btn btn-sm" id="pkGo" title="Найти">' + I('search') + '</button>' +
      '<button class="btn btn-sm" id="pkHere" title="Я здесь">' + I('crosshair') + '</button>' +
      '<button class="btn btn-sm" id="pkFull" title="Во весь экран">' + I('fullscreen') + '</button>' +
      '</div>' +
      '<div class="map-hits" id="pkHits" hidden></div>' +
      '</div>' +
      '<div class="row" style="margin-top:10px"><label for="pkPlace">Место</label>' +
      '<textarea id="pkPlace" class="field-wide" rows="2" ' +
      'placeholder="Подставится само, когда отметите точку">' + esc(placeName) + '</textarea></div>' +
      '<p class="note" id="pkInfo">' +
      (chosen.lat != null ? 'Выбрано: ' + chosen.lat.toFixed(4) + ', ' + chosen.lng.toFixed(4)
        : 'Точка пока не выбрана') + '</p>',
      [{ text: 'Сохранить точку', primary: true, fn: function () {
        if (chosen.lat == null) { self.toast('Сначала отметьте место на карте'); return; }
        var typed = document.getElementById('pkPlace');
        global.App.closeModal();
        // что написано в окне — то и сохраняем: и когда адрес подставился сам,
        // и когда человек стёр его или поправил
        self.setPlace(key, +chosen.lat.toFixed(6), +chosen.lng.toFixed(6),
          typed ? typed.value.trim() : '', true);
        self.renderBody();
      } }]);

    var placeFld = document.getElementById('pkPlace');
    if (placeFld) {
      placeFld.addEventListener('input', function () { this.dataset.touched = '1'; });
    }
    var host = document.getElementById('pkMap');
    var m = new global.MiniMap(host);
    self._picker = m;

    function mark(lat, lng, zoom) {
      chosen.lat = lat; chosen.lng = lng;
      m.setPins([{ lat: lat, lng: lng, kind: 'event', label: placeName }]);
      if (zoom) m.goTo(lat, lng, zoom);
      // выбранная точка держится в середине при любом масштабировании
      m.setMarker(lat, lng, !!zoom);
      var info = document.getElementById('pkInfo');
      if (info) info.textContent = 'Выбрано: ' + lat.toFixed(4) + ', ' + lng.toFixed(4) + ' · ищу адрес…';
      /* Заодно спрашиваем, как это место называется: руками переписывать
         адрес с карты — лишняя работа. */
      var mine = ++markSeq;
      global.MiniMap.reverse(lat, lng).then(function (addr) {
        if (mine !== markSeq) return;            // пока искали, выбрали другую точку
        chosen.address = addr;
        var el = document.getElementById('pkInfo');
        if (el) el.textContent = 'Выбрано: ' + lat.toFixed(4) + ', ' + lng.toFixed(4);
        var fld = document.getElementById('pkPlace');
        /* Новая точка — новый адрес. Не трогаем только то, что человек
           написал руками: это его формулировка, а не наша. */
        if (fld && addr && fld.dataset.touched !== '1') fld.value = addr;
      });
    }
    var markSeq = 0;
    if (chosen.lat != null) mark(chosen.lat, chosen.lng, 11);
    else m.draw();
    m.onClick = function (lat, lng) { mark(lat, lng); };

    /* --- поиск места --- */
    var hits = document.getElementById('pkHits');
    var findBox = document.getElementById('pkFind');
    function search() {
      var q = findBox.value.trim();
      if (q.length < 3) { hits.hidden = true; return; }
      hits.hidden = false;
      hits.innerHTML = '<div class="note" style="padding:8px">Ищем…</div>';
      fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=ru&q=' +
        encodeURIComponent(q), { headers: { 'Accept': 'application/json' } })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (list) {
          if (!list.length) {
            hits.innerHTML = '<div class="note" style="padding:8px">Ничего не нашлось. ' +
              'Можно просто нажать нужное место на карте.</div>';
            return;
          }
          hits.innerHTML = list.map(function (x, i) {
            return '<button type="button" data-i="' + i + '">' + esc(x.display_name) + '</button>';
          }).join('');
          hits.querySelectorAll('[data-i]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var x = list[+btn.dataset.i];
              hits.hidden = true;
              mark(parseFloat(x.lat), parseFloat(x.lon), 12);
            });
          });
        }, function () {
          hits.innerHTML = '<div class="note" style="padding:8px">' +
            'Поиск недоступен без интернета. Нажмите нужное место на карте.</div>';
        });
    }
    document.getElementById('pkGo').addEventListener('click', search);
    findBox.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); search(); }
    });
    findBox.addEventListener('input', function () {
      clearTimeout(self._findT);
      self._findT = setTimeout(search, 600);
    });

    /* --- где я сейчас --- */
    document.getElementById('pkHere').addEventListener('click', function () {
      var info = document.getElementById('pkInfo');
      if (!navigator.geolocation) { self.toast('Устройство не сообщает местоположение'); return; }
      if (info) info.textContent = 'Определяем, где вы…';
      navigator.geolocation.getCurrentPosition(function (pos) {
        mark(pos.coords.latitude, pos.coords.longitude, 14);
      }, function () {
        if (info) info.textContent = 'Не удалось определить местоположение — ' +
          'разрешите доступ или выберите место вручную.';
      }, { enableHighAccuracy: true, timeout: 10000 });
    });

    /* --- во весь экран --- */
    document.getElementById('pkFull').addEventListener('click', function () {
      var wrap = document.getElementById('pkWrap');
      wrap.classList.toggle('full');
      this.title = wrap.classList.contains('full') ? 'Свернуть' : 'Во весь экран';
      setTimeout(function () { m.draw(); }, 60);
    });
  };

  /* --------- голос --------- */
  Sheet.prototype.dictate = function (target, btn) {
    var self = this;
    var SR = global.SpeechRecognition || global.webkitSpeechRecognition;
    if (!SR) { this.toast('Голосовой ввод доступен в Chrome, Edge и Safari на установленном приложении'); return; }
    var rec = new SR();
    rec.lang = 'ru-RU'; rec.interimResults = true; rec.continuous = false;
    btn.classList.add('rec');
    var buf = '';
    rec.onresult = function (e) {
      buf = '';
      for (var i = 0; i < e.results.length; i++) buf += e.results[i][0].transcript;
    };
    rec.onerror = function () { btn.classList.remove('rec'); self.toast('Микрофон недоступен'); };
    rec.onend = function () {
      btn.classList.remove('rec');
      if (!buf.trim()) return;
      var p = S.person(self.personId);
      if (target === 'note') p.note = (p.note ? p.note + '\n' : '') + buf;
      else if (target.indexOf('ev:') === 0) {
        var id = target.slice(3).split('.')[0];
        var ev = (p.events || []).filter(function (x) { return x.id === id; })[0];
        if (ev) ev.note = (ev.note ? ev.note + ' ' : '') + buf;
      } else if (target.indexOf('f:') === 0) {
        var f = (p.fields || []).filter(function (x) { return x.id === target.slice(2); })[0];
        if (f) f.value = (f.value ? f.value + ' ' : '') + buf;
      } else {
        var path = target.split('.');
        if (path.length === 2) p[path[0]][path[1]] = buf;
        else p[path[0]] = buf;
      }
      S.updatePerson(p.id, {});
      self.renderBody();
      self.onChange();
    };
    try { rec.start(); } catch (e) { btn.classList.remove('rec'); }
  };

  Sheet.prototype.recordVoice = function (btn) {
    var self = this;
    if (this._rec) {
      this._rec.stop();
      return;
    }
    if (!navigator.mediaDevices || !global.MediaRecorder) {
      this.toast('Запись звука недоступна в этом окружении');
      return;
    }
    var state = this.el.querySelector('#recState');
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var mr = new MediaRecorder(stream);
      var chunks = [];
      self._rec = mr;
      btn.textContent = '⏹ Остановить запись';
      btn.classList.add('rec');
      var t0 = Date.now();
      var timer = setInterval(function () {
        if (state) state.textContent = 'Идёт запись… ' + Math.round((Date.now() - t0) / 1000) + ' с';
      }, 300);
      mr.ondataavailable = function (e) { chunks.push(e.data); };
      mr.onstop = function () {
        clearInterval(timer);
        stream.getTracks().forEach(function (t) { t.stop(); });
        self._rec = null;
        var blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
        blob.name = 'Голосовая заметка ' + new Date().toLocaleString('ru-RU') + '.webm';
        var file = new File([blob], blob.name, { type: blob.type });
        global.App.askAccess(function (acl) {
          S.addMedia(self.personId, file, { acl: acl, kind: 'audio' }).then(function () {
            self.renderBody();
            self.onChange();
            self.toast('Заметка сохранена');
          });
        });
      };
      mr.start();
    }).catch(function () { self.toast('Нет доступа к микрофону'); });
  };

  /* --------- мелкие построители разметки --------- */
  function row(label, inner) {
    return '<div class="row"><label>' + label + '</label><div>' + inner + '</div></div>';
  }
  function opt(v, t, cur) {
    return '<option value="' + v + '"' + (cur === v ? ' selected' : '') + '>' + t + '</option>';
  }
  function dateVal(s) {
    var d = U.parseDate(s);
    if (!d || !d.m || !d.d) return '';
    return d.y + '-' + pad(d.m) + '-' + pad(d.d);
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  /** Вместо двух полей с цифрами — ссылка на карту и кнопка выбора точки.
      Координаты по-прежнему хранятся: по ним строится вкладка «Карта». */
  function mapRow(key, o) {
    o = o || {};
    var has = o.lat != null && o.lng != null;
    var h = '<div class="map-row">';
    if (has) {
      var url = 'https://www.openstreetmap.org/?mlat=' + o.lat + '&mlon=' + o.lng + '#map=13/' +
        o.lat + '/' + o.lng;
      h += '<a class="map-link" href="' + url + '" target="_blank" rel="noopener">' +
        I('pin') + ' Открыть на карте</a>' +
        '<span class="map-coord">' + (+o.lat).toFixed(4) + ', ' + (+o.lng).toFixed(4) + '</span>' +
        '<button class="btn btn-sm" data-act="pickPlace" data-key="' + key + '">Изменить точку</button>' +
        '<button class="btn btn-sm btn-danger" data-act="dropPlace" data-key="' + key + '">Убрать</button>';
    } else {
      h += '<button class="btn btn-sm" data-act="pickPlace" data-key="' + key + '">' +
        I('pin') + ' Указать на карте</button>' +
        '<span class="note">точка не отмечена</span>';
    }
    return h + '</div>';
  }
  function fieldRow(f) {
    var isNote = f.type === 'text' || f.type === 'note';
    return '<div class="list-item" style="flex-wrap:wrap">' +
      '<div class="li-main" style="flex:1 1 100%">' +
      // адрес длинный — ему отдельная строка на всю ширину и в несколько строк
      (f.type === 'addr'
        ? '<div class="inline"><input data-f="' + f.id + '.label" value="' + esc(f.label) +
          '" placeholder="Название" style="max-width:40%">' + micBtn('f:' + f.id) + '</div>' +
          '<textarea class="field-wide" data-f="' + f.id + '.value" data-kind="addr" rows="2" ' +
          'placeholder="Индекс, область, район, населённый пункт, улица, дом, квартира">' +
          esc(f.value) + '</textarea>'
        : '<div class="inline"><input data-f="' + f.id + '.label" value="' + esc(f.label) +
          '" placeholder="Название" style="max-width:40%">' +
          '<input data-f="' + f.id + '.value" data-kind="' + esc(f.type) + '" value="' + esc(f.value) +
          '" placeholder="' + (f.type === 'phone' ? '+7 999 123-45-67' : 'Значение') +
          '"' + (f.type === 'phone' ? ' type="tel" inputmode="tel"' : '') + '>' +
          micBtn('f:' + f.id) + '</div>') +
      '<div class="inline" style="margin-top:5px">' + aclSelect('f:' + f.id, f.acl) +
      '<button class="btn btn-sm btn-danger" data-act="delField" data-id="' + f.id + '">Удалить</button></div>' +
      '</div></div>';
  }

  global.PersonSheet = Sheet;
  global.ACL_LEVELS = ACL_LEVELS;
})(window);
</script>
<script>/* Семейное Древо — главный модуль: вход, вкладки, поиск, настройки, календарь, карта. */
(function (global) {
  'use strict';
  var S = global.Store, U = S.util, esc = global.TreeView.esc;

  /* Номер сборки. Виден на экране входа — по нему сразу понятно,
     обновилась ли программа на сайте и на телефоне. */
  var BUILD = '20', BUILD_DATE = '3 ноября 2026';

  /** «90 секунд», «5 мин», «1 ч» — чтобы подпись читалась, а не считалась */
  function everyText(sec) {
    if (sec < 60) return sec + ' сек';
    if (sec % 3600 === 0) return (sec / 3600) + ' ч';
    var m = sec / 60;
    return (Math.round(m * 10) / 10) + ' мин';
  }

  /* Пароль дерева открывает и зашифрованные записи, и восстановить его
     нельзя. Поэтому требования жёсткие, а подсказка — сразу, пока набирают. */
  function passTrouble(p) {
    p = String(p || '');
    var miss = [];
    if (p.length < 6) miss.push('не меньше шести знаков');
    if (!/[a-zа-яё]/.test(p)) miss.push('строчная буква');
    if (!/[A-ZА-ЯЁ]/.test(p)) miss.push('заглавная буква');
    if (!/[0-9]/.test(p)) miss.push('цифра');
    if (!/[^\wа-яё]|_/i.test(p)) miss.push('знак вроде !?-,.#');
    if (!miss.length) return '';
    return 'В пароле не хватает: ' + miss.join(', ') + '.';
  }
  /** подсказка под полем, которая обновляется по мере набора */
  function watchPass(inputId, hintId) {
    var inp = document.getElementById(inputId), hint = document.getElementById(hintId);
    if (!inp || !hint) return;
    function paint() {
      var t = passTrouble(inp.value);
      if (!inp.value) { hint.textContent = 'Нужны строчные и заглавные буквы, цифра и знак вроде !?-,.#'; hint.style.color = ''; return; }
      hint.textContent = t || 'Пароль подходит';
      hint.style.color = t ? 'var(--warn)' : 'var(--good)';
    }
    inp.addEventListener('input', paint);
    paint();
  }

  var App = {
    BUILD: BUILD, BUILD_DATE: BUILD_DATE,
    tree: null, sheet: null, map: null,
    activeTab: 'tree',
    _mediaUrls: [],

    /* ============ запуск ============ */
    init: function () {
      S.load();
      this.bindChrome();
      var hash = location.hash || '';
      // Ссылка с настройками хранилища: устройство само забирает дерево.
      var join = hash.match(/^#join-([A-Za-z0-9_-]+)$/);
      if (join) { this.gateJoinLink(join[1]); return; }
      var invite = hash.match(/^#invite-([\w-]+)$/);
      if (!S.users.length) this.gateFirstRun();
      else if (invite) this.gateInvite(invite[1]);
      else if (S.session) this.start();
      else this.gateLogin();
    },

    /* ============ ссылки на дерево ============
       В ссылку кладём настройки общего хранилища, иначе на чистом телефоне
       программе неоткуда взять ни дерево, ни список приглашений. */
    /** Адрес, с которого ссылка откроется у других. Программа, запущенная
        из файла на диске, знает только путь вида file:///C:/… — такая ссылка
        не откроется ни на телефоне, ни у родни, поэтому адрес сайта задаётся руками. */
    /** Привести введённый адрес к рабочему виду: с протоколом и верным хвостом. */
    normBase: function (site) {
      var b = String(site || '').split('#')[0].split('?')[0].trim();
      if (!b) return null;
      // адрес без «https://» браузер понимает как путь — дописываем сами
      if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(b)) b = 'https://' + b.replace(/^\/+/, '');
      // «…/FamilyTree» — папка, ей нужен слеш; «…/index.html» — файл, слеш его сломает
      var last = b.split('/').pop();
      if (last.indexOf('.') < 0) b = b.replace(/\/+$/, '') + '/';
      return b;
    },
    linkBase: function () {
      var site = this.normBase(S.sync && S.sync.siteUrl);
      if (site) return site;
      if (location.protocol === 'file:') return null;
      return location.href.split('#')[0];
    },
    isLocalFile: function () { return location.protocol === 'file:'; },

    packLink: function (token, base) {
      base = base || this.linkBase();
      if (!base) return null;
      var s = S.sync || {};
      if (s.mode !== 'supabase' && s.mode !== 'server') return null;
      var cfg = s[s.mode] || {};
      if (!cfg.url || !cfg.key) return null;
      var payload = { m: s.mode, u: cfg.url, k: cfg.key };
      if (s.mode === 'supabase') payload.i = cfg.treeId;
      if (token) payload.t = token;
      var b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      return base + '#join-' + b64;
    },
    unpackLink: function (b64) {
      try {
        var t = b64.replace(/-/g, '+').replace(/_/g, '/');
        while (t.length % 4) t += '=';
        return JSON.parse(decodeURIComponent(escape(atob(t))));
      } catch (e) { return null; }
    },

    gateJoinLink: function (b64) {
      var self = this, Sy = global.Sync;
      var cfg = this.unpackLink(b64);
      if (!cfg || !cfg.m) {
        this.toast('Ссылка повреждена');
        location.hash = '';
        if (S.users.length) this.gateLogin(); else this.gateFirstRun();
        return;
      }

      var mine = Object.keys(S.tree.persons || {}).length;
      var replacing = mine && !S.tree.meta.demo;

      /* Человек пришёл по ссылке: единственное разумное действие — войти.
         Поэтому одна кнопка и крестик, а объяснять устройство хранилища
         тому, кто просто открыл присланную ссылку, незачем. */
      this.gate(
        '<button class="gate-close" id="jSkip" type="button" title="Закрыть" ' +
        'aria-label="Закрыть">' + global.Icon('close') + '</button>' +
        '<h1>' + (cfg.t ? 'Приглашение в семейное древо' : 'Вход на этом устройстве') + '</h1>' +
        '<p class="lede">' + (cfg.t
          ? 'Вас пригласили в семейное древо. Дальше вы напишете своё имя ' +
            'и придумаете себе логин и пароль.'
          : 'Это ваша ссылка. Войдёте тем же логином и паролем, что и на первом устройстве.') +
        '</p>' +
        (replacing ? '<p class="note" style="color:var(--warn)">Внимание: на этом устройстве уже есть ' +
          'своё дерево, ' + mine + ' ' + plural(mine, 'человек', 'человека', 'человек') +
          '. Оно будет заменено общим.</p>' : '') +
        '<div class="err" id="gErr"></div>' +
        '<div class="btn-row"><button class="btn btn-primary" id="jGo">' +
        (cfg.t ? 'Присоединиться к семейному древу' : 'Войти') + '</button></div>');

      document.getElementById('jSkip').addEventListener('click', function () {
        location.hash = '';
        if (S.users.length) self.gateLogin(); else self.gateFirstRun();
      });

      document.getElementById('jGo').addEventListener('click', function () {
        S.sync.mode = cfg.m;
        S.sync[cfg.m].url = cfg.u;
        S.sync[cfg.m].key = cfg.k;
        if (cfg.m === 'supabase') S.sync.supabase.treeId = cfg.i || '';
        S.saveSync();
        err('Присоединение…');
        Sy.peek().then(function (remote) {
          if (!remote || !remote.persons) {
            err('По этой ссылке дерева не нашлось. Попросите отправителя создать ссылку заново.');
            return;
          }
          S.tree = remote;
          S.save(true);
          S.sync.lastAt = new Date().toISOString();
          S.sync.lastError = null;
          S.dirty = false;
          S.saveSync();
          var n = Object.keys(remote.persons).length;
          self.toast('Готово. В дереве ' + n + ' ' + plural(n, 'человек', 'человека', 'человек'));
          if (cfg.t) { self.gateInvite(cfg.t); return; }
          location.hash = '';
          self.gateLogin();
        }, function (e) { err('Не вышло: ' + e.message); });
      });
    },

    start: function () {
      S.loadPrefs(S.session.userId);
      this.applyPrefs();
      document.getElementById('gate').hidden = true;
      document.getElementById('app').hidden = false;
      this.paintIcons();

      var self = this;
      this.tree = new global.TreeView({
        host: document.getElementById('treeHost'),
        canvas: document.getElementById('treeCanvas'),
        svg: document.getElementById('treeLines'),
        onSelect: function (id) { self.sheet.open(id); },
        onAdd: function (id) { self.addRelative(id); },
        onRender: function () { self.paintEmpty(); }
      });
      this.tree.mode = S.prefs.layout;
      // Пустое дерево так и остаётся пустым: образец больше не подставляется сам.
      if (S.persons().length) this.tree.setFocus(S.tree.meta.rootId || S.persons()[0].id);

      this.sheet = new global.PersonSheet({
        el: document.getElementById('sheet'),
        onChange: function () { self.tree.render(); self.renderTabs(); },
        onFocus: function (id) { self.tree.setFocus(id); },
        onOpen: function (id) { self.tree.setOpen(id); },
        toast: function (m) { self.toast(m); }
      });

      document.getElementById('who').innerHTML =
        '<b>' + esc(S.session.displayName) + '</b> · ' + (S.isAdmin() ? 'администратор' : 'пользователь');
      document.getElementById('treeName').textContent = S.tree.meta.name;
      this.renderTabs();
      this.paintTrash();
      this.paintHomeDates();
      this.showTab('tree');
      setTimeout(function () { self.tree.fit(true); }, 60);
      this.startSync();
      this.watchForHistory();
      this.watchInstall();
      /* Недосмотренные снимки. Программу могли закрыть на середине разбора —
         очередь пережила закрытие, продолжаем с того же места. Ждём минуту:
         сначала человек должен увидеть своё дерево, а не крутящийся разбор. */
      setTimeout(function () {
        if (global.FaceQueue && global.FaceQueue.load().length) global.FaceQueue.run();
      }, 60000);
    },

    /* ============ показ пароля ============
       Пароль дерева восстановить нельзя, поэтому важно видеть, что набираешь.
       Выбор запоминается: включили один раз — дальше поля открыты сразу. */
    showPw: function () {
      try { return localStorage.getItem('drevo.showpw') === '1'; } catch (e) { return false; }
    },
    setShowPw: function (on) {
      try { localStorage.setItem('drevo.showpw', on ? '1' : '0'); } catch (e) {}
    },
    enhancePasswords: function (root) {
      var self = this;
      var open = this.showPw();
      (root || document).querySelectorAll('input[type=password]:not([data-pw])').forEach(function (inp) {
        inp.dataset.pw = '1';
        var wrap = document.createElement('span');
        wrap.className = 'pw-wrap';
        inp.parentNode.insertBefore(wrap, inp);
        wrap.appendChild(inp);
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pw-eye';
        wrap.appendChild(btn);
        function paint() {
          var shown = inp.type === 'text';
          btn.innerHTML = global.Icon(shown ? 'eyeOff' : 'eye');
          btn.title = shown ? 'Скрыть пароль' : 'Показать пароль';
          btn.setAttribute('aria-label', btn.title);
        }
        btn.addEventListener('click', function () {
          var shown = inp.type === 'text';
          inp.type = shown ? 'password' : 'text';
          self.setShowPw(!shown);
          paint();
          inp.focus();
          var v = inp.value;
          try { inp.setSelectionRange(v.length, v.length); } catch (e) {}
          // остальные поля на экране переключаем заодно
          (root || document).querySelectorAll('.pw-wrap input').forEach(function (o) {
            if (o !== inp) o.type = shown ? 'password' : 'text';
          });
          (root || document).querySelectorAll('.pw-eye').forEach(function (o) {
            if (o === btn) return;
            o.innerHTML = global.Icon(shown ? 'eye' : 'eyeOff');
          });
        });
        if (open) inp.type = 'text';
        paint();
      });
    },

    /* ============ значки ============ */
    paintIcons: function () {
      var I = global.Icon;
      function put(id, name, before) {
        var el = document.getElementById(id);
        if (!el) return;
        var lbl = el.querySelector('.lbl');
        el.innerHTML = I(name) + (lbl ? lbl.outerHTML : '');
      }
      put('qIco', 'search');
      put('qClear', 'close');
      put('qMic', 'mic');
      put('btnAdd', 'addPerson');
      put('btnSync', 'sync');
      put('btnCalendar', 'calendar');
      put('btnMap', 'map');
      put('btnSettings', 'settings');
      put('btnLogout', 'logout');
      put('zoomIn', 'plus');
      put('zoomOut', 'minus');
      put('zoomFit', 'expand');
      put('zoomHome', 'home');
      var views = { vertical: 'down', horizontal: 'right', butterfly: 'butterfly' };
      document.querySelectorAll('#viewdock [data-view]').forEach(function (b) {
        var lbl = b.querySelector('.lbl');
        b.innerHTML = I(views[b.dataset.view]) + (lbl ? lbl.outerHTML : '');
      });
    },

    /* ============ пустое дерево ============ */

      if (!box) return;
      if (S.persons().length) { box.hidden = true; return; }

      box.innerHTML = '<div>' + global.Icon('tree') +
        '<h2>Дерево пока пустое</h2>' +
        '<p>Начните с себя или с того, о ком знаете больше всех. Дальше к каждому человеку ' +
        'можно будет добавлять родителей, супругов и детей — кнопкой «+» на его окошке.</p>' +
        '<div class="btn-row">' +
        '<button class="btn btn-primary" id="emAdd">Добавить первого человека</button>' +
        '<button class="btn" id="emImport">Загрузить из файла</button>' +
        '</div>' +
        '<p class="note" style="margin:14px 0 0">Хотите сначала посмотреть, как всё устроено? ' +
        '<button class="btn btn-sm" id="emDemo">Показать пример</button></p>' +
        '</div>';
      document.getElementById('emAdd').addEventListener('click', function () { self.addPerson(); });
      document.getElementById('emImport').addEventListener('click', function () { self.openSettings('data'); });
      document.getElementById('emDemo').addEventListener('click', function () {
        self.seedDemo();
        self.tree.setFocus(S.tree.meta.rootId);
        self.afterSync();

    /* ============ вход ============ */
    gate: function (html) {
      var g = document.getElementById('gate');
      g.hidden = false;
      document.getElementById('app').hidden = true;
      var self = this;
      g.innerHTML = '<div class="gate-card">' + html +
        (global.DREVO_PREVIEW ? '<p class="note" style="margin-top:16px;padding-top:12px;border-top:1px solid var(--line)">' +
          'Это витрина внутри Claude. Дерево, карточки, поиск и настройки работают полностью. ' +
          'Сохранение файлов, микрофон, карта и вход по отпечатку закрыты правилами этого окна — ' +
          'они работают в версии, установленной на телефон или компьютер.</p>' : '') +
        '<p class="gate-ver">сборка ' + BUILD + ' · ' + BUILD_DATE + '</p>' +
        '</div>';
      this.enhancePasswords(g);
    },
    /* Вход на втором устройстве. Учётные записи лежат в дереве, поэтому
       сперва надо забрать дерево из общего хранилища, а потом входить. */
    gateJoin: function () {
      var self = this, Sy = global.Sync;
      var sync = S.sync || U.defaultSync();
      this.gate(
        '<h1>Присоединиться к дереву</h1>' +
        '<p class="lede">Проще всего — вставить ссылку, которую прислал администратор: ' +
        'в ней уже лежат все настройки хранилища.</p>' +
        '<label for="jPaste">Ссылка от администратора</label>' +
        '<input id="jPaste" placeholder="https://…/#join-…" autocomplete="off" spellcheck="false">' +
        '<div class="btn-row"><button class="btn btn-primary" id="jPasteGo">Войти по ссылке</button></div>' +
        '<p class="note" style="margin:16px 0 4px;padding-top:14px;border-top:1px solid var(--line)">' +
        'Ссылки нет — укажите хранилище руками, то же самое, что на первом устройстве.</p>' +
        '<label for="jMode">Где лежит дерево</label>' +
        '<select id="jMode">' +
        '<option value="supabase"' + (sync.mode === 'supabase' ? ' selected' : '') + '>Supabase</option>' +
        '<option value="server"' + (sync.mode === 'server' ? ' selected' : '') + '>Свой сервер</option>' +
        '</select>' +
        '<div id="jFields"></div>' +
        '<div class="err" id="gErr"></div>' +
        '<div class="btn-row"><button class="btn btn-primary" id="jGo">Присоединиться</button>' +
        '<button class="btn" id="jBack">Назад</button></div>');

      function fields() {
        var m = document.getElementById('jMode').value;
        var cfg = sync[m] || {};
        document.getElementById('jFields').innerHTML = m === 'supabase'
          ? '<label for="jUrl">Адрес проекта</label><input id="jUrl" value="' + esc(cfg.url || '') +
            '" placeholder="https://xxxxx.supabase.co" autocomplete="off">' +
            '<label for="jKey">Ключ anon public</label><input id="jKey" type="password" value="' +
            esc(cfg.key || '') + '" autocomplete="off">' +
            '<label for="jTree">Имя дерева</label><input id="jTree" value="' + esc(cfg.treeId || '') +
            '" autocomplete="off">'
          : '<label for="jUrl">Адрес сервера</label><input id="jUrl" value="' + esc(cfg.url || '') +
            '" placeholder="https://drevo.мойдомен.ru" autocomplete="off">' +
            '<label for="jKey">Ключ доступа</label><input id="jKey" type="password" value="' +
            esc(cfg.key || '') + '" autocomplete="off">';
      }
      fields();
      document.getElementById('jMode').addEventListener('change', fields);

      // Вставленная ссылка: из неё достаём только часть после «#join-».
      document.getElementById('jPasteGo').addEventListener('click', function () {
        var raw = val('jPaste');
        if (!raw) return err('Вставьте ссылку целиком');
        var m = raw.match(/#?join-([A-Za-z0-9_-]+)/);
        if (!m) return err('В этой ссылке нет настроек дерева. Попросите администратора ' +
          'создать ссылку заново — в настройках, «Доступ и защита».');
        if (!self.unpackLink(m[1])) return err('Ссылка повреждена — похоже, скопировалась не целиком');
        self.gateJoinLink(m[1]);
      });
      document.getElementById('jPaste').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('jPasteGo').click();
      });
      document.getElementById('jBack').addEventListener('click', function () {
        if (S.users.length) self.gateLogin(); else self.gateFirstRun();
      });

      document.getElementById('jGo').addEventListener('click', function () {
        var m = document.getElementById('jMode').value;
        S.sync.mode = m;
        S.sync[m].url = val('jUrl');
        S.sync[m].key = val('jKey');
        if (m === 'supabase') S.sync.supabase.treeId = val('jTree');
        if (!S.sync[m].url || !S.sync[m].key) return err('Заполните адрес и ключ');
        if (m === 'supabase' && !S.sync.supabase.treeId) return err('Укажите имя дерева');
        S.saveSync();
        err('Присоединение…');
        Sy.peek().then(function (remote) {
          if (!remote || !remote.persons) {
            err('По этим настройкам дерева не нашлось. Проверьте адрес, ключ и имя дерева.');
            return;
          }
          if (!remote.users || !remote.users.length) {
            err('Дерево нашлось, но в нём нет учётных записей. ' +
              'Обновите программу на первом устройстве и синхронизируйте её — записи уедут вместе с деревом.');
            return;
          }
          S.tree = remote;
          S.save(true);
          // дерево только что взято целиком — переспрашивать «слить или заменить» незачем
          S.sync.lastAt = new Date().toISOString();
          S.sync.lastError = null;
          S.dirty = false;
          S.saveSync();
          var n2 = Object.keys(remote.persons).length;
          self.toast('Готово. В дереве ' + n2 + ' ' + plural(n2, 'человек', 'человека', 'человек'));
          self.gateLogin();
        }, function (e) { err('Не вышло: ' + e.message); });
      });
    },

    gateFirstRun: function () {
      var self = this;
      this.gate(
        '<h1>Семейное Древо</h1>' +
        '<p class="lede">Семейное древо, которое живёт на ваших устройствах. Первый вход создаёт администратора — ' +
        'того, кто раздаёт доступ остальным родственникам.</p>' +
        '<label for="gName">Как вас зовут</label><input id="gName" autocomplete="name">' +
        '<label for="gLogin">Логин</label><input id="gLogin" autocomplete="username" placeholder="admin">' +
        '<label for="gPass">Пароль</label><input id="gPass" type="password" autocomplete="new-password">' +
        '<label for="gPass2">Пароль ещё раз</label><input id="gPass2" type="password" autocomplete="new-password">' +
        '<p class="note" id="gPassHint"></p>' +
        '<p class="note" style="margin-top:10px">Этот же пароль открывает зашифрованные записи. ' +
        'Восстановить его нельзя — запишите в надёжном месте.</p>' +
        '<div class="err" id="gErr"></div>' +
        '<div class="btn-row"><button class="btn btn-primary" id="gGo">Создать дерево</button></div>' +
        '<p class="note" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">' +
        'Дерево уже заведено на другом устройстве? ' +
        '<button class="btn btn-sm" id="gJoin">Присоединиться к нему</button></p>');
      watchPass('gPass', 'gPassHint');
      document.getElementById('gJoin').addEventListener('click', function () { self.gateJoin(); });
      document.getElementById('gGo').addEventListener('click', function () {
        var name = val('gName'), login = val('gLogin'), p1 = val('gPass'), p2 = val('gPass2');
        if (!login || !p1) return err('Заполните логин и пароль');
        var bad = passTrouble(p1);
        if (bad) return err(bad);
        if (p1 !== p2) return err('Пароли не совпадают');
        S.createUser(login, p1, 'admin', name || login).then(function (u) {
          S.setSession({ userId: u.id, login: u.login, role: u.role, displayName: u.displayName });
          return S.unlockCrypto(p1);
        }).then(function () { self.start(); });
      });
    },
    gateLogin: function () {
      var self = this;
      var hasBio = S.users.some(function (u) { return u.webauthn; });
      this.gate(
        '<h1>Семейное Древо</h1>' +
        '<p class="lede">Войдите, чтобы открыть семейное древо.</p>' +
        '<label for="gLogin">Логин</label><input id="gLogin" autocomplete="username">' +
        '<label for="gPass">Пароль</label><input id="gPass" type="password" autocomplete="current-password">' +
        '<div class="err" id="gErr"></div>' +
        '<div class="btn-row"><button class="btn btn-primary" id="gGo">Войти</button>' +
        (hasBio ? '<button class="btn" id="gBio">Войти по отпечатку</button>' : '') + '</div>' +
        '<p class="note" style="margin-top:14px">Нет доступа? Попросите у администратора дерева ' +
        'ссылку-приглашение.</p>' +
        '<p class="note">Это другое устройство, а дерево лежит в общем хранилище? ' +
        '<button class="btn btn-sm" id="gJoin2">Забрать его оттуда</button></p>');
      var join2 = document.getElementById('gJoin2');
      if (join2) join2.addEventListener('click', function () { self.gateJoin(); });
      function go() {
        var login = val('gLogin'), pass = val('gPass');
        S.auth(login, pass).then(function (u) {
          if (!u) return err('Логин или пароль не подходят');
          S.setSession({ userId: u.id, login: u.login, role: u.role, displayName: u.displayName });
          return S.unlockCrypto(pass).then(function () { self.start(); });
        });
      }
      document.getElementById('gGo').addEventListener('click', go);
      document.getElementById('gPass').addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
      var bio = document.getElementById('gBio');
      if (bio) bio.addEventListener('click', function () { self.bioLogin(); });
    },
    gateInvite: function (token) {
      var self = this;
      var inv = S.findInvite(token);
      // записи старого образца, где логин заводил администратор
      var old = inv ? null : S.users.filter(function (x) { return x.invite === token; })[0];
      if (!inv && !old) {
        this.toast('Ссылка-приглашение больше не действует');
        if (S.users.length) this.gateLogin(); else this.gateFirstRun();
        return;
      }

      if (old) {
        this.gate(
          '<h1>Придумайте пароль</h1>' +
          '<p class="lede">Вам открыт доступ к дереву «' + esc(S.tree.meta.name) +
          '». Придумайте пароль — логин уже заведён: <b>' + esc(old.login) + '</b>.</p>' +
          '<label for="gPass">Пароль</label><input id="gPass" type="password" autocomplete="new-password">' +
          '<label for="gPass2">Пароль ещё раз</label><input id="gPass2" type="password" autocomplete="new-password">' +
          '<p class="note" id="gPassHint"></p>' +
          '<div class="err" id="gErr"></div>' +
          '<div class="btn-row"><button class="btn btn-primary" id="gGo">Принять приглашение</button></div>');
        watchPass('gPass', 'gPassHint');
        document.getElementById('gGo').addEventListener('click', function () {
          var p1 = val('gPass'), p2 = val('gPass2');
          var bad0 = passTrouble(p1);
          if (bad0) return err(bad0);
          if (p1 !== p2) return err('Пароли не совпадают');
          S.setPassword(old, p1).then(function () {
            old.invite = null;
            old.updated = new Date().toISOString();
            S.save();
            S.setSession({ userId: old.id, login: old.login, role: old.role, displayName: old.displayName });
            location.hash = '';
            return S.unlockCrypto(p1);
          }).then(function () { self.start(); });
        });
        return;
      }

      /* Обычный путь: человек сам пишет, как его зовут, и придумывает вход. */
      this.gate(
        '<h1>Знакомство</h1>' +
        '<p class="lede">Дерево «' + esc(S.tree.meta.name) + '» открыто' +
        (inv.by ? ', вас пригласил ' + esc(inv.by) : '') + '. Как вас записать и ' +
        'под каким входом вы будете заходить?</p>' +
        '<label for="gName">Имя и фамилия</label><input id="gName" autocomplete="name">' +
        '<label for="gLogin">Логин</label><input id="gLogin" autocomplete="username" spellcheck="false">' +
        '<label for="gPass">Пароль</label><input id="gPass" type="password" autocomplete="new-password">' +
        '<label for="gPass2">Пароль ещё раз</label><input id="gPass2" type="password" autocomplete="new-password">' +
        '<p class="note" id="gPassHint"></p>' +
        '<p class="note" style="margin-top:10px">Этот же пароль открывает записи с замком. ' +
        'Восстановить его нельзя — запишите в надёжном месте.</p>' +
        '<div class="err" id="gErr"></div>' +
        '<div class="btn-row"><button class="btn btn-primary" id="gGo">Войти в дерево</button></div>');

      watchPass('gPass', 'gPassHint');
      document.getElementById('gGo').addEventListener('click', function () {
        var name = val('gName'), login = val('gLogin'), p1 = val('gPass'), p2 = val('gPass2');
        if (!name) return err('Напишите, как вас зовут');
        if (!login) return err('Придумайте логин');
        if (!/^[A-Za-z0-9_.-]{3,}$/.test(login)) {
          return err('Логин — латиницей, не короче трёх знаков');
        }
        var bad1 = passTrouble(p1);
        if (bad1) return err(bad1);
        if (p1 !== p2) return err('Пароли не совпадают');
        err('Входим…');
        S.acceptInvite(token, login, p1, name).then(function (r) {
          if (r.error) { err(r.error); return; }
          S.setSession({ userId: r.user.id, login: r.user.login, role: r.user.role,
            displayName: r.user.displayName });
          location.hash = '';
          return S.unlockCrypto(p1).then(function () { self.start(); });
        });
      });
    },

    /* вход по отпечатку: ключ хранится в устройстве, пароль дерева — в защищённом поле */
    bioRegister: function () {
      var self = this;
      if (!global.PublicKeyCredential || !navigator.credentials) { this.toast('Устройство не поддерживает вход по отпечатку'); return; }
      this.prompt('Пароль дерева', 'Подтвердите пароль — он понадобится, чтобы открывать зашифрованные записи после входа по отпечатку.', '', function (pass) {
        S.auth(S.session.login, pass).then(function (u) {
          if (!u) { self.toast('Пароль не подходит'); return; }
          var challenge = crypto.getRandomValues(new Uint8Array(32));
          return navigator.credentials.create({
            publicKey: {
              challenge: challenge,
              rp: { name: 'Семейное Древо' },
              user: { id: new TextEncoder().encode(u.id), name: u.login, displayName: u.displayName },
              pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
              authenticatorSelection: { userVerification: 'required', authenticatorAttachment: 'platform' },
              timeout: 60000
            }
          }).then(function (cred) {
            return U.encryptText(pass).then(function (packed) {
              u.webauthn = { id: U.bytesToB64(cred.rawId), wrapped: packed };
              S.saveUsers();
              self.toast('Вход по отпечатку включён');
            });
          });
        }).catch(function () { self.toast('Не удалось включить вход по отпечатку'); });
      }, 'password');
    },
    bioLogin: function () {
      var self = this;
      var u = S.users.filter(function (x) { return x.webauthn; })[0];
      if (!u) return;
      navigator.credentials.get({
        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          allowCredentials: [{ type: 'public-key', id: U.b64ToBytes(u.webauthn.id) }],
          userVerification: 'required', timeout: 60000
        }
      }).then(function () {
        S.setSession({ userId: u.id, login: u.login, role: u.role, displayName: u.displayName });
        self.toast('Отпечаток принят. Введите пароль дерева один раз, чтобы открыть закрытые записи.');
        self.start();
      }).catch(function () { self.toast('Отпечаток не распознан'); });
    },

    /* ============ верхняя панель ============ */
    bindChrome: function () {
      var self = this;
      var q = document.getElementById('q');
      q.addEventListener('input', function () { self.runSearch(q.value); });
      q.addEventListener('focus', function () { if (q.value) self.runSearch(q.value); });
      document.getElementById('qClear').addEventListener('click', function () {
        q.value = ''; self.runSearch('');
        q.focus();
      });
      document.getElementById('qMic').addEventListener('click', function () { self.searchByVoice(this); });
      document.addEventListener('click', function (e) {
        if (!e.target.closest('.search-wrap')) document.getElementById('qResults').hidden = true;
      });
      document.getElementById('btnSettings').addEventListener('click', function () { self.openSettings(); });
      document.getElementById('btnSync').addEventListener('click', function () {
        var Sy = global.Sync;
        if (!Sy.ready()) { self.openSettings('sync'); return; }
        self.firstSync(function (rep) {
          self.afterSync();
          self.toast('Синхронизировано. ' + Sy.statsText(rep.stats) +
            (rep.down ? ' · получено файлов: ' + rep.down : ''));
        }, function (e) { self.toast('Синхронизация не прошла: ' + e.message); });
      });
      document.getElementById('btnTrash').addEventListener('click', function () { self.openTrash(); });
      document.getElementById('btnCalendar').addEventListener('click', function () { self.openCalendar(); });
      document.getElementById('btnMap').addEventListener('click', function () { self.openMap(); });
      document.getElementById('btnAdd').addEventListener('click', function () { self.addPerson(); });
      document.getElementById('btnLogout').addEventListener('click', function () {
        var Sy = global.Sync;
        var warn = (S.sync && S.sync.mode !== 'off' && S.dirty)
          ? 'Есть правки, которые ещё не ушли в общее хранилище. Синхронизировать перед выходом?'
          : 'Дерево останется на этом устройстве. Войти снова можно будет по логину и паролю.';
        self.modal('Выйти из программы?', '<p class="note">' + warn + '</p>',
          (S.sync && S.sync.mode !== 'off' && S.dirty ? [{
            text: 'Синхронизировать и выйти', primary: true, fn: function () {
              self.closeModal();
              self.toast('Отправляем правки…');
              Sy.run({ media: true }).then(done, function () {
                self.toast('Отправить не вышло — правки останутся на устройстве');
                setTimeout(done, 1200);
              });
            }
          }] : []).concat([{
            text: 'Выйти', danger: true, fn: done
          }]));
        function done() { S.setSession(null); location.reload(); }
      });
      document.getElementById('viewdock').addEventListener('click', function (e) {
        var b = e.target.closest('[data-view]');
        if (!b) return;
        S.prefs.layout = b.dataset.view; S.savePrefs();
        self.tree.setMode(b.dataset.view);
        self.markView();
        setTimeout(function () { self.tree.fit(true); }, 30);
      });
      document.getElementById('zoomIn').addEventListener('click', function () { self.tree.zoom(1.2); });
      document.getElementById('zoomOut').addEventListener('click', function () { self.tree.zoom(1 / 1.2); });
      document.getElementById('zoomFit').addEventListener('click', function () { self.tree.fit(); });
      document.getElementById('zoomHome').addEventListener('click', function () {
        /* Возврат к исходному виду: дерево снова строится от главного человека.
           «В центр дерева» меняет точку отсчёта — отсюда и другая расстановка. */
        var root = S.tree.meta.rootId && S.person(S.tree.meta.rootId)
          ? S.tree.meta.rootId : Object.keys(S.tree.persons)[0];
        if (!root) return;
        /* Возврат к виду по умолчанию целиком: и точка отсчёта, и
           расстановка. «В центр дерева» ставит другого человека корнем —
           эта кнопка отменяет всё, что он наменял. */
        S.prefs.layout = S.prefs.layout || 'vertical';
        self.tree.setMode(S.prefs.layout);
        self.markView();
        self.tree.setFocus(root);
        self.tree.fit(true);
        self.toast('Дерево снова по умолчанию');
      });
      /* Щелчок мимо окна раньше его закрывал — и набранное в форме
         пропадало от случайного промаха. Закрывают теперь только крестик,
         кнопки окна и Esc. */
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { self.closeModal(); document.getElementById('qResults').hidden = true; }
      });
    },
    markView: function () {
      document.querySelectorAll('#viewdock [data-view]').forEach(function (b) {
        b.setAttribute('aria-pressed', b.dataset.view === S.prefs.layout ? 'true' : 'false');
      });
    },

    /* ============ поиск ============ */
    runSearch: function (q) {
      var box = document.getElementById('qResults'), self = this;
      if (!q || !q.trim()) { box.hidden = true; box.innerHTML = ''; return; }
      var res = S.search(q);
      if (!res.length) {
        box.hidden = false;
        box.innerHTML = '<div class="empty" style="padding:18px">Ничего не нашлось</div>';
        return;
      }
      box.hidden = false;
      box.innerHTML = res.map(function (r, i) {
        var p = r.person;
        var sub = r.media ? ('файл: ' + esc(r.media.name)) : esc([S.years(p), p.birth && p.birth.place].filter(Boolean).join(' · ') || '—');
        return '<button data-i="' + i + '"><span class="mini-ph" data-ph="' + (p ? p.id : '') + '">' +
          global.Icon('person') + '</span>' +
          '<span style="min-width:0"><span style="display:block">' + esc(p ? S.fullName(p) : '—') + '</span>' +
          '<span class="r-sub">' + sub + '</span></span></button>';
      }).join('');
      box.querySelectorAll('button').forEach(function (b) {
        b.addEventListener('click', function () {
          var r = res[+b.dataset.i];
          box.hidden = true;
          if (r.person) { self.showTab('tree'); self.tree.reveal(r.person.id); self.sheet.open(r.person.id); }
        });
      });
      box.querySelectorAll('[data-ph]').forEach(function (el) {
        var p = S.person(el.dataset.ph);
        if (!p || !p.photo) return;
        S.mediaURL(p.photo).then(function (url) {
          if (url) { el.style.backgroundImage = 'url(' + url + ')'; el.innerHTML = ''; }
        });
      });
    },
    searchByVoice: function (btn) {
      var SR = global.SpeechRecognition || global.webkitSpeechRecognition, self = this;
      if (!SR) { this.toast('Голосовой поиск работает в Chrome, Edge и Safari'); return; }
      var rec = new SR();
      rec.lang = 'ru-RU'; rec.interimResults = true;
      btn.classList.add('rec');
      rec.onresult = function (e) {
        var s = '';
        for (var i = 0; i < e.results.length; i++) s += e.results[i][0].transcript;
        document.getElementById('q').value = s;
        self.runSearch(s);
      };
      rec.onend = function () { btn.classList.remove('rec'); };
      rec.onerror = function () { btn.classList.remove('rec'); self.toast('Микрофон недоступен'); };
      try { rec.start(); } catch (e) { btn.classList.remove('rec'); }
    },

    /* ============ вкладки ============ */
    renderTabs: function () {
      var self = this, bar = document.getElementById('tabs');
      bar.innerHTML = S.tree.tabs.map(function (t) {
        return '<button role="tab" data-tab="' + t.id + '" aria-selected="' + (self.activeTab === t.id) + '">' +
          esc(t.title) + (t.builtin ? '' : ' <span class="tab-close" data-del="' + t.id +
            '" title="Убрать вкладку">' + global.Icon('close') + '</span>') + '</button>';
      }).join('') + '<button class="tab-add" id="tabAdd" title="Добавить вкладку">+</button>';
      bar.querySelectorAll('[data-tab]').forEach(function (b) {
        b.addEventListener('click', function (e) {
          var x = e.target.closest('[data-del]');     // нажатие может попасть в рисунок внутри
          if (x) {
            e.stopPropagation();
            var id = x.dataset.del;
            var tab = S.tree.tabs.filter(function (t) { return t.id === id; })[0];
            self.confirm('Убрать вкладку «' + ((tab && tab.title) || '') + '»?',
              'Люди, фотографии и связи останутся на месте — пропадёт только сама вкладка' +
              (tab && tab.kind === 'notes' && tab.content ? ' вместе с записями на ней.' : '.'),
              function () {
                S.removeTab(id);
                if (self.activeTab === id) self.activeTab = 'tree';
                self.renderTabs();
                self.showTab(self.activeTab);
                self.toast('Вкладка убрана');
              });
            return;
          }
          self.showTab(b.dataset.tab);
        });
      });
      document.getElementById('tabAdd').addEventListener('click', function () { self.addTabDialog(); });
    },
    showTab: function (id) {
      this.activeTab = id;
      var tab = S.tree.tabs.filter(function (t) { return t.id === id; })[0] || S.tree.tabs[0];
      document.querySelectorAll('.pane').forEach(function (p) { p.classList.remove('active'); });
      document.querySelectorAll('#tabs [data-tab]').forEach(function (b) {
        b.setAttribute('aria-selected', b.dataset.tab === id ? 'true' : 'false');
      });
      var kind = tab.builtin ? tab.id : tab.kind;
      var pane = document.getElementById('pane-' + (['tree', 'photos', 'changes', 'calendar', 'map', 'people'].indexOf(kind) >= 0 ? kind : 'notes'));
      pane.classList.add('active');
      if (kind === 'tree') { this.markView(); this.tree.render(); }
      if (kind === 'photos') global.Files.render();
      if (kind === 'changes') this.renderChanges();
      if (kind === 'calendar') this.renderCalendar(document.querySelector('#pane-calendar .pane-scroll'));
      if (kind === 'people') this.renderPeople();
      if (kind === 'map') this.renderMapPane();
      if (kind === 'notes') this.renderNotesTab(tab);
    },
    addTabDialog: function () {
      var self = this;
      this.modal('Новая вкладка',
        '<div class="row"><label for="ntTitle">Название</label><input id="ntTitle" placeholder="Например, «Документы»"></div>' +
        '<div class="row"><label for="ntKind">Что показывать</label><select id="ntKind">' +
        '<option value="notes">Свободные заметки</option>' +
        '<option value="calendar">Календарь дат</option>' +
        '<option value="map">Карта мест</option>' +
        '<option value="people">Список людей</option>' +
        '<option value="photos">Галерея</option>' +
        '<option value="changes">Журнал изменений</option>' +
        '</select></div>',
        [{ text: 'Добавить', primary: true, fn: function () {
          var title = document.getElementById('ntTitle').value.trim();
          var kind = document.getElementById('ntKind').value;
          if (!title) return;
          S.addTab(title, kind);

    /* ============ вкладка «Фото и файлы» ============
       Сам раздел живёт в js/files.js: там папки, виды, выделение и скачивание. */

    /* ============ вкладка «Изменения» ============ */
    renderChanges: function () {
      var host = document.querySelector('#pane-changes .pane-scroll'), self = this;
      var ch = S.tree.changes || [];
      var canEdit = S.isAdmin();
      if (!ch.length) {
        host.innerHTML = '<h2 style="margin-bottom:4px">Изменения</h2>' +
          '<div class="empty">Журнал пуст</div>';
        return;
      }
      var kinds = { add: 'добавление', edit: 'правка', delete: 'удаление', media: 'файл',
        user: 'доступ', tab: 'вкладка', import: 'загрузка' };
      var cols = [
        { key: 'ts', title: 'Когда', num: true,
          get: function (c) { return Date.parse(c.ts || '') || 0; },
          cell: function (c) { return new Date(c.ts).toLocaleString('ru-RU'); } },
        { key: 'user', title: 'Кто', get: function (c) { return c.user || ''; },
          cell: function (c) { return esc(c.user || '—'); } },
        { key: 'action', title: 'Что', get: function (c) { return kinds[c.action] || c.action || ''; },
          cell: function (c) {
            return '<span class="chip ' + esc(c.action) + '">' + esc(kinds[c.action] || c.action) + '</span>';
          } },
        { key: 'summary', title: 'Подробности', get: function (c) { return c.summary || ''; },
          cell: function (c) { return esc(c.summary || ''); } }
      ];
      if (canEdit) {
        cols.push({ key: 'del', title: '', sortable: false, get: function () { return 0; },
          cell: function (c) {
            return '<button class="c-del" data-del="' + esc(c.id) + '" type="button" ' +
              'title="Убрать эту строку" aria-label="Убрать эту строку">' + global.Icon('trash') + '</button>';
          } });
      }

      function draw() {
        var list = (S.tree.changes || []).slice(0, 500);
        var t = self.buildTable('tblChanges', cols, list, { key: 'ts', dir: -1 });
        host.innerHTML = '<h2 style="margin-bottom:4px">Изменения</h2>' +
          '<p class="note" style="margin:0 0 12px">Кто и когда что поправил. Записей: ' +
          (S.tree.changes || []).length +
          '. Заголовки столбцов сортируют список' +
          (canEdit ? '; лишние строки можно убрать — на сами данные это не влияет.' : '.') + '</p>' +
          (canEdit ? '<div class="btn-row" style="margin:0 0 12px">' +
            '<button class="btn btn-sm btn-danger" id="chClear">Очистить журнал целиком</button></div>' : '') +
          t.html +
          ((S.tree.changes || []).length > 500
            ? '<p class="note" style="margin-top:10px">Показаны последние 500 записей.</p>' : '');
        self.bindTable('tblChanges', draw);
        host.querySelectorAll('[data-del]').forEach(function (b) {
          b.addEventListener('click', function () {
            S.tree.changes = (S.tree.changes || []).filter(function (c) { return c.id !== b.dataset.del; });
            S.save(true);
            draw();
            bindClear();
          });
        });
        bindClear();
      }
      draw();
      return;

      function bindClear() {
        var clr = document.getElementById('chClear');
        if (clr) clr.addEventListener('click', function () {
          self.confirm('Очистить журнал изменений?',
            'Пропадёт только история правок — люди, фотографии и связи останутся на месте. ' +
            'У других родственников журнал восстановится при следующей синхронизации с их устройств.',
            function () {
              S.tree.changes = [];
              S.save(true);
              self.renderChanges();
              self.toast('Журнал очищен');
            });
        });
      }
    },

    /* ============ сортируемая таблица ============
       cols: [{ key, title, get(row), cell(row), num }]
       Запоминает выбранный столбец отдельно для каждой таблицы. */
    sortState: {},
    buildTable: function (tableId, cols, rows, opts) {
      opts = opts || {};
      var st = this.sortState[tableId] || (this.sortState[tableId] = {
        key: opts.key || cols[0].key, dir: opts.dir || 1
      });
      var col = cols.filter(function (c) { return c.key === st.key; })[0] || cols[0];
      var sorted = rows.slice().sort(function (a, b) {
        var x = col.get(a), y = col.get(b);
        if (x == null) x = col.num ? -Infinity : '';
        if (y == null) y = col.num ? -Infinity : '';
        var r = col.num ? (x - y) : String(x).localeCompare(String(y), 'ru');
        return r * st.dir;
      });
      var head = cols.map(function (c) {
        var on = c.key === st.key;
        return '<th' + (c.sortable === false ? '' : ' class="sortable" data-sort="' + c.key + '"') +
          (on ? ' aria-sort="' + (st.dir > 0 ? 'ascending' : 'descending') + '"' : '') + '>' +
          esc(c.title) +
          (c.sortable === false ? '' : '<span class="sort-mark">' + (on ? (st.dir > 0 ? '▲' : '▼') : '⇅') + '</span>') +
          '</th>';
      }).join('');
      var body = sorted.map(function (r) {
        return '<tr>' + cols.map(function (c) {
          return '<td' + (c.num ? ' style="font-variant-numeric:tabular-nums"' : '') + '>' + c.cell(r) + '</td>';
        }).join('') + '</tr>';
      }).join('');
      return { html: '<div class="table-wrap"><table class="data" id="' + tableId + '"><thead><tr>' +
        head + '</tr></thead><tbody>' + body + '</tbody></table></div>', rows: sorted };
    },
    bindTable: function (tableId, redraw) {
      var self = this, t = document.getElementById(tableId);
      if (!t) return;
      t.querySelectorAll('[data-sort]').forEach(function (th) {
        th.addEventListener('click', function () {
          var st = self.sortState[tableId];
          if (st.key === th.dataset.sort) st.dir = -st.dir;
          else { st.key = th.dataset.sort; st.dir = 1; }
          redraw();
        });
      });
    },

    /* ============ список людей ============ */
    renderPeople: function () {

      var cols = [

          cell: function (p) { return p.sex === 'M' ? 'М' : p.sex === 'F' ? 'Ж' : '—'; } },
        { key: 'birth', title: 'Рождение', num: true,
          get: function (p) { return +(U.yr(p.birth && p.birth.date) || 0); },

          cell: function (p) { return esc((p.birth && p.birth.place) || '—'); } },
        { key: 'media', title: 'Файлов', num: true, get: function (p) { return (p.media || []).length; },
          cell: function (p) { return (p.media || []).length || '—'; } },
        { key: 'updated', title: 'Изменено', num: true,
          get: function (p) { return Date.parse(p.updated || '') || 0; },

          'Повторное нажатие переворачивает порядок.</p>' + t.html;
        self.bindTable('tblPeople', draw);

          });

      draw();
    },

    /* ============ календарь ============ */

    },
    renderCalendar: function (host) {

        ['birth', 'Дни рождения'],
        ['wedding', 'Годовщины свадьбы'],

      var pick = '<div class="set-card" style="margin-bottom:14px"><h3>Какие даты помнить</h3>' +

        }).join('') + '</tbody></table>' +
        '<div class="set-row" style="margin-top:10px"><span>Показывать ближайшие даты на главном экране</span>' +
        '<input type="checkbox" id="calHome"' + (p.homeDates !== false ? ' checked' : '') + '></div>' +
        '<div class="btn-row"><button class="btn btn-sm" id="calNotify">Включить напоминания</button></div>' +
        '<p class="note">Напоминание приходит за день и в сам день.</p></div>';

      host.innerHTML = pick + this.monthGrid() + (up.length
        ? '<div class="sect-title">Ближайшие даты</div>' + up.map(function (e) {
            var when = e.in === 0 ? 'сегодня' : e.in === 1 ? 'завтра' : 'через ' + e.in + ' дн.';
            return '<div class="cal-day" data-person="' + esc(e.person.id) + '">' +
              '<div class="cal-when"><b>' + e.date.getDate() + '</b>' +
              e.date.toLocaleDateString('ru-RU', { month: 'short' }) + '</div>' +
              '<div class="li-main"><div>' + esc(S.fullName(e.person)) + '</div>' +
              '<div class="li-sub">' + esc(self.kindName(e)) +
              (e.age ? ' · ' + e.age + ' лет' : '') + '</div></div>' +
              '<span class="chip' + (e.in <= 3 ? ' cal-soon' : '') + '">' + when + '</span></div>';
          }).join('')
        : '<div class="empty">Ближайших дат нет.<br>Они появятся, когда будут заполнены даты рождения и события.</div>');

      this.bindMonth(host);
      host.querySelectorAll('.cal-day[data-person]').forEach(function (d) {
        d.addEventListener('click', function () {
          self.showTab('tree');
          self.tree.reveal(d.dataset.person);
          self.sheet.open(d.dataset.person);
        });
      });

      host.querySelectorAll('[data-show]').forEach(function (c) {
        c.addEventListener('change', function () {
          p.calShow[c.dataset.show] = c.checked;

          self.renderCalendar(host);
          self.paintHomeDates();
        });
      });
      host.querySelectorAll('[data-notify]').forEach(function (c) {
        c.addEventListener('change', function () {
          p.calNotify[c.dataset.notify] = c.checked;

      if (home) home.addEventListener('change', function () {
        p.homeDates = this.checked;
        S.savePrefs();
        self.paintHomeDates();
