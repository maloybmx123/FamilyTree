        var files = [{ name: 'drevo.json', data: new TextEncoder().encode(JSON.stringify(tree)) }];
        var pend = b._pending || {};
        // всё, что уже лежало в файле, кроме перезаписанного
        var keep = b._cache || {};
        Object.keys(keep).forEach(function (n) {
          if (n === 'drevo.json') return;
          var id = n.replace(/^media\//, '');
          if (pend[id]) return;
          if (!tree.media[id]) return;                 // файл удалили — не переносим
          files.push({ name: n, data: keep[n] });
        });
        var ids = Object.keys(pend);
        return Promise.all(ids.map(function (id) {
          return pend[id].arrayBuffer().then(function (ab) {
            files.push({ name: 'media/' + id, data: new Uint8Array(ab) });
          });
        })).then(function () {
          var blob = global.IO.zip(files);
          return b.handle.createWritable().then(function (w) {
            return w.write(blob).then(function () { return w.close(); });
          });
        }).then(function () {
          b._pending = {};
          // обновить представление о содержимом файла
          var map = {};
          files.forEach(function (f) { map[f.name] = f.data; });
          b._cache = map;
        });
      },
      putMedia: function (cfg, id, blob) {
        var b = backends.file;
        b._pending = b._pending || {};
        b._pending[id] = blob;
        return Promise.resolve();
      },
      getMedia: function (cfg, id) {
        var b = backends.file;
        var d = b._cache && b._cache['media/' + id];
        return Promise.resolve(d ? new Blob([d]) : null);
      }
    }
  };

  /* запомнить выбранный файл между запусками */
  function saveHandle(h) {
    return U.blobPut('__sync_handle', h).catch(function () {});
  }
  function loadHandle() {
    return U.blobGet('__sync_handle').then(function (h) {
      if (!h || !h.queryPermission) return null;
      return h.queryPermission({ mode: 'readwrite' }).then(function (p) {
        if (p === 'granted') { backends.file.handle = h; return h; }
        return h;         // разрешение спросим при первой записи
      }).catch(function () { return null; });
    }).catch(function () { return null; });
  }

  /* ===================== запуск ===================== */

  var Sync = {
    backends: backends,
    merge: merge,
    unzip: unzip,
    statsText: statsText,
    busy: false,
    listeners: [],

    on: function (fn) { this.listeners.push(fn); },
    emit: function (state) {
      this.listeners.forEach(function (f) { try { f(state); } catch (e) {} });
    },

    cfg: function () {
      var s = S.sync || {};
      return s[s.mode] || {};
    },
    backend: function () {
      var s = S.sync || {};
      return backends[s.mode] || null;
    },
    ready: function () {
      var b = this.backend();
      if (!b) return false;
      if (b === backends.file) return !!backends.file.handle;
      var cfg = this.cfg();
      return b.needs.every(function (k) { return !!String(cfg[k] || '').trim(); });
    },

    restore: function () { return loadHandle(); },

    /** полный проход: забрать → слить → отдать → файлы */
    run: function (opts) {
      opts = opts || {};
      var self = this;
      var b = this.backend(), cfg = this.cfg();
      if (!b) return Promise.reject(new Error('Способ синхронизации не выбран'));
      if (!this.ready()) return Promise.reject(new Error('Синхронизация настроена не до конца'));
      if (this.busy) return Promise.reject(new Error('Синхронизация уже идёт'));

      this.busy = true;
      this.emit({ state: 'run', text: 'Синхронизация…' });
      var report = { pulled: null, stats: null, up: 0, down: 0, failed: [], failedDown: [] };

      return b.pull(cfg)
        .then(function (remote) {
          report.pulled = remote;
          // точка восстановления до чужих правок: если кто-то удалил человека,
          // администратору будет куда вернуться
          if (global.History && remote) global.History.maybeSnapshot('перед приёмом правок');
          var res = merge(S.tree, remote);
          report.stats = res.stats;
          // сохранить слияние у себя
          S.tree = res.tree;
          S.save(true);
          return b.push(cfg, S.tree);
        })
        .then(function () { return self.syncMedia(b, cfg, opts, report); })
        .then(function () {
          S.sync.lastAt = new Date().toISOString();
          S.dirty = false;
          var stuck = report.failed.length + report.failedDown.length;
          var txt = statsText(report.stats) +
            (report.up ? ' · отправлено файлов: ' + report.up : '') +
            (report.down ? ' · получено файлов: ' + report.down : '');
          if (stuck) {
            // молчать тут нельзя: человек будет уверен, что фотографии уехали
            S.sync.lastError = mediaTrouble(report);
            txt += ' · файлов не передалось: ' + stuck;
            S.saveSync();
            self.busy = false;
            self.emit({ state: 'warn', text: txt, report: report, detail: S.sync.lastError });
            return report;
          }
          S.sync.lastError = null;
          S.saveSync();
          self.busy = false;
          self.emit({ state: 'ok', text: txt, report: report });
          return report;
        })
        .catch(function (e) {
          self.busy = false;
          S.sync.lastError = e.message;
          S.saveSync();
          self.emit({ state: 'error', text: e.message });
          throw e;
        });
    },

    /** отправить свои новые файлы; забрать чужие, если велено */
    syncMedia: function (b, cfg, opts, report) {
      var self = this;
      var mine = [], theirs = [];
      Object.keys(S.tree.media).forEach(function (id) {
        var m = S.tree.media[id];
        if (!m.uploaded) mine.push(id);
      });

      function upload() {
        if (!mine.length) return Promise.resolve();
        var i = 0;
        function step() {
          if (i >= mine.length) return Promise.resolve();
          var id = mine[i++];
          self.emit({ state: 'run', text: 'Отправка файлов ' + i + ' из ' + mine.length });
          return U.blobGet(id).then(function (blob) {
            if (!blob) { return; }                      // файла нет на этом устройстве
            return b.putMedia(cfg, id, blob).then(function () {
              if (S.tree.media[id]) {
                S.tree.media[id].uploaded = true;
                S.tree.media[id].updated = new Date().toISOString();
              }
              report.up++;
            });
          }).catch(function (e) {
            /* Раньше ошибка только писалась в консоль — человек видел «всё хорошо»,
               а фотографии оставались на одном устройстве. Теперь она доходит до отчёта. */
            report.failed.push({ id: id, name: (S.tree.media[id] || {}).name || id, why: e.message });
          }).then(step);
        }
        return step();
      }

      function findMissing() {
        var ids = Object.keys(S.tree.media).filter(function (id) { return S.tree.media[id].uploaded; });
        var i = 0, missing = [];
        function step() {
          if (i >= ids.length) return Promise.resolve(missing);
          var id = ids[i++];
          return U.blobGet(id).then(function (bl) { if (!bl) missing.push(id); }).then(step);
        }
        return step();
      }

      function download(list) {
        if (!list.length) return Promise.resolve();
        var i = 0;
        function step() {
          if (i >= list.length) return Promise.resolve();
          var id = list[i++];
          self.emit({ state: 'run', text: 'Загрузка файлов ' + i + ' из ' + list.length });
          return b.getMedia(cfg, id).then(function (blob) {
            if (blob) return U.blobPut(id, blob).then(function () { report.down++; });
          }).catch(function (e) {
            report.failedDown.push({ id: id, name: (S.tree.media[id] || {}).name || id, why: e.message });
          }).then(step);
        }
        return step();
      }

      return upload()
        .then(function () { return mine.length ? b.push(cfg, S.tree) : null; })  // отметки «отправлено»
        .then(findMissing)
        .then(function (missing) {
          report.missing = missing.length;
          if (opts.media === false) return null;      // откладываем до открытия файла
          return download(missing);
        })
        .then(function () { S.save(true); });
    },

    /** заглянуть в общее хранилище, ничего не меняя у себя */
    peek: function () {
      var b = this.backend();
      if (!b || !this.ready()) return Promise.resolve(null);
      return b.pull(this.cfg());
    },

    /** отдать своё дерево, не принимая чужого (для «заменить общее моим») */
    pushOnly: function () {
      var self = this, b = this.backend(), cfg = this.cfg();
      if (!b) return Promise.reject(new Error('Способ синхронизации не выбран'));
      this.busy = true;
      this.emit({ state: 'run', text: 'Отправка дерева…' });
      var report = { stats: zeroStats(), up: 0, down: 0, failed: [], failedDown: [] };
      return b.push(cfg, S.tree)
        .then(function () { return self.syncMedia(b, cfg, { media: false }, report); })
        .then(function () {
          S.sync.lastAt = new Date().toISOString();
          S.sync.lastError = null;
          S.dirty = false;
          S.saveSync();
          self.busy = false;
          self.emit({ state: 'ok', text: 'Дерево отправлено', report: report });
          return report;
        })
        .catch(function (e) {
          self.busy = false;
          S.sync.lastError = e.message;
          S.saveSync();
          self.emit({ state: 'error', text: e.message });
          throw e;
        });
    },

    /** подтянуть один файл по требованию — когда его открывают, а локально его нет */
    fetchOne: function (id) {
      var b = this.backend(), cfg = this.cfg();
      var m = S.tree.media[id];
      if (!b || !m || !m.uploaded || !this.ready()) return Promise.resolve(null);
      return b.getMedia(cfg, id).then(function (blob) {
        if (!blob) return null;
        return U.blobPut(id, blob).then(function () { return blob; });
      }).catch(function () { return null; });
    },

    /* автоматический проход по таймеру */
    timer: null,
    schedule: function () {
      var self = this;
      clearInterval(this.timer);
      if (!S.sync || !S.sync.auto || S.sync.mode === 'off') return;
      var every = Math.max(30, S.sync.interval || 120) * 1000;
      this.timer = setInterval(function () {
        if (self.busy || !self.ready()) return;
        if (global.navigator && navigator.onLine === false) return;
        self.run({ media: true }).catch(function () {});
      }, every);
    },
    stop: function () { clearInterval(this.timer); this.timer = null; }
  };

  // дать хранилищу способ подтянуть недостающий файл
  S.fetchRemote = function (id) { return Sync.fetchOne(id); };

  global.Sync = Sync;
})(window);
</script>
<script>/* Семейное Древо — небольшая карта на тайлах OpenStreetMap, без внешних библиотек.
   Показывает места рождения, смерти и событий. */
(function (global) {
  'use strict';

  function MiniMap(host) {
    this.host = host;
    this.z = 4;
    this.cx = 55.75; this.cy = 37.62;     // широта/долгота центра
    this.pins = [];
    this.onPin = function () {};
    this._build();
  }
  var TILE = 256;

  function lon2x(lon, z) { return (lon + 180) / 360 * Math.pow(2, z) * TILE; }
  function lat2y(lat, z) {
    var s = Math.sin(lat * Math.PI / 180);
    return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * Math.pow(2, z) * TILE;
  }
  function x2lon(x, z) { return x / (Math.pow(2, z) * TILE) * 360 - 180; }
  function y2lat(y, z) {
    var n = Math.PI - 2 * Math.PI * y / (Math.pow(2, z) * TILE);
    return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
  }

  MiniMap.prototype._build = function () {
    var self = this;
    this.host.innerHTML =
      '<div class="map-ctl">' +
      '<button class="btn btn-sm" data-z="1" type="button" title="Приблизить" aria-label="Приблизить">' +
      global.Icon('plus') + '</button>' +
      '<button class="btn btn-sm" data-z="-1" type="button" title="Отдалить" aria-label="Отдалить">' +
      global.Icon('minus') + '</button>' +
      '<button class="btn btn-sm" data-fit="1" type="button" title="Показать все" aria-label="Показать все">' +
      global.Icon('expand') + '</button>' +
      '</div><div class="map-attr">© OpenStreetMap</div>';
    this.layer = document.createElement('div');
    this.layer.style.cssText = 'position:absolute;inset:0';
    this.host.insertBefore(this.layer, this.host.firstChild);

    this.onClick = null;      // выбор точки: fn(lat, lng)
    this.host.addEventListener('click', function (e) {
      var b = e.target.closest('[data-z]');
      if (b) { self.zoomTo(self.z + (+b.dataset.z)); return; }
      if (e.target.closest('[data-fit]')) { self.fit(); return; }
      if (e.target.closest('.map-ctl') || e.target.closest('.map-pin')) return;
      if (!self.onClick || self._moved) return;
      var r = self.host.getBoundingClientRect();
      var W = r.width, H = r.height, z = self.z;
      var left = lon2x(self.cy, z) - W / 2, top = lat2y(self.cx, z) - H / 2;
      self.onClick(y2lat(top + (e.clientY - r.top), z), x2lon(left + (e.clientX - r.left), z));
    });
    var drag = null;
    this.host.addEventListener('dragstart', function (e) { e.preventDefault(); });
    /* Щипок двумя пальцами: без него на телефоне карту было нечем приблизить.
       Тайлы бывают только целых уровней, поэтому уровень переключается,
       когда пальцы разошлись или сошлись заметно. */
    var pinch = null;
    this.host.addEventListener('touchstart', function (e) {
      if (e.touches.length === 2) { drag = null; pinch = { d: tdist(e.touches), z: self.z }; }
    }, { passive: true });
    this.host.addEventListener('touchmove', function (e) {
      if (!pinch || e.touches.length !== 2) return;
      e.preventDefault();
      var k = tdist(e.touches) / pinch.d;
      var nz = Math.max(2, Math.min(17, Math.round(pinch.z + Math.log(k) / Math.log(1.8))));
      if (nz !== self.z) { self.zoomTo(nz); }
    }, { passive: false });
    this.host.addEventListener('touchend', function (e) { if (e.touches.length < 2) pinch = null; });
    function tdist(t) {
      var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
      return Math.sqrt(dx * dx + dy * dy) || 1;
    }

    this.host.addEventListener('pointerdown', function (e) {
      if (e.target.closest('.map-ctl') || e.target.closest('.map-pin')) return;
      if (e.target.closest('.map-tools')) return;
      e.preventDefault();
      drag = { x: e.clientX, y: e.clientY, cx: self.cx, cy: self.cy };
      self._moved = false;
      self.host.setPointerCapture(e.pointerId);
      self.host.classList.add('grabbing');
    });
    this.host.addEventListener('pointermove', function (e) {
      if (!drag) return;
      if (Math.abs(e.clientX - drag.x) > 3 || Math.abs(e.clientY - drag.y) > 3) self._moved = true;
      var z = self.z;
      var px = lon2x(drag.cy, z) - (e.clientX - drag.x);
      var py = lat2y(drag.cx, z) - (e.clientY - drag.y);
      self.cy = x2lon(px, z); self.cx = y2lat(py, z);
      self.draw();
    });
    function end() { drag = null; self.host.classList.remove('grabbing'); }
    this.host.addEventListener('pointerup', end);
    this.host.addEventListener('pointercancel', end);
    this.host.addEventListener('wheel', function (e) {
      e.preventDefault();
      self.zoomTo(self.z + (e.deltaY < 0 ? 1 : -1));
    }, { passive: false });
  };

  /* Масштаб меняется вокруг того, что человек уже видит в середине, а если
     точка выбрана — вокруг неё. Иначе после каждого приближения приходится
     заново искать нужное место. */
  MiniMap.prototype.zoomTo = function (z) {
    z = Math.max(2, Math.min(17, z));
    if (z === this.z) return;
    this.z = z;
    if (this.marker) { this.cx = this.marker.lat; this.cy = this.marker.lng; }
    this.draw();
  };
  /** отметить выбранную точку; она держится в середине при масштабировании */
  MiniMap.prototype.setMarker = function (lat, lng, center) {
    if (lat == null || lng == null) { this.marker = null; return; }
    this.marker = { lat: lat, lng: lng };
    if (center !== false) { this.cx = lat; this.cy = lng; }
    this.draw();
  };

  MiniMap.prototype.setPins = function (pins) { this.pins = pins || []; this.draw(); };

  /** поставить центр и приближение */
  MiniMap.prototype.goTo = function (lat, lng, z) {
    this.cx = lat; this.cy = lng;
    if (z) this.z = Math.max(2, Math.min(18, z));
    this.draw();
  };

  MiniMap.prototype.fit = function () {
    if (!this.pins.length) return;
    var la = this.pins.map(function (p) { return p.lat; });
    var lo = this.pins.map(function (p) { return p.lng; });
    var minLa = Math.min.apply(null, la), maxLa = Math.max.apply(null, la);
    var minLo = Math.min.apply(null, lo), maxLo = Math.max.apply(null, lo);
    this.cx = (minLa + maxLa) / 2; this.cy = (minLo + maxLo) / 2;
    var r = this.host.getBoundingClientRect();
    var z = 17;
    while (z > 2) {
      var w = Math.abs(lon2x(maxLo, z) - lon2x(minLo, z));
      var h = Math.abs(lat2y(minLa, z) - lat2y(maxLa, z));
      if (w < r.width * 0.8 && h < r.height * 0.8) break;
      z--;
    }
    this.z = z;
    this.draw();
  };

  MiniMap.prototype.draw = function () {
    var self = this, r = this.host.getBoundingClientRect();
    var W = r.width || 600, H = r.height || 400, z = this.z;
    var px = lon2x(this.cy, z), py = lat2y(this.cx, z);
    var left = px - W / 2, top = py - H / 2;
    var x0 = Math.floor(left / TILE), y0 = Math.floor(top / TILE);
    var x1 = Math.ceil((left + W) / TILE), y1 = Math.ceil((top + H) / TILE);
    var max = Math.pow(2, z);
    var html = '';
    for (var x = x0; x < x1; x++) {
      for (var y = y0; y < y1; y++) {
        if (y < 0 || y >= max) continue;
        var tx = ((x % max) + max) % max;
        html += '<img class="map-tile" alt="" loading="lazy" draggable="false" ' +
          'src="https://tile.openstreetmap.org/' + z + '/' + tx + '/' + y + '.png" ' +
          'style="left:' + (x * TILE - left) + 'px;top:' + (y * TILE - top) + 'px">';
      }
    }
    this.pins.forEach(function (p, i) {
      var ppx = lon2x(p.lng, z) - left, ppy = lat2y(p.lat, z) - top;
      if (ppx < -40 || ppy < -40 || ppx > W + 40 || ppy > H + 40) return;
      var cls = p.kind === 'birth' ? 'birth' : p.kind === 'death' ? 'death' : 'event';
      html += '<button type="button" class="map-pin ' + cls + '" data-i="' + i + '" title="' +
        esc((p.label || '') + (p.place ? ' · ' + p.place : '')) + '" style="left:' + ppx + 'px;top:' + ppy + 'px"></button>';
    });
    this.layer.innerHTML = html;
    this.layer.querySelectorAll('.map-pin').forEach(function (b) {
      b.addEventListener('click', function () { self.onPin(self.pins[+b.dataset.i]); });
    });
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  global.MiniMap = MiniMap;
})(window);
</script>
<script>/* Семейное Древо — карточка персоны: сведения, медиа, записи, контакты, события, доступ, родня. */
(function (global) {
  'use strict';
  var S = global.Store;
  var U = S.util;
  var esc = global.TreeView.esc;
  var I = global.Icon;

  var ACL_LEVELS = [
    { v: 'public', t: 'Видно всем' },
    { v: 'group', t: 'Только вошедшим' },
    { v: 'chosen', t: 'Только выбранным' },
    { v: 'admin', t: 'Только администратору' }
  ];

  function Sheet(opts) {
    this.el = opts.el;
    this.onChange = opts.onChange || function () {};
    this.onFocus = opts.onFocus || function () {};
    this.onOpen = opts.onOpen || function () {};
    this.pending = [];
    this.toast = opts.toast || function () {};
    this.personId = null;
    this.tab = 'info';
    this.urls = [];
    this._bind();
  }

  Sheet.prototype.open = function (id) {
    var self = this;
    if (this.personId && this.personId !== id && this.hasPending()) {
      this.guard(function () { self.openNow(id); });
      return;
    }
    this.openNow(id);
  };
  Sheet.prototype.openNow = function (id) {
    this.pending = [];
    this.personId = id;
    this.el.hidden = false;
    this.render();
    if (this.onOpen) this.onOpen(id);
  };
  Sheet.prototype.close = function () {
    var self = this;
    this.guard(function () {
      self.el.hidden = true;
      self.revoke();
      self.personId = null;
      self.pending = [];
      if (self.onOpen) self.onOpen(null);
    });
  };
  Sheet.prototype.revoke = function () {
    this.urls.forEach(function (u) { try { URL.revokeObjectURL(u); } catch (e) {} });
    this.urls = [];
  };
  Sheet.prototype._bind = function () {
    var self = this;
    this.el.addEventListener('click', function (e) {
      var t = e.target.closest('[data-act]');
      if (!t) return;
      var act = t.dataset.act;
      if (self.actions[act]) { e.preventDefault(); self.actions[act].call(self, t); }
    });
    function onEdit(e) {
      var f = e.target.closest('[data-bind]');
      if (f) self.applyField(f);
    }
    this.el.addEventListener('change', onEdit);
    this.el.addEventListener('input', onEdit);
  };

  /* --------- чтение и запись полей --------- */
  Sheet.prototype.applyField = function (input) {
    var p = S.person(this.personId);
    if (!p) return;
    var path = input.dataset.bind.split('.');
    var val = input.type === 'checkbox' ? input.checked : input.value;
    this.stage('bind:' + input.dataset.bind, function () {
      var o = p;
      for (var i = 0; i < path.length - 1; i++) { o[path[i]] = o[path[i]] || {}; o = o[path[i]]; }
      o[path[path.length - 1]] = val;
    });
  };

  /* --------- отрисовка --------- */
  Sheet.prototype.render = function () {
    var p = S.person(this.personId);
    if (!p) { this.close(); return; }
    this.revoke();
    var tabs = [
      ['info', 'Сведения'], ['media', 'Фото и файлы'], ['notes', 'Записи'],
      ['contacts', 'Контакты'], ['events', 'События'], ['family', 'Родня'], ['access', 'Доступ']
    ];
    this.el.innerHTML =
      '<div class="sheet-head">' +
      '<div class="sheet-ph" id="shPhoto"></div>' +
      '<div style="flex:1 1 auto;min-width:0">' +
      '<div class="sheet-title" id="shName"></div>' +
      '<div class="sheet-sub" id="shSub"></div>' +
      '<div class="btn-row" style="margin-top:6px">' +
      '<button class="btn btn-sm" data-act="focus">В центр дерева</button>' +
      '<button class="btn btn-sm" data-act="addRel">+ Родственник</button>' +
      '</div></div>' +
      '<button class="icon-btn" data-act="close" title="Закрыть" aria-label="Закрыть">' + I('close') + '</button>' +
      '</div>' +
      '<div class="sheet-tabs" role="tablist">' +
      tabs.map(function (t) {
        return '<button role="tab" data-act="tab" data-tab="' + t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>' +
      '<div class="sheet-body" id="shBody"></div>' +
      '<div class="sheet-bar" id="shBar" hidden>' +
      '<span class="bar-count"></span>' +
      '<button class="btn btn-sm" data-act="discard">Отменить</button>' +
      '<button class="btn btn-sm btn-primary" data-act="commit">Сохранить</button>' +
      '</div>';
    this.renderHead();
    this.renderBody();
    this.paintBar();
  };

  Sheet.prototype.renderHead = function () {
    var p = S.person(this.personId), self = this;
    if (!p) return;
    this.el.querySelector('#shName').textContent = S.fullName(p);
    var bits = [];
    if (S.years(p)) bits.push(S.years(p));
    if (p.birth && p.birth.place) bits.push(p.birth.place);
    this.el.querySelector('#shSub').textContent = bits.join(' · ') || 'даты не указаны';
    var ph = this.el.querySelector('#shPhoto');
    ph.style.backgroundImage = '';
    var gone = (p.death && p.death.date) || p.living === false;
    ph.innerHTML = I(p.sex === 'M' ? 'personM' : p.sex === 'F' ? 'personF' : 'person') +
      (gone ? '<span class="mourn-corner"></span>' : '');
    if (p.photo) {
      S.mediaURL(p.photo).then(function (url) {
        if (!url) return;
        self.urls.push(url);
        ph.style.backgroundImage = 'url(' + url + ')';
        ph.innerHTML = gone ? '<span class="mourn-corner"></span>' : '';
      });
    }
    this.el.querySelectorAll('[data-act="tab"]').forEach(function (b) {
      b.setAttribute('aria-selected', b.dataset.tab === self.tab ? 'true' : 'false');
    });
  };

  Sheet.prototype.renderBody = function () {
    var p = S.person(this.personId);
    if (!p) return;
    var body = this.el.querySelector('#shBody');
    body.innerHTML = this.views[this.tab].call(this, p);
    this.after[this.tab] && this.after[this.tab].call(this, p, body);
    var self = this;
    this.el.querySelectorAll('[data-act="tab"]').forEach(function (b) {
      b.setAttribute('aria-selected', b.dataset.tab === self.tab ? 'true' : 'false');
    });
  };

  function micBtn(target) {
    return '<button class="btn btn-sm mic-btn" data-act="dictate" data-target="' + target +
      '" title="Надиктовать" aria-label="Надиктовать">' + I('mic') + '</button>';
  }
  /** Выбор видимости: список уровней, а для «только выбранным» — кнопка
      с поимённым перечнем тех, кому запись открыта. */
  function aclSelect(bindAttr, acl) {
    acl = acl || { level: 'public', locked: false };
    var out = '<select data-acl="' + bindAttr + '">' + ACL_LEVELS.map(function (l) {
      return '<option value="' + l.v + '"' + (acl.level === l.v ? ' selected' : '') + '>' + l.t + '</option>';
    }).join('') + '</select>';
    if (acl.level === 'chosen') {
      var names = S.allowedNames(acl);
      out += '<button class="btn btn-sm" data-act="pickViewers" data-key="' + bindAttr + '" ' +
        'title="Кому открыта эта запись">' + I('person') +
        (names.length ? ' ' + names.length : ' выбрать') + '</button>';
      if (names.length) out += '<span class="note acl-names">' + esc(names.join(', ')) + '</span>';
    }
    return out;
  }

  Sheet.prototype.views = {
    info: function (p) {
      return '' +
        row('Фамилия', '<input data-bind="surname" value="' + esc(p.surname) + '">') +
        row('Имя', '<input data-bind="given" value="' + esc(p.given) + '">') +
        row('Отчество', '<input data-bind="patronymic" value="' + esc(p.patronymic) + '">') +
        row('Девичья', '<input data-bind="maiden" value="' + esc(p.maiden) + '">') +
        row('Пол', '<select data-bind="sex">' +
          opt('M', 'Мужской', p.sex) + opt('F', 'Женский', p.sex) + opt('U', 'Не указан', p.sex) + '</select>') +
        '<div class="sect-title">Рождение</div>' +
        row('Дата', '<input type="date" data-bind="birth.date" value="' + esc(dateVal(p.birth.date)) + '">') +
        row('Место', '<input data-bind="birth.place" value="' + esc(p.birth.place) + '">') +
        row('На карте', mapRow('birth', p.birth)) +
        '<div class="sect-title">Смерть</div>' +
        row('Жив(а)', '<input type="checkbox" data-bind="living"' + (p.living !== false ? ' checked' : '') + '>') +
        row('Дата', '<input type="date" data-bind="death.date" value="' + esc(dateVal(p.death.date)) + '">') +
        row('Место', '<input data-bind="death.place" value="' + esc(p.death.place) + '">') +
        row('На карте', mapRow('death', p.death)) +
        '<div class="btn-row"><button class="btn btn-danger btn-sm" data-act="delPerson">Удалить персону</button></div>';
    },

    media: function (p) {
      var list = S.mediaOf(p.id);
      var html = '<div class="btn-row" style="margin-top:0">' +
        '<button class="btn btn-primary btn-sm" data-act="pickFile">Добавить файлы</button>' +
        '<button class="btn btn-sm" data-act="recVoice">' + I('mic') + ' Голосовая заметка</button>' +
        '</div>' +
        '<p class="note" style="margin:8px 0 0">Фото, документы, аудио и видео — без ограничения количества. ' +
        'Для каждого файла можно включить замок: тогда он хранится и попадает в резервную копию в зашифрованном виде.</p>' +
        '<div id="recState" class="note"></div>';
      if (!list.length) return html + '<div class="empty">Файлов пока нет</div>';
      html += '<div class="sect-title">Файлы (' + list.length + ')</div><div class="media-grid" id="shMedia">';
      list.forEach(function (m) {
        var visible = S.canSee(m.acl);
        var ic = I(m.kind === 'photo' ? 'photo' : m.kind === 'audio' ? 'mic' :
          m.kind === 'video' ? 'map' : 'note');
        html += '<button class="media-tile" data-act="openMedia" data-id="' + m.id + '" title="' + esc(m.name) + '">' +
          (visible ? ic : I('lock')) +
          (m.acl && (m.acl.locked || m.acl.level !== 'public')
            ? '<span class="m-lock">' + I('lock') + '</span>' : '') +
          '<span class="m-name">' + esc(m.caption || m.name) + '</span></button>';
      });
      return html + '</div>';
    },

    notes: function (p) {
      var html = '<div class="sect-title">Общая запись</div>' +
        '<div class="inline" style="align-items:flex-start">' +
        '<textarea data-bind="note" id="noteArea" rows="6">' + esc(p.note) + '</textarea>' +
        micBtn('note') + '</div>';
      var custom = (p.fields || []).filter(function (f) { return f.type === 'text' || f.type === 'note'; });
      html += '<div class="sect-title">Дополнительные строки</div>';
      if (!custom.length) html += '<p class="note">Строк пока нет. Можно добавить любые: «Служба в армии», «Прозвище», «Откуда родом» и что угодно ещё.</p>';
      html += '<div class="list">' + custom.map(fieldRow).join('') + '</div>' +
        '<div class="btn-row"><button class="btn btn-sm" data-act="addField" data-type="text">+ Добавить строку</button></div>';
      return html;
    },

    contacts: function (p) {
      var cs = (p.fields || []).filter(function (f) {
        return ['phone', 'email', 'addr', 'link', 'messenger'].indexOf(f.type) >= 0;
      });
      var html = '<p class="note">Контактные данные живых родственников лучше закрывать от общего доступа — ' +
        'выберите «Только вошедшим» или «Только администратору».</p><div class="list">' +
        cs.map(fieldRow).join('') + '</div>';
      if (!cs.length) html += '<div class="empty">Контактов пока нет</div>';
      html += '<div class="btn-row">' +
        '<button class="btn btn-sm" data-act="addField" data-type="phone">+ Телефон</button>' +
        '<button class="btn btn-sm" data-act="addField" data-type="email">+ Почта</button>' +
        '<button class="btn btn-sm" data-act="addField" data-type="addr">+ Адрес</button>' +
        '<button class="btn btn-sm" data-act="addField" data-type="link">+ Ссылка</button>' +
        '</div>';
      return html;
    },

    events: function (p) {
      var evs = p.events || [];
      var html = '<p class="note">События ложатся на карту и в календарь: переезд, свадьба, служба, поездка.</p>';
      if (!evs.length) html += '<div class="empty">Событий пока нет</div>';
      html += '<div class="list">' + evs.map(function (e) {
        return '<div class="list-item" style="flex-wrap:wrap">' +
          '<div class="li-main" style="flex:1 1 100%">' +
          '<div class="inline"><input data-ev="' + e.id + '.type" value="' + esc(e.type) + '" placeholder="Что произошло">' +
          '<input type="date" data-ev="' + e.id + '.date" value="' + esc(dateVal(e.date)) + '" style="max-width:150px"></div>' +
          '<div class="inline" style="margin-top:5px"><input data-ev="' + e.id + '.place" value="' + esc(e.place) + '" placeholder="Место"></div>' +
          '<div class="inline" style="margin-top:5px">' + mapRow('ev:' + e.id, e) + '</div>' +
          '<div class="inline" style="margin-top:5px"><input data-ev="' + e.id + '.note" value="' + esc(e.note) + '" placeholder="Подробности">' +
          micBtn('ev:' + e.id + '.note') + '</div>' +
          '<div class="inline" style="margin-top:5px">' + aclSelect('ev:' + e.id, e.acl) +
          '<button class="btn btn-sm btn-danger" data-act="delEvent" data-id="' + e.id + '">Удалить</button></div>' +
          '</div></div>';
      }).join('') + '</div>' +
        '<div class="btn-row"><button class="btn btn-sm" data-act="addEvent">+ Добавить событие</button></div>';
      return html;
    },

    family: function (p) {
      var par = S.parentsOf(p.id), sp = S.spousesOf(p.id), ch = S.childrenOf(p.id), sib = S.siblingsOf(p.id);
      function group(title, arr, rel) {
        var h = '<div class="sect-title">' + title + '</div>';
        if (!arr.length) return h + '<p class="note">нет</p>';
        return h + '<div class="list">' + arr.map(function (x) {
          return '<div class="list-item"><div class="mini-ph" data-ph="' + x.id + '">' + I('person') + '</div>' +
            '<div class="li-main"><div>' + esc(S.fullName(x)) + '</div>' +
            '<div class="li-sub">' + esc(S.years(x) || '—') + '</div></div>' +
            '<button class="btn btn-sm" data-act="goto" data-id="' + x.id + '">Открыть</button>' +
            (rel ? '<button class="btn btn-sm btn-danger" data-act="unlink" data-id="' + x.id +
              '" title="Убрать связь" aria-label="Убрать связь">' + I('close') + '</button>' : '') +
            '</div>';
        }).join('') + '</div>';
      }
      return group('Родители', par, true) + group('Супруги', sp, true) +
        group('Дети', ch, true) + group('Братья и сёстры', sib, false) +
        '<div class="btn-row"><button class="btn btn-primary btn-sm" data-act="addRel">+ Добавить родственника</button></div>';
    },

    access: function (p) {
      var a = p.acl || { level: 'public', locked: false };
      return '<p class="note">Права действуют на всю карточку. Отдельные строки, файлы и события закрываются ' +
        'каждый своим замком на соответствующих вкладках.</p>' +
        row('Видимость', '<div class="acl-ctl">' + aclSelect('person', a) + '</div>') +
        row('Замок', '<label class="inline"><input type="checkbox" data-lock="person"' + (a.locked ? ' checked' : '') +
          '> <span class="note">запретить изменение всем, кроме администратора</span></label>') +
        '<div class="sect-title">Что это значит</div>' +
        '<p class="note"><b>Видно всем</b> — запись открыта любому, кто откроет дерево.<br>' +
        '<b>Только вошедшим</b> — её видят все, у кого есть логин.<br>' +
        '<b>Только выбранным</b> — вы сами отмечаете, кому из родственников она видна; ' +
        'остальные её не увидят.<br>' +
        '<b>Только администратору</b> — скрыта у всех обычных пользователей.</p>' +
        '<p class="note">Записи с замком и закрытые записи шифруются при сохранении и в резервной копии. ' +
        'Ключ выводится из пароля дерева и нигде не хранится.</p>';
    }
  };

  Sheet.prototype.after = {
    media: function (p, body) {
      var self = this;
      body.querySelectorAll('.media-tile').forEach(function (tile) {
        var m = S.tree.media[tile.dataset.id];
        if (!m || m.kind !== 'photo' || !S.canSee(m.acl)) return;
        S.mediaURL(m.id).then(function (url) {
          if (!url) return;
          self.urls.push(url);
          tile.style.backgroundImage = 'url(' + url + ')';
          var ic0 = tile.querySelector('.ico');
          if (ic0) ic0.remove();
        });
      });
    },
    family: function (p, body) {
      var self = this;
      body.querySelectorAll('[data-ph]').forEach(function (el) {
        var per = S.person(el.dataset.ph);
        if (!per || !per.photo) return;
        S.mediaURL(per.photo).then(function (url) {
          if (!url) return;
          self.urls.push(url);
          el.style.backgroundImage = 'url(' + url + ')';
          el.innerHTML = '';
        });
      });
    },
    notes: function (p, body) { this.bindFields(body); },
    contacts: function (p, body) { this.bindFields(body); },
    events: function (p, body) { this.bindEvents(body); },
    access: function (p, body) { this.bindAcl(body); },
    info: function () {}
  };

  /* --------- отложенные правки ---------
     Поля не записываются в дерево сразу: правка попадает в очередь,
     внизу карточки появляется полоса «Сохранить / Отменить». Так случайное
     нажатие не уходит к родственникам при следующей синхронизации. */

  Sheet.prototype.stage = function (key, apply, label) {
    this.pending = this.pending || [];
    var found = false;
    for (var i = 0; i < this.pending.length; i++) {
      if (this.pending[i].key === key) { this.pending[i].apply = apply; found = true; break; }
    }
    if (!found) this.pending.push({ key: key, apply: apply, label: label || '' });
    this.paintBar();
  };
  Sheet.prototype.hasPending = function () { return !!(this.pending && this.pending.length); };

  Sheet.prototype.paintBar = function () {
    var bar = this.el.querySelector('#shBar');
    if (!bar) return;
    var n = this.pending ? this.pending.length : 0;
    bar.hidden = !n;
    if (!n) return;
    bar.querySelector('.bar-count').textContent =
      'Не сохранено: ' + n + ' ' + plural(n, 'правка', 'правки', 'правок');
  };

  Sheet.prototype.commit = function () {
    var p = S.person(this.personId);
    if (!p || !this.hasPending()) { this.pending = []; this.paintBar(); return; }
    this.pending.forEach(function (x) { try { x.apply(); } catch (e) { console.error(e); } });
    this.pending = [];
    S.updatePerson(p.id, {});
    this.paintBar();
    this.renderHead();
    this.renderBody();
    this.onChange();
    this.toast('Сохранено');
  };

  Sheet.prototype.discard = function () {
    this.pending = [];
    this.paintBar();
    this.renderBody();
  };

  /** спросить, если есть несохранённые правки; then() вызывается, когда можно идти дальше */
  Sheet.prototype.guard = function (then) {
    var self = this;
    if (!this.hasPending()) { then(); return; }
    global.App.modal('Сохранить изменения?',
      '<p class="note">В карточке ' + esc(S.fullName(S.person(this.personId))) +
      ' есть несохранённые правки: ' + this.pending.length + '. Что с ними сделать?</p>',
      [
        { text: 'Сохранить', primary: true, fn: function () {
          global.App.closeModal(); self.commit(); then();
        } },
        { text: 'Не сохранять', danger: true, fn: function () {
          global.App.closeModal(); self.pending = []; self.paintBar(); then();
        } }
      ]);
  };

  Sheet.prototype.bindFields = function (body) {
    var self = this, p = S.person(this.personId);
    body.querySelectorAll('input[data-f$=".value"][data-kind="phone"]').forEach(function (inp) {
      inp.addEventListener('focus', function () {
        if (!inp.value.trim()) { inp.value = '+7 '; }
        // курсор в конец, чтобы не править код страны случайно
        setTimeout(function () { inp.setSelectionRange(inp.value.length, inp.value.length); }, 0);
      });
    });
    body.querySelectorAll('textarea.field-wide').forEach(function (ta) {
      function grow() {
        ta.style.height = 'auto';
        ta.style.height = Math.min(220, Math.max(46, ta.scrollHeight)) + 'px';
      }
      ta.addEventListener('input', grow);
      grow();
    });
    body.querySelectorAll('[data-f]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var parts = inp.dataset.f.split('.');
        var v = inp.value;
        self.stage('f:' + inp.dataset.f, function () {
          var f = (p.fields || []).filter(function (x) { return x.id === parts[0]; })[0];
          if (f) f[parts[1]] = v;
        });
      });
    });
    self.bindAclSelects(body);
  };

  /* Права применяются сразу, а не через очередь: это осознанный выбор,
     от него зависит сам вид строки (появляется список людей), и закрытие
     карточки не должно молча отменять ограничение. */
  Sheet.prototype.bindAclSelects = function (body) {
    var self = this;
    body.querySelectorAll('select[data-acl]').forEach(function (sel) {
      sel.addEventListener('change', function () {
        var acl = self.aclByKey(sel.dataset.acl);
        if (!acl) return;
        acl.level = sel.value;
        if (acl.level === 'chosen') acl.allow = acl.allow || [];
        S.updatePerson(self.personId, {});
        self.onChange();
        self.renderBody();
        if (acl.level === 'chosen' && !acl.allow.length) self.pickViewers(sel.dataset.acl);
      });
    });
  };

  Sheet.prototype.bindEvents = function (body) {
    var self = this, p = S.person(this.personId);
    body.querySelectorAll('[data-ev]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var parts = inp.dataset.ev.split('.');
        var v = inp.value;
        self.stage('ev:' + inp.dataset.ev, function () {
          var e = (p.events || []).filter(function (x) { return x.id === parts[0]; })[0];
          if (e) e[parts[1]] = v;
        });
      });
    });
    self.bindAclSelects(body);
  };

  Sheet.prototype.bindAcl = function (body) {
    var self = this, p = S.person(this.personId);
    self.bindAclSelects(body);
    var lock = body.querySelector('[data-lock="person"]');
    if (lock) lock.addEventListener('change', function () {
      var v = lock.checked;
      self.stage('person.lock', function () { p.acl = p.acl || {}; p.acl.locked = v; });
    });
  };

  function plural(n, one, few, many) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  /* --------- действия --------- */
  Sheet.prototype.actions = {
    close: function () { this.close(); },
    commit: function () { this.commit(); },
    discard: function () { this.discard(); },
    tab: function (btn) {
      var self = this, t = btn.dataset.tab;
      this.guard(function () { self.tab = t; self.renderBody(); self.renderHead(); });
    },
    focus: function () { this.onFocus(this.personId); },
    goto: function (btn) { this.open(btn.dataset.id); },
    pickPlace: function (btn) { this.pickPlace(btn.dataset.key); },
    pickViewers: function (btn) { this.pickViewers(btn.dataset.key); },
    dropPlace: function (btn) {
      var self = this, key = btn.dataset.key;
      global.App.confirm('Убрать точку с карты?',
        'Место словами останется в карточке — пропадёт только метка на карте.',
        function () {
          self.setPlace(key, null, null);
          self.renderBody();
          self.toast('Точка убрана');
        });
    },
    delPerson: function () {
      var p = S.person(this.personId);
      var self = this;
      global.App.confirm('Удалить ' + S.fullName(p) + '?', 'Связи с другими персонами тоже будут сняты. Отменить нельзя.', function () {
        S.removePerson(self.personId);
        self.close();
        self.onChange();
      });
    },
    addRel: function () { global.App.addRelative(this.personId); },
    unlink: function (btn) {
      S.unlink(this.personId, btn.dataset.id);
      this.renderBody();
      this.onChange();
    },
    addField: function (btn) {
      this.commit();
      var p = S.person(this.personId);
      var type = btn.dataset.type;
      var labels = { phone: 'Телефон', email: 'Почта', addr: 'Адрес', link: 'Ссылка', text: 'Новая строка' };
      p.fields = p.fields || [];
      p.fields.push({
        id: U.uid('f'), label: labels[type] || 'Строка',
        value: type === 'phone' ? '+7 ' : '',      // дальше человек просто дописывает номер
        type: type,
        acl: { level: type === 'text' ? 'public' : 'group', locked: false }
      });
      S.updatePerson(p.id, {});
      this.renderBody();
      this.onChange();
    },
    delField: function (btn) {
      var p = S.person(this.personId);
      p.fields = (p.fields || []).filter(function (f) { return f.id !== btn.dataset.id; });
      S.updatePerson(p.id, {});
      this.renderBody();
      this.onChange();
    },
    addEvent: function () {
      this.commit();
      var p = S.person(this.personId);
      p.events = p.events || [];
      p.events.push({
        id: U.uid('e'), type: '', date: '', place: '', lat: null, lng: null, note: '',
        acl: { level: 'public', locked: false }
      });
      S.updatePerson(p.id, {});
      this.renderBody();
      this.onChange();
    },
    delEvent: function (btn) {
      var p = S.person(this.personId);
      p.events = (p.events || []).filter(function (e) { return e.id !== btn.dataset.id; });
      S.updatePerson(p.id, {});
      this.renderBody();
      this.onChange();
    },
    pickFile: function () {
      var self = this;
      global.App.pickFiles(function (files) {
        global.App.askAccess(function (acl) {
          var queue = Array.prototype.slice.call(files);
          (function next() {
            if (!queue.length) { self.renderBody(); self.renderHead(); self.onChange(); return; }
            S.addMedia(self.personId, queue.shift(), { acl: acl }).then(next, function (e) {
              self.toast('Файл не добавился: ' + e.message);
              next();
            });
          })();
        });
      });
    },
    openMedia: function (btn) { global.App.viewMedia(btn.dataset.id, this); },
    recVoice: function (btn) { this.recordVoice(btn); },
    dictate: function (btn) { this.dictate(btn.dataset.target, btn); }
  };

  /* --------- кому видна запись --------- */

  /** найти объект прав по ключу вида person | f:<id> | ev:<id> */
  Sheet.prototype.aclByKey = function (key) {
    var p = S.person(this.personId);
    if (!p) return null;
    var host = null;
    if (key === 'person') host = p;
    else if (key.indexOf('f:') === 0) {
      host = (p.fields || []).filter(function (x) { return x.id === key.slice(2); })[0];
    } else if (key.indexOf('ev:') === 0) {
      host = (p.events || []).filter(function (x) { return x.id === key.slice(3); })[0];
    }
    if (!host) return null;
    host.acl = host.acl || { level: 'public', locked: false };
    return host.acl;
  };

  Sheet.prototype.pickViewers = function (key) {
    var self = this;
    var acl = this.aclByKey(key);
    if (!acl) return;
    global.App.pickViewers(acl, function () {
      S.updatePerson(self.personId, {});
      self.onChange();
      self.renderBody();
    });
  };

  /* --------- точка на карте --------- */
  /* Точку записываем сразу: в окне карты человек уже нажал «Сохранить точку»,
     второе подтверждение внизу карточки было бы лишним. */
  Sheet.prototype.setPlace = function (key, lat, lng) {
    var p = S.person(this.personId);
    if (!p) return;
    if (key.indexOf('ev:') === 0) {
      var e = (p.events || []).filter(function (x) { return x.id === key.slice(3); })[0];
      if (e) { e.lat = lat; e.lng = lng; }
    } else {
      p[key] = p[key] || {};
      p[key].lat = lat;
      p[key].lng = lng;
    }
    S.updatePerson(p.id, {});
    this.onChange();
  };

  Sheet.prototype.pickPlace = function (key) {
    var self = this, p = S.person(this.personId);
    var cur = key.indexOf('ev:') === 0
      ? (p.events || []).filter(function (x) { return x.id === key.slice(3); })[0]
      : p[key];
    var placeName = (cur && cur.place) || '';
    var chosen = { lat: cur && cur.lat != null ? +cur.lat : null,
      lng: cur && cur.lng != null ? +cur.lng : null };

    global.App.modal('Где это было?',
      '<p class="note" style="margin:0 0 10px">Найдите место по названию или нажмите на карту. ' +
      'Карта двигается перетаскиванием, масштаб — колесом, щипком или кнопками слева.</p>' +
      '<div class="map-pick-wrap" id="pkWrap" style="height:56vh;min-height:300px">' +
      '<div class="map-host" id="pkMap"></div>' +
      '<div class="map-tools">' +
      '<input id="pkFind" type="search" placeholder="Город, село, улица…" autocomplete="off" ' +
      'value="' + esc(placeName) + '">' +
      '<button class="btn btn-sm" id="pkGo" title="Найти">' + I('search') + '</button>' +
      '<button class="btn btn-sm" id="pkHere" title="Я здесь">' + I('crosshair') + '</button>' +
      '<button class="btn btn-sm" id="pkFull" title="Во весь экран">' + I('fullscreen') + '</button>' +
      '</div>' +
      '<div class="map-hits" id="pkHits" hidden></div>' +
      '</div>' +
      '<p class="note" id="pkInfo" style="margin-top:8px">' +
      (chosen.lat != null ? 'Выбрано: ' + chosen.lat.toFixed(4) + ', ' + chosen.lng.toFixed(4)
        : 'Точка пока не выбрана') + '</p>',
      [{ text: 'Сохранить точку', primary: true, fn: function () {
        if (chosen.lat == null) { self.toast('Сначала отметьте место на карте'); return; }
        global.App.closeModal();
        self.setPlace(key, +chosen.lat.toFixed(6), +chosen.lng.toFixed(6));
        self.renderBody();
      } }]);

    var host = document.getElementById('pkMap');
    var m = new global.MiniMap(host);
    self._picker = m;

    function mark(lat, lng, zoom) {
      chosen.lat = lat; chosen.lng = lng;
      m.setPins([{ lat: lat, lng: lng, kind: 'event', label: placeName }]);
      if (zoom) m.goTo(lat, lng, zoom);
      // выбранная точка держится в середине при любом масштабировании
      m.setMarker(lat, lng, !!zoom);
      var info = document.getElementById('pkInfo');
      if (info) info.textContent = 'Выбрано: ' + lat.toFixed(4) + ', ' + lng.toFixed(4);
    }
    if (chosen.lat != null) mark(chosen.lat, chosen.lng, 11);
    else m.draw();
    m.onClick = function (lat, lng) { mark(lat, lng); };

    /* --- поиск места --- */
    var hits = document.getElementById('pkHits');
    var findBox = document.getElementById('pkFind');
    function search() {
      var q = findBox.value.trim();
      if (q.length < 3) { hits.hidden = true; return; }
      hits.hidden = false;
      hits.innerHTML = '<div class="note" style="padding:8px">Ищем…</div>';
      fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=ru&q=' +
        encodeURIComponent(q), { headers: { 'Accept': 'application/json' } })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (list) {
          if (!list.length) {
            hits.innerHTML = '<div class="note" style="padding:8px">Ничего не нашлось. ' +
              'Можно просто нажать нужное место на карте.</div>';
            return;
          }
          hits.innerHTML = list.map(function (x, i) {
            return '<button type="button" data-i="' + i + '">' + esc(x.display_name) + '</button>';
          }).join('');
          hits.querySelectorAll('[data-i]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              var x = list[+btn.dataset.i];
              hits.hidden = true;
              mark(parseFloat(x.lat), parseFloat(x.lon), 12);
            });
          });
        }, function () {
          hits.innerHTML = '<div class="note" style="padding:8px">' +
            'Поиск недоступен без интернета. Нажмите нужное место на карте.</div>';
        });
    }
    document.getElementById('pkGo').addEventListener('click', search);
    findBox.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); search(); }
    });
    findBox.addEventListener('input', function () {
      clearTimeout(self._findT);
      self._findT = setTimeout(search, 600);
    });

    /* --- где я сейчас --- */
    document.getElementById('pkHere').addEventListener('click', function () {
      var info = document.getElementById('pkInfo');
      if (!navigator.geolocation) { self.toast('Устройство не сообщает местоположение'); return; }
      if (info) info.textContent = 'Определяем, где вы…';
      navigator.geolocation.getCurrentPosition(function (pos) {
        mark(pos.coords.latitude, pos.coords.longitude, 14);
      }, function () {
        if (info) info.textContent = 'Не удалось определить местоположение — ' +
          'разрешите доступ или выберите место вручную.';
      }, { enableHighAccuracy: true, timeout: 10000 });
    });

    /* --- во весь экран --- */
    document.getElementById('pkFull').addEventListener('click', function () {
      var wrap = document.getElementById('pkWrap');
      wrap.classList.toggle('full');
      this.title = wrap.classList.contains('full') ? 'Свернуть' : 'Во весь экран';
      setTimeout(function () { m.draw(); }, 60);
    });
  };

  /* --------- голос --------- */
  Sheet.prototype.dictate = function (target, btn) {
    var self = this;
    var SR = global.SpeechRecognition || global.webkitSpeechRecognition;
    if (!SR) { this.toast('Голосовой ввод доступен в Chrome, Edge и Safari на установленном приложении'); return; }
    var rec = new SR();
    rec.lang = 'ru-RU'; rec.interimResults = true; rec.continuous = false;
    btn.classList.add('rec');
    var buf = '';
    rec.onresult = function (e) {
      buf = '';
      for (var i = 0; i < e.results.length; i++) buf += e.results[i][0].transcript;
    };
    rec.onerror = function () { btn.classList.remove('rec'); self.toast('Микрофон недоступен'); };
    rec.onend = function () {
      btn.classList.remove('rec');
      if (!buf.trim()) return;
      var p = S.person(self.personId);
      if (target === 'note') p.note = (p.note ? p.note + '\n' : '') + buf;
      else if (target.indexOf('ev:') === 0) {
        var id = target.slice(3).split('.')[0];
        var ev = (p.events || []).filter(function (x) { return x.id === id; })[0];
        if (ev) ev.note = (ev.note ? ev.note + ' ' : '') + buf;
      } else if (target.indexOf('f:') === 0) {
        var f = (p.fields || []).filter(function (x) { return x.id === target.slice(2); })[0];
        if (f) f.value = (f.value ? f.value + ' ' : '') + buf;
      } else {
        var path = target.split('.');
        if (path.length === 2) p[path[0]][path[1]] = buf;
        else p[path[0]] = buf;
      }
      S.updatePerson(p.id, {});
      self.renderBody();
      self.onChange();
    };
    try { rec.start(); } catch (e) { btn.classList.remove('rec'); }
  };

  Sheet.prototype.recordVoice = function (btn) {
    var self = this;
    if (this._rec) {
      this._rec.stop();
      return;
    }
    if (!navigator.mediaDevices || !global.MediaRecorder) {
      this.toast('Запись звука недоступна в этом окружении');
      return;
    }
    var state = this.el.querySelector('#recState');
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var mr = new MediaRecorder(stream);
      var chunks = [];
      self._rec = mr;
      btn.textContent = '⏹ Остановить запись';
      btn.classList.add('rec');
      var t0 = Date.now();
      var timer = setInterval(function () {
        if (state) state.textContent = 'Идёт запись… ' + Math.round((Date.now() - t0) / 1000) + ' с';
      }, 300);
      mr.ondataavailable = function (e) { chunks.push(e.data); };
      mr.onstop = function () {
        clearInterval(timer);
        stream.getTracks().forEach(function (t) { t.stop(); });
        self._rec = null;
        var blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
        blob.name = 'Голосовая заметка ' + new Date().toLocaleString('ru-RU') + '.webm';
        var file = new File([blob], blob.name, { type: blob.type });
        global.App.askAccess(function (acl) {
          S.addMedia(self.personId, file, { acl: acl, kind: 'audio' }).then(function () {
            self.renderBody();
            self.onChange();
            self.toast('Заметка сохранена');
          });
        });
      };
      mr.start();
    }).catch(function () { self.toast('Нет доступа к микрофону'); });
  };

  /* --------- мелкие построители разметки --------- */
  function row(label, inner) {
    return '<div class="row"><label>' + label + '</label><div>' + inner + '</div></div>';
  }
  function opt(v, t, cur) {
    return '<option value="' + v + '"' + (cur === v ? ' selected' : '') + '>' + t + '</option>';
  }
  function dateVal(s) {
    var d = U.parseDate(s);
    if (!d || !d.m || !d.d) return '';
    return d.y + '-' + pad(d.m) + '-' + pad(d.d);
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  /** Вместо двух полей с цифрами — ссылка на карту и кнопка выбора точки.
      Координаты по-прежнему хранятся: по ним строится вкладка «Карта». */
  function mapRow(key, o) {
    o = o || {};
    var has = o.lat != null && o.lng != null;
    var h = '<div class="map-row">';
    if (has) {
      var url = 'https://www.openstreetmap.org/?mlat=' + o.lat + '&mlon=' + o.lng + '#map=13/' +
        o.lat + '/' + o.lng;
      h += '<a class="map-link" href="' + url + '" target="_blank" rel="noopener">' +
        I('pin') + ' Открыть на карте</a>' +
        '<span class="map-coord">' + (+o.lat).toFixed(4) + ', ' + (+o.lng).toFixed(4) + '</span>' +
        '<button class="btn btn-sm" data-act="pickPlace" data-key="' + key + '">Изменить точку</button>' +
        '<button class="btn btn-sm btn-danger" data-act="dropPlace" data-key="' + key + '">Убрать</button>';
    } else {
      h += '<button class="btn btn-sm" data-act="pickPlace" data-key="' + key + '">' +
        I('pin') + ' Указать на карте</button>' +
        '<span class="note">точка не отмечена</span>';
    }
    return h + '</div>';
  }
  function fieldRow(f) {
    var isNote = f.type === 'text' || f.type === 'note';
    return '<div class="list-item" style="flex-wrap:wrap">' +
      '<div class="li-main" style="flex:1 1 100%">' +
      // адрес длинный — ему отдельная строка на всю ширину и в несколько строк
      (f.type === 'addr'
        ? '<div class="inline"><input data-f="' + f.id + '.label" value="' + esc(f.label) +
          '" placeholder="Название" style="max-width:40%">' + micBtn('f:' + f.id) + '</div>' +
          '<textarea class="field-wide" data-f="' + f.id + '.value" data-kind="addr" rows="2" ' +
          'placeholder="Индекс, область, район, населённый пункт, улица, дом, квартира">' +
          esc(f.value) + '</textarea>'
        : '<div class="inline"><input data-f="' + f.id + '.label" value="' + esc(f.label) +
          '" placeholder="Название" style="max-width:40%">' +
          '<input data-f="' + f.id + '.value" data-kind="' + esc(f.type) + '" value="' + esc(f.value) +
          '" placeholder="' + (f.type === 'phone' ? '+7 999 123-45-67' : 'Значение') +
          '"' + (f.type === 'phone' ? ' type="tel" inputmode="tel"' : '') + '>' +
          micBtn('f:' + f.id) + '</div>') +
      '<div class="inline" style="margin-top:5px">' + aclSelect('f:' + f.id, f.acl) +
      '<button class="btn btn-sm btn-danger" data-act="delField" data-id="' + f.id + '">Удалить</button></div>' +
      '</div></div>';
  }

  global.PersonSheet = Sheet;
  global.ACL_LEVELS = ACL_LEVELS;
})(window);
</script>
<script>/* Семейное Древо — главный модуль: вход, вкладки, поиск, настройки, календарь, карта. */
(function (global) {
  'use strict';
  var S = global.Store, U = S.util, esc = global.TreeView.esc;

  /* Номер сборки. Виден на экране входа — по нему сразу понятно,
     обновилась ли программа на сайте и на телефоне. */
  var BUILD = '12', BUILD_DATE = '2 ноября 2026';

  var App = {
    BUILD: BUILD, BUILD_DATE: BUILD_DATE,
    tree: null, sheet: null, map: null,
    activeTab: 'tree',
    _mediaUrls: [],

    /* ============ запуск ============ */
    init: function () {
      S.load();
      this.bindChrome();
      var hash = location.hash || '';
      // Ссылка с настройками хранилища: устройство само забирает дерево.
      var join = hash.match(/^#join-([A-Za-z0-9_-]+)$/);
      if (join) { this.gateJoinLink(join[1]); return; }
      var invite = hash.match(/^#invite-([\w-]+)$/);
      if (!S.users.length) this.gateFirstRun();
      else if (invite) this.gateInvite(invite[1]);
      else if (S.session) this.start();
      else this.gateLogin();
    },

    /* ============ ссылки на дерево ============
       В ссылку кладём настройки общего хранилища, иначе на чистом телефоне
       программе неоткуда взять ни дерево, ни список приглашений. */
    /** Адрес, с которого ссылка откроется у других. Программа, запущенная
        из файла на диске, знает только путь вида file:///C:/… — такая ссылка
        не откроется ни на телефоне, ни у родни, поэтому адрес сайта задаётся руками. */
    /** Привести введённый адрес к рабочему виду: с протоколом и верным хвостом. */
    normBase: function (site) {
      var b = String(site || '').split('#')[0].split('?')[0].trim();
      if (!b) return null;
      // адрес без «https://» браузер понимает как путь — дописываем сами
      if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(b)) b = 'https://' + b.replace(/^\/+/, '');
      // «…/FamilyTree» — папка, ей нужен слеш; «…/index.html» — файл, слеш его сломает
      var last = b.split('/').pop();
      if (last.indexOf('.') < 0) b = b.replace(/\/+$/, '') + '/';
      return b;
    },
    linkBase: function () {
      var site = this.normBase(S.sync && S.sync.siteUrl);
      if (site) return site;
      if (location.protocol === 'file:') return null;
      return location.href.split('#')[0];
    },
    isLocalFile: function () { return location.protocol === 'file:'; },

    packLink: function (token, base) {
      base = base || this.linkBase();
      if (!base) return null;
      var s = S.sync || {};
      if (s.mode !== 'supabase' && s.mode !== 'server') return null;
      var cfg = s[s.mode] || {};
      if (!cfg.url || !cfg.key) return null;
      var payload = { m: s.mode, u: cfg.url, k: cfg.key };
      if (s.mode === 'supabase') payload.i = cfg.treeId;
      if (token) payload.t = token;
      var b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      return base + '#join-' + b64;
    },
    unpackLink: function (b64) {
      try {
        var t = b64.replace(/-/g, '+').replace(/_/g, '/');
        while (t.length % 4) t += '=';
        return JSON.parse(decodeURIComponent(escape(atob(t))));
      } catch (e) { return null; }
    },

    gateJoinLink: function (b64) {
      var self = this, Sy = global.Sync;
      var cfg = this.unpackLink(b64);
      if (!cfg || !cfg.m) {
        this.toast('Ссылка повреждена');
        location.hash = '';
        if (S.users.length) this.gateLogin(); else this.gateFirstRun();
        return;
      }

      var mine = Object.keys(S.tree.persons || {}).length;
      var replacing = mine && !S.tree.meta.demo;

      /* Человек пришёл по ссылке — значит дерево уже есть и заводить новое
         ему незачем. Поэтому здесь одна кнопка, а уйти «заводить своё» можно
         только с устройства, где своё дерево уже лежит. */
      this.gate(
        '<h1>Семейное Древо</h1>' +
        '<p class="lede">' + (cfg.t
          ? 'Вас пригласили в семейное древо. Сейчас программа заберёт его из общего ' +
            'хранилища, а дальше вы напишете своё имя и придумаете логин с паролем.'
          : 'Ссылка принесла настройки вашего хранилища. Программа заберёт дерево, ' +
            'и вы войдёте тем же логином и паролем, что и на первом устройстве.') + '</p>' +
        (replacing ? '<p class="note" style="color:var(--warn)">На этом устройстве уже есть своё ' +
          'дерево (' + mine + ' персон). Оно будет заменено общим. Если в нём есть что-то ценное, ' +
          'сначала сохраните копию.</p>' : '') +
        '<div class="err" id="gErr"></div>' +
        '<div class="btn-row"><button class="btn btn-primary" id="jGo">' +
        'Присоединиться к семейному древу</button>' +
        (replacing ? '<button class="btn" id="jSkip">Оставить своё</button>' : '') + '</div>');

      var skip = document.getElementById('jSkip');
      if (skip) skip.addEventListener('click', function () {
        location.hash = '';
        if (S.users.length) self.gateLogin(); else self.gateFirstRun();
      });

      document.getElementById('jGo').addEventListener('click', function () {
        S.sync.mode = cfg.m;
        S.sync[cfg.m].url = cfg.u;
        S.sync[cfg.m].key = cfg.k;
        if (cfg.m === 'supabase') S.sync.supabase.treeId = cfg.i || '';
        S.saveSync();
        err('Забираем дерево…');
        Sy.peek().then(function (remote) {
          if (!remote || !remote.persons) {
            err('По этим настройкам дерева не нашлось. Попросите отправителя проверить ссылку.');
            return;
          }
          S.tree = remote;
          S.save(true);
          S.sync.lastAt = new Date().toISOString();
          S.sync.lastError = null;
          S.dirty = false;
          S.saveSync();
          var n = Object.keys(remote.persons).length;
          self.toast('Дерево получено: ' + n + ' ' + plural(n, 'персона', 'персоны', 'персон'));
          if (cfg.t) { self.gateInvite(cfg.t); return; }
          location.hash = '';
          self.gateLogin();
        }, function (e) { err('Не вышло: ' + e.message); });
      });
    },

    start: function () {
      S.loadPrefs(S.session.userId);
      this.applyPrefs();
      document.getElementById('gate').hidden = true;
      document.getElementById('app').hidden = false;
      this.paintIcons();

      var self = this;
      this.tree = new global.TreeView({
        host: document.getElementById('treeHost'),
        canvas: document.getElementById('treeCanvas'),
        svg: document.getElementById('treeLines'),
        onSelect: function (id) { self.sheet.open(id); },
        onAdd: function (id) { self.addRelative(id); },
        onRender: function () { self.paintEmpty(); }
      });
      this.tree.mode = S.prefs.layout;
      // Пустое дерево так и остаётся пустым: образец больше не подставляется сам.
      if (S.persons().length) this.tree.setFocus(S.tree.meta.rootId || S.persons()[0].id);

      this.sheet = new global.PersonSheet({
        el: document.getElementById('sheet'),
        onChange: function () { self.tree.render(); self.renderTabs(); },
        onFocus: function (id) { self.tree.setFocus(id); },
        onOpen: function (id) { self.tree.setOpen(id); },
        toast: function (m) { self.toast(m); }
      });

      document.getElementById('who').innerHTML =
        '<b>' + esc(S.session.displayName) + '</b> · ' + (S.isAdmin() ? 'администратор' : 'пользователь');
      document.getElementById('treeName').textContent = S.tree.meta.name;
      this.renderTabs();
      this.showTab('tree');
      setTimeout(function () { self.tree.fit(true); }, 60);
      this.startSync();
      this.watchForHistory();
    },

    /* ============ показ пароля ============
       Пароль дерева восстановить нельзя, поэтому важно видеть, что набираешь.
       Выбор запоминается: включили один раз — дальше поля открыты сразу. */
    showPw: function () {
      try { return localStorage.getItem('drevo.showpw') === '1'; } catch (e) { return false; }
    },
    setShowPw: function (on) {
      try { localStorage.setItem('drevo.showpw', on ? '1' : '0'); } catch (e) {}
    },
    enhancePasswords: function (root) {
      var self = this;
      var open = this.showPw();
      (root || document).querySelectorAll('input[type=password]:not([data-pw])').forEach(function (inp) {
        inp.dataset.pw = '1';
        var wrap = document.createElement('span');
        wrap.className = 'pw-wrap';
        inp.parentNode.insertBefore(wrap, inp);
        wrap.appendChild(inp);
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pw-eye';
        wrap.appendChild(btn);
        function paint() {
          var shown = inp.type === 'text';
          btn.innerHTML = global.Icon(shown ? 'eyeOff' : 'eye');
          btn.title = shown ? 'Скрыть пароль' : 'Показать пароль';
          btn.setAttribute('aria-label', btn.title);
        }
        btn.addEventListener('click', function () {
          var shown = inp.type === 'text';
          inp.type = shown ? 'password' : 'text';
          self.setShowPw(!shown);
          paint();
          inp.focus();
          var v = inp.value;
          try { inp.setSelectionRange(v.length, v.length); } catch (e) {}
          // остальные поля на экране переключаем заодно
          (root || document).querySelectorAll('.pw-wrap input').forEach(function (o) {
            if (o !== inp) o.type = shown ? 'password' : 'text';
          });
          (root || document).querySelectorAll('.pw-eye').forEach(function (o) {
            if (o === btn) return;
            o.innerHTML = global.Icon(shown ? 'eye' : 'eyeOff');
          });
        });
        if (open) inp.type = 'text';
        paint();
      });
    },

    /* ============ значки ============ */
    paintIcons: function () {
      var I = global.Icon;
      function put(id, name, before) {
        var el = document.getElementById(id);
        if (!el) return;
        var lbl = el.querySelector('.lbl');
        el.innerHTML = I(name) + (lbl ? lbl.outerHTML : '');
      }
      put('qIco', 'search');
      put('qClear', 'close');
      put('qMic', 'mic');
      put('btnAdd', 'addPerson');
      put('btnSync', 'sync');
      put('btnCalendar', 'calendar');
      put('btnMap', 'map');
      put('btnSettings', 'settings');
      put('btnLogout', 'logout');
      put('zoomIn', 'plus');
      put('zoomOut', 'minus');
      put('zoomFit', 'expand');
      var views = { vertical: 'down', horizontal: 'right', butterfly: 'butterfly' };
      document.querySelectorAll('#viewdock [data-view]').forEach(function (b) {
        var lbl = b.querySelector('.lbl');
        b.innerHTML = I(views[b.dataset.view]) + (lbl ? lbl.outerHTML : '');
      });
    },

    /* ============ пустое дерево ============ */
    paintEmpty: function () {
      var box = document.getElementById('treeEmpty'), self = this;
      if (!box) return;
      if (S.persons().length) { box.hidden = true; return; }
      box.hidden = false;
      box.innerHTML = '<div>' + global.Icon('tree') +
        '<h2>Дерево пока пустое</h2>' +
        '<p>Начните с себя или с того, о ком знаете больше всех. Дальше к каждому человеку ' +
        'можно будет добавлять родителей, супругов и детей — кнопкой «+» на его окошке.</p>' +
        '<div class="btn-row">' +
        '<button class="btn btn-primary" id="emAdd">Добавить первого человека</button>' +
        '<button class="btn" id="emImport">Загрузить из файла</button>' +
        '</div>' +
        '<p class="note" style="margin:14px 0 0">Хотите сначала посмотреть, как всё устроено? ' +
        '<button class="btn btn-sm" id="emDemo">Показать пример</button></p>' +
        '</div>';
      document.getElementById('emAdd').addEventListener('click', function () { self.addPerson(); });
      document.getElementById('emImport').addEventListener('click', function () { self.openSettings('data'); });
      document.getElementById('emDemo').addEventListener('click', function () {
        self.seedDemo();
        self.tree.setFocus(S.tree.meta.rootId);
        self.afterSync();
        setTimeout(function () { self.tree.fit(true); }, 40);
        self.toast('Это пример. Удалить его целиком — Настройки → Данные → Очистить дерево');
      });
    },

    /* ============ вход ============ */
    gate: function (html) {
      var g = document.getElementById('gate');
      g.hidden = false;
      document.getElementById('app').hidden = true;
      var self = this;
      g.innerHTML = '<div class="gate-card">' + html +
        (global.DREVO_PREVIEW ? '<p class="note" style="margin-top:16px;padding-top:12px;border-top:1px solid var(--line)">' +
          'Это витрина внутри Claude. Дерево, карточки, поиск и настройки работают полностью. ' +
          'Сохранение файлов, микрофон, карта и вход по отпечатку закрыты правилами этого окна — ' +
          'они работают в версии, установленной на телефон или компьютер.</p>' : '') +
        '<p class="gate-ver">сборка ' + BUILD + ' · ' + BUILD_DATE + '</p>' +
        '</div>';
      this.enhancePasswords(g);
    },
    /* Вход на втором устройстве. Учётные записи лежат в дереве, поэтому
       сперва надо забрать дерево из общего хранилища, а потом входить. */
    gateJoin: function () {
      var self = this, Sy = global.Sync;
      var sync = S.sync || U.defaultSync();
      this.gate(
        '<h1>Присоединиться к дереву</h1>' +
        '<p class="lede">Проще всего — вставить ссылку, которую прислал администратор: ' +
        'в ней уже лежат все настройки хранилища.</p>' +
        '<label for="jPaste">Ссылка от администратора</label>' +
        '<input id="jPaste" placeholder="https://…/#join-…" autocomplete="off" spellcheck="false">' +
        '<div class="btn-row"><button class="btn btn-primary" id="jPasteGo">Войти по ссылке</button></div>' +
        '<p class="note" style="margin:16px 0 4px;padding-top:14px;border-top:1px solid var(--line)">' +
        'Ссылки нет — укажите хранилище руками, то же самое, что на первом устройстве.</p>' +
        '<label for="jMode">Где лежит дерево</label>' +
        '<select id="jMode">' +
        '<option value="supabase"' + (sync.mode === 'supabase' ? ' selected' : '') + '>Supabase</option>' +
        '<option value="server"' + (sync.mode === 'server' ? ' selected' : '') + '>Свой сервер</option>' +
        '</select>' +
        '<div id="jFields"></div>' +
        '<div class="err" id="gErr"></div>' +
        '<div class="btn-row"><button class="btn btn-primary" id="jGo">Забрать дерево</button>' +
        '<button class="btn" id="jBack">Назад</button></div>');

      function fields() {
        var m = document.getElementById('jMode').value;
        var cfg = sync[m] || {};
        document.getElementById('jFields').innerHTML = m === 'supabase'
          ? '<label for="jUrl">Адрес проекта</label><input id="jUrl" value="' + esc(cfg.url || '') +
            '" placeholder="https://xxxxx.supabase.co" autocomplete="off">' +
            '<label for="jKey">Ключ anon public</label><input id="jKey" type="password" value="' +
            esc(cfg.key || '') + '" autocomplete="off">' +
            '<label for="jTree">Имя дерева</label><input id="jTree" value="' + esc(cfg.treeId || '') +
            '" autocomplete="off">'
          : '<label for="jUrl">Адрес сервера</label><input id="jUrl" value="' + esc(cfg.url || '') +
            '" placeholder="https://drevo.мойдомен.ru" autocomplete="off">' +
            '<label for="jKey">Ключ доступа</label><input id="jKey" type="password" value="' +
            esc(cfg.key || '') + '" autocomplete="off">';
      }
      fields();
      document.getElementById('jMode').addEventListener('change', fields);

      // Вставленная ссылка: из неё достаём только часть после «#join-».
      document.getElementById('jPasteGo').addEventListener('click', function () {
        var raw = val('jPaste');
        if (!raw) return err('Вставьте ссылку целиком');
        var m = raw.match(/#?join-([A-Za-z0-9_-]+)/);
        if (!m) return err('В этой ссылке нет настроек дерева. Попросите администратора ' +
          'создать ссылку заново — в настройках, «Доступ и защита».');
        if (!self.unpackLink(m[1])) return err('Ссылка повреждена — похоже, скопировалась не целиком');
        self.gateJoinLink(m[1]);
      });
      document.getElementById('jPaste').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('jPasteGo').click();
      });
      document.getElementById('jBack').addEventListener('click', function () {
        if (S.users.length) self.gateLogin(); else self.gateFirstRun();
      });

      document.getElementById('jGo').addEventListener('click', function () {
        var m = document.getElementById('jMode').value;
        S.sync.mode = m;
        S.sync[m].url = val('jUrl');
        S.sync[m].key = val('jKey');
        if (m === 'supabase') S.sync.supabase.treeId = val('jTree');
        if (!S.sync[m].url || !S.sync[m].key) return err('Заполните адрес и ключ');
        if (m === 'supabase' && !S.sync.supabase.treeId) return err('Укажите имя дерева');
        S.saveSync();
        err('Забираем дерево…');
        Sy.peek().then(function (remote) {
          if (!remote || !remote.persons) {
            err('По этим настройкам дерева не нашлось. Проверьте адрес, ключ и имя дерева.');
            return;
          }
          if (!remote.users || !remote.users.length) {
            err('Дерево нашлось, но в нём нет учётных записей. ' +
              'Обновите программу на первом устройстве и синхронизируйте её — записи уедут вместе с деревом.');
            return;
          }
          S.tree = remote;
          S.save(true);
          // дерево только что взято целиком — переспрашивать «слить или заменить» незачем
          S.sync.lastAt = new Date().toISOString();
          S.sync.lastError = null;
          S.dirty = false;
          S.saveSync();
          self.toast('Дерево получено: ' + Object.keys(remote.persons).length + ' персон');
          self.gateLogin();
        }, function (e) { err('Не вышло: ' + e.message); });
      });
    },

    gateFirstRun: function () {
