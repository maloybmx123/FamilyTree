      var btn = document.getElementById('calNotify');
      if (btn) btn.addEventListener('click', function () {
        if (!global.Notification) { self.toast('Уведомления в этом браузере недоступны'); return; }
        Notification.requestPermission().then(function (r) {
          self.toast(r === 'granted' ? 'Напоминания включены' : 'Разрешение не получено');

    /* Сетка месяца: видно сразу все даты, а не только ближайшие. */
    calMonth: null,
    monthGrid: function () {
      var base = this.calMonth ? new Date(this.calMonth) : new Date();
      base.setDate(1);
      this.calMonth = base.getTime();
      var self = this;
      var year = base.getFullYear(), month = base.getMonth();
      var marks = this.monthMarks(year, month);

      var first = new Date(year, month, 1);
      var shift = (first.getDay() + 6) % 7;             // неделя с понедельника
      var days = new Date(year, month + 1, 0).getDate();
      var today = new Date();
      var isNow = today.getFullYear() === year && today.getMonth() === month;

      var cells = '';
      for (var i = 0; i < shift; i++) cells += '<div class="cal-cell empty"></div>';
      for (var d = 1; d <= days; d++) {
        var list = marks[d] || [];
        cells += '<div class="cal-cell' + (isNow && today.getDate() === d ? ' is-today' : '') +
          (list.length ? ' has' : '') + '"' +
          (list.length ? ' data-day="' + d + '"' : '') + '>' +
          '<span class="cal-num">' + d + '</span>' +
          list.slice(0, 3).map(function (e) {
            return '<span class="cal-mark ' + e.kind + '" title="' +
              esc(S.fullName(e.person) + ' — ' + self.kindName(e)) + '">' +
              esc(S.callName(e.person)) + '</span>';
          }).join('') +
          (list.length > 3 ? '<span class="cal-more">ещё ' + (list.length - 3) + '</span>' : '') +
          '</div>';
      }

      var names = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь',
        'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
      return '<div class="cal-head">' +
        '<button class="btn btn-sm" data-mon="-1" aria-label="Предыдущий месяц">' + global.Icon('prev') + '</button>' +
        '<b>' + names[month] + ' ' + year + '</b>' +
        '<button class="btn btn-sm" data-mon="1" aria-label="Следующий месяц">' + global.Icon('next') + '</button>' +
        '<button class="btn btn-sm" data-mon="0">Сегодня</button></div>' +
        '<div class="cal-grid">' +
        ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map(function (w) {
          return '<div class="cal-wd">' + w + '</div>';
        }).join('') + cells + '</div>';
    },
    /** что отмечено в этом месяце: ключ — число, значение — список дат */
    monthMarks: function (year, month) {
      var self = this, out = {};
      var allow = S.prefs.calShow || {};
      function add(p, kind, dateStr, title) {
        var d = String(dateStr || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (!d) return;
        if (+d[2] - 1 !== month) return;
        if (allow[kind] === false) return;
        var day = +d[3];
        (out[day] = out[day] || []).push({ person: p, kind: kind, title: title || '', year: +d[1] });
      }
      S.persons().forEach(function (p) {
        if (p.living !== false && !(p.death && p.death.date)) add(p, 'birth', p.birth && p.birth.date);
        else add(p, 'memory', p.death && p.death.date);
        (p.events || []).forEach(function (e) {
          if (!S.canSee(e.acl)) return;
          var t = (e.type || '').toLowerCase();
          add(p, /свадьб|брак|венчан|женит|замуж/.test(t) ? 'wedding' : 'event', e.date, e.type);
        });
      });
      return out;
    },
    bindMonth: function (host) {
      var self = this;
      host.querySelectorAll('[data-mon]').forEach(function (b) {
        b.addEventListener('click', function () {
          var step = +b.dataset.mon;
          if (step === 0) self.calMonth = null;
          else {
            var d = new Date(self.calMonth);
            d.setMonth(d.getMonth() + step);
            self.calMonth = d.getTime();
          }
          self.renderCalendar(host);
        });
      });
      host.querySelectorAll('[data-day]').forEach(function (cell) {
        cell.addEventListener('click', function () {
          var d = new Date(self.calMonth);
          var list = self.monthMarks(d.getFullYear(), d.getMonth())[+cell.dataset.day] || [];
          if (!list.length) return;
          if (list.length === 1) {
            self.showTab('tree');
            self.tree.reveal(list[0].person.id);
            self.sheet.open(list[0].person.id);
            return;
          }
          self.modal(cell.dataset.day + ' ' + ['января','февраля','марта','апреля','мая','июня',
            'июля','августа','сентября','октября','ноября','декабря'][d.getMonth()],
            '<div class="list">' + list.map(function (e) {
              return '<button class="list-item" data-go="' + esc(e.person.id) + '" style="width:100%;text-align:left">' +
                '<span class="mini-ph">' + global.Icon('person') + '</span>' +
                '<span class="li-main"><span>' + esc(S.fullName(e.person)) + '</span>' +
                '<span class="li-sub">' + esc(self.kindName(e)) + ' · ' + e.year + '</span></span></button>';
            }).join('') + '</div>', []);
          document.querySelectorAll('[data-go]').forEach(function (b) {
            b.addEventListener('click', function () {
              self.closeAllModals();
              self.showTab('tree');
              self.tree.reveal(b.dataset.go);
              self.sheet.open(b.dataset.go);
            });
          });
        });
      });
    },

    kindName: function (e) {
      if (e.kind === 'birth') return 'день рождения';
      if (e.kind === 'memory') return 'день памяти';
      if (e.kind === 'wedding') return e.title || 'годовщина свадьбы';
      return e.title || 'событие';
    },

    /* Ближайшие даты в углу главного экрана: небольшие окошки, чтобы
       не пропустить день рождения, не заходя в календарь. */
    paintHomeDates: function () {
      var box = document.getElementById('homeDates');

      box.hidden = false;
      box.innerHTML = up.map(function (e) {
        var when = e.in === 0 ? 'сегодня' : e.in === 1 ? 'завтра' : 'через ' + e.in + ' дн.';
        return '<button class="home-date' + (e.in <= 1 ? ' soon' : '') +

          e.date.toLocaleDateString('ru-RU', { month: 'short' }) + '</span>' +
          '<span class="hd-txt"><b>' + esc(S.callName(e.person)) + '</b>' +
          '<span>' + esc(self.kindName(e)) + ' · ' + when + '</span></span></button>';
      }).join('');
      box.querySelectorAll('[data-person]').forEach(function (b) {
        b.addEventListener('click', function () {
          self.showTab('tree');
          self.tree.reveal(b.dataset.person);
          self.sheet.open(b.dataset.person);
        });
      });
    },

    scheduleReminders: function () {
      if (!global.Notification || Notification.permission !== 'granted') return;
      var self = this;
      var notify = S.prefs.calNotify || {};
      var today = S.upcoming(1);
      today.forEach(function (e) {
        if (e.in > 1) return;
        if (notify[e.kind] === false) return;       // об этом виде дат не напоминаем
        try {
          new Notification(self.kindName(e).charAt(0).toUpperCase() + self.kindName(e).slice(1), {
            body: S.fullName(e.person) + (e.in === 0 ? ' — сегодня' : ' — завтра'),
            tag: 'drevo-' + e.person.id + '-' + e.date.toDateString()
          });
        } catch (err) {}
      });
    },

    /* ============ новая персона ============ */
    addPerson: function () {

    /* ============ родственники ============ */
    addRelative: function (id) {

      this.modal('Родственник для ' + who,
        '<p class="note" style="margin:0 0 12px">Новый человек — кто он для ' + esc(who) + '?</p>' +
        '<div class="row"><label for="arRel">Это</label><select id="arRel">' +
        '<option value="child">Сын или дочь ' + esc(who) + '</option>' +

        '<option value="parent">Отец или мать ' + esc(who) + '</option>' +
        '<option value="sibling">Брат или сестра ' + esc(who) + '</option>' +
        '</select></div>' +
        '<div class="row"><label for="arSur">Фамилия</label><input id="arSur" value="' + esc(p.surname) + '"></div>' +
        '<div class="row"><label for="arGiv">Имя</label><input id="arGiv"></div>' +
        '<div class="row"><label for="arPat">Отчество</label><input id="arPat"></div>' +
        '<div class="row"><label for="arSex">Пол</label><select id="arSex">' +
        '<option value="M">Мужской</option><option value="F">Женский</option><option value="U">Не указан</option></select></div>' +
        '<div class="row"><label for="arBirth">Дата рождения</label><input id="arBirth" type="date"></div>' +
        '<p class="note" id="arHint"></p>',
        [{ text: 'Добавить', primary: true, fn: function () {
          var rel = document.getElementById('arRel').value;
          var np = S.addPerson({
            surname: document.getElementById('arSur').value.trim(),
            given: document.getElementById('arGiv').value.trim(),
            patronymic: document.getElementById('arPat').value.trim(),
            sex: document.getElementById('arSex').value,
            birth: { date: document.getElementById('arBirth').value, place: '', lat: null, lng: null }
          });
          if (rel === 'child') S.linkChild(id, np.id);
          else if (rel === 'spouse') S.linkSpouse(id, np.id);
          else if (rel === 'parent') S.linkParent(id, np.id);
          else if (rel === 'sibling') {
            var f = S.childFamily(id);

            f.children.push(np.id);
            S.save();

          self.closeModal();
          self.tree.render();
          self.sheet.open(np.id);

      var relSel = document.getElementById('arRel');
      var hint = document.getElementById('arHint');
      function sayHint() {
        var giv = (document.getElementById('arGiv').value || '').trim() || 'новый человек';
        var map = {
          child: giv + ' станет ребёнком, а ' + who + ' — родителем.',
          spouse: giv + ' и ' + who + ' станут супругами.',
          parent: giv + ' станет родителем, а ' + who + ' — ребёнком.',
          sibling: giv + ' и ' + who + ' станут братом и сестрой — у них будут общие родители.'
        };
        hint.textContent = map[relSel.value] || '';
      }
      relSel.addEventListener('change', function () {
        var sur = document.getElementById('arSur');
        if (relSel.value === 'spouse') sur.value = '';
        else sur.value = p.surname || '';
        sayHint();
      });
      document.getElementById('arGiv').addEventListener('input', sayHint);
      sayHint();
      setTimeout(function () {
        var el = document.getElementById('arGiv');
        if (el) el.focus();
      }, 50);
    },

    /** Кому открыта запись: отмечаем конкретных родственников. */
    pickViewers: function (acl, onDone) {
      var self = this;
      acl.allow = acl.allow || [];
      var others = S.users.filter(function (u) { return u.role !== 'admin'; });
      var admins = S.users.filter(function (u) { return u.role === 'admin'; });

      if (!others.length) {
        this.modal('Кому открыть запись',
          '<p class="note">Кроме администраторов, в дереве пока никого нет. ' +
          'Пригласите родственников — <b>Настройки → Доступ и защита → Пригласить родственника</b>, ' +
          'и они появятся в этом списке.</p>' +
          (admins.length ? '<p class="note">Администраторы видят всё и так: ' +
            esc(admins.map(function (u) { return u.displayName; }).join(', ')) + '.</p>' : ''),
          []);
        return;
      }

      var chosen = {};
      acl.allow.forEach(function (id) { chosen[id] = true; });

      this.modal('Кому открыть запись',
        '<p class="note" style="margin:0 0 12px">Отметьте тех, кому эта запись будет видна. ' +
        'Остальные её не увидят. Администраторы видят всё независимо от отметок.</p>' +
        '<div class="viewer-list" id="vwList">' +
        others.map(function (u) {
          return '<label class="viewer-row"><input type="checkbox" data-u="' + esc(u.id) + '"' +
            (chosen[u.id] ? ' checked' : '') + '>' +
            '<span class="mini-ph">' + global.Icon('person') + '</span>' +
            '<span class="li-main"><span>' + esc(u.displayName) + '</span>' +
            '<span class="li-sub">' + esc(u.login) + '</span></span></label>';
        }).join('') + '</div>' +
        '<div class="btn-row"><button class="btn btn-sm" id="vwAll">Отметить всех</button>' +
        '<button class="btn btn-sm" id="vwNone">Снять все</button></div>' +
        (admins.length ? '<p class="note" style="margin-top:10px">Видят всегда: ' +
          esc(admins.map(function (u) { return u.displayName; }).join(', ')) + '.</p>' : ''),
        [{ text: 'Готово', primary: true, fn: function () {
          var list = [];
          document.querySelectorAll('#vwList [data-u]').forEach(function (c) {
            if (c.checked) list.push(c.dataset.u);
          });
          acl.allow = list;
          self.closeModal();
          if (onDone) onDone(list);
        } }]);

      document.getElementById('vwAll').addEventListener('click', function () {
        document.querySelectorAll('#vwList [data-u]').forEach(function (c) { c.checked = true; });
      });
      document.getElementById('vwNone').addEventListener('click', function () {
        document.querySelectorAll('#vwList [data-u]').forEach(function (c) { c.checked = false; });
      });
    },

    /* ============ медиа ============ */
    /** Выбор файлов. opts.folder — выбрать папку целиком, со всем,
        что в ней лежит; вложенные папки тоже попадут. */
    pickFiles: function (cb, opts) {
      var self = this;
      var inp = document.createElement('input');
      inp.type = 'file'; inp.multiple = true;
      if (opts && opts.folder) {
        /* accept с выбором папки лучше не ставить: часть браузеров на этом
           показывает пустой список и выбрать нечего. Отсеем лишнее сами. */
        try { inp.webkitdirectory = true; inp.directory = true; } catch (e) {}
      } else {
        inp.accept = 'image/*,audio/*,video/*,.pdf,.doc,.docx,.txt,.rtf';
      }
      inp.addEventListener('change', function () {
        if (inp.files && inp.files.length) cb(inp.files);
        else self.toast('Ничего не выбрано');
      });
      inp.click();
    },
    /** Спросить, кому будут видны добавляемые файлы. */
    askAccess: function (cb, acl) {
      var self = this;
      acl = acl || { level: 'public', locked: false, allow: [] };

      this.modal('Кому показывать эти файлы?',
        '<div class="row"><label for="acLevel">Видимость</label>' +
        '<div class="acl-ctl"><select id="acLevel">' +
        global.ACL_LEVELS.map(function (l) {
          return '<option value="' + l.v + '"' + (acl.level === l.v ? ' selected' : '') + '>' + l.t + '</option>';
        }).join('') + '</select>' +
        '<button class="btn btn-sm" id="acWho" hidden>' + global.Icon('person') + ' Выбрать</button>' +
        '</div><span class="note acl-names" id="acNames"></span></div>' +
        '<label class="inline"><input type="checkbox" id="acLock"' + (acl.locked ? ' checked' : '') +
        '> <span>Замок: шифровать файл при хранении и в резервной копии</span></label>' +
        '<p class="note" style="margin-top:10px">Зашифрованные файлы открываются только после входа ' +
        'с паролем дерева. Если пароль утерян, восстановить их невозможно.</p>',
        [{ text: 'Добавить', primary: true, fn: function () {
          acl.level = document.getElementById('acLevel').value;
          acl.locked = document.getElementById('acLock').checked;
          self.closeModal();
          cb(acl);
        } }]);

      var lvl = document.getElementById('acLevel');
      var who = document.getElementById('acWho');
      var names = document.getElementById('acNames');
      function paint() {
        who.hidden = lvl.value !== 'chosen';
        names.textContent = lvl.value === 'chosen'
          ? (S.allowedNames(acl).join(', ') || 'пока никто не отмечен') : '';
      }
      lvl.addEventListener('change', function () { acl.level = lvl.value; paint(); });
      who.addEventListener('click', function () {
        acl.level = lvl.value;
        acl.locked = document.getElementById('acLock').checked;
        // выбор людей идёт отдельным окном, затем возвращаемся сюда
        self.pickViewers(acl, function () { self.askAccess(cb, acl); });
      });
      paint();
    },

    viewMedia: function (id, sheet) {
      var m = S.tree.media[id], self = this;
      if (!m) return;
      if (!S.canSee(m.acl)) { this.toast('Файл закрыт правами доступа'); return; }
      var who = S.person(m.personId);
      this.modal(m.caption || m.name,
        '<div id="mvBody" class="empty">Открываем…</div>' +
        '<div class="row" style="margin-top:12px"><label for="mvCap">Подпись</label><input id="mvCap" value="' + esc(m.caption) + '"></div>' +
        '<div class="row"><label for="mvAcl">Видимость</label>' +
        '<div class="acl-ctl"><select id="mvAcl">' +
        global.ACL_LEVELS.map(function (l) {
          return '<option value="' + l.v + '"' + (m.acl.level === l.v ? ' selected' : '') + '>' + l.t + '</option>';
        }).join('') + '</select>' +
        '<button class="btn btn-sm" id="mvWho"' + (m.acl.level === 'chosen' ? '' : ' hidden') + '>' +
        global.Icon('person') + ' Выбрать</button></div>' +
        '<span class="note acl-names" id="mvNames">' +
        (m.acl.level === 'chosen' ? esc(S.allowedNames(m.acl).join(', ') || 'пока никто не отмечен') : '') +
        '</span></div>' +
        '<p class="note">' + esc(who ? S.fullName(who) : '') + ' · ' + Math.round((m.size || 0) / 1024) + ' КБ' +
        (m.encrypted ? ' · зашифрован' : '') + '</p>',
        [
          { text: 'Сделать главным фото', fn: function () {
            if (m.kind !== 'photo') { self.toast('Главным может быть только снимок'); return; }
            S.updatePerson(m.personId, { photo: m.id });
            self.closeModal(); self.tree.render();
            if (sheet) sheet.render();
          } },
          { text: 'Удалить', danger: true, fn: function () {
            self.confirm('Удалить «' + (m.caption || m.name) + '»?',
              'Файл уйдёт в корзину — оттуда его можно вернуть.', function () {
                S.removeMedia(m.id);
                self.closeAllModals();
                if (sheet) sheet.render();
                self.tree.render();
                self.paintTrash();
                if (self.activeTab !== 'tree') self.showTab(self.activeTab);
              });
          } },
          { text: 'Готово', primary: true, fn: function () {
            m.caption = document.getElementById('mvCap').value;
            m.acl.level = document.getElementById('mvAcl').value;
            S.save();
            self.closeModal();
            if (sheet) sheet.renderBody();
          } }
        ]);
      var mvLvl = document.getElementById('mvAcl');
      var mvWho = document.getElementById('mvWho');
      mvLvl.addEventListener('change', function () {
        m.acl.level = mvLvl.value;
        mvWho.hidden = mvLvl.value !== 'chosen';
        document.getElementById('mvNames').textContent = mvLvl.value === 'chosen'
          ? (S.allowedNames(m.acl).join(', ') || 'пока никто не отмечен') : '';
      });
      mvWho.addEventListener('click', function () {
        m.acl.allow = m.acl.allow || [];
        self.pickViewers(m.acl, function () {
          S.save();
          self.viewMedia(id, sheet);
        });
      });

      S.mediaURL(id).then(function (url) {
        var body = document.getElementById('mvBody');
        if (!body) return;
        if (!url) { body.textContent = 'Файл не открылся'; return; }
        self._mediaUrls.push(url);
        body.classList.remove('empty');
        if (m.kind === 'photo') body.innerHTML = '<img src="' + url + '" alt="" style="width:100%;border-radius:10px">';
        else if (m.kind === 'audio') body.innerHTML = '<audio controls src="' + url + '" style="width:100%"></audio>';
        else if (m.kind === 'video') body.innerHTML = '<video controls src="' + url + '" style="width:100%;border-radius:10px"></video>';
        else body.innerHTML = '<p class="note">Документ «' + esc(m.name) + '». Скачайте его из резервной копии или откройте в своей программе.</p>';
      });
    },

        '<div class="sheet-tabs" id="setTabs">' +

    /* ============ синхронизация ============ */
    /* Точки восстановления по ходу работы: сам модуль не чаще чем раз
       в десять минут, так что на каждую правку хранилище не раздувается. */
    watchForHistory: function () {

      S.on(function (what) {
        if (what !== 'tree') return;
        clearTimeout(this._hT);
        this._hT = setTimeout(function () { global.History.maybeSnapshot('работа'); }, 4000);

    startSync: function () {

      Sy.on(function (state) {
        self.paintSync(state);
        if (state.state === 'ok' || state.state === 'warn') self.afterSync();
        // файлы не уехали — сказать вслух, иначе человек узнает об этом
        // только когда откроет дерево на другом устройстве
        if (state.state === 'warn' && state.detail) self.toast(state.detail, 9000);
      });
      this.countMissing();
      Sy.restore().then(function () {
        self.paintSync();
        if (S.sync.mode === 'off' || !Sy.ready()) return;
        Sy.schedule();
        // первый проход через пару секунд, чтобы не мешать открытию программы
        setTimeout(function () {
          self.firstSync(function () {}, function () {});
        }, 2500);
      });
    },

    /** Первое подключение этого устройства. Если в общем хранилище уже есть дерево,
        а у человека своё — решает он, а не программа. Нетронутый образец уступает молча. */
    firstSync: function (then, fail) {
      var self = this, Sy = global.Sync;
      then = then || function () {};
      fail = fail || function () {};
      if (S.sync.lastAt || S.tree.meta.demo || !Object.keys(S.tree.persons).length) {
        Sy.run({ media: true }).then(then, fail);
        return;
      }
      Sy.peek().then(function (remote) {
        var n = remote && remote.persons ? Object.keys(remote.persons).length : 0;
        if (!n) { Sy.run({ media: true }).then(then, fail); return; }
        var mine = Object.keys(S.tree.persons).length;
        self.modal('В общем хранилище уже есть дерево',
          '<p class="note">Там <b>' + n + '</b> ' + plural(n, 'персона', 'персоны', 'персон') +
          ', у вас на устройстве — <b>' + mine + '</b>. Как поступить?</p>' +
          '<p class="note" style="margin-top:10px"><b>Присоединиться</b> — ваши записи добавятся к общим. ' +
          'Это нужный выбор, если вы вносили сведения, которых больше нигде нет.</p>' +
          '<p class="note"><b>Взять общее</b> — ваше местное дерево уступит место общему. ' +
          'Берите этот вариант, если вы просто смотрели образец.</p>' +
          '<p class="note"><b>Заменить общее своим</b> — ваше дерево станет общим для всех. ' +
          'Чужие записи при этом никуда не денутся: они вернутся при следующей синхронизации с их устройств.</p>',
          [
            { text: 'Присоединиться', primary: true, fn: function () {
              self.closeModal();
              Sy.run({ media: true }).then(then, fail);
            } },
            { text: 'Взять общее', fn: function () {
              self.closeModal();

    /** сколько файлов числится в дереве, но ещё не лежит на этом устройстве */
    missingCount: function () {
      return this._missing || 0;
    },
    countMissing: function () {
      var self = this;
      var ids = Object.keys(S.tree.media).filter(function (id) { return S.tree.media[id].uploaded; });
      var i = 0, n = 0;
      function step() {
        if (i >= ids.length) { self._missing = n; return Promise.resolve(n); }
        return U.blobGet(ids[i++]).then(function (b) { if (!b) n++; }).then(step);
      }
      return step();
    },

    /** обновить вид после прихода чужих правок */
    afterSync: function () {
      if (!this.tree) return;
      if (!S.person(this.tree.focusId)) {
        this.tree.focusId = S.tree.meta.rootId || Object.keys(S.tree.persons)[0] || null;
      }
      this.tree.render();
      document.getElementById('treeName').textContent = S.tree.meta.name;
      this.renderTabs();
      this.paintTrash();
      this.paintHomeDates();
      if (this.sheet && this.sheet.personId) {
        if (!S.person(this.sheet.personId)) this.sheet.close();
        else if (this.sheet.hasPending()) {
          /* Человек прямо сейчас что-то печатает. Перерисовать карточку —
             значит стереть набранное у него на глазах. Ждём, пока сохранит. */
          this.toast('Пришли изменения от родных. Карточка обновится, когда вы сохраните свои.', 6000);
        } else this.sheet.render();
      }
      if (this.activeTab !== 'tree') this.showTab(this.activeTab);
      this.countMissing();
    },

    /** значок состояния синхронизации в верхней панели */
    paintSync: function (state) {
      var btn = document.getElementById('btnSync');
      if (!btn) return;
      var Sy = global.Sync, s = S.sync || {};
      if (s.mode === 'off') {
        btn.hidden = true;
        return;
      }
      btn.hidden = false;
      var title = 'Синхронизировать';
      btn.classList.remove('spin', 'bad');
      if (state && state.state === 'run') {
        btn.classList.add('spin');
        title = state.text || 'Синхронизация…';
      } else if ((state && state.state === 'error') || s.lastError) {
        btn.classList.add('bad');
        title = (state && state.state === 'error')
          ? 'Не удалось: ' + state.text
          : 'Прошлая попытка не удалась: ' + s.lastError;
      } else if (s.lastAt) {
        title = 'Синхронизировано ' + new Date(s.lastAt).toLocaleTimeString('ru-RU',
          { hour: '2-digit', minute: '2-digit' });
      }
      btn.innerHTML = global.Icon('sync');
      btn.title = title;
      btn.setAttribute('aria-label', title);
    },

            'Впишите адрес, по которому «Семейное Древо» открывается в интернете — например, ' +

    /* ============ импорт ============ */
    importFile: function (kind) {
      var self = this;
      var inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = kind === 'ged' ? '.ged,.gedcom,text/plain'
        : kind === 'json' ? '.zip,.drevo,.json,application/zip,application/json'
        : '.txt,.csv,text/plain';
      inp.addEventListener('change', function () {
        var f = inp.files[0];
        if (!f) return;
        var isArchive = /\.(zip|drevo)$/i.test(f.name) || f.type === 'application/zip';
        if (kind === 'json' && isArchive) { self.importArchive(f); return; }

        var r = new FileReader();
        r.onload = function () {
          var incoming;
          try {
            if (kind === 'ged') incoming = global.IO.importGEDCOM(r.result);
            else if (kind === 'json') incoming = JSON.parse(r.result);
            else incoming = global.IO.importText(r.result);
          } catch (e) { self.toast('Файл не разобрался: ' + e.message); return; }
          self.applyImport(incoming, f.name, null);
        };
        r.readAsText(f, 'utf-8');
      });
      inp.click();
    },

    /** Полная копия целиком: дерево и все вложенные файлы из одного архива. */
    importArchive: function (file) {
      var self = this;
      self.toast('Разбираем архив…');
      file.arrayBuffer().then(global.Sync.unzip).then(function (map) {
        var raw = map['drevo.json'] || map['rodovod.json'];
        if (!raw) throw new Error('В архиве нет файла drevo.json');
        var incoming = JSON.parse(new TextDecoder().decode(raw));
        // вложенные файлы: photo/M-xxx_имя.jpg и так далее
        var blobs = [];
        Object.keys(map).forEach(function (name) {
          var m = name.match(/^(?:photo|audio|video|doc)\/([^_\/]+)_/);
          if (m) blobs.push({ id: m[1], data: map[name] });
        });
        self.applyImport(incoming, file.name, blobs);
      }).catch(function (e) {
        self.toast('Архив не разобрался: ' + e.message);
      });
    },

    /** Заменить дерево загруженным. blobs — вложенные файлы, если они были. */
    applyImport: function (incoming, fileName, blobs) {
      var self = this;
      if (global.History) global.History.snapshot('перед загрузкой из файла');
      var n = Object.keys((incoming && incoming.persons) || {}).length;
      if (!n) { this.toast('В файле не нашлось ни одной персоны'); return; }
      var users = ((incoming.users || []).length);

      this.confirm('Загрузить ' + n + ' ' + plural(n, 'персону', 'персоны', 'персон') + '?',
        'Текущее дерево (' + S.persons().length + ' персон) будет заменено' +
        (users ? ', вместе с ним приедут ' + users + ' ' +
          plural(users, 'учётная запись', 'учётные записи', 'учётных записей') : '') +
        (blobs && blobs.length ? ' и ' + blobs.length + ' ' +
          plural(blobs.length, 'вложенный файл', 'вложенных файла', 'вложенных файлов') : '') +
        '. Сначала сохраните копию, если она ещё не сделана.',
        function () {
          incoming.changes = incoming.changes || S.tree.changes || [];
          incoming.tabs = incoming.tabs || S.tree.tabs;
          incoming.users = incoming.users || S.tree.users || [];
          incoming.invites = incoming.invites || [];
          incoming.meta.salt = incoming.meta.salt || S.tree.meta.salt;
          delete incoming.meta.demo;

          var put = Promise.resolve();
          (blobs || []).forEach(function (b) {
            put = put.then(function () { return U.blobPut(b.id, new Blob([b.data])); });
          });

          put.then(function () {
            S.tree = incoming;
            S.log('import', 'Загружено дерево из файла «' + fileName + '» — ' + n + ' персон');
            S.save();
            self.closeAllModals();
            self.tree.focusId = null;
            self.tree.setFocus(S.tree.meta.rootId || Object.keys(S.tree.persons)[0]);
            self.renderTabs();
            self.showTab('tree');
            self.tree.fit(true);
            self.countMissing();
            var who = S.users.filter(function (u) { return u.id === (S.session || {}).userId; })[0];
            if (!who) {
              self.toast('Дерево загружено. Войдите заново — учётные записи приехали из копии.');
              setTimeout(function () { S.setSession(null); location.reload(); }, 2200);
            } else {
              self.toast('Загружено персон: ' + n +
                (blobs && blobs.length ? ', файлов: ' + blobs.length : ''));
            }
          });
        });
    },

    saveFile: function (blob, name) {
      if (!global.IO.download(blob, name)) {
        this.toast('Браузер не дал сохранить файл. Откройте программу в отдельной вкладке.');
      } else {
        this.toast('Сохранено: ' + name);
      }
    },

    /* ============ оформление ============ */
    applyPrefs: function () {
      var p = S.prefs;
      var root = document.documentElement;
      if (p.theme === 'auto') root.removeAttribute('data-theme');
      else root.setAttribute('data-theme', p.theme);
      root.style.setProperty('--accent', p.accent);
      root.style.setProperty('--ui-size', p.ui.fontSize + 'px');
      root.style.setProperty('--tab-size', p.ui.tabSize + 'px');
      root.style.setProperty('--icon-size', (p.ui.iconSize || 17) + 'px');
      root.style.setProperty('--mourn-w', (p.card.mournWidth == null ? 14 : p.card.mournWidth) + 'px');
      root.style.setProperty('--mourn-gap', (p.card.mournGap || 0) + 'px');
      if (p.treeBg && p.treeBg !== 'auto') root.style.setProperty('--tree-bg', p.treeBg);
      else root.style.setProperty('--tree-bg', 'var(--paper)');
      root.style.setProperty('--tree-fade', ((p.treeImageFade == null ? 35 : p.treeImageFade) / 100));
      this.paintTreeImage();
    },

    /** картинка под деревом; лежит в хранилище устройства, своя у каждого */
    paintTreeImage: function () {
      var el = document.getElementById('treeBgImage'), p = S.prefs, self = this;
      if (!el) return;
      if (!p.treeImage) {
        el.hidden = true;
        el.style.backgroundImage = '';
        if (this._bgUrl) { try { URL.revokeObjectURL(this._bgUrl); } catch (e) {} this._bgUrl = null; }
        return;
      }
      el.classList.toggle('tile', p.treeImageFit === 'tile');
      if (this._bgUrl) { el.hidden = false; return; }
      U.blobGet('__treebg_' + S.session.userId).then(function (b) {
        if (!b) { p.treeImage = false; S.savePrefs(); el.hidden = true; return; }
        self._bgUrl = URL.createObjectURL(b);
        el.style.backgroundImage = 'url(' + self._bgUrl + ')';
        el.hidden = false;
      });
    },
    setTreeImage: function (file) {
      var self = this, p = S.prefs;
      if (this._bgUrl) { try { URL.revokeObjectURL(this._bgUrl); } catch (e) {} this._bgUrl = null; }
      return U.blobPut('__treebg_' + S.session.userId, file).then(function () {
        p.treeImage = true;
        S.savePrefs();
        self.paintTreeImage();
      });
    },
    clearTreeImage: function () {
      var p = S.prefs;
      if (this._bgUrl) { try { URL.revokeObjectURL(this._bgUrl); } catch (e) {} this._bgUrl = null; }
      p.treeImage = false;
      S.savePrefs();
      U.blobDel('__treebg_' + S.session.userId);
      this.paintTreeImage();
    },

    /** Образец окошка в настройках: те же правила, что и в дереве,
        поэтому видно ровно то, что получится. */
    paintPreview: function () {
      var stage = document.getElementById('stStage');
      if (!stage) return;
      var p = S.prefs, I = global.Icon;
      stage.style.background = (p.treeBg && p.treeBg !== 'auto') ? p.treeBg : 'var(--paper)';
      stage.style.backgroundImage = p.treeGrid
        ? 'radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0)' : '';
      stage.style.backgroundSize = p.treeGrid ? '28px 28px' : '';

      var r = p.card.shape === 'circle' ? Math.round(p.card.h / 2) : p.card.radius;
      var pr = p.card.shape === 'circle' ? '50%' : Math.max(2, p.card.radius - 4) + 'px';
      function node(cls, name, years, gone) {
        var h = '<div class="pv-node ' + cls + (gone ? ' is-gone' : '') + '" style="width:' + p.card.w +
          'px;height:' + p.card.h + 'px;border-radius:' + r + 'px">';
        var withPhoto = p.showPhotos && p.card.photo > 0;
        if (withPhoto) {

            'px;border-radius:' + pr + '">' + I(cls === 'm' ? 'personM' : 'personF') +

          esc(name) + '</div>';
        if (p.showDates) {

        }
        h += '</div>';
        if (gone && !withPhoto) h += '<span class="node-mourn"></span>';
        return h + '</div>';
      }
      // имена в образце строит та же функция, что и в дереве, — иначе образец
      // показывал бы не то, что получится на самом деле
      stage.innerHTML = '<div class="pv-row">' +
        node('f', S.shortName({ given: 'Анна', patronymic: 'Петровна', surname: 'Смирнова' }), '1932', false) +
        node('m', S.shortName({ given: 'Пётр', surname: 'Смирнов' }), '1928 – 1994', true) + '</div>' +
        '<div class="preview-hint">Слева — живой человек, справа — с траурной полосой на углу.</div>';
    },

    /* ============ окна и мелочи ============ */
    /* Окна складываются стопкой: открыть окно поверх настроек и закрыть его —
       значит вернуться к настройкам, а не к дереву. */
    modalStack: [],

    modal: function (title, body, buttons, opts) {
      opts = opts || {};
      var self = this;
      var back = document.getElementById('modalBack');

      // запомнить то, что сейчас открыто, чтобы вернуться к нему
      if (!back.hidden && !opts.replace) {
        var rest = opts.restore || this.autoRestore();
        if (rest) this.modalStack.push({ restore: rest });
      }

      var foot = (buttons || []).map(function (b, i) {
        return '<button class="btn ' + (b.primary ? 'btn-primary' : b.danger ? 'btn-danger' : '') +
          '" data-b="' + i + '">' + esc(b.text) + '</button>';
      }).join('');
      var backLabel = this.modalStack.length ? 'Назад' : 'Закрыть';
      back.innerHTML = '<div class="modal' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' +
        '<div class="modal-head"><h2>' + esc(title) + '</h2>' +
        '<button class="icon-btn" data-close="1" aria-label="' + backLabel + '" title="' + backLabel + '">' +
        global.Icon('close') + '</button></div>' +
        '<div class="modal-body">' + body + '</div>' +
        '<div class="modal-foot">' + foot +
        '<button class="btn" data-close="1">' + backLabel + '</button></div></div>';
      back.hidden = false;
      // обещание окна: что сделать, когда его закроют крестиком
      this._onClose = opts.onClose || null;
      back.querySelectorAll('[data-close]').forEach(function (b) {
        b.addEventListener('click', function () {
          var fn = self._onClose; self._onClose = null;
          self.closeModal();
          if (fn) try { fn(); } catch (e) { console.error(e); }
        });
      });
      back.querySelectorAll('[data-b]').forEach(function (b) {
        b.addEventListener('click', function () { buttons[+b.dataset.b].fn(); });
      });
      this.enhancePasswords(back);
    },

    /** Чем вернуть текущее окно, если поверх него откроют другое.
        Пока это нужно только настройкам — они открываются на выбранной вкладке. */
    autoRestore: function () {
      var back = document.getElementById('modalBack');
      var tab = back.querySelector('#setTabs [data-s][aria-selected="true"]');
      if (!tab) return null;
      var pane = tab.dataset.s, self = this;
      return function () { self.openSettings(pane, true); };
    },

    /** закрыть верхнее окно; если под ним было другое — вернуть его */
    closeModal: function () {
      var prev = this.modalStack.pop();
      if (prev && typeof prev.restore === 'function') { prev.restore(); return; }
      this.closeAllModals();
    },

    /** закрыть всю стопку разом */
    closeAllModals: function () {
      this.modalStack = [];
      var back = document.getElementById('modalBack');
      back.hidden = true;
      back.innerHTML = '';
    },
    confirm: function (title, text, onYes) {
      var self = this;
      this.modal(title, '<p class="note" style="font-size:13px">' + esc(text) + '</p>',
        [{ text: 'Да, продолжить', danger: true, fn: function () { self.closeModal(); onYes(); } }]);
    },
    prompt: function (title, text, value, cb, type) {
      var self = this;
      this.modal(title,
        '<p class="note" style="margin-bottom:10px">' + esc(text) + '</p>' +
        '<input id="pmVal" type="' + (type || 'text') + '" value="' + esc(value || '') + '" ' +
        'style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--paper)">',
        [{ text: 'Готово', primary: true, fn: function () {
          var v = document.getElementById('pmVal').value;
          self.closeModal();
          cb(v);
        } }]);
      setTimeout(function () {
        var el = document.getElementById('pmVal');
        if (!el) return;
        el.focus();
        el.select();
        // Enter подтверждает: тянуться мышкой к кнопке ради одного слова незачем
        el.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter') return;
          e.preventDefault();
          var btn = document.querySelector('#modalBack .modal-foot .btn-primary');
          if (btn) btn.click();
        });
      }, 40);
    },
    /* ============ установка на устройство ============
       Программа ставится как обычное приложение: появляется значок, окно без
       адресной строки, запуск без интернета. Браузер разрешает предложить это
       только один раз и только по нажатию, поэтому событие приходится ловить
       заранее и держать до нажатия кнопки. */
    installReady: null,
    watchInstall: function () {
      var self = this;
      global.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        self.installReady = e;
        self.paintInstall();
      });
      global.addEventListener('appinstalled', function () {
        self.installReady = null;
        try { localStorage.setItem('drevo.installed', '1'); } catch (err) {}
        self.paintInstall();
        self.toast('Готово — программа установлена. Дальше запускайте её со значка.');
      });
      // плашку показываем один раз: навязываться не нужно
      setTimeout(function () { self.offerInstall(); }, 4000);
    },
    isInstalled: function () {
      try {
        if (localStorage.getItem('drevo.installed') === '1') return true;
      } catch (e) {}
      return global.matchMedia && global.matchMedia('(display-mode: standalone)').matches;
    },
    offerInstall: function () {
      if (!this.installReady || this.isInstalled()) return;
      try { if (localStorage.getItem('drevo.installAsked') === '1') return; } catch (e) {}
      var self = this;
      var bar = document.createElement('div');
      bar.className = 'install-bar';
      bar.innerHTML =
        '<span>' + global.Icon('download') + '</span>' +
        '<div><b>Поставить на это устройство?</b><br>' +
        '<span class="note">Появится значок, как у обычного приложения — ' +
        'ссылку больше искать не придётся.</span></div>' +
        '<button class="btn btn-sm btn-primary" id="ibGo">Установить</button>' +
        '<button class="btn btn-sm" id="ibNo">Не сейчас</button>';
      document.body.appendChild(bar);
      function hide() {
        try { localStorage.setItem('drevo.installAsked', '1'); } catch (e) {}
        bar.remove();
      }
      bar.querySelector('#ibNo').addEventListener('click', hide);
      bar.querySelector('#ibGo').addEventListener('click', function () {
        hide();
        self.doInstall();
      });
    },
    doInstall: function () {
      var self = this;
      if (!this.installReady) { this.installHelp(); return; }
      var e = this.installReady;
      this.installReady = null;
      e.prompt();
      e.userChoice.then(function (r) {
        if (r && r.outcome === 'accepted') self.toast('Устанавливаю…');
        self.paintInstall();
      });
    },
    /** Если браузер сам не предлагает — объясняем, где нажать. */
    installHelp: function () {
      var ua = navigator.userAgent;
      var steps;
      if (/iPhone|iPad|iPod/i.test(ua)) {
        steps = '<li>Нажмите «Поделиться» внизу экрана</li>' +
          '<li>Выберите «На экран «Домой»»</li>' +
          '<li>Нажмите «Добавить»</li>';
      } else if (/Android/i.test(ua)) {
        steps = '<li>Откройте меню браузера (три точки справа вверху)</li>' +
          '<li>Выберите «Установить приложение» или «Добавить на главный экран»</li>' +
          '<li>Подтвердите</li>';
      } else {
        steps = '<li>В адресной строке справа нажмите значок установки ' +
          '(монитор со стрелкой)</li>' +
          '<li>Либо меню браузера → «Установить «Семейное Древо»»</li>' +
          '<li>Появится ярлык на рабочем столе и пункт в «Пуске»</li>';
      }
      this.modal('Установка на это устройство',
        '<p class="note">Программа ставится как обычное приложение: свой значок, ' +
        'окно без адресной строки, запуск без интернета.</p>' +
        '<ol class="note" style="margin:10px 0 0 18px;line-height:1.9">' + steps + '</ol>' +
        (location.protocol === 'file:'
          ? '<p class="note" style="color:var(--warn);margin-top:10px">Сейчас программа открыта ' +
            'из файла на диске — так установить нельзя. Откройте её по адресу в интернете.</p>' : ''),
        []);
    },
    paintInstall: function () {
      var box = document.getElementById('abInstall');
      if (!box) return;
      if (this.isInstalled()) {
        box.innerHTML = '<p class="note">Программа уже установлена на это устройство.</p>';
        return;
      }
      box.innerHTML = '<p class="note">Появится значок, как у обычного приложения: ' +
        'запуск без адресной строки и без интернета, ссылку искать не нужно.</p>' +
        '<div class="btn-row"><button class="btn btn-sm btn-primary" id="abInstallGo">' +
        global.Icon('download') + ' Установить</button>' +
        '<button class="btn btn-sm" id="abInstallHelp">Как это сделать вручную</button></div>';
      var self = this;
      box.querySelector('#abInstallGo').addEventListener('click', function () { self.doInstall(); });
      box.querySelector('#abInstallHelp').addEventListener('click', function () { self.installHelp(); });
    },

    /** Спросить про цвет перед сохранением и печатью: на бумаге заливка
        съедает краску, а на экране она нужна. */
    askPlain: function (then) {
      var self = this;
      this.modal('Как сохранить дерево',
        '<p class="note">Цветные окошки и фон хорошо смотрятся на экране, ' +
        'но при печати расходуют много краски.</p>',
        [
          { text: 'Без цвета, для печати', fn: function () { self.closeModal(); then(true); } },
          { text: 'Как на экране', primary: true, fn: function () { self.closeModal(); then(false); } }
        ]);
    },

    /* ============ корзина ============ */
    /** Значок и счётчик в верхней панели. */
    paintTrash: function () {
      var btn = document.getElementById('btnTrash');
      if (!btn) return;
      var n = S.trashList().length;
      btn.innerHTML = global.Icon('trash') +
        '<span class="trash-count" id="trashCount"' + (n ? '' : ' hidden') + '>' + n + '</span>';
      btn.title = n ? 'Корзина: ' + n + ' ' + plural(n, 'запись', 'записи', 'записей') : 'Корзина пуста';
      btn.setAttribute('aria-label', btn.title);
      btn.classList.toggle('has-items', !!n);
    },

    /** Кадр из видео: берём первый кадр, который удалось показать. */
    videoThumb: function (id, fromTrash) {
      var self = this;
      return (fromTrash ? S.trashURL(id) : S.mediaURL(id)).then(function (url) {
        if (!url) return null;
        return new Promise(function (done) {
          var v = document.createElement('video');
          v.muted = true; v.playsInline = true; v.preload = 'metadata';
          var finish = function (res) { done(res); };
          v.addEventListener('loadeddata', function () {
            try {
              var cv = document.createElement('canvas');
              cv.width = 96; cv.height = 96;
              var g = cv.getContext('2d');
              var k = Math.max(96 / v.videoWidth, 96 / v.videoHeight);
              var w = v.videoWidth * k, h = v.videoHeight * k;
              g.drawImage(v, (96 - w) / 2, (96 - h) / 2, w, h);
              finish(cv.toDataURL('image/jpeg', 0.7));
            } catch (e) { finish(null); }
          });
          v.addEventListener('error', function () { finish(null); });
          setTimeout(function () { finish(null); }, 3000);
          v.src = url;
          v.currentTime = 0.1;
        });
      });
    },

    openTrash: function () {
      var self = this;
      var items = S.trashList();
      var body = items.length
        ? '<p class="note" style="margin:0 0 10px">Удалённое лежит здесь, пока его не убрать совсем. ' +
          'Файлы занимают место на устройстве до окончательного удаления.</p>' +
          '<div class="list">' + items.map(function (it) {
            var name = it.what === 'media'
              ? (it.rec.caption || it.rec.name || 'файл')
              : ((it.rec.label || it.rec.title || 'запись') +
                 (it.rec.value ? ': ' + String(it.rec.value).slice(0, 40) : ''));
            var who = S.person(it.personId);
            var thumb = it.what === 'media' && (it.rec.kind === 'photo' || it.rec.kind === 'video')
              ? '<span class="mini-ph trash-thumb" data-thumb="' + esc(it.id) + '">' +
                global.Icon(it.rec.kind === 'video' ? 'play' : 'photo') + '</span>'
              : '<span class="mini-ph">' + global.Icon(it.what === 'media'
                  ? (it.rec.kind === 'audio' ? 'mic' : 'note') : 'note') + '</span>';
            return '<div class="list-item">' + thumb +
              '<div class="li-main"><div>' + esc(name) + '</div>' +
              '<div class="li-sub">' + esc(who ? S.fullName(who) : 'без человека') + ' · удалил ' +
              esc(it.by || '—') + ', ' + new Date(it.at).toLocaleString('ru-RU',
                { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) + '</div></div>' +
              '<button class="btn btn-sm" data-back="' + esc(it.id) + '">Вернуть</button>' +
              '<button class="btn btn-sm btn-danger" data-kill="' + esc(it.id) +
              '" title="Удалить навсегда" aria-label="Удалить навсегда">' + global.Icon('close') + '</button>' +
              '</div>';
          }).join('') + '</div>'
        : '<div class="empty">Корзина пуста.<br>Сюда попадают удалённые файлы и записи — ' +
          'оттуда их можно вернуть.</div>';

      this.modal('Корзина', body,
        items.length ? [{ text: 'Очистить корзину', danger: true, fn: function () {
          self.confirm('Очистить корзину?',
            'Будет стёрто навсегда: ' + items.length + ' ' +
            plural(items.length, 'запись', 'записи', 'записей') + '. Вернуть уже не получится.',
            function () {
              S.emptyTrash();
              self.closeAllModals();
              self.paintTrash();
              self.toast('Корзина очищена');
              if (self.activeTab !== 'tree') self.showTab(self.activeTab);
            });
        } }] : [], { wide: true });

      var back = document.getElementById('modalBack');
      // фотографии и видео показываем эскизами: по названию файла не вспомнишь,
      // что именно удалил
      back.querySelectorAll('[data-thumb]').forEach(function (el) {
        var it = (S.tree.trash || {})[el.dataset.thumb];
        if (!it) return;
        if (it.rec.kind === 'photo') {
          S.trashURL(it.id).then(function (url) {
            if (!url || !el.isConnected) return;
            el.style.backgroundImage = 'url(' + url + ')';
            el.innerHTML = '';
            self._mediaUrls.push(url);
          });
        } else {
          self.videoThumb(it.id, true).then(function (url) {
            if (!url || !el.isConnected) return;
            el.style.backgroundImage = 'url(' + url + ')';
            el.innerHTML = '<span class="thumb-play">' + global.Icon('play') + '</span>';
            self._mediaUrls.push(url);
          });
        }
      });
      back.querySelectorAll('[data-back]').forEach(function (b) {
        b.addEventListener('click', function () {
          S.restoreTrash(b.dataset.back);
          self.closeModal();
          self.paintTrash();
          self.tree.render();
          if (self.sheet && self.sheet.personId) self.sheet.render();
          if (self.activeTab !== 'tree') self.showTab(self.activeTab);
          self.openTrash();
          self.toast('Возвращено');
        });
      });
      back.querySelectorAll('[data-kill]').forEach(function (b) {
        b.addEventListener('click', function () {
          S.purgeTrash(b.dataset.kill);
          self.closeModal();
          self.paintTrash();
          self.openTrash();
        });
      });
    },

    /* ============ откат изменений ============ */
    /** Список точек восстановления. how: session | hour | day | all */
    historyDialog: function (how) {
      var self = this, H = global.History;
      if (!H) return;
      if (!S.isAdmin()) { this.toast('Откат доступен администратору дерева'); return; }
      how = how || 'session';
      var groups = H.grouped(how);
      var modes = [['session', 'По сеансам'], ['hour', 'По часам'], ['day', 'По дням'], ['all', 'Все точки']];

      var body =
        '<div class="sort-bar">' + modes.map(function (m) {
          return '<button class="btn btn-sm" data-how="' + m[0] + '" aria-pressed="' +
            (m[0] === how) + '">' + m[1] + '</button>';
        }).join('') + '</div>' +
        (groups.length ? '' : '<p class="empty">Точек восстановления пока нет. ' +
          'Они появятся сами: перед приёмом чужих правок, перед загрузкой из файла ' +
          'и по ходу работы с деревом.</p>') +
        groups.map(function (g) {
          return (g.head ? '<div class="sect-title">' + esc(g.head) + '</div>' : '') +
            '<div class="list">' + g.items.map(function (r) {
              var d = new Date(r.at);
              return '<div class="list-item">' +
                '<div class="li-main"><div>' +
                d.toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) +
                ' · ' + esc(r.by) + '</div>' +
                '<div class="li-sub">' + esc(r.reason) + ' · ' + r.persons + ' человек, ' +
                r.media + ' файлов</div></div>' +
                '<button class="btn btn-sm" data-see="' + r.id + '">Что изменится</button>' +
                '<button class="btn btn-sm btn-danger" data-del="' + r.id +
                '" title="Убрать точку" aria-label="Убрать точку">' + global.Icon('close') + '</button>' +
                '</div>';
            }).join('') + '</div>';
        }).join('');

      this.modal('Откат изменений', body, [], { wide: true });

      var back = document.getElementById('modalBack');
      back.querySelectorAll('[data-how]').forEach(function (b) {
        b.addEventListener('click', function () { self.closeModal(); self.historyDialog(b.dataset.how); });
      });
      back.querySelectorAll('[data-see]').forEach(function (b) {
        b.addEventListener('click', function () { self.rollbackPreview(b.dataset.see); });
      });
      back.querySelectorAll('[data-del]').forEach(function (b) {
        b.addEventListener('click', function () {
          H.drop(b.dataset.del).then(function () { self.closeModal(); self.historyDialog(how); });
        });
      });
    },

    /** Показать, что именно изменится, и только потом откатывать. */
    rollbackPreview: function (id) {
      var self = this, H = global.History;
      var rec = H.index.filter(function (r) { return r.id === id; })[0];
      H.read(id).then(function (snap) {
        if (!snap) { self.toast('Точка не читается'); return; }
        var d = H.diff(snap);
        var when = rec ? new Date(rec.at).toLocaleString('ru-RU') : '';
        var lines = [];
        if (d.persons.revive) lines.push('вернётся людей: ' + d.persons.revive);
        if (d.persons.back) lines.push('вернутся прежние данные у: ' + d.persons.back);
        if (d.persons.remove) lines.push('исчезнет людей, добавленных позже: ' + d.persons.remove);
        if (d.families.revive || d.families.back || d.families.remove) {
          lines.push('изменится связей: ' +
            (d.families.revive + d.families.back + d.families.remove));
        }
        self.modal('Откат к ' + when,
          (lines.length
            ? '<p class="note">' + lines.join('<br>') + '</p>'
            : '<p class="note">Дерево уже в этом состоянии — откатывать нечего.</p>') +
          (d.names.length
            ? '<div class="sect-title">Кого это коснётся</div><p class="note">' +
              esc(d.names.slice(0, 25).join('; ')) +
              (d.names.length > 25 ? ' и ещё ' + (d.names.length - 25) : '') + '</p>'
            : '') +
          '<p class="note" style="margin-top:10px">Фотографии и документы не пропадут: ' +
          'они хранятся отдельно. Перед откатом программа сохранит нынешнее состояние — ' +
          'если откатили зря, можно вернуться обратно.</p>' +
          (S.sync && S.sync.mode !== 'off'
            ? '<p class="note" style="color:var(--warn)">Откат уйдёт в общее хранилище, ' +
              'то есть применится у всех родственников.</p>' : ''),
          lines.length ? [{ text: 'Откатить', primary: true, fn: function () {
            H.restore(id).then(function () {
              self.closeAllModals();
              self.afterSync();
              self.toast('Дерево возвращено к состоянию на ' + when, 6000);
              if (global.Sync && global.Sync.ready()) global.Sync.run({ media: false });
            }, function (e) { self.toast('Не вышло: ' + e.message); });
          } }] : []);
      });
    },

    /** Самопроверка дерева: показывает то, что иначе замечаешь слишком поздно. */
    selfCheck: function () {
      var out = document.getElementById('abOut');
      if (!out) return;
      out.textContent = 'Проверяю…';
      var t = S.tree, lines = [];
      var media = Object.keys(t.media || {});
      var notUp = media.filter(function (id) { return !t.media[id].uploaded; });
      var orphanFam = 0;
      for (var fid in t.families) {
        var f = t.families[fid];
        if ((f.husb && !t.persons[f.husb]) || (f.wife && !t.persons[f.wife])) orphanFam++;
      }
      var noPhoto = 0;
      S.persons().forEach(function (p) { if (!p.photo) noPhoto++; });

      var missing = [];
      var i = 0;
      function step() {
        if (i >= media.length) return Promise.resolve();
        var id = media[i++];
        return S.util.blobGet(id).then(function (b) { if (!b) missing.push(id); }).then(step);
      }
      step().then(function () {
        lines.push('Людей: ' + S.persons().length + ', связей: ' +
          Object.keys(t.families || {}).length + ', файлов: ' + media.length + '.');
        if (noPhoto) lines.push('Без фотографии: ' + noPhoto + '.');
        if (orphanFam) lines.push('⚠ Связей с исчезнувшими людьми: ' + orphanFam +
          '. Это чинится следующей синхронизацией.');
        if (notUp.length) {
          lines.push('⚠ Не отправлено в общее хранилище файлов: ' + notUp.length +
            '. На других устройствах они не покажутся. Нажмите «Синхронизировать».');
        }
        if (missing.length) {
          lines.push('Файлов нет на этом устройстве: ' + missing.length +
            ' — они подтянутся, когда их откроют, или при синхронизации.');
        }
        if (!notUp.length && !orphanFam && !missing.length) lines.push('Всё на месте.');
        out.innerHTML = lines.map(function (s) { return esc(s); }).join('<br>');
      });
    },

    toast: function (msg, ms) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.hidden = false;
      clearTimeout(this._tt);
      this._tt = setTimeout(function () { t.hidden = true; }, ms || 3200);
    },

    /* ============ демонстрационное дерево ============ */
    seedDemo: function () {
      var t = S.tree;
      function P(sur, giv, pat, sex, b, d, place) {
        var p = U.newPerson({
          surname: sur, given: giv, patronymic: pat, sex: sex,
          birth: { date: b || '', place: place || '', lat: null, lng: null },
          death: { date: d || '', place: '', lat: null, lng: null },
          living: !d
        });
        t.persons[p.id] = p;
        return p;
      }
      function F(h, w, kids, marr) {
        var f = U.newFamily({
          husb: h ? h.id : null, wife: w ? w.id : null,
          children: (kids || []).map(function (k) { return k.id; }),
          marriage: { date: marr || '', place: '', lat: null, lng: null }
        });
        t.families[f.id] = f;
        return f;
      }
      t.meta.name = 'Дерево семьи';

      var grig = P('Булыгин', 'Григорий', '', 'M', '1905', '1968');
      var kalina = P('Монаков', 'Калина', '', 'M', '1902', '1971');
      var monak = P('Монакова', 'Мария', 'Калиновна', 'F', '1908', '1979');

      var nik = P('Булыгин', 'Николай', 'Григорьевич', 'M', '1935-03-14', '1977', 'с. Матур');
      var efr = P('Булыгина', 'Ефросинья', 'Калиновна', 'F', '1931-07-02', '', 'с. Матур');
      efr.maiden = 'Монакова';

      var mih = P('Буйлов', 'Михаил', 'Владимирович', 'M', '1959-11-08', '', 'Красноярский край');
      var alex = P('Буйлова', 'Александра', 'Николаевна', 'F', '1961-07-14', '', 'с. Матур, Красноярский край');
      alex.maiden = 'Булыгина';
      alex.birth.lat = 52.9; alex.birth.lng = 89.6;
      alex.note = 'Хранительница семейного архива.';
      var tat = P('Булыгина', 'Татьяна', 'Николаевна', 'F', '1963-02-20');
      var ser = P('Булыгин', 'Сергей', 'Николаевич', 'M', '1964-09-03');

      var elena = P('Завьялова', 'Елена', 'Александровна', 'F', '1988-05-19');
      elena.maiden = 'Буйлова';
      var igor = P('Завьялов', 'Игорь', '', 'M', '1986');
      var roman = P('Буйлов', 'Роман', 'Михайлович', 'M', '1982-01-11');
      var oleg = P('Буйлов', 'Олег', 'Михайлович', 'M', '1990-06-25');
      var ivan = P('Булыгин', 'Иван', 'Сергеевич', 'M', '1985-04-02');
      var svet = P('Булыгина', 'Светлана', 'Владимировна', 'F', '1981-12-30');
      var alexey = P('Булыгин', 'Алексей', 'Сергеевич', 'M', '1988-08-17');

      F(grig, null, [nik]);
      F(kalina, monak, [efr]);
      F(nik, efr, [alex, tat, ser], '1958-06-12');
      F(mih, alex, [elena, roman, oleg], '1981-09-05');
      F(ivan, svet, []);
      F(ser, null, [ivan, alexey]);
      F(igor, elena, []);

      alex.events.push({
        id: U.uid('e'), type: 'Переезд', date: '1979-08-01', place: 'Абакан',
        lat: 53.72, lng: 91.44, note: 'Поступление в техникум',
        acl: { level: 'public', locked: false }
      });
      nik.death.place = 'с. Матур';
      nik.death.lat = 52.9; nik.death.lng = 89.6;

      t.meta.rootId = alex.id;
      t.meta.demo = true;   // снимется при первой же правке руками
      S.log('add', 'Создано демонстрационное дерево — 16 персон');
      S.save(true);
    }
  };

  function plural(n, one, few, many) {
    var a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  function val(id) { return (document.getElementById(id).value || '').trim(); }
  function err(msg) { document.getElementById('gErr').textContent = msg; }

  global.App = App;
  document.addEventListener('DOMContentLoaded', function () { App.init(); });
})(window);
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (r) {
      r.addEventListener('updatefound', function () {
        var w = r.installing;
        if (w) w.addEventListener('statechange', function () {
          if (w.state === 'installed' && navigator.serviceWorker.controller) w.postMessage('skip-waiting');
        });
      });
      r.update();
    }).catch(function () {});
  });
}
</script>
