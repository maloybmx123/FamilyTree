        p.sex = sx && /^[MF]/.test(sx.val) ? sx.val[0] : 'U';
        var b = kid(r, 'BIRT');
        if (b) {
          p.birth.date = parseGedDate((kid(b, 'DATE') || {}).val);
          p.birth.place = ((kid(b, 'PLAC') || {}).val || '').trim();
        }
        var d = kid(r, 'DEAT');
        if (d) {
          p.death.date = parseGedDate((kid(d, 'DATE') || {}).val);
          p.death.place = ((kid(d, 'PLAC') || {}).val || '').trim();
          p.living = false;
        }
        var note = kid(r, 'NOTE');
        if (note) p.note = note.val;
        kids(r, 'PHON').forEach(function (x) {
          p.fields.push({ id: U.uid('f'), label: 'Телефон', value: x.val, type: 'phone', acl: { level: 'group', locked: false } });
        });
        kids(r, 'EMAIL').forEach(function (x) {
          p.fields.push({ id: U.uid('f'), label: 'Почта', value: x.val, type: 'email', acl: { level: 'group', locked: false } });
        });
        kids(r, 'EVEN').forEach(function (x) {
          p.events.push({
            id: U.uid('e'), type: ((kid(x, 'TYPE') || {}).val) || 'Событие',
            date: parseGedDate((kid(x, 'DATE') || {}).val), place: ((kid(x, 'PLAC') || {}).val || ''),
            note: x.val || '', lat: null, lng: null, acl: { level: 'public', locked: false }
          });
        });
        tree.persons[p.id] = p;
        byXref[r.xref] = p.id;
      }
    });
    recs.forEach(function (r) {
      if (r.tag === 'FAM') {
        var f = U.newFamily();
        var h = kid(r, 'HUSB'), w = kid(r, 'WIFE');
        if (h) f.husb = byXref[(h.val || '').trim()] || null;
        if (w) f.wife = byXref[(w.val || '').trim()] || null;
        kids(r, 'CHIL').forEach(function (c) {
          var id = byXref[(c.val || '').trim()];
          if (id) f.children.push(id);
        });
        var mr = kid(r, 'MARR');
        if (mr) {
          f.marriage.date = parseGedDate((kid(mr, 'DATE') || {}).val);
          f.marriage.place = ((kid(mr, 'PLAC') || {}).val || '');
        }
        if (kid(r, 'DIV')) f.divorced = true;
        tree.families[f.id] = f;
        famXref[r.xref] = f.id;
      }
    });
    var ids = Object.keys(tree.persons);
    tree.meta.rootId = ids[0] || null;
    return tree;
  }

  /* ---------------- импорт обычного текста ----------------
     Поддержаны строки вида:
       Фамилия Имя Отчество | м | 1935-05-12 | 1977 | с. Матур
       + ребёнок: Фамилия Имя Отчество
       = супруг: Фамилия Имя Отчество
     и простой отступ табуляцией — отступ означает «ребёнок предыдущего». */
  function importText(text) {
    var tree = U.emptyTree();
    tree.meta.name = 'Дерево из текста';
    var stack = [];
    String(text).split(/\r?\n/).forEach(function (raw) {
      if (!raw.trim()) return;
      var indent = (raw.match(/^[\t ]*/)[0] || '').replace(/ {2}/g, '\t').length;
      var line = raw.trim();
      var rel = null;
      if (/^[+•-]\s*(ребен|ребён|сын|доч)/i.test(line)) { rel = 'child'; line = line.replace(/^[+•-]\s*\S+\s*:?\s*/i, ''); }
      else if (/^=\s*(супруг|жена|муж)/i.test(line)) { rel = 'spouse'; line = line.replace(/^=\s*\S+\s*:?\s*/i, ''); }
      else if (/^[+•-]\s+/.test(line)) { rel = 'child'; line = line.replace(/^[+•-]\s+/, ''); }

      var cells = line.split(/\s*[|;]\s*/);
      var nameParts = (cells[0] || '').split(/\s+/).filter(Boolean);
      var p = U.newPerson({
        surname: nameParts[0] || '', given: nameParts[1] || '', patronymic: nameParts.slice(2).join(' ')
      });
      for (var i = 1; i < cells.length; i++) {
        var c = cells[i].trim();
        if (/^(м|муж|m|male)$/i.test(c)) p.sex = 'M';
        else if (/^(ж|жен|f|female)$/i.test(c)) p.sex = 'F';
        else if (/^\d{4}([-.\/]\d{1,2}([-.\/]\d{1,2})?)?$/.test(c)) {
          if (!p.birth.date) p.birth.date = norm(c); else { p.death.date = norm(c); p.living = false; }
        } else if (!p.birth.place) p.birth.place = c;
        else p.note = (p.note ? p.note + '\n' : '') + c;
      }
      tree.persons[p.id] = p;
      if (rel === 'spouse' && stack.length) {
        var f = U.newFamily();
        var prev = stack[stack.length - 1].id;
        var pr = tree.persons[prev];
        if (pr.sex === 'F') { f.wife = prev; f.husb = p.id; } else { f.husb = prev; f.wife = p.id; }
        tree.families[f.id] = f;
        return;
      }
      while (stack.length && stack[stack.length - 1].indent >= indent) stack.pop();
      var parent = stack[stack.length - 1];
      if (parent || rel === 'child') {
        var par = parent ? parent.id : null;
        if (par) {
          var fam = null;
          for (var fid in tree.families) {
            var ff = tree.families[fid];
            if (ff.husb === par || ff.wife === par) { fam = ff; break; }

  }

  /* ---------------- SVG дерева ---------------- */
  function exportSVG(treeView) {

      '.f{fill:#fbdfe9;stroke:#e0a0bb}',
      '.u{fill:#ece7dc;stroke:#bdb3a1}',
      '.nm{font:700 12px "PT Sans",Arial,sans-serif;fill:#241f1a}',
      '.yr{font:11px "PT Mono",monospace;fill:#5d554a}',
      '.ln{fill:none;stroke:#bdb3a1;stroke-width:1.5}',
      '.cp{fill:none;stroke:#2f7fb8;stroke-width:2;opacity:.55}',
      '.ttl{font:700 20px "PT Serif",Georgia,serif;fill:#241f1a}',

      '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + (H + 60) + '" viewBox="0 0 ' + W + ' ' + (H + 60) + '">',
      '<style>' + css + '</style>',
      '<rect width="100%" height="100%" fill="#f6f1e6"/>',
      '<text class="ttl" x="30" y="34">' + xml(S.tree.meta.name) + '</text>',
      '<text class="sub" x="30" y="52">Выгружено ' + new Date().toLocaleDateString('ru-RU') +
      ' · персон: ' + S.persons().length + '</text>',
      '<g transform="translate(0,60)">'];

    // линии
    var map = res.map, mode = treeView.mode;
    res.links.forEach(function (L) {
      if (L.kind === 'couple') {
        var a = map[L.a], b = map[L.b];
        if (!a || !b || typeof a !== 'object' || typeof b !== 'object') return;
        var p1 = mode === 'horizontal' ? [a.x + a.w / 2, a.y + a.h] : [a.x + a.w, a.y + a.h / 2];
        var p2 = mode === 'horizontal' ? [b.x + b.w / 2, b.y] : [b.x, b.y + b.h / 2];
        out.push('<path class="cp" d="M' + p1 + ' L' + p2 + '"/>');
      } else {
        var kidc = map[L.to];
        if (!kidc || typeof kidc !== 'object') return;
        var ps = L.from.map(function (id) { return map[id]; }).filter(function (c) { return c && typeof c === 'object'; });
        if (!ps.length) return;
        if (mode === 'horizontal') {
          var cy = ps.reduce(function (s, p) { return s + p.y + p.h / 2; }, 0) / ps.length;
          var sx = Math.max.apply(null, ps.map(function (p) { return p.x + p.w; }));
          var mx = (sx + kidc.x) / 2;
          out.push('<path class="ln" d="M' + sx + ',' + cy + ' H' + mx + ' V' + (kidc.y + kidc.h / 2) + ' H' + kidc.x + '"/>');
        } else {
          var cx = ps.reduce(function (s, p) { return s + p.x + p.w / 2; }, 0) / ps.length;
          var sy = Math.max.apply(null, ps.map(function (p) { return p.y + p.h; }));
          var my = (sy + kidc.y) / 2;
          out.push('<path class="ln" d="M' + cx + ',' + sy + ' V' + my + ' H' + (kidc.x + kidc.w / 2) + ' V' + kidc.y + '"/>');
        }
      }
    });
    // карточки
    var r = S.prefs.card.radius;
    res.cards.forEach(function (c) {
      var cls = c.person.sex === 'M' ? 'm' : c.person.sex === 'F' ? 'f' : 'u';
      out.push('<rect class="n ' + cls + '" x="' + c.x + '" y="' + c.y + '" width="' + c.w + '" height="' + c.h +
        '" rx="' + r + '" ry="' + r + '"/>');
      var tx = c.x + 10, ty = c.y + 20;
      var name = S.shortName(c.person);
      wrap(name, Math.floor((c.w - 18) / 6.6)).forEach(function (ln, i) {
        out.push('<text class="nm" x="' + tx + '" y="' + (ty + i * 14) + '">' + xml(ln) + '</text>');
      });
      var years = S.years(c.person);
      if (years) out.push('<text class="yr" x="' + tx + '" y="' + (c.y + c.h - 9) + '">' + xml(years) + '</text>');
    });
    out.push('</g></svg>');
    return out.join('\n');

    function wrap(s, max) {
      var words = String(s).split(' '), lines = [], cur = '';
      words.forEach(function (w) {
        if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; }
        else cur = (cur ? cur + ' ' : '') + w;

      if (cur) lines.push(cur);
      return lines.slice(0, 3);
    }
  }
  function xml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c];

  }

  /* ---------------- печать / PDF ---------------- */
  function printSVG(svgText) {
    var w = global.open('', '_blank');
    if (!w) return false;
    w.document.write('<!doctype html><meta charset="utf-8"><title>' + xml(S.tree.meta.name) +
      '</title><style>@page{size:auto;margin:8mm}body{margin:0}svg{width:100%;height:auto}</style>' +
      svgText.replace(/^<\?xml[^>]*\?>/, ''));
    w.document.close();
    w.focus();
    setTimeout(function () { try { w.print(); } catch (e) {} }, 400);
    return true;
  }

  /* ---------------- ZIP (без сжатия) ---------------- */
  var CRC = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {

  })();
  function crc32(u8) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;

    var parts = [], central = [], offset = 0;

      var nameBytes = enc.encode(f.name);

      var lh = new Uint8Array(30 + nameBytes.length);
      var dv = new DataView(lh.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true); dv.setUint16(8, 0, true);
      dv.setUint16(10, 0, true); dv.setUint16(12, 0, true);
      dv.setUint32(14, crc, true); dv.setUint32(18, size, true); dv.setUint32(22, size, true);
      dv.setUint16(26, nameBytes.length, true); dv.setUint16(28, 0, true);
      lh.set(nameBytes, 30);
      parts.push(lh, f.data);
      var ch = new Uint8Array(46 + nameBytes.length);
      var cv = new DataView(ch.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true); cv.setUint16(6, 20, true); cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true); cv.setUint16(12, 0, true); cv.setUint16(14, 0, true);
      cv.setUint32(16, crc, true); cv.setUint32(20, size, true); cv.setUint32(24, size, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint32(42, offset, true);
      ch.set(nameBytes, 46);
      central.push(ch);
      offset += lh.length + size;
    });
    var cdSize = central.reduce(function (s, c) { return s + c.length; }, 0);
    var end = new Uint8Array(22);
    var ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
    ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true);

  }

  /* полная резервная копия: GEDCOM + JSON + фото + SVG */
  function fullBackup(treeView, onStep) {
    var enc = new TextEncoder();
    var files = [];
    files.push({ name: 'tree.ged', data: enc.encode(exportGEDCOM()) });
    files.push({ name: 'tree.svg', data: enc.encode(exportSVG(treeView)) });
    files.push({ name: 'drevo.json', data: enc.encode(JSON.stringify(S.tree, null, 1)) });
    files.push({ name: 'ЧИТАТЬ.txt', data: enc.encode(readme()) });

    var media = S.allMedia();
    var i = 0;
    function next() {
      if (i >= media.length) return Promise.resolve();
      var m = media[i++];
      if (onStep) onStep(i, media.length);
      var isPrivate = m.encrypted;
      // приватные файлы кладём как есть — то есть зашифрованными
      var get = isPrivate ? U.blobGet(m.id) : S.mediaBlob(m.id);
      return get.then(function (b) {
        if (!b) return;
        return b.arrayBuffer().then(function (buf) {
          var folder = m.kind === 'photo' ? 'photo' : m.kind === 'audio' ? 'audio' : m.kind === 'video' ? 'video' : 'doc';
          var ext = isPrivate ? '.enc' : '';
          files.push({
            name: folder + '/' + m.id + '_' + safeName(m.name) + ext,
            data: new Uint8Array(buf)

    return next().then(function () { return zip(files); });
  }
  function readme() {
    return [
      'Резервная копия «Семейное Древо»',
      'Создана: ' + new Date().toLocaleString('ru-RU'),
      'Дерево: ' + S.tree.meta.name,
      'Персон: ' + S.persons().length + ', семей: ' + S.families().length + ', файлов: ' + S.allMedia().length,
      '',
      'Что внутри:',
      '  tree.ged      — дерево в формате GEDCOM 5.5.1, открывается любой генеалогической программой',
      '  tree.svg      — схема дерева, открывается браузером, печатается в PDF без потери качества',
      '  drevo.json    — полная копия для возврата в «Семейное Древо» (Настройки → Данные)',
      '  photo/ audio/ video/ doc/ — вложенные файлы',
      '',
      'Файлы с расширением .enc зашифрованы (AES-256-GCM) — это записи,',
      'для которых был включён запрет просмотра. Они открываются только',
      'в «Семейном Древе» после ввода пароля дерева. Без пароля их не прочитать —',
      'в том числе и разработчику программы.'
    ].join('\n');
  }

  /* ---------------- сохранение файла ---------------- */
  function download(blob, filename) {
    try {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
      return true;
    } catch (e) { return false; }
  }

  global.IO = {
    exportGEDCOM: exportGEDCOM, importGEDCOM: importGEDCOM, importText: importText,
    exportSVG: exportSVG, printSVG: printSVG, fullBackup: fullBackup, zip: zip,
    download: download, gedDate: gedDate, xml: xml
  };
})(window);

<script>/* Семейное Древо — синхронизация.

   Дерево у всех родственников общее, поэтому правки сливаются, а не затирают
   друг друга: каждая персона, семья, файл и вкладка живут отдельно и имеют
   время последней правки. При встрече двух копий по каждой записи побеждает
   та, что правилась позже. Удаления помечаются «следами» (tombstones), иначе
   запись, стёртая на телефоне, вернулась бы с компьютера.

   Порядок: забрать общее → слить со своим → отдать обратно → разобраться
   с файлами. Слияние идемпотентно: если чья-то отправка перебила чужую,
   следующая синхронизация вернёт потерянное обратно.

   Три способа хранения общих данных — Supabase, свой сервер, файл в облачном
   диске — отличаются только четырьмя действиями: pull, push, putMedia, getMedia. */
(function (global) {
  'use strict';
  var S = global.Store, U = S.util;

  /* ===================== слияние ===================== */

  function ts(x) { return x ? Date.parse(x) || 0 : 0; }

  /** позже ли a, чем b */
  function newer(a, b) { return ts(a) > ts(b); }

  /** слить два дерева. Возвращает { tree, stats } */
  function merge(local, remote) {
    if (!remote || !remote.persons) return { tree: local, stats: zeroStats() };

    // Человек присоединяется к общему дереву, а у него на устройстве ещё лежит
    // нетронутый образец. Сливать их нельзя — вышли бы двойники.
    if (local.meta && local.meta.demo && Object.keys(remote.persons).length) {
      var taken = JSON.parse(JSON.stringify(remote));
      var zs = zeroStats();
      zs.persons.added = Object.keys(remote.persons).length;
      zs.families.added = Object.keys(remote.families || {}).length;
      zs.media.added = Object.keys(remote.media || {}).length;
      return { tree: taken, stats: zs, replaced: true };
    }

    var out = JSON.parse(JSON.stringify(local));
    var st = zeroStats();

    out.tombstones = out.tombstones || {};
    var rt = remote.tombstones || {};
    for (var tid in rt) {
      if (!out.tombstones[tid] || newer(rt[tid], out.tombstones[tid])) out.tombstones[tid] = rt[tid];
    }
    var graves = out.tombstones;

    /* --- словари записей: персоны, семьи, медиа --- */
    ['persons', 'families', 'media'].forEach(function (kind) {
      out[kind] = out[kind] || {};
      var mine = out[kind], theirs = remote[kind] || {};
      var stampField = kind === 'media' ? 'updated' : 'updated';

      for (var id in theirs) {
        var r = theirs[id], l = mine[id];
        var rStamp = r[stampField] || r.added || r.updated;
        if (graves[id] && !newer(rStamp, graves[id])) continue;      // удалено позже, чем правилось
        if (!l) { mine[id] = r; st[kind].added++; continue; }
        var lStamp = l[stampField] || l.added || l.updated;
        if (newer(rStamp, lStamp)) { mine[id] = r; st[kind].updated++; }
      }
      // применить чужие удаления к своим записям
      for (var id2 in mine) {
        var m = mine[id2];
        var mStamp = m[stampField] || m.added || m.updated;
        if (graves[id2] && !newer(mStamp, graves[id2])) { delete mine[id2]; st[kind].removed++; }
      }
    });

    /* --- вкладки: по id, встроенные не трогаем --- */
    var tabs = {}, order = [];
    (out.tabs || []).concat(remote.tabs || []).forEach(function (t) {
      if (graves[t.id] && !t.builtin && !newer(t.updated, graves[t.id])) return;
      if (!tabs[t.id]) { tabs[t.id] = t; order.push(t.id); }
      else if (newer(t.updated, tabs[t.id].updated)) tabs[t.id] = t;
    });
    out.tabs = order.map(function (id) { return tabs[id]; });

    /* --- журнал изменений: объединение без повторов --- */
    var seen = {}, log = [];
    (out.changes || []).concat(remote.changes || []).forEach(function (c) {
      if (!c || seen[c.id]) return;
      seen[c.id] = 1;
      log.push(c);
    });
    log.sort(function (a, b) { return (b.ts || '').localeCompare(a.ts || ''); });
    out.changes = log.slice(0, 1000);
    st.changes = log.length - (local.changes || []).length;

    /* --- шапка дерева --- */
    // Имя берём у того, кто правил позже; личность дерева (id и соль шифрования)
    // всегда остаётся за общим хранилищем, иначе зашифрованные файлы перестанут открываться.
    if (remote.meta) {
      if (newer(remote.meta.updated, out.meta.updated)) {
        out.meta.name = remote.meta.name;
        if (remote.meta.rootId && out.persons[remote.meta.rootId]) out.meta.rootId = remote.meta.rootId;
      }
      out.meta.id = remote.meta.id || out.meta.id;
      out.meta.salt = remote.meta.salt || out.meta.salt;
      out.meta.updated = newer(remote.meta.updated, out.meta.updated) ? remote.meta.updated : out.meta.updated;
    }
    if (!out.meta.rootId || !out.persons[out.meta.rootId]) {
      out.meta.rootId = Object.keys(out.persons)[0] || null;
    }

    /* --- ссылки, оставшиеся в пустоту --- */
    cleanup(out);
    return { tree: out, stats: st };
  }

  function zeroStats() {
    return {
      persons: { added: 0, updated: 0, removed: 0 },
      families: { added: 0, updated: 0, removed: 0 },
      media: { added: 0, updated: 0, removed: 0 },
      changes: 0

  }

  /** убрать ссылки на исчезнувшие записи */
  function cleanup(t) {
    for (var fid in t.families) {
      var f = t.families[fid];
      if (f.husb && !t.persons[f.husb]) f.husb = null;
      if (f.wife && !t.persons[f.wife]) f.wife = null;
      f.children = (f.children || []).filter(function (c) { return !!t.persons[c]; });
      if (!f.husb && !f.wife && !f.children.length) delete t.families[fid];
    }
    for (var pid in t.persons) {
      var p = t.persons[pid];
      p.media = (p.media || []).filter(function (m) { return !!t.media[m]; });
      if (p.photo && !t.media[p.photo]) p.photo = p.media[0] || null;
    }
    for (var mid in t.media) {
      var m = t.media[mid];
      if (m.personId && !t.persons[m.personId]) delete t.media[mid];
    }
  }

  function statsText(st) {
    var bits = [];
    function part(label, s) {
      var x = [];
      if (s.added) x.push('+' + s.added);
      if (s.updated) x.push('обновлено ' + s.updated);
      if (s.removed) x.push('убрано ' + s.removed);
      if (x.length) bits.push(label + ': ' + x.join(', '));
    }
    part('люди', st.persons);
    part('связи', st.families);
    part('файлы', st.media);
    return bits.length ? bits.join(' · ') : 'изменений нет';
  }

  /* ===================== ZIP для файлового режима ===================== */

  function unzip(buf) {
    var dv = new DataView(buf), u8 = new Uint8Array(buf);
    // найти конец центрального каталога
    var eocd = -1;
    for (var i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) return Promise.reject(new Error('Это не ZIP-файл'));
    var count = dv.getUint16(eocd + 10, true);
    var cdOff = dv.getUint32(eocd + 16, true);
    var dec = new TextDecoder('utf-8');
    var entries = [], p = cdOff;
    for (var n = 0; n < count; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      var method = dv.getUint16(p + 10, true);
      var csize = dv.getUint32(p + 20, true);
      var nameLen = dv.getUint16(p + 28, true);
      var extraLen = dv.getUint16(p + 30, true);
      var cmtLen = dv.getUint16(p + 32, true);
      var lho = dv.getUint32(p + 42, true);
      var name = dec.decode(u8.subarray(p + 46, p + 46 + nameLen));
      var lNameLen = dv.getUint16(lho + 26, true);
      var lExtraLen = dv.getUint16(lho + 28, true);
      var dataAt = lho + 30 + lNameLen + lExtraLen;
      entries.push({ name: name, method: method, data: u8.subarray(dataAt, dataAt + csize) });
      p += 46 + nameLen + extraLen + cmtLen;
    }
    // разжать всё, что сжато
    return Promise.all(entries.map(function (e) {
      if (e.method === 0) return Promise.resolve(e);
      if (!global.DecompressionStream) return Promise.reject(new Error('Браузер не умеет распаковывать этот архив'));
      var ds = new DecompressionStream('deflate-raw');
      return new Response(new Blob([e.data]).stream().pipeThrough(ds)).arrayBuffer()
        .then(function (b) { return { name: e.name, method: 0, data: new Uint8Array(b) }; });
    })).then(function (list) {
      var map = {};
      list.forEach(function (e) { map[e.name] = e.data; });
      return map;
    });
  }

  /* ===================== способы хранения ===================== */

  function httpErr(r, what) {
    return r.text().then(function (t) {
      throw new Error(what + ': ' + r.status + (t ? ' — ' + t.slice(0, 160) : ''));
    });
  }

  var backends = {

    /* ---------- Supabase ---------- */
    supabase: {
      label: 'Supabase',
      needs: ['url', 'key', 'treeId'],
      head: function (cfg) {
        return { apikey: cfg.key, Authorization: 'Bearer ' + cfg.key };
      },
      check: function (cfg) {
        var b = backends.supabase;
        return fetch(b.base(cfg) + '/rest/v1/trees?select=id&limit=1', { headers: b.head(cfg) })
          .then(function (r) {
            if (r.ok) return { ok: true, message: 'Связь есть, таблица найдена' };
            if (r.status === 404) return { ok: false, message: 'Таблица trees не создана — выполните SQL из инструкции' };
            if (r.status === 401 || r.status === 403) return { ok: false, message: 'Ключ не подошёл' };
            return { ok: false, message: 'Ответ сервера: ' + r.status };
          }, function (e) { return { ok: false, message: 'Сервер не отвечает: ' + e.message }; });
      },
      base: function (cfg) { return String(cfg.url || '').replace(/\/+$/, ''); },
      pull: function (cfg) {
        var b = backends.supabase;
        return fetch(b.base(cfg) + '/rest/v1/trees?id=eq.' + encodeURIComponent(cfg.treeId) + '&select=data',
          { headers: b.head(cfg) }).then(function (r) {
            if (!r.ok) return httpErr(r, 'Чтение дерева');
            return r.json();
          }).then(function (rows) { return rows && rows[0] ? rows[0].data : null; });
      },
      push: function (cfg, tree) {
        var b = backends.supabase;
        return fetch(b.base(cfg) + '/rest/v1/trees', {
          method: 'POST',
          headers: Object.assign(b.head(cfg), {
            'Content-Type': 'application/json',
            Prefer: 'resolution=merge-duplicates,return=minimal'
          }),
          body: JSON.stringify({ id: cfg.treeId, data: tree, updated_at: new Date().toISOString() })
        }).then(function (r) { if (!r.ok) return httpErr(r, 'Запись дерева'); });
      },
      putMedia: function (cfg, id, blob) {
        var b = backends.supabase;
        var path = '/storage/v1/object/drevo/' + encodeURIComponent(cfg.treeId) + '/' + encodeURIComponent(id);
        return fetch(b.base(cfg) + path, {
          method: 'POST',
          headers: Object.assign(b.head(cfg), { 'x-upsert': 'true', 'Content-Type': 'application/octet-stream' }),
          body: blob
        }).then(function (r) { if (!r.ok) return httpErr(r, 'Отправка файла'); });
      },
      getMedia: function (cfg, id) {
        var b = backends.supabase;
        var path = '/storage/v1/object/drevo/' + encodeURIComponent(cfg.treeId) + '/' + encodeURIComponent(id);
        return fetch(b.base(cfg) + path, { headers: b.head(cfg) })
          .then(function (r) { return r.ok ? r.blob() : null; });
      }
    },

    /* ---------- свой сервер ---------- */
    server: {
      label: 'Свой сервер',
      needs: ['url', 'key'],
      base: function (cfg) { return String(cfg.url || '').replace(/\/+$/, ''); },
      head: function (cfg) { return { 'X-Drevo-Key': cfg.key }; },
      check: function (cfg) {
        var b = backends.server;
        return fetch(b.base(cfg) + '/api/health', { headers: b.head(cfg) }).then(function (r) {
          if (r.ok) return r.json().then(function (j) {
            return { ok: true, message: 'Сервер отвечает, персон в хранилище: ' + (j.persons != null ? j.persons : '—') };
          });
          if (r.status === 401) return { ok: false, message: 'Ключ доступа не подошёл' };
          return { ok: false, message: 'Ответ сервера: ' + r.status };
        }, function (e) { return { ok: false, message: 'Сервер не отвечает: ' + e.message }; });
      },
      pull: function (cfg) {
        var b = backends.server;
        return fetch(b.base(cfg) + '/api/tree', { headers: b.head(cfg) }).then(function (r) {
          if (r.status === 404) return null;
          if (!r.ok) return httpErr(r, 'Чтение дерева');
          return r.json();
        }).then(function (j) { return j && j.persons ? j : null; });
      },
      push: function (cfg, tree) {
        var b = backends.server;
        return fetch(b.base(cfg) + '/api/tree', {
          method: 'PUT',
          headers: Object.assign(b.head(cfg), { 'Content-Type': 'application/json' }),
          body: JSON.stringify(tree)
        }).then(function (r) { if (!r.ok) return httpErr(r, 'Запись дерева'); });
      },
      putMedia: function (cfg, id, blob) {
        var b = backends.server;
        return fetch(b.base(cfg) + '/api/media/' + encodeURIComponent(id), {
          method: 'PUT',
          headers: Object.assign(b.head(cfg), { 'Content-Type': 'application/octet-stream' }),
          body: blob
        }).then(function (r) { if (!r.ok) return httpErr(r, 'Отправка файла'); });
      },
      getMedia: function (cfg, id) {
        var b = backends.server;
        return fetch(b.base(cfg) + '/api/media/' + encodeURIComponent(id), { headers: b.head(cfg) })
          .then(function (r) { return r.ok ? r.blob() : null; });
      }
    },

    /* ---------- файл в облачном диске ----------
       Работает через File System Access API: программа один раз получает
       разрешение на файл внутри папки Яндекс.Диска или Google Диска,
       дальше читает и пишет его сама. Диск разносит файл по устройствам. */
    file: {
      label: 'Облачный диск',
      needs: [],
      supported: function () {
        return typeof global.showOpenFilePicker === 'function' && typeof global.showSaveFilePicker === 'function';
      },
      handle: null,
      check: function () {
        if (!backends.file.supported()) {
          return Promise.resolve({
            ok: false,
            message: 'Этот браузер не умеет работать с файлом напрямую. На телефоне пользуйтесь обменом через «Данные → Полная копия».'
          });
        }
        if (!backends.file.handle) return Promise.resolve({ ok: false, message: 'Файл не выбран' });
        return backends.file.handle.getFile().then(function (f) {
          return { ok: true, message: 'Файл «' + f.name + '», ' + Math.round(f.size / 1024) + ' КБ' };
        }, function () { return { ok: false, message: 'Файл стал недоступен — выберите заново' }; });
      },
      /** выбрать существующий файл обмена */
      open: function () {
        return global.showOpenFilePicker({
          types: [{ description: 'Семейное Древо', accept: { 'application/zip': ['.drevo', '.zip'] } }],
          multiple: false
        }).then(function (hs) {
          backends.file.handle = hs[0];
          return saveHandle(hs[0]);
        });
      },
      /** создать новый файл обмена */
      create: function (name) {
        return global.showSaveFilePicker({
          suggestedName: (name || 'Семейное Древо') + '.drevo',
          types: [{ description: 'Семейное Древо', accept: { 'application/zip': ['.drevo'] } }]
        }).then(function (h) {
          backends.file.handle = h;
          return saveHandle(h);
        });
      },
      _cache: null,
      pull: function () {
        var b = backends.file;
        if (!b.handle) return Promise.reject(new Error('Файл обмена не выбран'));
        return b.handle.getFile().then(function (f) {
          if (!f.size) { b._cache = {}; return null; }
          return f.arrayBuffer().then(unzip).then(function (map) {
            b._cache = map;
            var j = map['drevo.json'];
            if (!j) return null;
            return JSON.parse(new TextDecoder().decode(j));
          });
        });
      },
      push: function (cfg, tree) {
        var b = backends.file;
        if (!b.handle) return Promise.reject(new Error('Файл обмена не выбран'));
        var files = [{ name: 'drevo.json', data: new TextEncoder().encode(JSON.stringify(tree)) }];
        var pend = b._pending || {};
        // всё, что уже лежало в файле, кроме перезаписанного
        var keep = b._cache || {};
        Object.keys(keep).forEach(function (n) {
          if (n === 'drevo.json') return;
          var id = n.replace(/^media\//, '');
          if (pend[id]) return;
          if (!tree.media[id]) return;                 // файл удалили — не переносим
          files.push({ name: n, data: keep[n] });
        });
        var ids = Object.keys(pend);
        return Promise.all(ids.map(function (id) {
          return pend[id].arrayBuffer().then(function (ab) {
            files.push({ name: 'media/' + id, data: new Uint8Array(ab) });
          });
        })).then(function () {
          var blob = global.IO.zip(files);
          return b.handle.createWritable().then(function (w) {
            return w.write(blob).then(function () { return w.close(); });
          });
        }).then(function () {
          b._pending = {};
          // обновить представление о содержимом файла
          var map = {};
          files.forEach(function (f) { map[f.name] = f.data; });
          b._cache = map;
        });
      },
      putMedia: function (cfg, id, blob) {
        var b = backends.file;
        b._pending = b._pending || {};
        b._pending[id] = blob;
        return Promise.resolve();
      },
      getMedia: function (cfg, id) {
        var b = backends.file;
        var d = b._cache && b._cache['media/' + id];
        return Promise.resolve(d ? new Blob([d]) : null);
      }
    }
  };

  /* запомнить выбранный файл между запусками */
  function saveHandle(h) {
    return U.blobPut('__sync_handle', h).catch(function () {});
  }
  function loadHandle() {
    return U.blobGet('__sync_handle').then(function (h) {
      if (!h || !h.queryPermission) return null;
      return h.queryPermission({ mode: 'readwrite' }).then(function (p) {
        if (p === 'granted') { backends.file.handle = h; return h; }
        return h;         // разрешение спросим при первой записи
      }).catch(function () { return null; });
    }).catch(function () { return null; });
  }

  /* ===================== запуск ===================== */

  var Sync = {
    backends: backends,
    merge: merge,
    unzip: unzip,
    statsText: statsText,
    busy: false,
    listeners: [],

    on: function (fn) { this.listeners.push(fn); },
    emit: function (state) {
      this.listeners.forEach(function (f) { try { f(state); } catch (e) {} });
    },

    cfg: function () {
      var s = S.sync || {};
      return s[s.mode] || {};
    },
    backend: function () {
      var s = S.sync || {};
      return backends[s.mode] || null;
    },
    ready: function () {
      var b = this.backend();
      if (!b) return false;
      if (b === backends.file) return !!backends.file.handle;
      var cfg = this.cfg();
      return b.needs.every(function (k) { return !!String(cfg[k] || '').trim(); });
    },

    restore: function () { return loadHandle(); },

    /** полный проход: забрать → слить → отдать → файлы */
    run: function (opts) {
      opts = opts || {};
      var self = this;
      var b = this.backend(), cfg = this.cfg();
      if (!b) return Promise.reject(new Error('Способ синхронизации не выбран'));
      if (!this.ready()) return Promise.reject(new Error('Синхронизация настроена не до конца'));
      if (this.busy) return Promise.reject(new Error('Синхронизация уже идёт'));

      this.busy = true;
      this.emit({ state: 'run', text: 'Синхронизация…' });
      var report = { pulled: null, stats: null, up: 0, down: 0 };

      return b.pull(cfg)
        .then(function (remote) {
          report.pulled = remote;
          var res = merge(S.tree, remote);
          report.stats = res.stats;
          // сохранить слияние у себя
          S.tree = res.tree;
          S.save(true);
          return b.push(cfg, S.tree);
        })
        .then(function () { return self.syncMedia(b, cfg, opts, report); })
        .then(function () {
          S.sync.lastAt = new Date().toISOString();
          S.sync.lastError = null;
          S.dirty = false;
          S.saveSync();
          self.busy = false;
          var txt = statsText(report.stats) +
            (report.up ? ' · отправлено файлов: ' + report.up : '') +
            (report.down ? ' · получено файлов: ' + report.down : '');
          self.emit({ state: 'ok', text: txt, report: report });
          return report;
        })
        .catch(function (e) {
          self.busy = false;
          S.sync.lastError = e.message;
          S.saveSync();
          self.emit({ state: 'error', text: e.message });
          throw e;
        });
    },

    /** отправить свои новые файлы; забрать чужие, если велено */
    syncMedia: function (b, cfg, opts, report) {
      var self = this;
      var mine = [], theirs = [];
      Object.keys(S.tree.media).forEach(function (id) {
        var m = S.tree.media[id];
        if (!m.uploaded) mine.push(id);
      });

      function upload() {
        if (!mine.length) return Promise.resolve();
        var i = 0;
        function step() {
          if (i >= mine.length) return Promise.resolve();
          var id = mine[i++];
          self.emit({ state: 'run', text: 'Отправка файлов ' + i + ' из ' + mine.length });
          return U.blobGet(id).then(function (blob) {
            if (!blob) { return; }                      // файла нет на этом устройстве
            return b.putMedia(cfg, id, blob).then(function () {
              if (S.tree.media[id]) {
                S.tree.media[id].uploaded = true;
                S.tree.media[id].updated = new Date().toISOString();
              }
              report.up++;
            });
          }).catch(function (e) { console.warn('Файл не ушёл', id, e); }).then(step);
        }
        return step();
      }

      function findMissing() {
        var ids = Object.keys(S.tree.media).filter(function (id) { return S.tree.media[id].uploaded; });
        var i = 0, missing = [];
        function step() {
          if (i >= ids.length) return Promise.resolve(missing);
          var id = ids[i++];
          return U.blobGet(id).then(function (bl) { if (!bl) missing.push(id); }).then(step);
        }
        return step();
      }

      function download(list) {
        if (!list.length) return Promise.resolve();
        var i = 0;
        function step() {
          if (i >= list.length) return Promise.resolve();
          var id = list[i++];
          self.emit({ state: 'run', text: 'Загрузка файлов ' + i + ' из ' + list.length });
          return b.getMedia(cfg, id).then(function (blob) {
            if (blob) return U.blobPut(id, blob).then(function () { report.down++; });
          }).catch(function (e) { console.warn('Файл не пришёл', id, e); }).then(step);
        }
        return step();
      }

      return upload()
        .then(function () { return mine.length ? b.push(cfg, S.tree) : null; })  // отметки «отправлено»
        .then(findMissing)
        .then(function (missing) {
          report.missing = missing.length;
          if (opts.media === false) return null;      // откладываем до открытия файла
          return download(missing);
        })
        .then(function () { S.save(true); });
    },

    /** заглянуть в общее хранилище, ничего не меняя у себя */
    peek: function () {
      var b = this.backend();
      if (!b || !this.ready()) return Promise.resolve(null);
      return b.pull(this.cfg());
    },

    /** отдать своё дерево, не принимая чужого (для «заменить общее моим») */
    pushOnly: function () {
      var self = this, b = this.backend(), cfg = this.cfg();
      if (!b) return Promise.reject(new Error('Способ синхронизации не выбран'));
      this.busy = true;
      this.emit({ state: 'run', text: 'Отправка дерева…' });
      var report = { stats: zeroStats(), up: 0, down: 0 };
      return b.push(cfg, S.tree)
        .then(function () { return self.syncMedia(b, cfg, { media: false }, report); })
        .then(function () {
          S.sync.lastAt = new Date().toISOString();
          S.sync.lastError = null;
          S.dirty = false;
          S.saveSync();
          self.busy = false;
          self.emit({ state: 'ok', text: 'Дерево отправлено', report: report });
          return report;
        })
        .catch(function (e) {
          self.busy = false;
          S.sync.lastError = e.message;
          S.saveSync();
          self.emit({ state: 'error', text: e.message });
          throw e;
        });
    },

    /** подтянуть один файл по требованию — когда его открывают, а локально его нет */
    fetchOne: function (id) {
      var b = this.backend(), cfg = this.cfg();
      var m = S.tree.media[id];
      if (!b || !m || !m.uploaded || !this.ready()) return Promise.resolve(null);
      return b.getMedia(cfg, id).then(function (blob) {
        if (!blob) return null;
        return U.blobPut(id, blob).then(function () { return blob; });
      }).catch(function () { return null; });
    },

    /* автоматический проход по таймеру */
    timer: null,
    schedule: function () {
      var self = this;
      clearInterval(this.timer);
      if (!S.sync || !S.sync.auto || S.sync.mode === 'off') return;
      var every = Math.max(30, S.sync.interval || 120) * 1000;
      this.timer = setInterval(function () {
        if (self.busy || !self.ready()) return;
        if (global.navigator && navigator.onLine === false) return;
        self.run({ media: true }).catch(function () {});
      }, every);
    },
    stop: function () { clearInterval(this.timer); this.timer = null; }
  };

  // дать хранилищу способ подтянуть недостающий файл
  S.fetchRemote = function (id) { return Sync.fetchOne(id); };

  global.Sync = Sync;
})(window);
</script>
<script>/* Семейное Древо — небольшая карта на тайлах OpenStreetMap, без внешних библиотек.
   Показывает места рождения, смерти и событий. */
(function (global) {
  'use strict';

  function MiniMap(host) {
    this.host = host;
    this.z = 4;
    this.cx = 55.75; this.cy = 37.62;     // широта/долгота центра
    this.pins = [];
    this.onPin = function () {};
    this._build();
  }
  var TILE = 256;

  function lon2x(lon, z) { return (lon + 180) / 360 * Math.pow(2, z) * TILE; }
  function lat2y(lat, z) {
    var s = Math.sin(lat * Math.PI / 180);
    return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * Math.pow(2, z) * TILE;
  }
  function x2lon(x, z) { return x / (Math.pow(2, z) * TILE) * 360 - 180; }
  function y2lat(y, z) {
    var n = Math.PI - 2 * Math.PI * y / (Math.pow(2, z) * TILE);
    return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
  }

  MiniMap.prototype._build = function () {
    var self = this;
    this.host.innerHTML =
      '<div class="map-ctl">' +
      '<button class="btn btn-sm" data-z="1" type="button">+</button>' +
      '<button class="btn btn-sm" data-z="-1" type="button">−</button>' +
      '<button class="btn btn-sm" data-fit="1" type="button" title="Показать все">⤢</button>' +
      '</div><div class="map-attr">© OpenStreetMap</div>';
    this.layer = document.createElement('div');
    this.layer.style.cssText = 'position:absolute;inset:0';
    this.host.insertBefore(this.layer, this.host.firstChild);

    this.host.addEventListener('click', function (e) {
      var b = e.target.closest('[data-z]');
      if (b) { self.z = Math.max(2, Math.min(17, self.z + (+b.dataset.z))); self.draw(); }
      if (e.target.closest('[data-fit]')) self.fit();
    });
    var drag = null;
    this.host.addEventListener('pointerdown', function (e) {
      if (e.target.closest('.map-ctl') || e.target.closest('.map-pin')) return;
      drag = { x: e.clientX, y: e.clientY, cx: self.cx, cy: self.cy };
      self.host.setPointerCapture(e.pointerId);
      self.host.classList.add('grabbing');
    });
    this.host.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var z = self.z;
      var px = lon2x(drag.cy, z) - (e.clientX - drag.x);
      var py = lat2y(drag.cx, z) - (e.clientY - drag.y);
      self.cy = x2lon(px, z); self.cx = y2lat(py, z);
      self.draw();
    });
    function end() { drag = null; self.host.classList.remove('grabbing'); }
    this.host.addEventListener('pointerup', end);
    this.host.addEventListener('pointercancel', end);
    this.host.addEventListener('wheel', function (e) {
      e.preventDefault();
      self.z = Math.max(2, Math.min(17, self.z + (e.deltaY < 0 ? 1 : -1)));
      self.draw();
    }, { passive: false });
  };

  MiniMap.prototype.setPins = function (pins) { this.pins = pins || []; this.draw(); };

  MiniMap.prototype.fit = function () {
    if (!this.pins.length) return;
    var la = this.pins.map(function (p) { return p.lat; });
    var lo = this.pins.map(function (p) { return p.lng; });
    var minLa = Math.min.apply(null, la), maxLa = Math.max.apply(null, la);
    var minLo = Math.min.apply(null, lo), maxLo = Math.max.apply(null, lo);
    this.cx = (minLa + maxLa) / 2; this.cy = (minLo + maxLo) / 2;
    var r = this.host.getBoundingClientRect();
    var z = 17;
    while (z > 2) {
      var w = Math.abs(lon2x(maxLo, z) - lon2x(minLo, z));
      var h = Math.abs(lat2y(minLa, z) - lat2y(maxLa, z));
      if (w < r.width * 0.8 && h < r.height * 0.8) break;
      z--;
    }
    this.z = z;
    this.draw();
  };

  MiniMap.prototype.draw = function () {
    var self = this, r = this.host.getBoundingClientRect();
    var W = r.width || 600, H = r.height || 400, z = this.z;
    var px = lon2x(this.cy, z), py = lat2y(this.cx, z);
    var left = px - W / 2, top = py - H / 2;
    var x0 = Math.floor(left / TILE), y0 = Math.floor(top / TILE);
    var x1 = Math.ceil((left + W) / TILE), y1 = Math.ceil((top + H) / TILE);
    var max = Math.pow(2, z);
    var html = '';
    for (var x = x0; x < x1; x++) {
      for (var y = y0; y < y1; y++) {
        if (y < 0 || y >= max) continue;
        var tx = ((x % max) + max) % max;
        html += '<img class="map-tile" alt="" loading="lazy" src="https://tile.openstreetmap.org/' +
          z + '/' + tx + '/' + y + '.png" style="left:' + (x * TILE - left) + 'px;top:' + (y * TILE - top) + 'px">';
      }
    }
    this.pins.forEach(function (p, i) {
      var ppx = lon2x(p.lng, z) - left, ppy = lat2y(p.lat, z) - top;
      if (ppx < -40 || ppy < -40 || ppx > W + 40 || ppy > H + 40) return;
      var cls = p.kind === 'birth' ? 'birth' : p.kind === 'death' ? 'death' : 'event';
      html += '<button type="button" class="map-pin ' + cls + '" data-i="' + i + '" title="' +
        esc((p.label || '') + (p.place ? ' · ' + p.place : '')) + '" style="left:' + ppx + 'px;top:' + ppy + 'px"></button>';
    });
    this.layer.innerHTML = html;
    this.layer.querySelectorAll('.map-pin').forEach(function (b) {
      b.addEventListener('click', function () { self.onPin(self.pins[+b.dataset.i]); });
    });
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  global.MiniMap = MiniMap;
})(window);
</script>
<script>/* Семейное Древо — карточка персоны: сведения, медиа, записи, контакты, события, доступ, родня. */
(function (global) {
  'use strict';

  var ACL_LEVELS = [

  function Sheet(opts) {

  Sheet.prototype.open = function (id) {

  };
  Sheet.prototype.close = function () {
    this.el.hidden = true;
    this.revoke();
    this.personId = null;
  };
  Sheet.prototype.revoke = function () {
    this.urls.forEach(function (u) { try { URL.revokeObjectURL(u); } catch (e) {} });
    this.urls = [];
  };
  Sheet.prototype._bind = function () {
    var self = this;
    this.el.addEventListener('click', function (e) {
      var t = e.target.closest('[data-act]');
      if (!t) return;
      var act = t.dataset.act;
      if (self.actions[act]) { e.preventDefault(); self.actions[act].call(self, t); }
    });
    this.el.addEventListener('change', function (e) {
      var f = e.target.closest('[data-bind]');
      if (f) self.applyField(f);
    });
  };

  /* --------- чтение и запись полей --------- */
  Sheet.prototype.applyField = function (input) {
    var p = S.person(this.personId);
    if (!p) return;
    var path = input.dataset.bind.split('.');
    var val = input.type === 'checkbox' ? input.checked : input.value;
    var o = p;
    for (var i = 0; i < path.length - 1; i++) { o[path[i]] = o[path[i]] || {}; o = o[path[i]]; }
    o[path[path.length - 1]] = val;
    S.updatePerson(p.id, {}, false);
    this.onChange();
    if (path[0] === 'surname' || path[0] === 'given' || path[0] === 'patronymic' || path[0] === 'sex') this.renderHead();
  };

  /* --------- отрисовка --------- */
  Sheet.prototype.render = function () {
    var p = S.person(this.personId);
    if (!p) { this.close(); return; }
    this.revoke();
    var tabs = [
      ['info', 'Сведения'], ['media', 'Фото и файлы'], ['notes', 'Записи'],
      ['contacts', 'Контакты'], ['events', 'События'], ['family', 'Родня'], ['access', 'Доступ']
    ];
    this.el.innerHTML =
      '<div class="sheet-head">' +
      '<div class="sheet-ph" id="shPhoto">👤</div>' +
      '<div style="flex:1 1 auto;min-width:0">' +
      '<div class="sheet-title" id="shName"></div>' +
      '<div class="sheet-sub" id="shSub"></div>' +
      '<div class="btn-row" style="margin-top:6px">' +
      '<button class="btn btn-sm" data-act="focus">В центр дерева</button>' +
      '<button class="btn btn-sm" data-act="addRel">+ Родственник</button>' +
      '</div></div>' +
      '<button class="icon-btn" data-act="close" title="Закрыть">✕</button>' +
      '</div>' +
      '<div class="sheet-tabs" role="tablist">' +
      tabs.map(function (t) {
        return '<button role="tab" data-act="tab" data-tab="' + t[0] + '">' + t[1] + '</button>';
      }).join('') + '</div>' +
      '<div class="sheet-body" id="shBody"></div>';
    this.renderHead();
    this.renderBody();
  };

  Sheet.prototype.renderHead = function () {
    var p = S.person(this.personId), self = this;
    if (!p) return;
    this.el.querySelector('#shName').textContent = S.fullName(p);
    var bits = [];
    if (S.years(p)) bits.push(S.years(p));
    if (p.birth && p.birth.place) bits.push(p.birth.place);
    this.el.querySelector('#shSub').textContent = bits.join(' · ') || 'даты не указаны';
    var ph = this.el.querySelector('#shPhoto');
    ph.style.backgroundImage = '';
    ph.textContent = '👤';
    if (p.photo) {
      S.mediaURL(p.photo).then(function (url) {
        if (!url) return;
        self.urls.push(url);
        ph.style.backgroundImage = 'url(' + url + ')';
        ph.textContent = '';
      });
    }
    this.el.querySelectorAll('[data-act="tab"]').forEach(function (b) {
      b.setAttribute('aria-selected', b.dataset.tab === self.tab ? 'true' : 'false');
    });
  };

  Sheet.prototype.renderBody = function () {

    var body = this.el.querySelector('#shBody');
    body.innerHTML = this.views[this.tab].call(this, p);
    this.after[this.tab] && this.after[this.tab].call(this, p, body);
    var self = this;

      b.setAttribute('aria-selected', b.dataset.tab === self.tab ? 'true' : 'false');

  };

  function micBtn(target) {

  }
  function aclSelect(bindAttr, acl) {

    return '<select data-acl="' + bindAttr + '">' + ACL_LEVELS.map(function (l) {
