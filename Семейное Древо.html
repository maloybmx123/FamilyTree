<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Семейное Древо</title>
<meta name="theme-color" content="#2f7fb8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:wght@400;700&family=PT+Mono&display=swap">
<style>/* Семейное Древо — оформление.
   Композиция: верхняя панель → вкладки → полотно во всю высоту;
   слева выдвижная карточка персоны, справа внизу переключатель вида дерева. */

:root {
  /* бумага и чернила: палитра старого семейного альбома */
  --paper:        #f6f1e6;
  --paper-2:      #fffdf8;
  --ink:          #241f1a;
  --ink-soft:     #5d554a;
  --ink-faint:    #8d8577;
  --line:         #ddd3c0;
  --accent:       #2f7fb8;
  --accent-ink:   #ffffff;
  --male:         #cde6f7;
  --male-edge:    #6aa9d4;
  --female:       #fbd3e2;
  --female-edge:  #dd8fae;
  --neutral:      #ece7dc;
  --neutral-edge: #bdb3a1;
  --good:         #3f7d5a;
  --warn:         #a9741f;
  --bad:          #a4402f;
  --shadow:       0 1px 2px rgba(40,32,20,.14), 0 6px 18px rgba(40,32,20,.08);
  --radius:       10px;

  --font-display: "PT Serif", Georgia, "Times New Roman", serif;
  --font-body:    "PT Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data:    "PT Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --ui-size:      14px;
  --tab-size:     14px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:        #1a1714;
    --paper-2:      #221e1a;
    --ink:          #ece5d9;
    --ink-soft:     #b3a998;
    --ink-faint:    #837a6c;
    --line:         #3a342c;
    --accent:       #5fa8dc;
    --accent-ink:   #10212c;
    --male:         #1d3444;
    --male-edge:    #3f6f93;
    --female:       #3c2230;
    --female-edge:  #8d5570;
    --neutral:      #2a251f;
    --neutral-edge: #4d463c;
    --good:         #6fae89;
    --warn:         #d3a55c;
    --bad:          #d47a68;
    --shadow:       0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper:        #1a1714;
  --paper-2:      #221e1a;
  --ink:          #ece5d9;
  --ink-soft:     #b3a998;
  --ink-faint:    #837a6c;
  --line:         #3a342c;
  --accent:       #5fa8dc;
  --accent-ink:   #10212c;
  --male:         #1d3444;
  --male-edge:    #3f6f93;
  --female:       #3c2230;
  --female-edge:  #8d5570;
  --neutral:      #2a251f;
  --neutral-edge: #4d463c;
  --good:         #6fae89;
  --warn:         #d3a55c;
  --bad:          #d47a68;
  --shadow:       0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--ui-size);
  background: var(--paper);
  color: var(--ink);
  -webkit-text-size-adjust: 100%;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; text-wrap: balance; margin: 0; }
a { color: var(--accent); }

/* ---------- каркас ---------- */
#app { display: flex; flex-direction: column; height: 100%; }

.topbar {
  display: flex; align-items: center; gap: 10px;
  padding-block: 8px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--paper-2);
  border-bottom: 1px solid var(--line);
  flex: 0 0 auto;
}
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand-mark {
  width: 26px; height: 26px; flex: 0 0 auto; border-radius: 7px;
  background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 15px;
}
.brand-name { font-family: var(--font-display); font-size: 16px; font-weight: 700; white-space: nowrap; }
.tree-name {
  font-size: 12px; color: var(--ink-faint); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}

.search-wrap { position: relative; flex: 1 1 auto; max-width: 440px; min-width: 0; }
.search-wrap input {
  width: 100%; padding: 7px 64px 7px 30px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--paper); outline: none;
}
.search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,127,184,.18); }
.search-ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); font-size: 13px; }
.search-mic, .search-clear {
  position: absolute; top: 50%; transform: translateY(-50%);
  border: 0; background: transparent; padding: 4px; border-radius: 50%; line-height: 1; color: var(--ink-faint);
}
.search-mic { right: 6px; }
.search-mic.rec { color: var(--bad); animation: pulse 1.1s infinite; }
.search-clear { right: 32px; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .search-mic.rec { animation: none; } }

.results {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 60;
  background: var(--paper-2); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow); max-height: 60vh; overflow: auto; padding: 4px;
}
.results button {
  display: flex; gap: 10px; align-items: center; width: 100%; text-align: left;
  border: 0; background: transparent; padding: 7px 8px; border-radius: 8px;
}
.results button:hover, .results button:focus-visible { background: var(--neutral); }
.results .r-sub { font-size: 12px; color: var(--ink-faint); }

.topbar-right { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.icon-btn {
  border: 1px solid transparent; background: transparent; color: var(--ink-soft);
  width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 16px;
}
.icon-btn:hover { background: var(--neutral); color: var(--ink); }
.who { font-size: 12px; color: var(--ink-faint); white-space: nowrap; }
.who b { color: var(--ink); font-weight: 700; }

/* ---------- вкладки ---------- */
.tabs {
  display: flex; align-items: stretch; gap: 2px; overflow-x: auto; flex: 0 0 auto;
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  background: var(--paper-2); border-bottom: 1px solid var(--line);
  scrollbar-width: thin;
}
.tabs button {
  border: 0; background: transparent; color: var(--ink-soft);
  padding: 9px 14px; font-size: var(--tab-size); white-space: nowrap;
  border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 6px;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }
.tabs .tab-add { color: var(--ink-faint); font-size: 16px; padding-inline: 10px; }
.tabs .tab-close { font-size: 12px; opacity: .5; }

/* ---------- панели ---------- */
.panes { position: relative; flex: 1 1 auto; min-height: 0; }
.pane { position: absolute; inset: 0; display: none; }
.pane.active { display: block; }
.pane-scroll { position: absolute; inset: 0; overflow: auto;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- полотно дерева ---------- */
#treeHost {
  position: absolute; inset: 0; overflow: hidden; touch-action: none;
  background:
    radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0/28px 28px,
    var(--paper);
  cursor: grab;
}
#treeHost.grabbing { cursor: grabbing; }
#treeCanvas, #treeLines { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#treeLines { pointer-events: none; }
.lnk-parent, .lnk-couple { fill: none; stroke: var(--neutral-edge); stroke-width: 1.5; }
.lnk-couple { stroke: var(--accent); stroke-width: 2; opacity: .55; }

.node {
  position: absolute; display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; background: var(--neutral); border: 1px solid var(--neutral-edge);
  box-shadow: var(--shadow); overflow: hidden; transition: box-shadow .12s, transform .12s;
}
.node:hover { transform: translateY(-1px); box-shadow: 0 2px 4px rgba(40,32,20,.2), 0 10px 24px rgba(40,32,20,.14); }
.node.sex-m { background: var(--male); border-color: var(--male-edge); }
.node.sex-f { background: var(--female); border-color: var(--female-edge); }
.node.is-focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.node-ph {
  flex: 0 0 auto; background: var(--paper-2) center/cover no-repeat;
  border: 1px solid rgba(0,0,0,.08); position: relative;
}
.node-ph:not(.has-img)::after {
  content: "👤"; position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 15px; opacity: .3;
}
.node-txt { min-width: 0; flex: 1 1 auto; }
.node-name { font-weight: 700; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
.node-years { color: var(--ink-soft); font-family: var(--font-data); margin-top: 2px; }
.node-lock { position: absolute; top: 2px; right: 3px; font-size: 10px; opacity: .65; }
.node-plus {
  position: absolute; left: -9px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--good);
  background: var(--paper-2); color: var(--good); font-size: 13px; line-height: 1;
  display: grid; place-items: center; padding: 0; opacity: 0; transition: opacity .12s;
}
.node:hover .node-plus, .node-plus:focus-visible { opacity: 1; }
@media (pointer: coarse) { .node-plus { opacity: .9; } }

/* плавающие кнопки вида дерева — справа внизу */
.viewdock {
  position: absolute; z-index: 30;
  right: calc(12px + env(safe-area-inset-right, 0px));
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 6px; background: var(--paper-2);
  border: 1px solid var(--line); border-radius: 12px; padding: 4px; box-shadow: var(--shadow);
}
.viewdock button {
  border: 0; background: transparent; color: var(--ink-soft);
  padding: 7px 10px; border-radius: 9px; font-size: 13px; display: flex; align-items: center; gap: 5px;
}
.viewdock button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.zoomdock {
  position: absolute; z-index: 30;
  right: calc(12px + env(safe-area-inset-right, 0px));
  bottom: calc(62px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 4px;
}
.zoomdock button {
  width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--paper-2); color: var(--ink-soft); box-shadow: var(--shadow); font-size: 15px;
}

/* ---------- карточка персоны ---------- */
.sheet {
  position: absolute; z-index: 50; background: var(--paper-2);
  border: 1px solid var(--line); box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  left: max(10px, env(safe-area-inset-left, 0px)); top: 10px; bottom: 10px; width: 370px;
  border-radius: 14px; overflow: hidden;
}
.sheet[hidden] { display: none !important; }
@media (max-width: 760px) {
  .sheet { left: 0; right: 0; width: auto; top: auto; height: 76%; border-radius: 16px 16px 0 0; bottom: 0; }
}
.sheet-head {
  display: flex; gap: 10px; align-items: flex-start; padding: 12px;
  border-bottom: 1px solid var(--line); flex: 0 0 auto;
}
.sheet-ph {
  width: 64px; height: 64px; border-radius: 10px; flex: 0 0 auto;
  background: var(--neutral) center/cover no-repeat; border: 1px solid var(--line);
  display: grid; place-items: center; font-size: 24px; color: var(--ink-faint);
}
.sheet-title { font-family: var(--font-display); font-size: 17px; line-height: 1.25; }
.sheet-sub { font-size: 12px; color: var(--ink-faint); margin-top: 3px; font-family: var(--font-data); }
.sheet-body { flex: 1 1 auto; overflow: auto; padding: 12px; }
.sheet-tabs { display: flex; flex-wrap: wrap; gap: 2px 0; padding: 0 10px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
.sheet-tabs button {
  border: 0; background: transparent; color: var(--ink-soft); padding: 8px 10px;
  font-size: 13px; border-bottom: 2px solid transparent; white-space: nowrap;
}
.sheet-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }

.row { display: grid; grid-template-columns: 112px 1fr; gap: 8px; align-items: start; margin-bottom: 8px; }
.row > label { font-size: 12px; color: var(--ink-faint); padding-top: 7px; }
.row input, .row select, .row textarea, .field-val {
  width: 100%; min-width: 0; padding: 6px 8px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--paper); outline: none;
}
.row input:focus, .row select:focus, .row textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,127,184,.16); }
.row textarea { min-height: 70px; resize: vertical; }
.inline { display: flex; gap: 6px; align-items: center; }
.inline > * { min-width: 0; }

.btn {
  border: 1px solid var(--line); background: var(--paper); color: var(--ink);
  padding: 7px 12px; border-radius: 9px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--neutral); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn-primary:hover { filter: brightness(1.07); background: var(--accent); }
.btn-danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn-sm { padding: 4px 8px; font-size: 12px; border-radius: 7px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px;
  border-radius: 999px; background: var(--neutral); font-size: 12px; color: var(--ink-soft);
}
.chip.lock { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }

.sect-title {
  font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--ink-faint); margin: 14px 0 7px;
}
.sect-title:first-child { margin-top: 0; }

.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 7px; }
.media-tile {
  position: relative; aspect-ratio: 1; border-radius: 9px; overflow: hidden;
  border: 1px solid var(--line); background: var(--neutral) center/cover no-repeat;
  display: grid; place-items: center; font-size: 22px; color: var(--ink-faint); padding: 0;
}
.media-tile .m-name {
  position: absolute; inset: auto 0 0 0; background: rgba(0,0,0,.55); color: #fff;
  font-size: 10px; padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.media-tile .m-lock { position: absolute; top: 3px; right: 3px; font-size: 11px; }

.list { display: flex; flex-direction: column; gap: 6px; }
.list-item {
  display: flex; gap: 9px; align-items: center; padding: 8px 10px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--paper);
}
.list-item .li-main { flex: 1 1 auto; min-width: 0; }
.list-item .li-sub { font-size: 12px; color: var(--ink-faint); }
.mini-ph {
  width: 34px; height: 34px; border-radius: 8px; flex: 0 0 auto;
  background: var(--neutral) center/cover no-repeat; display: grid; place-items: center;
  font-size: 15px; color: var(--ink-faint); border: 1px solid var(--line);
}

/* ---------- модальные окна ---------- */
.modal-back {
  position: fixed; inset: 0; z-index: 100; background: rgba(20,14,8,.45);
  display: grid; place-items: center; padding: 16px;
}
.modal-back[hidden] { display: none !important; }
.modal {
  background: var(--paper-2); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: var(--shadow); width: min(520px, 100%); max-height: 88vh;
  display: flex; flex-direction: column; overflow: hidden;
}
.modal-head { padding: 13px 15px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.modal-head h2 { font-size: 16px; flex: 1 1 auto; }
.modal-body { padding: 15px; overflow: auto; }
.modal-foot { padding: 11px 15px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* ---------- экран входа ---------- */
.gate {
  position: fixed; inset: 0; z-index: 200; display: grid; place-items: center;
  background: var(--paper);
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: auto;
}
.gate[hidden] { display: none !important; }
.gate-card {
  width: min(400px, 100%); background: var(--paper-2); border: 1px solid var(--line);
  border-radius: 16px; padding: 22px; box-shadow: var(--shadow);
}
.gate h1 { font-size: 24px; margin-bottom: 4px; }
.gate .lede { color: var(--ink-soft); font-size: 13px; margin: 0 0 18px; line-height: 1.5; }
.gate label { display: block; font-size: 12px; color: var(--ink-faint); margin: 10px 0 4px; }
.gate input {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line);
  border-radius: 9px; background: var(--paper); outline: none;
}
.gate input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,127,184,.18); }
.gate .err { color: var(--bad); font-size: 12px; min-height: 16px; margin-top: 8px; }
.gate .alt { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- фото, изменения, календарь, карта ---------- */
.photo-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 9px; }
.photo-wall .media-tile { aspect-ratio: 4/3; }

.change {
  display: flex; gap: 10px; padding: 9px 11px; border-bottom: 1px solid var(--line); align-items: flex-start;
}
.change:last-child { border-bottom: 0; }
.change .c-dot {
  width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; margin-top: 6px; background: var(--accent);
}
.change.add .c-dot { background: var(--good); }
.change.delete .c-dot { background: var(--bad); }
.change.media .c-dot { background: var(--warn); }
.change .c-meta { font-size: 12px; color: var(--ink-faint); font-family: var(--font-data); }

.cal-day {
  display: flex; gap: 10px; align-items: center; padding: 9px 11px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--paper); margin-bottom: 7px;
}
.cal-when {
  flex: 0 0 auto; width: 62px; text-align: center; font-family: var(--font-data);
  font-size: 12px; color: var(--ink-soft); line-height: 1.3;
}
.cal-when b { display: block; font-size: 17px; color: var(--ink); }
.cal-soon { color: var(--good); font-weight: 700; }

#mapCanvas {
  position: relative; width: 100%; height: 100%; overflow: hidden;
  background: var(--neutral); touch-action: none; cursor: grab;
}
#mapCanvas.grabbing { cursor: grabbing; }
.map-tile { position: absolute; width: 256px; height: 256px; }
.map-pin {
  position: absolute; width: 20px; height: 20px; margin: -20px 0 0 -10px;
  border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
  border: 2px solid var(--paper-2); box-shadow: 0 1px 4px rgba(0,0,0,.4); padding: 0;
}
.map-pin.birth { background: var(--good); }
.map-pin.death { background: var(--ink-soft); }
.map-pin.event { background: var(--warn); }
.map-attr {
  position: absolute; right: 4px; bottom: 2px; font-size: 10px;
  background: rgba(255,255,255,.8); color: #333; padding: 1px 5px; border-radius: 4px;
}
.map-ctl { position: absolute; left: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 5; }

/* ---------- настройки ---------- */
.set-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.set-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--paper-2); }
.set-card h3 { font-size: 14px; margin-bottom: 10px; }
.set-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin-bottom: 9px; font-size: 13px; }
.set-row input[type=range] { width: 120px; }
.set-row output { font-family: var(--font-data); font-size: 12px; color: var(--ink-faint); min-width: 38px; text-align: right; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch { width: 26px; height: 26px; border-radius: 7px; border: 2px solid transparent; padding: 0; }
.swatch[aria-pressed="true"] { border-color: var(--ink); }

.preview-node {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 8px;
  background: var(--male); border: 1px solid var(--male-edge); box-shadow: var(--shadow);
}

.empty { color: var(--ink-faint); font-size: 13px; text-align: center; padding: 34px 16px; line-height: 1.6; }
.toast {
  position: fixed; z-index: 300; left: 50%; transform: translateX(-50%);
  bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--paper); padding: 9px 15px; border-radius: 10px;
  font-size: 13px; box-shadow: var(--shadow); max-width: 90vw;
}
.toast[hidden] { display: none !important; }

.note { font-size: 12px; color: var(--ink-faint); line-height: 1.5; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th, table.data td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.data th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); font-weight: 400; }

/* ---------- узкие экраны ---------- */
@media (max-width: 720px) {
  .brand-name, .tree-name { display: none; }
  .who { display: none; }
  .topbar { gap: 7px; }
  .icon-btn { width: 32px; height: 32px; font-size: 15px; }
  .viewdock button { padding: 7px 9px; font-size: 12px; }
  .viewdock button span { display: none; }
}
@media (max-width: 420px) {
  #btnCalendar, #btnMap { display: none; }
  .viewdock { right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
  .zoomdock { bottom: calc(56px + env(safe-area-inset-bottom, 0px)); right: 8px; }
}

/* ---------- значок синхронизации ---------- */
#btnSync.spin { animation: sync-spin 1.1s linear infinite; color: var(--accent); }
#btnSync.bad { color: var(--warn); }
@keyframes sync-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { #btnSync.spin { animation: none; opacity: .55; } }
.set-card details summary { outline-offset: 3px; }
.set-card ol { margin: 8px 0 0; }
</style>
</head>
<body>


<!-- ввод в программу -->
<div class="gate" id="gate"></div>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">Д</span>
      <span>
        <span class="brand-name">Семейное Древо</span>
        <span class="tree-name" id="treeName"></span>
      </span>
    </div>

    <div class="search-wrap">
      <span class="search-ico" aria-hidden="true">🔍</span>
      <label class="sr" for="q">Поиск по людям и данным</label>
      <input id="q" type="search" placeholder="Имя, место, год, запись…" autocomplete="off">
      <button class="search-clear" id="qClear" type="button" title="Очистить">✕</button>
      <button class="search-mic" id="qMic" type="button" title="Найти голосом">🎙</button>
      <div class="results" id="qResults" hidden></div>
    </div>

    <div class="topbar-right">
      <button class="icon-btn" id="btnSync" type="button" title="Синхронизировать" hidden>⟳</button>
      <button class="icon-btn" id="btnCalendar" type="button" title="Календарь дат">📅</button>
      <button class="icon-btn" id="btnMap" type="button" title="Карта мест">🗺</button>
      <button class="icon-btn" id="btnSettings" type="button" title="Настройки">⚙</button>
      <span class="who" id="who"></span>
      <button class="icon-btn" id="btnLogout" type="button" title="Выйти">⏻</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <main class="panes">
    <!-- дерево -->
    <section class="pane active" id="pane-tree">
      <div id="treeHost">
        <svg id="treeLines" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="treeCanvas"></div>
      </div>
      <div class="zoomdock">
        <button id="zoomIn" type="button" title="Приблизить">+</button>
        <button id="zoomOut" type="button" title="Отдалить">−</button>
        <button id="zoomFit" type="button" title="Вписать всё дерево">⤢</button>
      </div>
      <div class="viewdock" id="viewdock" role="group" aria-label="Вид дерева">
        <button type="button" data-view="vertical" aria-pressed="true" title="Вертикальное дерево">↓<span> Вертикальное</span></button>
        <button type="button" data-view="horizontal" aria-pressed="false" title="Горизонтальное дерево">→<span> Горизонтальное</span></button>
        <button type="button" data-view="butterfly" aria-pressed="false" title="Вид «бабочка»">✦<span> Бабочка</span></button>
      </div>
      <aside class="sheet" id="sheet" hidden></aside>
    </section>

    <section class="pane" id="pane-photos"><div class="pane-scroll"></div></section>
    <section class="pane" id="pane-changes"><div class="pane-scroll"></div></section>
    <section class="pane" id="pane-calendar"><div class="pane-scroll"></div></section>
    <section class="pane" id="pane-people"><div class="pane-scroll"></div></section>
    <section class="pane" id="pane-notes"><div class="pane-scroll"></div></section>
    <section class="pane" id="pane-map"><div id="mapCanvas"></div></section>
  </main>
</div>

<div class="modal-back" id="modalBack" hidden></div>
<div class="toast" id="toast" hidden></div>


<script>/* Семейное Древо — слой данных.
   Дерево и люди общие для всех пользователей; оформление — у каждого своё.
   Медиафайлы лежат в IndexedDB, приватные — в зашифрованном виде (AES-GCM). */
(function (global) {
  'use strict';

  var DB_NAME = 'drevo';
  var DB_VER = 1;
  var LS_TREE = 'drevo.tree';
  var LS_USERS = 'drevo.users';
  var LS_SESSION = 'drevo.session';
  var LS_PREFS = 'drevo.prefs.';
  var LS_DEVICE = 'drevo.device';
  var LS_SYNC = 'drevo.sync';

  /* ---------- маленькие помощники ---------- */
  function uid(prefix) {
    return (prefix || 'x') + '-' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function nowISO() { return new Date().toISOString(); }
  function bytesToB64(buf) {
    var b = new Uint8Array(buf), s = '', i;
    for (i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s);
  }
  function b64ToBytes(s) {
    var bin = atob(s), b = new Uint8Array(bin.length), i;
    for (i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
    return b;
  }

  /* ---------- IndexedDB для медиа ---------- */
  var dbp = null;
  function openDB() {
    if (dbp) return dbp;
    dbp = new Promise(function (res, rej) {
      if (!global.indexedDB) { rej(new Error('IndexedDB недоступна')); return; }
      var rq = indexedDB.open(DB_NAME, DB_VER);
      rq.onupgradeneeded = function (e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs');
      };
      rq.onsuccess = function () { res(rq.result); };
      rq.onerror = function () { rej(rq.error); };
    });
    return dbp;
  }
  function blobPut(key, blob) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction('blobs', 'readwrite');
        tx.objectStore('blobs').put(blob, key);
        tx.oncomplete = function () { res(key); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }
  function blobGet(key) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction('blobs', 'readonly');
        var rq = tx.objectStore('blobs').get(key);
        rq.onsuccess = function () { res(rq.result || null); };
        rq.onerror = function () { rej(rq.error); };
      });
    });
  }
  function blobDel(key) {
    return openDB().then(function (db) {
      return new Promise(function (res) {
        var tx = db.transaction('blobs', 'readwrite');
        tx.objectStore('blobs').delete(key);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { res(); };
      });
    });
  }

  /* ---------- шифрование приватных файлов и записей ---------- */
  var cryptoKey = null;          // CryptoKey текущего дерева
  var subtle = global.crypto && global.crypto.subtle ? global.crypto.subtle : null;

  function deriveKey(passphrase, saltB64) {
    if (!subtle) return Promise.resolve(null);
    var salt = b64ToBytes(saltB64);
    return subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: 200000, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      });
  }
  function encryptBlob(blob) {
    if (!cryptoKey) return Promise.resolve({ blob: blob, enc: false });
    return blob.arrayBuffer().then(function (buf) {
      var iv = crypto.getRandomValues(new Uint8Array(12));
      return subtle.encrypt({ name: 'AES-GCM', iv: iv }, cryptoKey, buf).then(function (ct) {
        var out = new Uint8Array(12 + ct.byteLength);
        out.set(iv, 0); out.set(new Uint8Array(ct), 12);
        return { blob: new Blob([out], { type: 'application/octet-stream' }), enc: true };
      });
    });
  }
  function decryptBlob(blob, mime) {
    if (!cryptoKey) return Promise.reject(new Error('Нет ключа расшифровки'));
    return blob.arrayBuffer().then(function (buf) {
      var all = new Uint8Array(buf);
      var iv = all.slice(0, 12), ct = all.slice(12);
      return subtle.decrypt({ name: 'AES-GCM', iv: iv }, cryptoKey, ct).then(function (pt) {
        return new Blob([pt], { type: mime || 'application/octet-stream' });
      });
    });
  }
  function encryptText(str) {
    if (!cryptoKey) return Promise.resolve(null);
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return subtle.encrypt({ name: 'AES-GCM', iv: iv }, cryptoKey, new TextEncoder().encode(str))
      .then(function (ct) { return bytesToB64(iv) + '.' + bytesToB64(ct); });
  }
  function decryptText(packed) {
    if (!cryptoKey || !packed) return Promise.resolve('');
    var parts = String(packed).split('.');
    if (parts.length !== 2) return Promise.resolve('');
    return subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(parts[0]) }, cryptoKey, b64ToBytes(parts[1]))
      .then(function (pt) { return new TextDecoder().decode(pt); })
      .catch(function () { return ''; });
  }
  function sha256hex(str) {
    if (!subtle) return Promise.resolve('plain:' + str);
    return subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function (b) {
      return Array.prototype.map.call(new Uint8Array(b), function (x) {
        return ('0' + x.toString(16)).slice(-2);
      }).join('');
    });
  }

  /* ---------- структура дерева ---------- */
  function emptyTree() {
    return {
      meta: {
        id: uid('tree'),
        name: 'Моё дерево',
        created: nowISO(),
        salt: bytesToB64(crypto.getRandomValues(new Uint8Array(16))),
        rootId: null,
        version: 1
      },
      persons: {},
      families: {},
      media: {},
      changes: [],
      tabs: [
        { id: 'tree', title: 'Дерево', icon: 'tree', builtin: true },
        { id: 'photos', title: 'Фото', icon: 'photo', builtin: true },
        { id: 'changes', title: 'Изменения', icon: 'clock', builtin: true }
      ],
      /* следы удалённых записей: id -> когда удалили.
         Без них удаление, сделанное на одном устройстве, вернулось бы
         обратно при первой же синхронизации с другого. */
      tombstones: {}
    };
  }

  function newPerson(patch) {
    var p = {
      id: uid('I'),
      sex: 'U',
      surname: '', given: '', patronymic: '', maiden: '',
      birth: { date: '', place: '', lat: null, lng: null },
      death: { date: '', place: '', lat: null, lng: null },
      living: true,
      photo: null,          // id медиа, которое показывается в окошке
      note: '',
      fields: [],           // произвольные строки {id,label,value,type,acl}
      events: [],           // {id,type,date,place,lat,lng,note,acl}
      media: [],            // id медиа
      acl: { level: 'public', locked: false },
      updated: nowISO()
    };
    if (patch) for (var k in patch) p[k] = patch[k];
    return p;
  }

  /** настройки синхронизации; хранятся отдельно от дерева — у каждого устройства свои */
  function defaultSync() {
    return {
      mode: 'off',            // off | supabase | server | file
      auto: true,             // синхронизировать самостоятельно
      interval: 120,          // как часто, секунд
      lastAt: null,           // когда прошла последняя
      lastError: null,
      supabase: { url: '', key: '', treeId: '' },
      server: { url: '', key: '' },
      file: { handleName: '' }
    };
  }

  function newFamily(patch) {
    var f = {
      id: uid('F'), husb: null, wife: null, children: [],
      marriage: { date: '', place: '', lat: null, lng: null },
      divorced: false, updated: nowISO()
    };
    if (patch) for (var k in patch) f[k] = patch[k];
    return f;
  }

  /* ---------- Store ---------- */
  var Store = {
    tree: emptyTree(),
    users: [],
    session: null,
    prefs: null,
    listeners: [],

    on: function (fn) { this.listeners.push(fn); },
    emit: function (what) {
      var self = this;
      this.listeners.forEach(function (fn) { try { fn(what, self); } catch (e) { console.error(e); } });
    },

    /* --- загрузка/сохранение --- */
    load: function () {
      try {
        var raw = localStorage.getItem(LS_TREE);
        if (raw) this.tree = JSON.parse(raw);
      } catch (e) { console.warn('Дерево не прочиталось', e); }
      if (!this.tree || !this.tree.persons) this.tree = emptyTree();
      if (!this.tree.tabs) this.tree.tabs = emptyTree().tabs;
      if (!this.tree.tombstones) this.tree.tombstones = {};
      if (!this.tree.meta.updated) this.tree.meta.updated = nowISO();
      try {
        this.deviceId = localStorage.getItem(LS_DEVICE);
        if (!this.deviceId) {
          this.deviceId = uid('dev');
          localStorage.setItem(LS_DEVICE, this.deviceId);
        }
        this.sync = JSON.parse(localStorage.getItem(LS_SYNC) || 'null') || defaultSync();
      } catch (e) { this.deviceId = uid('dev'); this.sync = defaultSync(); }
      try {
        var u = localStorage.getItem(LS_USERS);
        this.users = u ? JSON.parse(u) : [];
      } catch (e) { this.users = []; }
      try {
        var s = localStorage.getItem(LS_SESSION);
        this.session = s ? JSON.parse(s) : null;
      } catch (e) { this.session = null; }
      return this;
    },
    save: function (silent) {
      this.tree.meta.version = (this.tree.meta.version || 1) + 1;
      this.tree.meta.updated = nowISO();
      // первая же правка руками снимает метку «это образец»
      if (!silent && this.tree.meta.demo) delete this.tree.meta.demo;
      this.dirty = true;
      try { localStorage.setItem(LS_TREE, JSON.stringify(this.tree)); }
      catch (e) { console.error('Не удалось сохранить дерево', e); }
      if (!silent) this.emit('tree');
    },
    saveUsers: function () {
      try { localStorage.setItem(LS_USERS, JSON.stringify(this.users)); } catch (e) {}
    },
    saveSync: function () {
      try { localStorage.setItem(LS_SYNC, JSON.stringify(this.sync)); } catch (e) {}
      this.emit('sync');
    },
    /** пометить запись удалённой, чтобы удаление разошлось по устройствам */
    bury: function (id) {
      this.tree.tombstones = this.tree.tombstones || {};
      this.tree.tombstones[id] = nowISO();
    },
    setSession: function (s) {
      this.session = s;
      try {
        if (s) localStorage.setItem(LS_SESSION, JSON.stringify(s));
        else localStorage.removeItem(LS_SESSION);
      } catch (e) {}
    },

    /* --- настройки оформления (у каждого пользователя свои) --- */
    defaultPrefs: function () {
      return {
        theme: 'auto',
        accent: '#2f7fb8',
        layout: 'vertical',
        card: { w: 168, h: 76, radius: 10, photo: 44, nameSize: 12, dateSize: 11, shape: 'rounded' },
        ui: { fontSize: 14, tabSize: 14 },
        showPhotos: true,
        showDates: true
      };
    },
    loadPrefs: function (userId) {
      var d = this.defaultPrefs();
      try {
        var raw = localStorage.getItem(LS_PREFS + userId);
        if (raw) {
          var p = JSON.parse(raw);
          for (var k in p) {
            if (p[k] && typeof p[k] === 'object' && d[k]) { for (var j in p[k]) d[k][j] = p[k][j]; }
            else d[k] = p[k];
          }
        }
      } catch (e) {}
      this.prefs = d;
      return d;
    },
    savePrefs: function () {
      if (!this.session) return;
      try { localStorage.setItem(LS_PREFS + this.session.userId, JSON.stringify(this.prefs)); } catch (e) {}
      this.emit('prefs');
    },

    /* --- журнал изменений --- */
    log: function (action, summary, targetId) {
      this.tree.changes.unshift({
        id: uid('c'), ts: nowISO(),
        user: this.session ? this.session.displayName : 'система',
        userId: this.session ? this.session.userId : null,
        action: action, summary: summary, target: targetId || null
      });
      if (this.tree.changes.length > 1000) this.tree.changes.length = 1000;
    },

    /* --- персоны --- */
    persons: function () {
      var t = this.tree, out = [];
      for (var id in t.persons) out.push(t.persons[id]);
      return out;
    },
    person: function (id) { return this.tree.persons[id] || null; },
    addPerson: function (patch) {
      var p = newPerson(patch);
      this.tree.persons[p.id] = p;
      if (!this.tree.meta.rootId) this.tree.meta.rootId = p.id;
      this.log('add', 'Добавлена персона: ' + this.fullName(p), p.id);
      this.save();
      return p;
    },
    updatePerson: function (id, patch, quiet) {
      var p = this.tree.persons[id];
      if (!p) return null;
      for (var k in patch) p[k] = patch[k];
      p.updated = nowISO();
      if (!quiet) this.log('edit', 'Изменена карточка: ' + this.fullName(p), id);
      this.save();
      return p;
    },
    removePerson: function (id) {
      var p = this.tree.persons[id];
      if (!p) return;
      var name = this.fullName(p);
      var self = this;
      (p.media || []).forEach(function (mid) { self.removeMedia(mid, true); });
      delete this.tree.persons[id];
      this.bury(id);
      for (var fid in this.tree.families) {
        var f = this.tree.families[fid];
        var hit = false;
        if (f.husb === id) { f.husb = null; hit = true; }
        if (f.wife === id) { f.wife = null; hit = true; }
        if (f.children.indexOf(id) >= 0) {
          f.children = f.children.filter(function (c) { return c !== id; });
          hit = true;
        }
        if (hit) f.updated = nowISO();
        if (!f.husb && !f.wife && !f.children.length) { delete this.tree.families[fid]; this.bury(fid); }
      }
      if (this.tree.meta.rootId === id) {
        var rest = Object.keys(this.tree.persons);
        this.tree.meta.rootId = rest.length ? rest[0] : null;
      }
      this.log('delete', 'Удалена персона: ' + name, null);
      this.save();
    },
    fullName: function (p) {
      if (!p) return '';
      var parts = [p.surname, p.given, p.patronymic].filter(Boolean);
      var n = parts.join(' ').trim();
      return n || 'Без имени';
    },
    shortName: function (p) {
      if (!p) return '';
      var n = [p.given, p.patronymic].filter(Boolean).join(' ');
      return (n + ' ' + (p.surname || '')).trim() || 'Без имени';
    },
    years: function (p) {
      if (!p) return '';
      var b = yr(p.birth && p.birth.date), d = yr(p.death && p.death.date);
      if (b && d) return b + ' – ' + d;
      if (b) return b;
      if (d) return '? – ' + d;
      return '';
    },

    /* --- семьи и связи --- */
    families: function () {
      var out = [];
      for (var id in this.tree.families) out.push(this.tree.families[id]);
      return out;
    },
    family: function (id) { return this.tree.families[id] || null; },
    addFamily: function (patch) {
      var f = newFamily(patch);
      this.tree.families[f.id] = f;
      return f;
    },
    /** семья, где человек — супруг */
    spouseFamilies: function (id) {
      return this.families().filter(function (f) { return f.husb === id || f.wife === id; });
    },
    /** семья, где человек — ребёнок */
    childFamily: function (id) {
      var all = this.families();
      for (var i = 0; i < all.length; i++) if (all[i].children.indexOf(id) >= 0) return all[i];
      return null;
    },
    parentsOf: function (id) {
      var f = this.childFamily(id);
      if (!f) return [];
      return [f.husb, f.wife].filter(Boolean).map(this.person.bind(this)).filter(Boolean);
    },
    childrenOf: function (id) {
      var self = this, out = [];
      this.spouseFamilies(id).forEach(function (f) {
        f.children.forEach(function (c) { if (out.indexOf(c) < 0) out.push(c); });
      });
      return out.map(function (c) { return self.person(c); }).filter(Boolean);
    },
    spousesOf: function (id) {
      var self = this, out = [];
      this.spouseFamilies(id).forEach(function (f) {
        var other = f.husb === id ? f.wife : f.husb;
        if (other && out.indexOf(other) < 0) out.push(other);
      });
      return out.map(function (c) { return self.person(c); }).filter(Boolean);
    },
    siblingsOf: function (id) {
      var f = this.childFamily(id);
      if (!f) return [];
      var self = this;
      return f.children.filter(function (c) { return c !== id; })
        .map(function (c) { return self.person(c); }).filter(Boolean);
    },
    linkChild: function (parentId, childId) {
      var fams = this.spouseFamilies(parentId), f;
      if (fams.length) f = fams[0];
      else {
        var p = this.person(parentId);
        f = this.addFamily(p && p.sex === 'F' ? { wife: parentId } : { husb: parentId });
      }
      if (f.children.indexOf(childId) < 0) f.children.push(childId);
      f.updated = nowISO();
      var old = this.childFamily(childId);
      if (old && old.id !== f.id) {
        old.children = old.children.filter(function (c) { return c !== childId; });
        old.updated = nowISO();
      }
      this.save();
      return f;
    },
    linkSpouse: function (aId, bId) {
      var a = this.person(aId), b = this.person(bId);
      if (!a || !b) return null;
      var fams = this.spouseFamilies(aId);
      var free = fams.filter(function (f) { return !f.husb || !f.wife; })[0];
      var f = free || this.addFamily({});
      if (a.sex === 'F') { f.wife = aId; f.husb = bId; }
      else { f.husb = aId; f.wife = bId; }
      f.updated = nowISO();
      this.save();
      return f;
    },
    linkParent: function (childId, parentId) {
      var f = this.childFamily(childId);
      var p = this.person(parentId);
      if (!f) f = this.addFamily({ children: [childId] });
      if (p && p.sex === 'F') f.wife = parentId; else f.husb = parentId;
      f.updated = nowISO();
      this.save();
      return f;
    },
    unlink: function (aId, bId) {
      var self = this;
      this.families().forEach(function (f) {
        var pair = (f.husb === aId && f.wife === bId) || (f.husb === bId && f.wife === aId);
        var hit = false;
        if (pair) { f.husb = null; f.wife = null; hit = true; }
        if ((f.husb === aId || f.wife === aId) && f.children.indexOf(bId) >= 0) {
          f.children = f.children.filter(function (c) { return c !== bId; }); hit = true;
        }
        if ((f.husb === bId || f.wife === bId) && f.children.indexOf(aId) >= 0) {
          f.children = f.children.filter(function (c) { return c !== aId; }); hit = true;
        }
        if (hit) f.updated = nowISO();
        if (!f.husb && !f.wife && !f.children.length) { delete self.tree.families[f.id]; self.bury(f.id); }
      });
      this.save();
    },

    /* --- медиа --- */
    addMedia: function (personId, file, opts) {
      var self = this;
      opts = opts || {};
      var id = uid('M');
      var acl = opts.acl || { level: 'public', locked: false };
      var isPrivate = acl.locked || acl.level === 'admin' || acl.level === 'owner';
      var step = isPrivate ? encryptBlob(file) : Promise.resolve({ blob: file, enc: false });
      return step.then(function (r) {
        return blobPut(id, r.blob).then(function () {
          var m = {
            id: id, personId: personId, kind: opts.kind || kindOf(file.type, file.name),
            name: file.name || 'файл', mime: file.type || 'application/octet-stream',
            size: file.size || 0, caption: opts.caption || '', date: opts.date || '',
            acl: acl, encrypted: r.enc, added: nowISO(),
            addedBy: self.session ? self.session.displayName : '',
            updated: nowISO(),
            uploaded: false,      // файл ещё не ушёл в общее хранилище
            origin: self.deviceId
          };
          self.tree.media[id] = m;
          var p = self.person(personId);
          if (p) {
            p.media = p.media || [];
            p.media.push(id);
            if (!p.photo && m.kind === 'photo') p.photo = id;
          }
          self.log('media', 'Добавлен файл «' + m.name + '» к ' + self.fullName(p), personId);
          self.save();
          return m;
        });
      });
    },
    removeMedia: function (id, quiet) {
      var m = this.tree.media[id];
      if (!m) return;
      var p = this.person(m.personId);
      if (p) {
        p.media = (p.media || []).filter(function (x) { return x !== id; });
        if (p.photo === id) p.photo = (p.media || []).filter(function (x) {
          return (this.tree.media[x] || {}).kind === 'photo';
        }.bind(this))[0] || null;
      }
      delete this.tree.media[id];
      this.bury(id);
      blobDel(id);
      if (p) p.updated = nowISO();
      if (!quiet) { this.log('media', 'Удалён файл «' + m.name + '»', m.personId); this.save(); }
    },
    mediaOf: function (personId) {
      var t = this.tree, out = [];
      (this.person(personId) || { media: [] }).media.forEach(function (id) {
        if (t.media[id]) out.push(t.media[id]);
      });
      return out;
    },
    allMedia: function () {
      var out = [];
      for (var id in this.tree.media) out.push(this.tree.media[id]);
      return out.sort(function (a, b) { return (b.added || '').localeCompare(a.added || ''); });
    },
    /** достать файл с диска, а если его тут нет — из общего хранилища */
    rawBlob: function (id) {
      var self = this;
      return blobGet(id).then(function (b) {
        if (b) return b;
        if (typeof self.fetchRemote === 'function') return self.fetchRemote(id);
        return null;
      });
    },
    /** URL для показа; расшифровывает приватные файлы на лету */
    mediaURL: function (id) {
      var m = this.tree.media[id];
      if (!m) return Promise.resolve(null);
      if (!this.canSee(m.acl)) return Promise.resolve(null);
      return this.rawBlob(id).then(function (b) {
        if (!b) return null;
        if (!m.encrypted) return URL.createObjectURL(b);
        return decryptBlob(b, m.mime).then(function (d) { return URL.createObjectURL(d); })
          .catch(function () { return null; });
      });
    },
    mediaBlob: function (id) {
      var m = this.tree.media[id];
      if (!m) return Promise.resolve(null);
      return this.rawBlob(id).then(function (b) {
        if (!b) return null;
        if (!m.encrypted) return b;
        return decryptBlob(b, m.mime).catch(function () { return null; });
      });
    },

    /* --- права доступа --- */
    isAdmin: function () { return !!(this.session && this.session.role === 'admin'); },
    canSee: function (acl) {
      if (!acl) return true;
      if (this.isAdmin()) return true;
      if (acl.level === 'admin' || acl.level === 'owner') return false;
      if (acl.level === 'group') return !!this.session;
      return true;
    },
    canEdit: function (acl) {
      if (this.isAdmin()) return true;
      if (!acl) return !!this.session;
      if (acl.locked) return false;
      return acl.level !== 'admin' && acl.level !== 'owner' && !!this.session;
    },

    /* --- пользователи --- */
    createUser: function (login, password, role, displayName) {
      var self = this;
      return sha256hex(password + '::' + login.toLowerCase()).then(function (h) {
        var u = {
          id: uid('U'), login: login.toLowerCase(), hash: h,
          role: role || 'user', displayName: displayName || login,
          created: nowISO(), invite: uid('inv'), active: true, webauthn: null
        };
        self.users.push(u);
        self.saveUsers();
        self.log('user', 'Создан пользователь ' + u.displayName + ' (' + (u.role === 'admin' ? 'администратор' : 'пользователь') + ')');
        self.save();
        return u;
      });
    },
    auth: function (login, password) {
      var self = this;
      var u = this.users.filter(function (x) { return x.login === String(login).toLowerCase(); })[0];
      if (!u) return Promise.resolve(null);
      if (!u.active) return Promise.resolve(null);
      return sha256hex(password + '::' + u.login).then(function (h) {
        return h === u.hash ? u : null;
      });
    },
    unlockCrypto: function (passphrase) {
      var self = this;
      return deriveKey(passphrase + '::' + this.tree.meta.id, this.tree.meta.salt).then(function (k) {
        cryptoKey = k;
        return !!k;
      });
    },
    hasCryptoKey: function () { return !!cryptoKey; },

    /* --- вкладки --- */
    addTab: function (title, kind) {
      var t = {
        id: uid('tab'), title: title, kind: kind || 'notes',
        builtin: false, content: '', updated: nowISO()
      };
      this.tree.tabs.push(t);
      this.log('tab', 'Добавлена вкладка «' + title + '»');
      this.save();
      return t;
    },
    removeTab: function (id) {
      var had = this.tree.tabs.some(function (t) { return t.id === id && !t.builtin; });
      this.tree.tabs = this.tree.tabs.filter(function (t) { return t.id !== id || t.builtin; });
      if (had) this.bury(id);
      this.save();
    },

    /* --- поиск --- */
    search: function (q) {
      q = String(q || '').trim().toLowerCase();
      if (!q) return [];
      var self = this, res = [];
      this.persons().forEach(function (p) {
        var hay = [p.surname, p.given, p.patronymic, p.maiden, p.note,
          p.birth && p.birth.place, p.death && p.death.place,
          p.birth && p.birth.date, p.death && p.death.date].filter(Boolean).join(' ').toLowerCase();
        (p.fields || []).forEach(function (f) {
          if (self.canSee(f.acl)) hay += ' ' + (f.label || '') + ' ' + (f.value || '');
        });
        (p.events || []).forEach(function (e) {
          hay += ' ' + (e.type || '') + ' ' + (e.place || '') + ' ' + (e.note || '');
        });
        var i = hay.indexOf(q);
        if (i >= 0) res.push({ person: p, score: (self.fullName(p).toLowerCase().indexOf(q) === 0 ? 0 : 1) + i / 1000 });
      });
      this.allMedia().forEach(function (m) {
        if (!self.canSee(m.acl)) return;
        var hay = ((m.name || '') + ' ' + (m.caption || '')).toLowerCase();
        if (hay.indexOf(q) >= 0) res.push({ media: m, person: self.person(m.personId), score: 2 });
      });
      return res.sort(function (a, b) { return a.score - b.score; }).slice(0, 60);
    },

    /* --- календарь --- */
    upcoming: function (days) {
      days = days || 60;
      var self = this, today = new Date(), out = [];
      function push(p, kind, dateStr) {
        var d = parseDate(dateStr);
        if (!d || !d.m || !d.d) return;
        var year = today.getFullYear();
        var next = new Date(year, d.m - 1, d.d);
        if (next < new Date(year, today.getMonth(), today.getDate())) next = new Date(year + 1, d.m - 1, d.d);
        var diff = Math.round((next - new Date(year, today.getMonth(), today.getDate())) / 86400000);
        if (diff <= days) out.push({ person: p, kind: kind, date: next, in: diff, age: d.y ? next.getFullYear() - d.y : null });
      }
      this.persons().forEach(function (p) {
        if (p.living !== false && !(p.death && p.death.date)) push(p, 'birth', p.birth && p.birth.date);
        else push(p, 'memory', p.death && p.death.date);
        (p.events || []).forEach(function (e) {
          if (self.canSee(e.acl) && e.date) push(p, e.type || 'event', e.date);
        });
      });
      return out.sort(function (a, b) { return a.in - b.in; });
    },

    /* --- точки для карты --- */
    places: function () {
      var self = this, out = [];
      function add(p, kind, obj) {
        if (!obj || obj.lat == null || obj.lng == null) return;
        out.push({ person: p, kind: kind, lat: +obj.lat, lng: +obj.lng, place: obj.place || '', date: obj.date || '' });
      }
      this.persons().forEach(function (p) {
        add(p, 'birth', p.birth);
        add(p, 'death', p.death);
        (p.events || []).forEach(function (e) { if (self.canSee(e.acl)) add(p, e.type || 'event', e); });
      });
      return out;
    }
  };

  function kindOf(mime, name) {
    mime = mime || ''; name = (name || '').toLowerCase();
    if (mime.indexOf('image/') === 0) return 'photo';
    if (mime.indexOf('audio/') === 0) return 'audio';
    if (mime.indexOf('video/') === 0) return 'video';
    if (/\.(jpg|jpeg|png|gif|webp|heic)$/.test(name)) return 'photo';
    if (/\.(mp3|m4a|ogg|wav|opus)$/.test(name)) return 'audio';
    if (/\.(mp4|mov|webm|avi)$/.test(name)) return 'video';
    return 'doc';
  }

  function yr(s) {
    if (!s) return '';
    var m = String(s).match(/(\d{4})/);
    return m ? m[1] : '';
  }
  function parseDate(s) {
    if (!s) return null;
    s = String(s).trim();
    var m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return { y: +m[1], m: +m[2], d: +m[3] };
    m = s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/);
    if (m) return { y: +m[3], m: +m[2], d: +m[1] };
    m = s.match(/^(\d{4})$/);
    if (m) return { y: +m[1], m: 0, d: 0 };
    var d = new Date(s);
    if (!isNaN(d)) return { y: d.getFullYear(), m: d.getMonth() + 1, d: d.getDate() };
    return null;
  }
  function formatDate(s) {
    var d = parseDate(s);
    if (!d) return s || '';
    if (!d.m || !d.d) return String(d.y);
    var mon = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
    return d.d + ' ' + mon[d.m - 1] + ' ' + d.y;
  }

  Store.util = {
    uid: uid, clone: clone, nowISO: nowISO, parseDate: parseDate, formatDate: formatDate,
    yr: yr, kindOf: kindOf, sha256hex: sha256hex,
    encryptText: encryptText, decryptText: decryptText,
    encryptBlob: encryptBlob, decryptBlob: decryptBlob,
    blobPut: blobPut, blobGet: blobGet, blobDel: blobDel,
    newPerson: newPerson, newFamily: newFamily, emptyTree: emptyTree,
    defaultSync: defaultSync,
    bytesToB64: bytesToB64, b64ToBytes: b64ToBytes
  };

  global.Store = Store;
})(window);
</script>
<script>/* Семейное Древо — раскладка и отрисовка дерева.
   Три вида: вертикальный, горизонтальный, «бабочка».
   Расчёт идёт в абстрактных координатах (поколение × позиция),
   затем переводится в пиксели по выбранному виду. */
(function (global) {
  'use strict';

  var S = global.Store;

  function Tree(opts) {
    this.host = opts.host;                 // контейнер со скроллом
    this.canvas = opts.canvas;             // слой с карточками
    this.svg = opts.svg;                   // слой с линиями
    this.focusId = null;
    this.mode = 'vertical';
    this.up = 3;                           // поколений вверх
    this.down = 3;                         // поколений вниз
    this.scale = 1;
    this.tx = 0; this.ty = 0;
    this.onSelect = opts.onSelect || function () {};
    this.onAdd = opts.onAdd || function () {};
    this.cards = [];
    this.links = [];
    this._bindPanZoom();
  }

  Tree.prototype.setFocus = function (id) { this.focusId = id; this.render(true); };
  Tree.prototype.setMode = function (m) { this.mode = m; this.render(true); };

  /* ---------------- раскладка ---------------- */
  Tree.prototype.compute = function () {
    var self = this, prefs = S.prefs;
    var CW = prefs.card.w, CH = prefs.card.h;
    var mode = this.mode;

    // шаг вдоль оси «братья-сёстры» и шаг между поколениями
    var SLOT, LEVEL;
    if (mode === 'horizontal') { SLOT = CH + 22; LEVEL = CW + 110; }
    else { SLOT = CW + 26; LEVEL = CH + 78; }
    var MATE = (mode === 'horizontal') ? CH + 10 : CW + 12;  // шаг внутри пары супругов

    var cards = [], links = [];
    var focus = S.person(this.focusId);
    if (!focus) return { cards: [], links: [], w: 0, h: 0 };

    var placed = {};           // personId -> card
    var cursor = { v: 0 };

    function unitOf(personId) {
      var u = [personId];
      S.spousesOf(personId).forEach(function (sp) {
        if (u.indexOf(sp.id) < 0 && !placed[sp.id]) u.push(sp.id);
      });
      return u;
    }
    function unitSize(u) { return u.length * MATE - (MATE - SLOT); }

    function addCard(personId, gen, pos, role) {
      var p = S.person(personId);
      if (!p) return null;
      var c = { id: personId, person: p, gen: gen, pos: pos, role: role || 'blood' };
      cards.push(c); placed[personId] = c;
      return c;
    }

    /* потомки: раскладываем пару и её детей */
    function descend(unit, gen, depth) {
      unit.forEach(function (pid) { placed[pid] = 'res'; });   // занимаем места, чтобы супруга не забрали дважды
      var start = cards.length;
      var uw = unitSize(unit);

      var kids = [];
      if (depth > 0) {
        var seen = {};
        unit.forEach(function (pid) {
          S.childrenOf(pid).forEach(function (ch) {
            if (!seen[ch.id] && !placed[ch.id]) { seen[ch.id] = 1; kids.push(ch.id); }
          });
        });
      }

      var centers = [];
      kids.forEach(function (kid) {
        if (placed[kid]) return;
        centers.push(descend(unitOf(kid), gen + 1, depth - 1));
      });

      var center;
      if (!centers.length) {
        center = cursor.v + uw / 2;
        cursor.v += uw + SLOT * 0.2;
      } else {
        var span = centers[centers.length - 1] - centers[0];
        center = centers[0] + span / 2;
        if (uw > span + SLOT) {                                 // пара шире, чем её дети
          var delta = (uw - span - SLOT) / 2;
          for (var i = start; i < cards.length; i++) cards[i].pos += delta;
          center += delta;
          cursor.v += delta;
        }
      }

      var left = center - uw / 2;
      unit.forEach(function (pid, i) {
        addCard(pid, gen, left + i * MATE, i === 0 ? 'blood' : 'spouse');
      });
      if (unit.length > 1) links.push({ kind: 'couple', a: unit[0], b: unit[1] });
      kids.forEach(function (kid) {
        if (placed[kid] && placed[kid] !== 'res') links.push({ kind: 'parent', from: unit, to: kid });
      });
      return center;
    }

    /* предки: пирамида над человеком */
    function ancWidth(pid, depth) {
      if (!pid || depth <= 0) return SLOT;
      var par = S.parentsOf(pid);
      if (!par.length) return SLOT;
      var w = 0;
      par.forEach(function (p) { w += ancWidth(p.id, depth - 1); });
      return Math.max(SLOT, w);
    }
    function ascend(pid, centerPos, gen, depth, wing) {
      if (depth <= 0) return;
      var par = S.parentsOf(pid);
      if (!par.length) return;
      var widths = par.map(function (p) { return ancWidth(p.id, depth - 1); });
      var total = widths.reduce(function (a, b) { return a + b; }, 0);
      var x = centerPos - total / 2;
      par.forEach(function (p, i) {
        var c = x + widths[i] / 2;
        x += widths[i];
        if (placed[p.id]) { links.push({ kind: 'parent', from: [p.id], to: pid }); return; }
        var w2 = wing;
        if (w2 === 0) w2 = (p.sex === 'F' ? 1 : -1);
        var bias = (mode === 'butterfly') ? w2 * SLOT * 0.9 * (self.up - depth + 1) : 0;
        addCard(p.id, gen, c - SLOT / 2 + bias, 'blood');
        links.push({ kind: 'parent', from: [p.id], to: pid });
        ascend(p.id, c + bias, gen - 1, depth - 1, w2);
      });
      if (par.length === 2 && placed[par[0].id] && placed[par[1].id]) {
        links.push({ kind: 'couple', a: par[0].id, b: par[1].id });
      }
    }

    /* старт: опора — родительская пара фокуса (тогда видны братья и сёстры) */
    var pivotFam = S.childFamily(focus.id);
    var rootUnit;
    if (pivotFam && (pivotFam.husb || pivotFam.wife)) {
      rootUnit = [pivotFam.husb, pivotFam.wife].filter(Boolean);
      descend(rootUnit, -1, this.down + 1);
    } else {
      rootUnit = unitOf(focus.id);
      descend(rootUnit, 0, this.down);
    }

    // предки над каждым членом опорной пары
    rootUnit.forEach(function (pid) {
      var c = placed[pid];
      if (!c) return;
      ascend(pid, c.pos + SLOT / 2, c.gen - 1, self.up, 0);
    });

    // развести предков, которые наехали друг на друга
    var byGen = {};
    cards.forEach(function (c) { (byGen[c.gen] = byGen[c.gen] || []).push(c); });
    Object.keys(byGen).forEach(function (g) {
      if (+g >= 0) return;
      var row = byGen[g].sort(function (a, b) { return a.pos - b.pos; });
      for (var i = 1; i < row.length; i++) {
        var need = row[i - 1].pos + SLOT * 0.96;
        if (row[i].pos < need) row[i].pos = need;
      }
    });

    /* перевод в пиксели */
    var minPos = Infinity, maxPos = -Infinity, minGen = Infinity, maxGen = -Infinity;
    cards.forEach(function (c) {
      minPos = Math.min(minPos, c.pos); maxPos = Math.max(maxPos, c.pos);
      minGen = Math.min(minGen, c.gen); maxGen = Math.max(maxGen, c.gen);
    });
    var PAD = 60;
    cards.forEach(function (c) {
      var p = c.pos - minPos, g = c.gen - minGen;
      if (mode === 'horizontal') { c.x = PAD + g * LEVEL; c.y = PAD + p; }
      else { c.x = PAD + p; c.y = PAD + g * LEVEL; }
      c.w = CW; c.h = CH;
    });

    var w = PAD * 2 + (mode === 'horizontal' ? (maxGen - minGen) * LEVEL + CW : (maxPos - minPos) + CW);
    var h = PAD * 2 + (mode === 'horizontal' ? (maxPos - minPos) + CH : (maxGen - minGen) * LEVEL + CH);

    return { cards: cards, links: links, w: w, h: h, map: placed };
  };

  /* ---------------- отрисовка ---------------- */
  Tree.prototype.render = function (recenter) {
    var self = this;
    var res = this.compute();
    this.cards = res.cards; this.links = res.links;
    var prefs = S.prefs;

    this.canvas.style.width = res.w + 'px';
    this.canvas.style.height = res.h + 'px';
    this.svg.setAttribute('width', res.w);
    this.svg.setAttribute('height', res.h);
    this.svg.setAttribute('viewBox', '0 0 ' + res.w + ' ' + res.h);

    // линии
    var paths = [], map = res.map;
    function anchor(c, side) {
      var horiz = self.mode === 'horizontal';
      if (horiz) {
        if (side === 'out') return { x: c.x + c.w, y: c.y + c.h / 2 };
        if (side === 'in') return { x: c.x, y: c.y + c.h / 2 };
        return { x: c.x + c.w / 2, y: c.y + c.h };
      }
      if (side === 'out') return { x: c.x + c.w / 2, y: c.y + c.h };
      if (side === 'in') return { x: c.x + c.w / 2, y: c.y };
      return { x: c.x + c.w, y: c.y + c.h / 2 };
    }
    res.links.forEach(function (L) {
      if (L.kind === 'couple') {
        var a = map[L.a], b = map[L.b];
        if (!a || !b || typeof a !== 'object' || typeof b !== 'object') return;
        var horiz = self.mode === 'horizontal';
        var p1 = horiz ? { x: a.x + a.w / 2, y: a.y + a.h } : { x: a.x + a.w, y: a.y + a.h / 2 };
        var p2 = horiz ? { x: b.x + b.w / 2, y: b.y } : { x: b.x, y: b.y + b.h / 2 };
        paths.push({ d: 'M' + p1.x + ',' + p1.y + ' L' + p2.x + ',' + p2.y, cls: 'lnk-couple' });
      } else if (L.kind === 'parent') {
        var kid = map[L.to];
        if (!kid || typeof kid !== 'object') return;
        var ps = L.from.map(function (id) { return map[id]; }).filter(function (c) { return c && typeof c === 'object'; });
        if (!ps.length) return;
        var horiz = self.mode === 'horizontal';
        var cx, cy;
        if (ps.length === 2) {
          cx = (ps[0].x + ps[0].w / 2 + ps[1].x + ps[1].w / 2) / 2;
          cy = (ps[0].y + ps[0].h / 2 + ps[1].y + ps[1].h / 2) / 2;
        } else { cx = ps[0].x + ps[0].w / 2; cy = ps[0].y + ps[0].h / 2; }
        if (horiz) {
          var sx = Math.max.apply(null, ps.map(function (p) { return p.x + p.w; }));
          var mx = (sx + kid.x) / 2;
          paths.push({ d: 'M' + sx + ',' + cy + ' H' + mx + ' V' + (kid.y + kid.h / 2) + ' H' + kid.x, cls: 'lnk-parent' });
        } else {
          var sy = Math.max.apply(null, ps.map(function (p) { return p.y + p.h; }));
          var my = (sy + kid.y) / 2;
          paths.push({ d: 'M' + cx + ',' + sy + ' V' + my + ' H' + (kid.x + kid.w / 2) + ' V' + kid.y, cls: 'lnk-parent' });
        }
      }
    });
    this.svg.innerHTML = paths.map(function (p) {
      return '<path d="' + p.d + '" class="' + p.cls + '"/>';
    }).join('');

    // карточки
    var frag = document.createDocumentFragment();
    res.cards.forEach(function (c) { frag.appendChild(self.cardEl(c)); });
    this.canvas.innerHTML = '';
    this.canvas.appendChild(frag);

    this.applyTransform();
    if (recenter) this.centerOn(this.focusId);
  };

  Tree.prototype.cardEl = function (c) {
    var self = this, p = c.person, prefs = S.prefs;
    var el = document.createElement('div');
    el.className = 'node sex-' + (p.sex || 'U').toLowerCase() + (p.id === this.focusId ? ' is-focus' : '');
    el.style.left = c.x + 'px';
    el.style.top = c.y + 'px';
    el.style.width = c.w + 'px';
    el.style.height = c.h + 'px';
    el.style.borderRadius = (prefs.card.shape === 'circle' ? Math.round(c.h / 2) : prefs.card.radius) + 'px';
    el.dataset.id = p.id;

    var html = '';
    if (prefs.showPhotos) {
      html += '<div class="node-ph" style="width:' + prefs.card.photo + 'px;height:' + prefs.card.photo + 'px;border-radius:' +
        (prefs.card.shape === 'circle' ? '50%' : Math.max(2, prefs.card.radius - 4) + 'px') + '"></div>';
    }
    html += '<div class="node-txt"><div class="node-name" style="font-size:' + prefs.card.nameSize + 'px">' +
      esc(S.shortName(p)) + '</div>';
    if (prefs.showDates) {
      html += '<div class="node-years" style="font-size:' + prefs.card.dateSize + 'px">' + esc(S.years(p)) + '</div>';
    }
    html += '</div>';
    if (p.acl && (p.acl.locked || p.acl.level !== 'public')) html += '<span class="node-lock" title="Ограниченный доступ">🔒</span>';
    el.innerHTML = html;

    // кнопка «добавить родственника»
    var plus = document.createElement('button');
    plus.className = 'node-plus';
    plus.type = 'button';
    plus.textContent = '+';
    plus.title = 'Добавить родственника';
    plus.addEventListener('click', function (e) { e.stopPropagation(); self.onAdd(p.id, plus); });
    el.appendChild(plus);

    el.addEventListener('click', function () { self.onSelect(p.id); });
    el.addEventListener('dblclick', function () { self.setFocus(p.id); });

    if (prefs.showPhotos && p.photo) {
      S.mediaURL(p.photo).then(function (url) {
        var ph = el.querySelector('.node-ph');
        if (url && ph) { ph.style.backgroundImage = 'url(' + url + ')'; ph.classList.add('has-img'); }
      });
    }
    return el;
  };

  /* ---------------- масштаб и перетаскивание ---------------- */
  Tree.prototype.applyTransform = function () {
    var t = 'translate(' + this.tx + 'px,' + this.ty + 'px) scale(' + this.scale + ')';
    this.canvas.style.transform = t;
    this.svg.style.transform = t;
  };
  Tree.prototype.zoom = function (factor, cx, cy) {
    var rect = this.host.getBoundingClientRect();
    cx = cx == null ? rect.width / 2 : cx;
    cy = cy == null ? rect.height / 2 : cy;
    var ns = Math.min(2.5, Math.max(0.2, this.scale * factor));
    var k = ns / this.scale;
    this.tx = cx - k * (cx - this.tx);
    this.ty = cy - k * (cy - this.ty);
    this.scale = ns;
    this.applyTransform();
  };
  /* keepReadable: если всё дерево пришлось бы ужать до нечитаемого размера,
     показываем ближний круг выбранного человека — родителей, супругов, детей */
  Tree.prototype.fit = function (keepReadable) {
    var rect = this.host.getBoundingClientRect();
    var w = parseFloat(this.canvas.style.width) || 1, h = parseFloat(this.canvas.style.height) || 1;
    var s = Math.min(rect.width / w, rect.height / h, 1) * 0.96;
    if (keepReadable && s < 0.45) { this.fitCircle(); return; }
    this.scale = Math.max(0.2, s);
    this.tx = (rect.width - w * this.scale) / 2;
    this.ty = (rect.height - h * this.scale) / 2;
    this.applyTransform();
  };

  /** вписать ближний круг выбранного человека */
  Tree.prototype.fitCircle = function () {
    var S2 = global.Store, id = this.focusId;
    var want = {};
    want[id] = 1;
    [S2.parentsOf(id), S2.spousesOf(id), S2.childrenOf(id), S2.siblingsOf(id)].forEach(function (arr) {
      arr.forEach(function (p) { want[p.id] = 1; });
    });
    var box = null;
    this.cards.forEach(function (c) {
      if (!want[c.id]) return;
      if (!box) box = { x1: c.x, y1: c.y, x2: c.x + c.w, y2: c.y + c.h };
      else {
        box.x1 = Math.min(box.x1, c.x); box.y1 = Math.min(box.y1, c.y);
        box.x2 = Math.max(box.x2, c.x + c.w); box.y2 = Math.max(box.y2, c.y + c.h);
      }
    });
    if (!box) { this.centerOn(id); return; }
    var rect = this.host.getBoundingClientRect();
    var bw = (box.x2 - box.x1) + 48, bh = (box.y2 - box.y1) + 48;
    this.scale = Math.max(0.42, Math.min(1, Math.min(rect.width / bw, rect.height / bh)));
    this.tx = rect.width / 2 - ((box.x1 + box.x2) / 2) * this.scale;
    this.ty = rect.height / 2 - ((box.y1 + box.y2) / 2) * this.scale;
    this.applyTransform();
  };

  Tree.prototype.centerOn = function (id) {
    var c = this.cards.filter(function (x) { return x.id === id; })[0] || this.cards[0];
    if (!c) return;
    var rect = this.host.getBoundingClientRect();
    this.tx = rect.width / 2 - (c.x + c.w / 2) * this.scale;
    this.ty = rect.height / 2 - (c.y + c.h / 2) * this.scale;
    this.applyTransform();
  };
  Tree.prototype._bindPanZoom = function () {
    var self = this, drag = null, pinch = null;
    this.host.addEventListener('pointerdown', function (e) {
      if (e.target.closest('.node')) return;
      drag = { x: e.clientX, y: e.clientY, tx: self.tx, ty: self.ty, id: e.pointerId };
      self.host.setPointerCapture(e.pointerId);
      self.host.classList.add('grabbing');
    });
    this.host.addEventListener('pointermove', function (e) {
      if (!drag || drag.id !== e.pointerId) return;
      self.tx = drag.tx + (e.clientX - drag.x);
      self.ty = drag.ty + (e.clientY - drag.y);
      self.applyTransform();
    });
    function end() { drag = null; self.host.classList.remove('grabbing'); }
    this.host.addEventListener('pointerup', end);
    this.host.addEventListener('pointercancel', end);
    this.host.addEventListener('wheel', function (e) {
      e.preventDefault();
      var r = self.host.getBoundingClientRect();
      self.zoom(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });

    // щипок на сенсорном экране
    var pts = {};
    this.host.addEventListener('touchstart', function (e) {
      if (e.touches.length === 2) {
        pinch = { d: dist(e.touches), s: self.scale };
      }
    }, { passive: true });
    this.host.addEventListener('touchmove', function (e) {
      if (pinch && e.touches.length === 2) {
        e.preventDefault();
        var r = self.host.getBoundingClientRect();
        var d = dist(e.touches);
        var target = pinch.s * (d / pinch.d);
        var cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
        var cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
        self.zoom(target / self.scale, cx, cy);
      }
    }, { passive: false });
    this.host.addEventListener('touchend', function (e) { if (e.touches.length < 2) pinch = null; });
    function dist(t) {
      var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
      return Math.sqrt(dx * dx + dy * dy) || 1;
    }
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  Tree.esc = esc;
  global.TreeView = Tree;
})(window);
</script>
<script>/* Семейное Древо — импорт, экспорт и резервные копии.
   GEDCOM 5.5.1 (UTF-8), простой текст, SVG, PDF (через печать), ZIP с фотографиями. */
(function (global) {
  'use strict';
  var S = global.Store;
  var U = S.util;

  var MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

  /* ---------------- GEDCOM: выгрузка ---------------- */
  function gedDate(s) {
    var d = U.parseDate(s);
    if (!d) return s || '';
    if (!d.m || !d.d) return String(d.y);
    return d.d + ' ' + MON[d.m - 1] + ' ' + d.y;
  }
  function exportGEDCOM() {
    var t = S.tree, L = [];
    L.push('0 HEAD');
    L.push('1 SOUR SEMDREVO');
    L.push('2 NAME Семейное Древо');
    L.push('2 VERS 1.0');
    L.push('1 DATE ' + gedDate(new Date().toISOString().slice(0, 10)));
    L.push('1 CHAR UTF-8');
    L.push('1 GEDC');
    L.push('2 VERS 5.5.1');
    L.push('2 FORM LINEAGE-LINKED');
    L.push('1 FILE ' + (t.meta.name || 'tree') + '.ged');

    var pid = {}, fid = {}, n = 1;
    S.persons().forEach(function (p) { pid[p.id] = '@I' + (n++) + '@'; });
    n = 1;
    S.families().forEach(function (f) { fid[f.id] = '@F' + (n++) + '@'; });

    S.persons().forEach(function (p) {
      L.push('0 ' + pid[p.id] + ' INDI');
      var given = [p.given, p.patronymic].filter(Boolean).join(' ');
      L.push('1 NAME ' + given + ' /' + (p.surname || '') + '/');
      if (given) L.push('2 GIVN ' + given);
      if (p.surname) L.push('2 SURN ' + p.surname);
      if (p.maiden) { L.push('1 NAME /' + p.maiden + '/'); L.push('2 TYPE maiden'); }
      L.push('1 SEX ' + (p.sex === 'M' || p.sex === 'F' ? p.sex : 'U'));
      if (p.birth && (p.birth.date || p.birth.place)) {
        L.push('1 BIRT');
        if (p.birth.date) L.push('2 DATE ' + gedDate(p.birth.date));
        if (p.birth.place) L.push('2 PLAC ' + p.birth.place);
        if (p.birth.lat != null && p.birth.lng != null) {
          L.push('2 MAP'); L.push('3 LATI ' + mapCoord(p.birth.lat, 'N', 'S')); L.push('3 LONG ' + mapCoord(p.birth.lng, 'E', 'W'));
        }
      }
      if (p.death && (p.death.date || p.death.place)) {
        L.push('1 DEAT');
        if (p.death.date) L.push('2 DATE ' + gedDate(p.death.date));
        if (p.death.place) L.push('2 PLAC ' + p.death.place);
      }
      (p.events || []).forEach(function (e) {
        if (!S.canSee(e.acl)) return;
        L.push('1 EVEN' + (e.note ? ' ' + oneLine(e.note) : ''));
        L.push('2 TYPE ' + (e.type || 'событие'));
        if (e.date) L.push('2 DATE ' + gedDate(e.date));
        if (e.place) L.push('2 PLAC ' + e.place);
      });
      (p.fields || []).forEach(function (f) {
        if (!S.canSee(f.acl)) return;
        if (f.type === 'phone') L.push('1 PHON ' + oneLine(f.value));
        else if (f.type === 'email') L.push('1 EMAIL ' + oneLine(f.value));
        else if (f.type === 'addr') L.push('1 ADDR ' + oneLine(f.value));
        else { L.push('1 FACT ' + oneLine(f.value)); L.push('2 TYPE ' + oneLine(f.label || 'сведения')); }
      });
      if (p.note) pushNote(L, 1, p.note);
      var cf = S.childFamily(p.id);
      if (cf) L.push('1 FAMC ' + fid[cf.id]);
      S.spouseFamilies(p.id).forEach(function (f) { L.push('1 FAMS ' + fid[f.id]); });
      (p.media || []).forEach(function (mid) {
        var m = S.tree.media[mid];
        if (!m || !S.canSee(m.acl)) return;
        L.push('1 OBJE');
        L.push('2 FILE media/' + mid + '_' + safeName(m.name));
        L.push('2 FORM ' + (m.mime || '').split('/').pop());
        if (m.caption) L.push('2 TITL ' + oneLine(m.caption));
      });
      L.push('1 CHAN');
      L.push('2 DATE ' + gedDate((p.updated || '').slice(0, 10)));
    });

    S.families().forEach(function (f) {
      L.push('0 ' + fid[f.id] + ' FAM');
      if (f.husb && pid[f.husb]) L.push('1 HUSB ' + pid[f.husb]);
      if (f.wife && pid[f.wife]) L.push('1 WIFE ' + pid[f.wife]);
      f.children.forEach(function (c) { if (pid[c]) L.push('1 CHIL ' + pid[c]); });
      if (f.marriage && (f.marriage.date || f.marriage.place)) {
        L.push('1 MARR');
        if (f.marriage.date) L.push('2 DATE ' + gedDate(f.marriage.date));
        if (f.marriage.place) L.push('2 PLAC ' + f.marriage.place);
      }
      if (f.divorced) L.push('1 DIV Y');
    });

    L.push('0 TRLR');
    return L.join('\r\n') + '\r\n';
  }
  function mapCoord(v, pos, neg) { return (v >= 0 ? pos : neg) + Math.abs(v).toFixed(6); }
  function oneLine(s) { return String(s || '').replace(/\s*\n\s*/g, ' ').trim(); }
  function safeName(s) { return String(s || 'file').replace(/[^\wа-яА-ЯёЁ.\-]+/g, '_'); }
  function pushNote(L, lvl, text) {
    var lines = String(text).split(/\r?\n/);
    L.push(lvl + ' NOTE ' + lines[0]);
    for (var i = 1; i < lines.length; i++) L.push((lvl + 1) + ' CONT ' + lines[i]);
  }

  /* ---------------- GEDCOM: загрузка ---------------- */
  function parseGedDate(s) {
    if (!s) return '';
    s = s.replace(/^(ABT|EST|CAL|BEF|AFT|FROM|TO)\s+/i, '').trim();
    var m = s.match(/^(\d{1,2})\s+([A-Z]{3})\s+(\d{4})$/i);
    if (m) {
      var mi = MON.indexOf(m[2].toUpperCase());
      if (mi >= 0) return m[3] + '-' + pad(mi + 1) + '-' + pad(+m[1]);
    }
    m = s.match(/^([A-Z]{3})\s+(\d{4})$/i);
    if (m) { var k = MON.indexOf(m[1].toUpperCase()); if (k >= 0) return m[2] + '-' + pad(k + 1); }
    m = s.match(/(\d{4})/);
    return m ? m[1] : s;
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function importGEDCOM(text) {
    var lines = String(text).replace(/﻿/g, '').split(/\r?\n/);
    var recs = [], cur = null, stack = [];
    lines.forEach(function (raw) {
      var m = raw.match(/^\s*(\d+)\s+(@[^@]+@\s+)?(\w+)\s?(.*)$/);
      if (!m) return;
      var lvl = +m[1], xref = (m[2] || '').trim(), tag = m[3], val = m[4] || '';
      var node = { lvl: lvl, xref: xref, tag: tag, val: val, kids: [] };
      if (lvl === 0) { cur = node; recs.push(node); stack = [node]; return; }
      if (!stack.length) return;
      stack.length = Math.min(stack.length, lvl);
      var parent = stack[lvl - 1];
      if (!parent) return;
      if (tag === 'CONT') { parent.val += '\n' + val; return; }
      if (tag === 'CONC') { parent.val += val; return; }
      parent.kids.push(node);
      stack[lvl] = node;
    });

    var tree = U.emptyTree();
    tree.meta.name = 'Импортированное дерево';
    var byXref = {}, famXref = {};
    function kid(node, tag) { return node.kids.filter(function (k) { return k.tag === tag; })[0]; }
    function kids(node, tag) { return node.kids.filter(function (k) { return k.tag === tag; }); }

    recs.forEach(function (r) {
      if (r.tag === 'INDI') {
        var p = U.newPerson();
        var nameNode = kid(r, 'NAME');
        if (nameNode) {
          var nm = nameNode.val || '';
          var sur = (nm.match(/\/([^\/]*)\//) || [])[1] || '';
          var giv = nm.replace(/\/[^\/]*\//, '').trim();
          var gn = kid(nameNode, 'GIVN'), sn = kid(nameNode, 'SURN');
          p.surname = (sn && sn.val) || sur;
          var parts = ((gn && gn.val) || giv).split(/\s+/).filter(Boolean);
          p.given = parts[0] || '';
          p.patronymic = parts.slice(1).join(' ');
        }
        var sx = kid(r, 'SEX');
